<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°1 « CARTES PIXELS » · SCÈNE : LE GRAND CHIFFRE (la preuve) · 3,4 s
    Ce que la scène montre : un panneau blanc posé sur la grille, encadré de deux bandes de
    hachures fines ; le chiffre compte jusqu'à sa valeur au milieu d'un nuage de glyphes (# + X = %)
    qui s'éteint par le centre ; dessous, l'étiquette mono dans sa pastille et six points de
    couleur qui s'allument du centre vers les bords ; la caméra ne fait qu'une dérive lente (4 %).
    Le chiffre et son étiquette se tiennent 1,6 s une fois comptés. Sortie : tout s'efface et le
    panneau se resserre en une case blanche au centre, celle où t01-logos-fin pose le logo de la
    marque (raccord d'objet).
    Format : 16:9 (1920 × 1080) ; en 9:16, data-width="1080" data-height="1920" ici et sur l'hôte.

    À remplacer : l'objet EXEMPLE (en tête du script), et l'id « t01-chiffre » (racine, constante ID,
    préfixe CSS). Le nombre est obligatoire : le vrai chiffre de OFFRE.json, arrondi vers le bas ;
    sans chiffre réel, n'utilise pas cette scène (jamais un chiffre inventé). FORMAT ajoute « + » ou
    « k » au besoin.
    Couleurs : celles de sa marque, rien d'autre : le papier et le panneau sont son clair, l'encre
    sa nuit (var(--brand-sombre)), le label var(--brand-gris-2) ; le chiffre, les glyphes et les
    points suivent var(--brand-accent), toujours plein. Accent clair (jaune…) : chiffre et glyphes
    passent à l'encre, un trait plein de sa couleur souligne le chiffre.
  -->
</head>
<body>
<template>
<style>
  #t01-chiffre { --t01-papier: var(--brand-clair); --t01-trait: rgba(0, 0, 0, 0.07); --t01-encre: var(--brand-sombre);
    --t01-mono: ui-monospace, "SF Mono", Menlo, Consolas, var(--brand-font-mono);
    --t01-chiffre: var(--brand-accent); --t01-glyphe: var(--brand-accent); background: var(--t01-papier); }
  #t01-chiffre.t01-accent-clair { --t01-chiffre: var(--t01-encre); --t01-glyphe: var(--t01-encre); }
  #t01-chiffre .t01-papier { position: absolute; inset: -2px; background-color: var(--t01-papier);
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.085) 0 4px, transparent 4.6px),
      linear-gradient(var(--t01-trait) 0 2px, transparent 2px),
      linear-gradient(90deg, var(--t01-trait) 0 2px, transparent 2px),
      linear-gradient(rgba(0, 0, 0, 0.028), rgba(0, 0, 0, 0.028));
    background-size: 180px 180px, 180px 180px, 180px 180px, 100% 100%; background-position: 60px 30px, 60px 30px, 60px 30px, 0 0; }
  #t01-chiffre .t01-label { position: absolute; left: 96px; top: 66px; font: 500 28px/1 var(--t01-mono);
    letter-spacing: .14em; color: var(--brand-gris-2); white-space: pre; z-index: 40; }
  #t01-chiffre .t01-hachures { position: absolute; background-image: linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 2px, transparent 2px); background-size: 16px 100%; }
  #t01-chiffre .t01-panneau { position: absolute; background: var(--brand-clair); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 24px 60px rgba(0, 0, 0, 0.06); }
  #t01-chiffre .t01-separe { position: absolute; height: 2px; background: rgba(0, 0, 0, 0.06); }
  #t01-chiffre .t01-chiffre { position: absolute; left: 0; right: 0; text-align: center; white-space: pre;
    font-family: var(--brand-font-display); font-weight: 700; letter-spacing: -0.045em; line-height: 1; color: var(--t01-chiffre); }
  #t01-chiffre .t01-souligne { position: absolute; background: var(--brand-accent); transform-origin: 0 50%; }
  #t01-chiffre .t01-glyphes { position: absolute; font: 500 18px/22px var(--t01-mono); color: var(--t01-glyphe); white-space: pre; letter-spacing: 4px; }
  #t01-chiffre .t01-rangee { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
  #t01-chiffre .t01-pastille { position: relative; padding: 13px 26px; border-radius: 12px; background: var(--brand-clair);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 10px 24px rgba(0, 0, 0, 0.08); font: 500 32px/1 var(--t01-mono); color: var(--t01-encre); white-space: pre; }
  #t01-chiffre .t01-point { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--brand-accent); }
  #t01-chiffre.t01-accent-clair .t01-point { box-shadow: 0 0 0 1.5px var(--t01-encre); }
  #t01-chiffre.t01-vertical .t01-label { left: 100px; top: 306px; font-size: 30px; }
</style>

<div data-composition-id="t01-chiffre" data-width="1920" data-height="1080" data-duration="3.4" style="position:absolute; inset:0;">
  <div id="t01-chiffre" class="k-scene">
    <div class="t01-papier"></div>
    <div class="k-scene3d"><div class="k-camera" id="t01-chiffre-cam"></div></div>
    <div class="t01-label" id="t01-chiffre-label"></div>
  </div>
</div>

<script>
  (function () {
    var EXEMPLE = { // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire
      etiquette: "[ 03 · LA PREUVE ]",   // le label du chapitre
      nombre: 1000,                      // un exemple : le VRAI chiffre de OFFRE.json, arrondi vers le bas (sans lui, pas de scène)
      libelle: "élèves"                  // ce que le chiffre compte, 1 à 3 mots (« clients accompagnés », « ventes »)
    };
    // L'écriture du nombre (espace des milliers ; ajoute « + » ou « k » au besoin).
    var FORMAT = function (v) { return String(Math.floor(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); };

    var ID = "t01-chiffre", D = 3.4;
    var tl = gsap.timeline({ paused: true });
    var racine = document.getElementById(ID);
    var q = function (s) { return racine.querySelector(s); };
    var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
    if (vertical) racine.classList.add("t01-vertical");
    var rgb = function (css) {
      var e = document.createElement("i"); e.style.color = css; racine.appendChild(e);
      var m = (getComputedStyle(e).color.match(/[\d.]+/g) || [0, 0, 0]).map(Number); racine.removeChild(e); return m;
    };
    var lum = function (c) {
      var a = c.slice(0, 3).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
    };
    // Le chiffre est un texte : il garde l'accent seulement s'il s'y lit à 4,5:1 au moins sur le gris
    // clair (luminance de 0,17 au plus) ; sinon il passe à l'encre, souligné d'un trait de couleur.
    var clair = lum(rgb("var(--brand-accent)")) > 0.17;
    racine.classList.toggle("t01-accent-clair", clair);
    var GLYPHES = "#%@X=+:*/<>";
    var decoder = function (el, texte, debut, duree) {
      K.texteSelon(tl, el, D, function (t) {
        if (t < debut) return "";
        if (t >= debut + duree) return texte;
        var p = (t - debut) / duree, pas = Math.floor(t / 0.045), s = "", n = texte.length;
        for (var i = 0; i < n; i++) {
          if (p < (i / n) * 0.5) break;
          s += (texte[i] === " " || p >= 0.4 + (i / n) * 0.6) ? texte[i] : GLYPHES[(i * 7 + pas * 13) % GLYPHES.length];
        }
        return s;
      });
    };
    var poser = function (el, x, y, l, h) { el.style.left = x + "px"; el.style.top = y + "px"; if (l != null) { el.style.width = l + "px"; el.style.height = h + "px"; } };

    // La mise en page : un panneau centré, ses hachures, sa rangée d'étiquette.
    var cam = q("#t01-chiffre-cam"), cx = L / 2, cy = H / 2 + (vertical ? 0 : 20);
    // Le chiffre est le mot héros : il occupe environ 60 % de la largeur (80 % en 9:16), d'après le
    // nombre de ses signes ; le panneau suit sa taille.
    var signes = FORMAT(EXEMPLE.nombre).length;
    var TAILLE = Math.min(vertical ? 300 : 400, Math.round((vertical ? 0.8 : 0.62) * L / (signes * 0.6)));
    var PL = vertical ? 900 : 1360, PH = TAILLE + 60, RH = 112, HB = vertical ? 220 : 150;
    var px = cx - PL / 2, py = cy - (PH + RH) / 2;
    var hautH = K.el(cam, "div", "t01-hachures"); poser(hautH, px, py - HB, PL, HB - 18);
    var basH = K.el(cam, "div", "t01-hachures"); poser(basH, px, py + PH + RH + 18, PL, HB - 18);
    var panneau = K.el(cam, "div", "t01-panneau"); poser(panneau, px, py, PL, PH + RH);
    var contenu = K.el(cam, "div", null, null, "position:absolute; inset:0;");
    var separe = K.el(contenu, "div", "t01-separe"); poser(separe, px, py + PH, PL, 2);
    var chiffre = K.el(contenu, "div", "t01-chiffre"); chiffre.style.top = (py + 30) + "px"; chiffre.style.fontSize = TAILLE + "px";
    var glyphes = K.el(contenu, "div", "t01-glyphes"); poser(glyphes, px + 20, py + 14, PL - 40, PH - 24); glyphes.setAttribute("data-layout-ignore", "");
    var rangee = K.el(contenu, "div", "t01-rangee"); rangee.style.top = (py + PH + (RH - 56) / 2) + "px";
    var pastille = K.el(rangee, "div", "t01-pastille", EXEMPLE.libelle);
    var points = [];
    for (var i = 0; i < 6; i++) {
      var cote = i < 3 ? -1 : 1, rang = i < 3 ? 3 - i : i - 2;
      points.push(K.el(contenu, "div", "t01-point", null, "left:" + (cx + cote * (vertical ? 120 + rang * 90 : 150 + rang * 150) - 5) + "px; top:" + (py + PH + RH / 2 - 5) + "px;"));
    }

    // Entrées : hachures et panneau, puis le chiffre qui compte dans son nuage de glyphes.
    K.cacher([hautH, basH], { scaleY: 0 });
    tl.to(hautH, { opacity: 1, scaleY: 1, transformOrigin: "50% 100%", duration: 0.5, ease: "expo.out" }, 0.05);
    tl.to(basH, { opacity: 1, scaleY: 1, transformOrigin: "50% 0%", duration: 0.5, ease: "expo.out" }, 0.05);
    tl.fromTo(panneau, { scaleX: 0.92, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 0);
    tl.fromTo(separe, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.15);
    K.compteur(tl, chiffre, 0, EXEMPLE.nombre, 0.25, 1.25, D, FORMAT, "expo.out");
    K.cacher(chiffre);
    tl.to(chiffre, { opacity: 1, duration: 0.15 }, 0.22);
    tl.fromTo(chiffre, { scale: 0.94 }, { scale: 1, duration: 1.2, ease: "expo.out" }, 0.25);
    if (clair) {
      var souligne = K.el(contenu, "div", "t01-souligne");
      var ls = Math.min(PL - 80, signes * TAILLE * 0.6);
      poser(souligne, cx - ls / 2, py + 30 + TAILLE * 0.92, ls, Math.round(TAILLE * 0.064));
      K.cacher(souligne, { scaleX: 0 });
      tl.to(souligne, { opacity: 1, scaleX: 1, duration: 0.9, ease: "expo.out" }, 0.6);
    }
    var colG = Math.floor((PL - 40) / 15.5), ligG = Math.floor((PH - 24) / 22), rg = K.rng(23), bruitG = [];
    for (var a = 0; a < ligG * colG; a++) bruitG.push(rg());
    K.texteSelon(tl, glyphes, D, function (t) {
      if (t < 0.2 || t > 2.8) return "";
      var dens = t < 0.5 ? (t - 0.2) / 0.3 : Math.max(0, 1 - (t - 0.5) / 1.6), pas = Math.floor(t / 0.06), out = [];
      for (var y = 0; y < ligG; y++) {
        var s = "";
        for (var x = 0; x < colG; x++) {
          var dx = Math.abs(x / colG - 0.5) * 2, dy = Math.abs(y / ligG - 0.5) * 2;
          var dedans = dx < 0.6 && dy < 0.85, bord = Math.abs(Math.max(dx / 0.6, dy / 0.85) - 1);
          var poids = dedans ? Math.max(0, 1 - (t - 0.3) / 0.9) * 0.75 : 0.5 * Math.max(0, 1 - bord * 2.2);
          var v = (bruitG[y * colG + x] * 9.7 + pas * 0.618) % 1;
          s += v < dens * poids ? GLYPHES[Math.floor(v * 97) % GLYPHES.length] : " ";
        }
        out.push(s);
      }
      return out.join("\n");
    });
    K.cacher(pastille, { y: 14 });
    tl.to(pastille, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 0.75);
    K.cacher(points, { scale: 0 });
    points.forEach(function (p, i) { tl.to(p, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 0.95 + (i < 3 ? 2 - i : i - 3) * 0.1); });
    decoder(q("#t01-chiffre-label"), EXEMPLE.etiquette, 0.1, 0.55);
    // La caméra ne fait qu'une dérive lente pendant la lecture (4 %, sine.inOut).
    tl.fromTo(cam, { scale: 1 }, { scale: 1.04, duration: 2.45, ease: "sine.inOut" }, 0.2);

    // Sortie : le contenu s'efface, le panneau se resserre en case blanche de 300 × 300 au centre.
    tl.to(contenu, { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in" }, 2.65);
    tl.to([hautH, basH], { opacity: 0, scaleX: 0.3, duration: 0.35, ease: "power2.in" }, 2.65);
    tl.to(panneau, { scaleX: 300 / PL, scaleY: 300 / (PH + RH), duration: 0.55, ease: "expo.inOut" }, 2.75);
    tl.to(cam, { scale: 1, duration: 0.55, ease: "expo.inOut" }, 2.75);

    window.__timelines[ID] = tl;
  })();
</script>
</template>
</body>
</html>
