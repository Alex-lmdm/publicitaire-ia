<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°1 « CARTES PIXELS » · SCÈNE : LES LOGOS RELIÉS ET LA FIN · 9 s
    Ce que la scène montre :
     0 → 3,6 s : dans la case blanche du centre, le logo de la marque dans un bouton rond ; la caméra
       recule (l'entrée) et les logos des outils sortent de la case sur des tuiles blanches, deux ondes
       partent du bouton ; l'étiquette (2 à 4 mots) arrive et se lit 2,5 s ; puis tout se range :
       l'outil principal à gauche, la marque à droite, un fil, un point qui voyage de l'un à l'autre,
       le maillon du milieu qui s'allume. Pendant ce temps, la caméra se tient ; les tuiles flottent.
     3,65 → 9 s : un chevron en escalier part du bord droit, en couches (grille, couleur, gris,
       clair) et blanchit l'écran ; le logo se forme en pixels, le nom de l'offre se décode ; le
       bouton d'appel s'écrit lettre à lettre et le curseur clique. L'écran final se tient 3 s.
       En pub, pas de bouton : la fin dit « Découvre-le » et une flèche vers le bas (voir l'index).
    Sans logo : son nom à la place, dans le bouton rond puis seul à la fin (jamais une initiale ni
    une icône). Entrée : raccord d'objet avec t01-chiffre (la case blanche est déjà là) ; seule,
    mets APRES_CHIFFRE = false (la case surgit de la grille).
    Format : 16:9 (1920 × 1080) ; en 9:16, data-width="1080" data-height="1920" ici et sur l'hôte.

    À remplacer : l'objet EXEMPLE (en tête du script), et l'id « t01-logos-fin » (racine, constante
    ID, préfixe CSS). Les logos des outils se posent avant avec `studio_motion.py logos <projet>
    claude chatgpt …` (les vrais outils de l'offre).
    Couleurs : celles de sa marque, rien d'autre : le papier, la case, les tuiles et la fin sont son
    clair, l'encre sa nuit (var(--brand-sombre)), le fil et la couche grise du chevron
    var(--brand-gris-4), l'appui du titre var(--brand-gris-2), les pixels de la case sa nuit et son
    premier gris ; maillon, point, chevron, bouton et surlignage suivent var(--brand-accent), plein.
  -->
</head>
<body>
<template>
<style>

  #t01-logos-fin .t01-chevron { position: absolute; inset: 0; z-index: 50; overflow: visible; }
  #t01-logos-fin .t01-final { position: absolute; inset: 0; z-index: 60; }
  #t01-logos-fin .t01-lockup { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 34px; }
  #t01-logos-fin .t01-lockup-logo { position: relative; flex: none; display: grid; place-items: center; }
  #t01-logos-fin .t01-lockup-logo img { width: 100%; height: 100%; object-fit: contain; }
  #t01-logos-fin .t01-lockup-logo i { position: absolute; display: block; }
  #t01-logos-fin .t01-nom { font: 700 200px/1 var(--brand-font-display); letter-spacing: -0.04em; color: var(--t01-encre); white-space: pre; min-width: 10px; }
  #t01-logos-fin .t01-rangee { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
  #t01-logos-fin .t01-bouton { position: relative; height: 104px; min-width: 120px; padding: 0 56px; border-radius: 52px;
    background: var(--brand-accent); color: var(--brand-contrast); display: flex; align-items: center; justify-content: center;
    font: 600 42px/1 "Inter", var(--brand-font-body); letter-spacing: -0.02em; white-space: pre; }
  #t01-logos-fin.t01-vertical .t01-titre { left: 100px; top: 330px; font-size: 72px; }
</style>

<div data-composition-id="t01-logos-fin" data-width="1920" data-height="1080" data-duration="9" style="position:absolute; inset:0;">
  <div id="t01-logos-fin" class="k-scene">
    <div class="t01-papier"></div>
    <div class="k-scene3d"><div class="k-camera" id="t01-logos-fin-cam"></div></div>

      <div id="t01-logos-fin-curseur-calque" style="position:absolute; inset:0; z-index:70;"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    var EXEMPLE = { // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire
      logos: ["logo-claude", "logo-chatgpt", "logo-notion", "logo-canva", "logo-youtube", "logo-instagram", "logo-stripe", "logo-google"],   // les vrais outils de l'offre (6 à 8)
      outil: 0,                        // l'index de l'outil qu'on relie à l'offre
      logo: "brand/logo.png",          // son logo (le fichier de brand/ : logo.png, logo.svg…) ; "" : son nom à la place
      nom: "Ton offre",                // le nom de l'offre
      titre: ["Relié à", "tes outils."],   // 2 à 4 mots, le dernier surligné
      bouton: "Je découvre"            // l'appel du support, 2 ou 3 mots (page : « Je découvre »)
    };
    var APRES_CHIFFRE = true;          // false : la scène vient seule, la case surgit de la grille

    var ID = "t01-logos-fin", D = 9;
    var tl = gsap.timeline({ paused: true });
    var racine = document.getElementById(ID);
    var q = function (s) { return racine.querySelector(s); };
    var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
    if (vertical) racine.classList.add("t01-vertical");
    var rgb = function (css) {
      var e = document.createElement("i"); e.style.color = css; racine.appendChild(e);
      var m = (getComputedStyle(e).color.match(/[\d.]+/g) || [0, 0, 0]).map(Number); racine.removeChild(e); return m;
    };
    var lum = function (c) {
      var a = c.slice(0, 3).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
    };
    racine.classList.toggle("t01-accent-clair", lum(rgb("var(--brand-accent)")) > 0.28);
    var GLYPHES = "#%@X=+:*/<>";
    var decoder = function (el, texte, debut, duree) {
      K.texteSelon(tl, el, D, function (t) {
        if (t < debut) return "";
        if (t >= debut + duree) return texte;
        var p = (t - debut) / duree, pas = Math.floor(t / 0.045), s = "", n = texte.length;
        for (var i = 0; i < n; i++) {
          if (p < (i / n) * 0.5) break;
          s += (texte[i] === " " || p >= 0.4 + (i / n) * 0.6) ? texte[i] : GLYPHES[(i * 7 + pas * 13) % GLYPHES.length];
        }
        return s;
      });
    };
    var poser = function (el, x, y, l, h) { el.style.left = x + "px"; el.style.top = y + "px"; if (l != null) { el.style.width = l + "px"; el.style.height = h + "px"; } };
    // Son logo ; sans logo (ou introuvable), son nom à sa place : jamais une initiale ni une icône.
    var logoMarque = function (parent, sansLogo) {
      if (!EXEMPLE.logo) return sansLogo();
      var img = K.el(parent, "img"); img.alt = ""; img.onerror = sansLogo; img.src = EXEMPLE.logo;
    };

    // ================= Les logos reliés ======================================================
    var cam = q("#t01-logos-fin-cam"), cx = L / 2, cy = H / 2 + (vertical ? 0 : 20), HUB = 300, R = 210;
    var caseHub = K.el(cam, "div", "t01-case"); poser(caseHub, cx - HUB / 2, cy - HUB / 2, HUB, HUB);
    var rond = K.el(cam, "div", "t01-rond"); poser(rond, cx - R / 2, cy - R / 2, R, R);
    logoMarque(rond, function () {
      var mot = Math.max.apply(null, EXEMPLE.nom.split(" ").map(function (m) { return m.length; }));
      rond.innerHTML = '<span class="t01-nom-rond" style="font-size:' + Math.max(28, Math.min(64, Math.floor(R * 0.78 / (mot * 0.6)))) + 'px">' + EXEMPLE.nom + "</span>";
    });
    var PLACES = vertical
      ? [[-300, -430, 130], [60, -540, 104], [330, -360, 120], [-370, -40, 108], [370, 60, 140], [-280, 380, 116], [70, 500, 100], [320, 400, 126]]
      : [[-470, -250, 124], [-250, -330, 100], [250, -320, 112], [480, -170, 104], [-540, 70, 108], [520, 130, 130], [-320, 300, 104], [330, 300, 116]];
    var tuiles = [];
    EXEMPLE.logos.forEach(function (nom, i) {
      var svg = K.ic(nom), pl = PLACES[i % PLACES.length]; if (!svg || !pl) return;   // un logo absent : sa tuile se retire
      var t = K.el(cam, "div", "t01-tuile", svg); poser(t, cx + pl[0] - pl[2] / 2, cy + pl[1] - pl[2] / 2, pl[2], pl[2]);
      t.dataset.i = String(i); t.dataset.dx = String(-pl[0]); t.dataset.dy = String(-pl[1]); tuiles.push(t);
    });
    if (!APRES_CHIFFRE) tl.fromTo(caseHub, { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.55, ease: "expo.out" }, 0);
    // Des pixels sombres (sa nuit, son premier gris, un sur cinq de sa couleur) couvrent la case puis
    // tombent un à un : le logo est dessous.
    var rpx = K.rng(41), cotePx = HUB / 5;
    for (var py = 0; py < 5; py++) for (var pxx = 0; pxx < 5; pxx++) {
      var bloc = K.el(cam, "div", null, null, "position:absolute; left:" + (cx - HUB / 2 + pxx * cotePx) + "px; top:" + (cy - HUB / 2 + py * cotePx) +
        "px; width:" + (cotePx + 0.5) + "px; height:" + (cotePx + 0.5) + "px; z-index:5; background:" +
        (rpx() < 0.2 ? "var(--brand-accent)" : rpx() < 0.7 ? "var(--brand-sombre)" : "var(--brand-gris-1)") + ";");
      K.cacher(bloc);
      tl.set(bloc, { opacity: 1 }, 0.02 + rpx() * 0.12).set(bloc, { opacity: 0 }, 0.22 + rpx() * 0.3);
    }
    K.cacher(rond);
    tl.fromTo(rond, { scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(1)" }, 0.12).fromTo(rond, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.12);
    // La caméra part de près et recule pendant que les tuiles sortent (l'entrée, avant tout texte) ;
    // puis, pendant que l'étiquette se lit, elle se tient : les tuiles flottent autour.
    tl.fromTo(cam, { scale: 1.35 }, { scale: 1, duration: 0.75, ease: "power3.inOut" }, 0.2);
    if (tuiles.length) K.cacher(tuiles);
    tuiles.forEach(function (t, i) {
      var dx = +t.dataset.dx, dy = +t.dataset.dy, t0 = (i % 2 ? 0.95 : 0.45) + Math.floor(i / 2) * 0.05;
      tl.fromTo(t, { opacity: 0, scale: 0.2, x: dx, y: dy }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.7, ease: "expo.out" }, t0);
      tl.fromTo(t.querySelector("svg"), { scale: 0.4, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(1)" }, t0 + 0.08);
      var ph = (i * 0.37) % 1, amp = 14 + (i % 3) * 6;
      tl.to(t, { x: amp * Math.cos(ph * 6.28), y: amp * 0.6 * Math.sin(ph * 6.28), duration: 2.12 - (t0 + 0.7), ease: "sine.inOut" }, t0 + 0.7);
    });
    [1.2, 1.7].forEach(function (t0) {
      var o = K.el(cam, "div", "t01-onde"); poser(o, cx - R / 2, cy - R / 2, R, R);
      K.cacher(o);
      tl.set(o, { opacity: 1, scale: 1 }, t0).to(o, { opacity: 0, scale: 2.6, duration: 0.8, ease: "power2.out" }, t0);
    });
    // Tout se range : l'outil à gauche, la marque à droite, reliés par un fil. Sans le logo de cet
    // outil, pas de lien : la marque reste seule au centre (jamais un rond vide).
    var ecart = 300, principal = tuiles.filter(function (t) { return +t.dataset.i === EXEMPLE.outil; })[0];
    tuiles.forEach(function (t, i) {
      if (t === principal) return;
      tl.to(t, { x: +t.dataset.dx * 0.85, y: +t.dataset.dy * 0.85, scale: 0, opacity: 0, duration: 0.42, ease: "power3.in" }, 2.15 + i * 0.03);
    });
    tl.to(caseHub, { opacity: 0, scale: 0.8, duration: 0.35, ease: "power2.in" }, 2.2);
    if (principal) {
      tl.to(rond, { x: ecart, duration: 0.6, ease: "power3.inOut" }, 2.3);
      var rondOutil = K.el(cam, "div", "t01-rond"); poser(rondOutil, cx - R / 2, cy - R / 2, R, R);
      rondOutil.innerHTML = principal.innerHTML; tl.to(principal, { opacity: 0, scale: 0.5, duration: 0.3, ease: "power2.in" }, 2.25);
      K.cacher(rondOutil, { scale: 0.5 });
      tl.to(rondOutil, { opacity: 1, scale: 1, x: -ecart, duration: 0.6, ease: "power3.inOut" }, 2.3);
      var long = 2 * ecart - R - 44, x0 = cx - ecart + R / 2 + 22;
      var fil = K.el(cam, "div", "t01-fil", "<i></i>"); poser(fil, x0, cy - 1.5, long, 3);
      var maillon = K.el(cam, "div", "t01-maillon", K.ic("link")); poser(maillon, cx, cy);
      var on = K.el(maillon, "div", "t01-maillon-on", K.ic("link"));
      var voyageur = K.el(cam, "div", "t01-voyageur"); poser(voyageur, x0, cy);
      K.cacher([fil, maillon, voyageur, on]);
      tl.fromTo(fil, { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 2.75);
      tl.fromTo(maillon, { scale: 0.4 }, { scale: 1, duration: 0.3, ease: "back.out(1)" }, 2.8).fromTo(maillon, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 2.8);
      tl.set(voyageur, { opacity: 1 }, 2.85).set(voyageur, { opacity: 0 }, 3.4);
      tl.to(voyageur, { x: long, duration: 0.55, ease: "power2.inOut" }, 2.85);
      tl.fromTo(fil.querySelector("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 2.85);
      tl.to(on, { opacity: 1, duration: 0.12 }, 3.12);
      tl.to(maillon, { scale: 1.22, duration: 0.06, ease: "power2.out" }, 3.12).to(maillon, { scale: 1, duration: 0.35, ease: "back.out(1)" }, 3.18);
      tl.to(rond, { scale: 1.07, duration: 0.06, ease: "power2.out" }, 3.4).to(rond, { scale: 1, duration: 0.35, ease: "back.out(1)" }, 3.46);
    }
    // L'étiquette arrive avec les tuiles et se lit 2,5 s avant que le chevron la couvre.
    K.cacher("#t01-logos-fin-titre");
    tl.fromTo("#t01-logos-fin-titre", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.25);
    decoder(q("#t01-logos-fin-t1"), EXEMPLE.titre[0], 1.3, 0.4);
    decoder(q("#t01-logos-fin-t2"), EXEMPLE.titre[1], 1.5, 0.45);

    // ================= Le chevron en escalier ================================================
    var CH = 3.65, NS = "http://www.w3.org/2000/svg", svg = q("#t01-logos-fin-chevron");
    svg.setAttribute("viewBox", "0 0 " + L + " " + H); svg.setAttribute("width", L); svg.setAttribute("height", H);
    var defs = document.createElementNS(NS, "defs");
    defs.innerHTML = '<pattern id="' + ID + '-cellules" width="54" height="54" patternUnits="userSpaceOnUse">' +
      '<rect width="54" height="54" style="fill:var(--brand-clair)"/><rect x="0.75" y="0.75" width="52.5" height="52.5" style="fill:none; stroke:var(--brand-gris-4); stroke-width:1.5"/></pattern>';
    svg.appendChild(defs);
    var marche = 54, pasX = vertical ? 50 : 62, n = Math.ceil(H / 2 / marche) + 1, LOIN = L * 3, pts = [[LOIN, H / 2 - (n + 0.5) * marche]];
    for (var j = -n; j <= n; j++) pts.push([Math.abs(j) * pasX, H / 2 + (j - 0.5) * marche], [Math.abs(j) * pasX, H / 2 + (j + 0.5) * marche]);
    pts.push([LOIN, H / 2 + (n + 0.5) * marche]);
    var escalier = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    ["url(#" + ID + "-cellules)", "var(--brand-accent)", "var(--brand-gris-4)", "var(--brand-clair)"].forEach(function (fond, i) {
      var g = document.createElementNS(NS, "g"), poly = document.createElementNS(NS, "polygon");
      poly.setAttribute("points", escalier); poly.setAttribute("style", "fill:" + fond);
      g.appendChild(poly); svg.appendChild(g);
      gsap.set(g, { x: L + 10 });
      tl.to(g, { x: -n * pasX - 40, duration: 1.05, ease: "power2.in" }, CH + i * 0.16);
    });
    // Une fois l'écran couvert, ce qui est dessous s'éteint (rien ne reste caché sous le clair).
    tl.set([cam, "#t01-logos-fin-titre"], { opacity: 0 }, CH + 1.55);

    // ================= Le logo en pixels, le nom, le bouton ==================================
    // Le nom est le mot héros de la fin : il occupe environ 60 % de la largeur (80 % en 9:16, sous le
    // logo), d'après le nombre de ses signes ; le logo suit sa taille.
