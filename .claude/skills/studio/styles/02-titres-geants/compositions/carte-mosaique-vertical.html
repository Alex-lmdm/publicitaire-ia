<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°2 · TITRES GÉANTS · SCÈNE « CARTE ET MOSAÏQUE », VERSION VERTICALE 9:16 (1080 × 1920),
    5,0 s (la même scène que carte-mosaique.html, remise en page pour un Reel, une story, un TikTok :
    les cartes passent en portrait, 960 × 1 360, la grande remplit l'image ; la mosaïque met deux
    cartes par rangée sur trois rangées)

    Ce qu'elle montre : sur la nuit de la marque, la caméra part tout près du coin arrondi d'une
    carte vide (deux repères, une cote « Rayon 64 px », un point d'accent), recule ; le point file
    au centre et devient le fond de la carte (un cercle d'accent qui s'ouvre jusqu'aux bords). La
    carte se construit par couches : la bande du nom s'ouvre depuis le centre, trois étiquettes de
    maquette montent (la couleur, la police, le rayon), les repères se tracent (deux traits pleins,
    deux pointillés, quatre points), le nom de l'offre s'écrit en voix légère dans la bande, sa
    marque dessous. La même carte change trois fois de palette sur les temps (clair, sombre,
    accent). Puis la caméra recule : six cartes arrivent de la droite, en mosaïque autour de la
    première ; la vie continue (une liste se coche, le curseur clique le bouton, les mots se posent).

    Couleurs : celles de la marque, rien d'autre. Quatre fonds de carte (accent, clair, gris,
    sombre), chacun avec son encre (classes pal-*) ; la nuit est --brand-sombre. Aucun paysage,
    aucune illustration, aucune teinte dérivée de l'accent, aucun accent en transparence.

    À remplacer :
      1. L'identifiant « t02-carte » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. NOM (le nom de l'offre, 1 à 3 mots : il se réduit seul s'il déborde de la bande) et MARQUE
         (le nom de sa marque, sous la bande ; "" pour aucun), en tête du script.
      3. CARTES : la grande (hero) puis les six de la mosaïque, avec la vraie matière du client.
         fond : "accent", "clair", "gris" ou "sombre". ui : "mot" (un mot ou une phrase courte de
         sa page), "liste" (les vrais titres de ses modules, qui se cochent), "bouton" (le vrai
         libellé du bouton de sa page, que le curseur clique), "aplat" (la couleur seule).
         image : une vraie capture du dossier assets/images (sa page, son espace de formation, son
         logiciel, un résultat), qui remplit la carte ; sur la grande, le cercle d'accent l'ouvre.
         Sans matière réelle, une carte reste un aplat ou un mot : jamais une interface inventée,
         un faux lecteur, une icône de décor ni un paysage. Les morceaux du produit vont sur les
         cartes entières (c1, c2, c5, c6) ; les cartes coupées par les bords (c3, c4) restent des
         aplats.
    Polices : var(--brand-font-display) pour le nom et les mots ; var(--brand-font-body) pour les
    étiquettes et la liste.
  -->
</head>
<body>
<template>
  <style>
    #t02-carte {
      /* La palette du style : la nuit de la marque (--brand-sombre), son clair, ses gris, l'accent
         plein (--brand-accent-lisible pour un trait ou un texte posé sur la nuit). */
      --t02-nuit: var(--brand-sombre);
      --t02-texte: var(--brand-clair);
      --t02-accent-texte: var(--brand-accent-lisible);
      background: var(--t02-nuit);
    }
    /* Les quatre palettes d'une carte. --c-fond : son fond ; --c-encre : le texte et les repères
       posés dessus ; --c-mot : un mot géant ; --c-bande et --c-bande-encre : la bande du nom et le
       nom ; --c-contour : un trait de marque autour de la carte (la carte sombre sur la nuit). */
    #t02-carte .pal-accent { --c-fond: var(--brand-accent); --c-encre: var(--brand-contrast); --c-mot: var(--brand-contrast); --c-bande: var(--brand-sombre); --c-bande-encre: var(--brand-clair); --c-contour: transparent; --c-trait: rgba(0, 0, 0, 0.16); }
    #t02-carte .pal-clair { --c-fond: var(--brand-clair); --c-encre: var(--brand-sombre); --c-mot: var(--brand-sombre); --c-bande: var(--brand-sombre); --c-bande-encre: var(--brand-clair); --c-contour: transparent; --c-trait: rgba(0, 0, 0, 0.1); }
    #t02-carte .pal-gris { --c-fond: var(--brand-gris-1); --c-encre: var(--brand-clair); --c-mot: var(--brand-clair); --c-bande: var(--brand-accent); --c-bande-encre: var(--brand-contrast); --c-contour: transparent; --c-trait: rgba(255, 255, 255, 0.14); }
    #t02-carte .pal-sombre { --c-fond: var(--brand-sombre); --c-encre: var(--brand-clair); --c-mot: var(--brand-accent-lisible); --c-bande: var(--brand-accent); --c-bande-encre: var(--brand-contrast); --c-contour: var(--brand-accent-lisible); --c-trait: rgba(255, 255, 255, 0.14); }

    #t02-carte .t02-carte-c {
      position: absolute; width: 960px; height: 1360px; margin: -680px 0 0 -480px;
      border-radius: 64px; overflow: hidden;
    }
    #t02-carte .t02-carte-fond { position: absolute; inset: 0; background: var(--c-fond); }
    #t02-carte .t02-carte-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    #t02-carte .t02-carte-contour { position: absolute; inset: 0; border-radius: 64px; pointer-events: none; box-shadow: inset 0 0 0 3px var(--c-contour); }
    /* La carte vide du début : un trait de marque fin, rien dedans. */
    #t02-carte .t02-carte-vide { position: absolute; inset: 0; border-radius: 64px; box-shadow: inset 0 0 0 2px var(--t02-accent-texte); }

    /* La grande carte : la bande du nom, ses repères, ses étiquettes. */
    #t02-carte .t02-carte-bande { position: absolute; left: 12%; right: 12%; top: 24%; height: 22%; background: var(--c-bande); }
    #t02-carte .t02-carte-guides { position: absolute; inset: 0; }
    #t02-carte .t02-carte-gv { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--c-encre); transform-origin: 50% 0; }
    #t02-carte .t02-carte-gh { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--c-encre); transform-origin: 0 50%; }
    #t02-carte .t02-carte-pt { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--brand-clair); box-shadow: 0 0 0 2px var(--c-encre, var(--t02-nuit)); }
    #t02-carte .t02-carte-zone-titre { position: absolute; left: 12%; right: 12%; top: 24%; height: 22%; display: flex; align-items: center; justify-content: center; }
    #t02-carte .t02-carte-titre {
      font-family: var(--brand-font-display); font-weight: 400; font-size: 110px; line-height: 1.02; text-align: center;
      letter-spacing: -0.035em; color: var(--c-bande-encre); white-space: nowrap;
    }
    #t02-carte .t02-carte-signe {
      position: absolute; left: 0; right: 0; bottom: 130px; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 52px; letter-spacing: -0.02em; color: var(--c-encre);
    }
    #t02-carte .t02-carte-etq { position: absolute; font-family: var(--brand-font-body); font-weight: 500; font-size: 26px; line-height: 1.3; color: var(--c-encre); white-space: nowrap; }
    /* La cote et les repères du début (au-dessus de la caméra, en pixels d'écran). */
    #t02-carte .t02-carte-cote { position: absolute; z-index: 20; font-family: var(--brand-font-body); font-size: 26px; line-height: 1.3; color: var(--t02-texte); white-space: nowrap; }
    #t02-carte .t02-carte-repere { position: absolute; z-index: 20; background: var(--t02-accent-texte); }
    #t02-carte .t02-carte-point { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--brand-accent); z-index: 5; }
    #t02-carte .t02-carte-coin { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--brand-clair); box-shadow: 0 0 0 2px var(--t02-nuit); z-index: 4; }

    /* Les cartes de la mosaïque : un mot, une liste, le bouton, un aplat. */
    #t02-carte .t02-carte-mot {
      position: absolute; left: 0; right: 0; top: 50%; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 150px; line-height: 1;
      letter-spacing: -0.045em; color: var(--c-mot);
    }
    #t02-carte .t02-carte-liste { position: absolute; left: 80px; right: 60px; }
    #t02-carte .t02-carte-ligne {
      display: flex; align-items: center; gap: 30px; height: 124px; white-space: nowrap;
      font-family: var(--brand-font-body); font-weight: 600; font-size: 50px; color: var(--c-encre);
    }
    #t02-carte .t02-carte-ligne + .t02-carte-ligne { border-top: 2px solid var(--c-trait); }
    #t02-carte .t02-carte-coche { width: 64px; height: 64px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 3px var(--c-trait); display: grid; place-items: center; color: var(--brand-contrast); }
    #t02-carte .t02-carte-coche svg { width: 38px; height: 38px; opacity: 0; }
    #t02-carte .t02-carte-coche.fait { background: var(--brand-accent); box-shadow: none; }
    #t02-carte .t02-carte-coche.fait svg { opacity: 1; }
    #t02-carte .t02-carte-bouton {
      position: absolute; left: 50%; top: 50%; height: 156px; border-radius: 999px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; padding: 0 64px;
      background: var(--brand-clair); color: var(--brand-sombre); white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 58px; letter-spacing: -0.02em;
    }
    #t02-carte .t02-carte-bouton .remplir { position: absolute; inset: 0; border-radius: 999px; background: var(--brand-accent); transform-origin: 0 50%; }
    #t02-carte .t02-carte-bouton span { position: relative; }
    #t02-carte .t02-carte-bouton[data-etat="plein"] span { color: var(--brand-contrast); }
    #t02-carte .t02-carte-legende { position: absolute; left: 64px; bottom: 56px; font-family: var(--brand-font-display); font-weight: 600; font-size: 40px; letter-spacing: -0.02em; color: var(--c-encre); white-space: nowrap; }
  </style>

  <div data-composition-id="t02-carte" data-width="1080" data-height="1920" data-duration="5" style="position:absolute; inset:0;">
    <div id="t02-carte" class="k-scene">
      <div class="k-scene3d"><div class="k-camera" id="t02-carte-cam"></div></div>
      <div class="t02-carte-repere" id="t02-carte-rh" style="left:0; top:1378px; width:1080px; height:2px;"></div>
      <div class="t02-carte-repere" id="t02-carte-rv" style="left:798px; top:0; width:2px; height:1920px;"></div>
      <div class="t02-carte-cote" id="t02-carte-cote" style="left:826px; top:1400px;">Rayon<br>64 px</div>
      <div id="t02-carte-curseur-hote" style="position:absolute; inset:0; z-index:30;"></div>
    </div>
  </div>

  <script>
    (function () {
      var D = 5.0, ID = "t02-carte", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cam = $("cam");
      var cadre = K.cadre(racine), L = cadre.largeur;

      // ---------- Ce qu'on remplace ----------
      var NOM = "Ton offre";      // le nom de l'offre, en voix légère dans la bande (il se réduit seul)
      var MARQUE = "Ta marque";   // le nom de sa marque, sous la bande ("" : rien)
      // La grande carte (hero), au centre, puis la mosaïque autour (centre de chaque carte, dans
      // l'espace de la caméra). fond : accent, clair, gris, sombre ; ui : mot, liste, bouton, aplat ;
      // image : une vraie capture (assets/images/…), sinon rien.
      // Deux cartes par rangée sur trois rangées : celles du haut et du bas entières, celle du milieu
      // avec la grande au centre et deux cartes coupées par les bords (c3, c4 : des aplats).
      var CARTES = [
        { nom: "hero", x: 540, y: 960, fond: "accent", image: "" },
        { nom: "c1", x: 38, y: -444, fond: "gris", ui: "bouton", texte: "Commencer" },
        { nom: "c2", x: 1042, y: -444, fond: "clair", ui: "liste",
          lignes: ["Module 1 · Les bases", "Module 2 · La méthode", "Module 3 · Les outils", "Module 4 · Le lancement"] },
        { nom: "c3", x: -464, y: 960, fond: "accent", ui: "aplat" },
        { nom: "c4", x: 1544, y: 960, fond: "gris", ui: "aplat" },
        { nom: "c5", x: 38, y: 2364, fond: "sombre", ui: "mot", texte: "Enfin clair." },
        { nom: "c6", x: 1042, y: 2364, fond: "clair", ui: "mot", texte: "Pas à pas." }
      ];

      // Ce qui dépend du temps sans tween possible (la découpe du cercle) : fonctions pures du temps.
      var aJour = [], horloge = { t: 0 };
      function selon(fn) { aJour.push(fn); }
      function prog(t, t0, duree, ease) { return t <= t0 ? 0 : t >= t0 + duree ? 1 : gsap.parseEase(ease || "power2.inOut")((t - t0) / duree); }
      tl.to(horloge, { t: D, duration: D, ease: "none", onUpdate: function () { aJour.forEach(function (f) { f(horloge.t); }); } }, 0);

      // ---------- Les cartes ----------
      var el = {};
      CARTES.forEach(function (c) {
        var d = K.el(cam, "div", "t02-carte-c pal-" + c.fond);
        d.id = ID + "-" + c.nom;
        d.setAttribute("data-layout-allow-overflow", "");   // la mosaïque déborde du cadre, exprès
        d.style.left = c.x + "px"; d.style.top = c.y + "px";
        var fond = K.el(d, "div", "t02-carte-fond");
        if (c.image) { var im = K.el(fond, "img", "t02-carte-img"); im.src = c.image; im.alt = ""; }
        c.fondEl = fond;
        K.el(d, "div", "t02-carte-contour");
        el[c.nom] = d;
        if (c.ui === "mot") {
          c.mot = K.el(d, "div", "t02-carte-mot", c.texte);
          gsap.set(c.mot, { yPercent: -50 });
        } else if (c.ui === "liste") {
          var liste = K.el(d, "div", "t02-carte-liste", null, "top:" + (680 - c.lignes.length * 62) + "px;");
          c.coches = c.lignes.map(function (t) {
            var l = K.el(liste, "div", "t02-carte-ligne");
            var ch = K.el(l, "span", "t02-carte-coche", K.ic("check"));
            K.el(l, "span", null, t);
            return ch;
          });
        } else if (c.ui === "bouton") {
          var b = K.el(d, "div", "t02-carte-bouton", '<i class="remplir"></i><span>' + c.texte + "</span>");
          gsap.set(b, { xPercent: -50, yPercent: -50 });
          c.remplir = b.querySelector(".remplir");
          c.bouton = b;
        } else if (c.ui === "aplat" && c.texte) {
          K.el(d, "div", "t02-carte-legende", c.texte);
        }
      });

      // ---------- La grande carte : vide au début, puis fond, bande, repères, nom ----------
      var H0 = CARTES[0], hero = el.hero, fondHero = H0.fondEl;
      var vide = K.el(hero, "div", "t02-carte-vide");
      var bande = K.el(hero, "div", "t02-carte-bande");
      var guides = K.el(hero, "div", "t02-carte-guides");
      var gv = [K.el(guides, "i", "t02-carte-gv", null, "left:12%"), K.el(guides, "i", "t02-carte-gv", null, "left:88%")];
      var gh = [K.el(guides, "i", "t02-carte-gh", null, "top:20%"), K.el(guides, "i", "t02-carte-gh", null, "top:51%")];
      var pts = [[12, 20], [88, 20], [12, 51], [88, 51]].map(function (p) {
        return K.el(guides, "u", "t02-carte-pt", null, "left:" + p[0] + "%; top:" + p[1] + "%");
      });
      var zone = K.el(hero, "div", "t02-carte-zone-titre");
      var titre = K.el(zone, "div", "t02-carte-titre", NOM.split(" ").map(function (m) { return '<span class="k-mot">' + m + "</span>"; }).join(" "));
      titre.id = ID + "-titre";
      var signe = MARQUE ? K.el(hero, "div", "t02-carte-signe", MARQUE) : null;
      if (signe) signe.id = ID + "-signe";
      // Trois étiquettes de maquette, vraies : la couleur du fond, la police du nom, le rayon.
      // Elles se posent entre les deux repères verticaux (à 12 et 88 %), jamais en travers d'eux.
      var etqs = H0.image ? [] : [
        K.el(hero, "div", "t02-carte-etq", null, "left:calc(12% + 20px); top:56px;"),
        K.el(hero, "div", "t02-carte-etq", null, "right:calc(12% + 20px); top:56px; text-align:right;"),
        K.el(hero, "div", "t02-carte-etq", "Rayon 64 px", "right:calc(12% + 20px); bottom:56px; text-align:right;")
      ];
      var point = K.el(cam, "div", "t02-carte-point", null, "left:880px; top:1565px;");

      // ---------- La caméra ----------
      // Départ : tout près du coin bas-droit de la grande carte (1020, 1640 dans l'espace caméra),
      // posé en (800, 1380) à l'écran, à l'échelle 2,6. La grande carte remplit ensuite l'image.
      var S0 = 2.6, CX = 540, CY = 960, S1 = 0.46, DX = -30, DY = -50;
      gsap.set(cam, { scale: S0, x: (800 - CX) - S0 * (1020 - CX), y: (1380 - CY) - S0 * (1640 - CY) });
      tl.to(cam, { scale: 1, x: 0, y: 0, duration: 0.62, ease: "expo.inOut" }, 0.42);
      tl.to(cam, { scale: 1.035, duration: 0.95, ease: "none" }, 2.05);
      tl.to(cam, { scale: S1, x: 0, y: 0, duration: 0.85, ease: "expo.inOut" }, 3.0);
      tl.to(cam, { x: DX, y: DY, duration: D - 3.85, ease: "none" }, 3.85);

      // La cote, les repères et le point du début ; les repères se rétractent au recul.
      var rh = $("rh"), rv = $("rv"), cote = $("cote");
      // Ils partent du coin (798, 1378 à l'écran) et s'étendent des deux côtés.
      gsap.set(rh, { scaleX: 0, transformOrigin: "798px 50%" });
      gsap.set(rv, { scaleY: 0, transformOrigin: "50% 1378px" });
      tl.to(rh, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 0.0);
      tl.to(rv, { scaleY: 1, duration: 0.4, ease: "expo.out" }, 0.04);
      K.cacher(cote, { y: 8 });
      tl.to(cote, { opacity: 0.85, y: 0, duration: 0.3, ease: "expo.out" }, 0.08);
      tl.to(rh, { scaleX: 0, duration: 0.28, ease: "power2.in" }, 0.45);
      tl.to(rv, { scaleY: 0, duration: 0.28, ease: "power2.in" }, 0.45);
      tl.to(cote, { opacity: 0, duration: 0.2, ease: "power2.in" }, 0.45);
      gsap.set(point, { scale: 0 });
      tl.to(point, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.12);
      // Le point d'accent file au centre de la carte : il en devient le fond.
      tl.to(point, { x: -340, y: -605, duration: 0.55, ease: "power3.inOut" }, 0.45);
      tl.set(point, { opacity: 0 }, 1.0);

      // Les quatre points de la carte vide, à la fin du recul.
      var coins = [[70, 290], [1010, 290], [70, 1630], [1010, 1630]].map(function (p) {
        return K.el(cam, "u", "t02-carte-coin", null, "left:" + p[0] + "px; top:" + p[1] + "px;");
      });
      K.cacher(coins, { scale: 0 });
      tl.to(coins, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.04 }, 0.82);
      tl.to(coins, { scale: 0, duration: 0.2, ease: "power2.in", stagger: 0.03 }, 1.45);

      // ---------- La carte se construit par couches ----------
      // 1. Le fond : un cercle qui s'ouvre depuis le point (même taille, même couleur au départ).
      var R0 = 17, R1 = Math.hypot(480, 680) + 6;
      selon(function (t) {
        var r = t < 1.0 ? 0 : R0 + (R1 - R0) * prog(t, 1.0, 0.5, "power3.inOut");
        fondHero.style.clipPath = "circle(" + r.toFixed(1) + "px at 50% 50%)";
      });
      tl.set(vide, { opacity: 0 }, 1.5);
      // 2. La bande du nom s'ouvre depuis le centre.
      gsap.set(bande, { scaleX: 0 });
      tl.to(bande, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.3);
      // 3. Les étiquettes montent (30, 70 et 120 px), comme des couches.
      etqs.forEach(function (e, i) {
        K.cacher(e, { y: [30, 70, 120][i] });
        tl.to(e, { opacity: 1, y: 0, duration: 0.45 + i * 0.05, ease: "expo.out" }, 1.4 + i * 0.14);
      });
      // 4. Les repères de maquette, puis le nom en voix légère, puis sa marque.
      gsap.set(gv, { scaleY: 0 }); gsap.set(gh, { scaleX: 0 }); K.cacher(pts, { scale: 0 });
      tl.to(gv, { scaleY: 1, duration: 0.42, ease: "expo.out", stagger: 0.05 }, 1.92);
      tl.to(gh, { scaleX: 1, duration: 0.42, ease: "expo.out", stagger: 0.05 }, 1.98);
      tl.to(pts, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", stagger: 0.04 }, 2.12);
      K.entreeMots(tl, titre.querySelectorAll(".k-mot"), 2.25, { y: 34, flou: 12, decalage: 0.09 });
      if (signe) {
        K.cacher(signe, { y: 16 });
        tl.to(signe, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 2.5);
      }
      // 5. La même carte change de palette sur les temps (coupes franches) : clair, sombre, accent.
      var PALETTES = [[2.64, "clair"], [2.80, "sombre"], [2.96, H0.fond]];
      PALETTES.forEach(function (p) { tl.set(hero, { attr: { class: "t02-carte-c pal-" + p[1] } }, p[0]); });
      tl.to(gv, { scaleY: 0, duration: 0.3, ease: "power2.in" }, 3.0);
      tl.to(gh, { scaleX: 0, duration: 0.3, ease: "power2.in" }, 3.0);
      tl.to(pts, { scale: 0, duration: 0.25, ease: "power2.in" }, 3.0);

      // ---------- La mosaïque : les autres cartes arrivent de la droite ----------
      // Elles partent hors champ (au moins 1 400 px à droite) et glissent sous la grande, sans
      // fondu : une carte d'accent qui apparaîtrait en transparence sur la nuit virerait à l'olive.
      hero.style.zIndex = "2";
      var horsChamp = CX + (L / 2) / 0.95 + 480 + 20;
      CARTES.slice(1).forEach(function (c, i) {
        gsap.set(el[c.nom], { x: Math.max(1200, horsChamp - c.x) });
        tl.to(el[c.nom], { x: 0, duration: 0.85, ease: "expo.out" }, 3.05 + i * 0.06);
      });

      // La vie de la mosaïque : la liste se coche, le curseur clique le bouton, les mots se posent.
      var avec = function (ui) { return CARTES.filter(function (c) { return c.ui === ui; }); };
      avec("liste").forEach(function (c) {
        c.coches.forEach(function (ch, i) { tl.set(ch, { attr: { class: "t02-carte-coche fait" } }, 3.7 + i * 0.18); });
      });
      tl.fromTo(avec("mot").map(function (c) { return c.mot; }), { scale: 0.82 }, { scale: 1, duration: 0.6, ease: "back.out(2.2)", stagger: 0.12 }, 3.6);
      var bouton = avec("bouton")[0];
      if (bouton) {
        var curseur = K.curseur($("curseur-hote"), ID + "-curseur", true);
        K.cacher(curseur);
        gsap.set(bouton.remplir, { scaleX: 0 });
        // Le centre du bouton à l'écran au moment du clic (recul fini, la dérive a commencé).
        var derive = 0.6 / (D - 3.85);
        var bx = CX + S1 * (bouton.x - CX) + DX * derive, by = CY + S1 * (bouton.y - CY) + DY * derive;
        tl.to(curseur, { opacity: 1, duration: 0.2 }, 3.85);
        K.trajet(tl, curseur, [[0, 900, 1500], [3.85, bx + 8, by + 6, 0.55, "power3.out"]]);
        K.clic(tl, curseur, 4.45);
        tl.to(bouton.remplir, { scaleX: 1, duration: 0.35, ease: "power3.inOut" }, 4.5);
        tl.set(bouton.bouton, { attr: { "data-etat": "plein" } }, 4.7);
      }

      // Les étiquettes et le nom se mesurent une fois les polices chargées.
      var cs = getComputedStyle(titre);
      document.fonts.load(cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily).then(finir, finir);
      function finir() {
        var famille = cs.fontFamily.split(",")[0].replace(/["']/g, "").trim();
        var NOMS = { 300: "Light", 400: "Regular", 500: "Medium", 600: "SemiBold", 700: "Bold" };
        // Le nom tient dans la bande : sur deux lignes s'il le faut, réduit ensuite ; un mot géant
        // et le libellé du bouton tiennent dans leur carte.
        var maxNom = zone.offsetWidth - 60;
        if (titre.scrollWidth > maxNom && NOM.indexOf(" ") > 0) { titre.style.whiteSpace = "normal"; titre.style.width = maxNom + "px"; }
        var plusLarge = 0; titre.querySelectorAll(".k-mot").forEach(function (m) { plusLarge = Math.max(plusLarge, m.offsetWidth); });
        var fsNom = 110;
        if (plusLarge > maxNom) fsNom = 110 * maxNom / plusLarge;
        if (titre.scrollHeight > zone.offsetHeight - 40) fsNom = Math.min(fsNom, 110 * (zone.offsetHeight - 40) / titre.scrollHeight);
        titre.style.fontSize = fsNom.toFixed(1) + "px";
        avec("mot").forEach(function (c) { if (c.mot.scrollWidth > 840) c.mot.style.fontSize = (150 * 840 / c.mot.scrollWidth).toFixed(1) + "px"; });
        avec("bouton").forEach(function (c) { if (c.bouton.offsetWidth > 880) c.bouton.style.fontSize = (58 * 880 / c.bouton.offsetWidth).toFixed(1) + "px"; });
        if (etqs.length) {
          var lire = function (v) { return getComputedStyle(racine).getPropertyValue(v).trim().toUpperCase(); };
          var COUL = { accent: ["Accent", "--brand-accent"], clair: ["Clair", "--brand-clair"], sombre: ["Sombre", "--brand-sombre"], gris: ["Gris", "--brand-gris-1"] };
          var etiquette = function (nom) { return COUL[nom][0] + " · " + lire(COUL[nom][1]); };
          K.texteSelon(tl, etqs[0], D, function (t) {
            var nom = H0.fond;
            PALETTES.forEach(function (p) { if (t >= p[0]) nom = p[1]; });
            return etiquette(nom);
          });
          etqs[1].textContent = famille + " " + (NOMS[cs.fontWeight] || cs.fontWeight) + " · " + Math.round(parseFloat(titre.style.fontSize || cs.fontSize)) + " px";
        }
        aJour.forEach(function (f) { f(0); });
        window.__timelines[ID] = tl;
      }
    })();
  </script>
</template>
