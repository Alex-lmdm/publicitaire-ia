<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°2 · TITRES GÉANTS · SCÈNE « CARTE ET MOSAÏQUE », VERSION VERTICALE 9:16 (1080 × 1920),
    6,9 s (la même scène que carte-mosaique.html, remise en page pour un Reel, une story, un TikTok :
    les cartes passent en portrait, 960 × 1 360, la grande remplit l'image ; la mosaïque met deux
    cartes par rangée sur trois rangées)

    Ce qu'elle montre : sur la nuit de la marque, la caméra part tout près du coin arrondi d'une
    carte (son trait de marque, deux repères, un point d'accent) et recule ; le point file au centre
    et s'ouvre en cercle jusqu'aux bords : il découvre sa vraie matière (une capture de sa page, de
    son produit). La carte se construit par couches : la bande du nom s'ouvre depuis le centre, les
    repères se tracent (deux traits pleins, deux pointillés, quatre points), le nom de l'offre
    s'écrit en voix légère dans la bande, sa marque dessous. Pendant que le nom se lit, la bande
    change trois fois de palette sur les temps. Puis la caméra recule (sa marque se retire) : six
    cartes arrivent de la droite, en mosaïque autour de la première, chacune avec un morceau de son
    vrai produit ; la vie continue (une liste se coche, un chiffre monte, le curseur clique le
    bouton).

    La vraie matière, dans cet ordre (image.md, « La vraie matière ») : une vraie capture, son
    interface reconstruite, un vrai chiffre de OFFRE.json, puis ses mots. Le point d'accent n'est
    qu'une transition (moins d'une seconde) vers la capture ; chaque carte porte une matière, jamais
    un aplat seul : une carte sans matière n'est pas posée.
    Mosaïque à ×0,46 : le texte d'une carte y fait au moins 64 px (29 px à l'écran) ; on n'y lit
    que le nom, le bouton et la liste (8 mots au plus à l'image, hors bouton et liste). La rangée
    du bas passe sous les commandes de l'application : des images, pas de texte clé ; les deux
    cartes coupées par les bords (c3, c4) portent des captures.

    La lecture (mouvement.md, « La lecture ») : le nom et sa marque restent lecture(nom + marque)
    une fois posés (0,3 s par mot + 0,8 s, jamais moins de 1,5 s) avant que la caméra recule : la
    scène place le recul seule. Pendant cette tenue, la caméra ne fait qu'une dérive lente.
    data-duration (ici et sur l'hôte dans index.html) = l'instant du recul + 2,8 s (la mosaïque se
    lit) ; la console le rappelle s'il manque.

    Couleurs : celles de la marque, rien d'autre. Quatre fonds de carte (accent, clair, gris,
    sombre), chacun avec son encre (classes pal-*) ; la nuit est --brand-sombre. Ses vraies
    captures gardent leurs couleurs. Aucun paysage, aucune illustration, aucune teinte dérivée de
    l'accent, aucun accent en transparence.

    À remplacer : l'objet EXEMPLE, en tête du script (chaque valeur vient de OFFRE.json ou de sa
    vraie matière, ou sa ligne se retire), puis l'identifiant « t02-carte » partout (racine, scène,
    préfixe des ids, clé de la timeline) et data-duration.
      nom : le nom de l'offre (1 à 3 mots : il se réduit seul s'il déborde de la bande) ; marque :
        le nom de sa marque, sous la bande ("" : aucun).
      cartes : la grande, puis les six de la mosaïque, dans l'ordre des places (PLACES, hors
        d'EXEMPLE : leur position et leur fond). La grande porte TOUJOURS une vraie capture
        (image, du dossier assets/images : sa page, son produit, son espace de formation, un
        résultat), que le cercle découvre ; cadrage (facultatif) : la partie montrée, en
        object-position ("50% 0%" : le haut) ; la bande du nom descend alors au tiers bas. En
        portrait, une capture d'écran large se recadre (cadrage) ; une vraie image en hauteur (sa
        pub, sa story, son Reel, son téléphone) remplit mieux la carte. Sans
        aucune capture (rare : c'est la question du repérage), la grande garde ses mots dans la
        bande, sur son fond. Les six autres, en descendant l'échelle : image (une vraie capture,
        avec cadrage) ; ui "bouton" (le vrai libellé du bouton de sa page, que le curseur clique) ;
        ui "liste" (les vrais titres de ses modules, qui se cochent) ; ui "chiffre" (un vrai
        chiffre de la fiche qui monte : a, de, avant, apres, decimales, et texte : son contexte en
        2 ou 3 mots) ; ui "mot" (un mot de sa page, une carte au plus). Les chemins d'exemple
        (sa-page.jpg…) n'existent pas : `npm run check` refuse la scène (erreur 404) tant qu'ils ne
        pointent pas sur ses vraies captures. Jamais une interface inventée, un faux lecteur, une
        icône de décor, un paysage, ni une étiquette technique (rayon, police, code couleur).
    Polices : var(--brand-font-display) pour le nom, les mots et les chiffres ; var(--brand-font-body)
    pour la liste et les contextes.
  -->
</head>
<body>
<template>
  <style>
    #t02-carte {
      /* La palette du style : la nuit de la marque (--brand-sombre), son clair, ses gris, l'accent
         plein (--brand-accent-lisible pour un trait ou un texte posé sur la nuit). */
      --t02-nuit: var(--brand-sombre);
      --t02-texte: var(--brand-clair);
      --t02-accent-texte: var(--brand-accent-lisible);
      background: var(--t02-nuit);
    }
    /* Les quatre palettes d'une carte. --c-fond : son fond ; --c-encre : le texte et les repères
       posés dessus ; --c-mot : un mot géant ; --c-bande et --c-bande-encre : la bande du nom et le
       nom ; --c-contour : un trait de marque autour de la carte (la carte sombre sur la nuit). */
    #t02-carte .pal-accent { --c-fond: var(--brand-accent); --c-encre: var(--brand-contrast); --c-mot: var(--brand-contrast); --c-bande: var(--brand-sombre); --c-bande-encre: var(--brand-clair); --c-contour: transparent; --c-trait: rgba(0, 0, 0, 0.16); }
    #t02-carte .pal-clair { --c-fond: var(--brand-clair); --c-encre: var(--brand-sombre); --c-mot: var(--brand-sombre); --c-bande: var(--brand-sombre); --c-bande-encre: var(--brand-clair); --c-contour: transparent; --c-trait: rgba(0, 0, 0, 0.1); }
    #t02-carte .pal-gris { --c-fond: var(--brand-gris-1); --c-encre: var(--brand-clair); --c-mot: var(--brand-clair); --c-bande: var(--brand-accent); --c-bande-encre: var(--brand-contrast); --c-contour: transparent; --c-trait: rgba(255, 255, 255, 0.14); }
    #t02-carte .pal-sombre { --c-fond: var(--brand-sombre); --c-encre: var(--brand-clair); --c-mot: var(--brand-accent-lisible); --c-bande: var(--brand-accent); --c-bande-encre: var(--brand-contrast); --c-contour: var(--brand-accent-lisible); --c-trait: rgba(255, 255, 255, 0.14); }

    #t02-carte .t02-carte-c {
      position: absolute; width: 960px; height: 1360px; margin: -680px 0 0 -480px;
      border-radius: 64px; overflow: hidden;
    }
    #t02-carte .t02-carte-fond { position: absolute; inset: 0; background: var(--c-fond); }
    #t02-carte .t02-carte-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    #t02-carte .t02-carte-contour { position: absolute; inset: 0; border-radius: 64px; pointer-events: none; box-shadow: inset 0 0 0 3px var(--c-contour); }
    /* La carte vide du début : un trait de marque fin, le cadre qui va porter la capture. */
    #t02-carte .t02-carte-vide { position: absolute; inset: 0; border-radius: 64px; box-shadow: inset 0 0 0 2px var(--t02-accent-texte); }

    /* La grande carte : la bande du nom et ses repères (au tiers bas sur une capture). */
    #t02-carte .t02-carte-bande { position: absolute; left: 12%; right: 12%; top: var(--b-haut, 24%); height: var(--b-h, 22%); background: var(--c-bande); }
    #t02-carte .t02-carte-guides { position: absolute; inset: 0; }
    #t02-carte .t02-carte-gv { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--c-encre); transform-origin: 50% 0; }
    #t02-carte .t02-carte-gh { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--c-encre); transform-origin: 0 50%; }
    #t02-carte .t02-carte-pt { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--brand-clair); box-shadow: 0 0 0 2px var(--c-encre, var(--t02-nuit)); }
    #t02-carte .t02-carte-zone-titre { position: absolute; left: 12%; right: 12%; top: var(--b-haut, 24%); height: var(--b-h, 22%); display: flex; align-items: center; justify-content: center; }
    #t02-carte .t02-carte-titre {
      font-family: var(--brand-font-display); font-weight: 400; font-size: 110px; line-height: 1.02; text-align: center;
      letter-spacing: -0.035em; color: var(--c-bande-encre); white-space: nowrap;
    }
    /* Sa marque, dans une pastille à l'encre de la bande : elle se lit sur une capture comme sur un fond. */
    #t02-carte .t02-carte-signe {
      position: absolute; left: 50%; bottom: 150px; height: 72px; padding: 0 34px; border-radius: 999px;
      display: flex; align-items: center; white-space: nowrap; background: var(--c-bande);
      font-family: var(--brand-font-display); font-weight: 600; font-size: 42px; letter-spacing: -0.02em; color: var(--c-bande-encre);
    }
    /* Les repères et le point du début (au-dessus de la caméra, en pixels d'écran). */
    #t02-carte .t02-carte-repere { position: absolute; z-index: 20; background: var(--t02-accent-texte); }
    #t02-carte .t02-carte-point { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--brand-accent); z-index: 5; }
    #t02-carte .t02-carte-coin { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--brand-clair); box-shadow: 0 0 0 2px var(--t02-nuit); z-index: 4; }

    /* Les cartes de la mosaïque : une capture, le bouton, une liste, un chiffre, un mot. */
    #t02-carte .t02-carte-mot {
      position: absolute; left: 0; right: 0; top: 50%; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 150px; line-height: 1;
      letter-spacing: -0.045em; color: var(--c-mot);
    }
    #t02-carte .t02-carte-chiffre {
      position: absolute; left: 0; right: 0; top: 40%; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 200px; line-height: 1;
      letter-spacing: -0.04em; color: var(--c-mot); font-variant-numeric: tabular-nums;
    }
    #t02-carte .t02-carte-contexte {
      position: absolute; left: 0; right: 0; top: 70%; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-body); font-weight: 600; font-size: 64px; letter-spacing: -0.01em; color: var(--c-encre);
    }
    #t02-carte .t02-carte-liste { position: absolute; left: 80px; right: 60px; }
    #t02-carte .t02-carte-ligne {
      display: flex; align-items: center; gap: 30px; height: 140px; white-space: nowrap;
      font-family: var(--brand-font-body); font-weight: 600; font-size: 64px; color: var(--c-encre);
    }
    #t02-carte .t02-carte-ligne + .t02-carte-ligne { border-top: 2px solid var(--c-trait); }
    #t02-carte .t02-carte-coche { width: 64px; height: 64px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 3px var(--c-trait); display: grid; place-items: center; color: var(--brand-contrast); }
    #t02-carte .t02-carte-coche svg { width: 38px; height: 38px; opacity: 0; }
    #t02-carte .t02-carte-coche.fait { background: var(--brand-accent); box-shadow: none; }
    #t02-carte .t02-carte-coche.fait svg { opacity: 1; }
    #t02-carte .t02-carte-bouton {
      position: absolute; left: 50%; top: 50%; height: 156px; border-radius: 999px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; padding: 0 64px;
      background: var(--brand-clair); color: var(--brand-sombre); white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 64px; letter-spacing: -0.02em;
    }
    #t02-carte .t02-carte-bouton .remplir { position: absolute; inset: 0; border-radius: 999px; background: var(--brand-accent); transform-origin: 0 50%; }
    #t02-carte .t02-carte-bouton span { position: relative; }
    #t02-carte .t02-carte-bouton[data-etat="plein"] span { color: var(--brand-contrast); }
  </style>

  <div data-composition-id="t02-carte" data-width="1080" data-height="1920" data-duration="6.9" style="position:absolute; inset:0;">
    <div id="t02-carte" class="k-scene">
      <div class="k-scene3d"><div class="k-camera" id="t02-carte-cam"></div></div>
      <div class="t02-carte-repere" id="t02-carte-rh" style="left:0; top:1378px; width:1080px; height:2px;"></div>
      <div class="t02-carte-repere" id="t02-carte-rv" style="left:798px; top:0; width:2px; height:1920px;"></div>
      <div id="t02-carte-curseur-hote" style="position:absolute; inset:0; z-index:30;"></div>
    </div>
  </div>

  <script>
    (function () {
      var EXEMPLE = {   // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire
        nom: "Ta formation",   // le nom de l'offre, en voix légère dans la bande (exemple : une formation)
        marque: "Ta marque",   // le nom de sa marque, sous la bande ("" : aucun)
        // La grande carte, puis les six de la mosaïque (ordre des PLACES). Ces chemins montrent où
        // vont SES captures ; les modules sont des exemples à remplacer.
        cartes: [
          { image: "assets/images/sa-pub.jpg", cadrage: "50% 0%" },
          { ui: "bouton", texte: "Je commence" },
          { ui: "liste", lignes: ["Les bases", "La méthode", "Les outils", "Le lancement"] },
          { image: "assets/images/une-lecon.jpg", cadrage: "50% 0%" },
          { image: "assets/images/sa-page.jpg", cadrage: "50% 0%" },
          { image: "assets/images/son-produit.jpg", cadrage: "50% 30%" },
          { image: "assets/images/un-resultat.jpg", cadrage: "50% 50%" }
        ]
      };

      var ID = "t02-carte", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cam = $("cam");
      var cadre = K.cadre(racine), L = cadre.largeur;
      // La durée : la plus courte des data-duration de la scène et de son hôte (index.html).
      var D = (function () {
        var v = [], n = racine;
        for (; n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === ID && parseFloat(n.getAttribute("data-duration")) > 0) v.push(parseFloat(n.getAttribute("data-duration")));
        }
        return v.length ? Math.min.apply(null, v) : 6.9;
      })();

      // ---------- Le mouvement : la place et le fond de chaque carte ----------
      // La grande (hero) au centre, puis la mosaïque autour (centre de chaque carte, dans l'espace
      // de la caméra) : deux cartes par rangée sur trois rangées, celles du haut et du bas entières,
      // celle du milieu avec la grande entre deux cartes coupées par les bords (c3, c4). fond :
      // "accent", "clair", "gris" ou "sombre" (le fond d'une carte, et le cadre d'une capture).
      var PLACES = [
        { nom: "hero", x: 540, y: 960, fond: "accent" },
        { nom: "c1", x: 38, y: -444, fond: "gris" },
        { nom: "c2", x: 1042, y: -444, fond: "clair" },
        { nom: "c3", x: -464, y: 960, fond: "accent" },
        { nom: "c4", x: 1544, y: 960, fond: "gris" },
        { nom: "c5", x: 38, y: 2364, fond: "sombre" },
        { nom: "c6", x: 1042, y: 2364, fond: "clair" }
      ];
      // La matière de chaque carte, dans l'ordre des places (voir EXEMPLE) ; une carte sans matière
      // n'est pas posée.
      var CARTES = PLACES.map(function (p, i) { return Object.assign({}, EXEMPLE.cartes[i] || {}, p); })
        .filter(function (c, i) {
          if (c.image || (c.ui && c.ui !== "aplat")) return true;
          if (!i) console.warn(ID + " : la grande carte n'a pas de capture (image) : elle garde ses mots dans la bande.");
          return !i;
        });
      var NOM = EXEMPLE.nom, MARQUE = EXEMPLE.marque;

      // La lecture : 0,3 s par mot + 0,8 s, jamais moins de 1,5 s (studio_motion.py lecture).
      var lecture = function (t) {
        var n = t.split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length;
        return n ? Math.ceil(Math.max(1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10 : 0;
      };
      var mots = NOM.split(" ").length;
      var NOM_POSE = 1.4 + 0.09 * (mots - 1) + 0.55, SIGNE_POSE = MARQUE ? 2.07 : 0;
      var POSE = Math.max(NOM_POSE, SIGNE_POSE);
      var RECUL = Math.max(3.6, Math.ceil((POSE + lecture(NOM + " " + MARQUE)) * 10) / 10);
      if (D + 1e-6 < RECUL + 2.8) console.warn(ID + " : data-duration trop courte, il faut " + (RECUL + 2.8).toFixed(1) + " s (recul à " + RECUL.toFixed(1) + " s)");

      // Ce qui dépend du temps sans tween possible (la découpe du cercle) : fonctions pures du temps.
      var aJour = [], horloge = { t: 0 };
      function selon(fn) { aJour.push(fn); }
      function prog(t, t0, duree, ease) { return t <= t0 ? 0 : t >= t0 + duree ? 1 : gsap.parseEase(ease || "power2.inOut")((t - t0) / duree); }
      tl.to(horloge, { t: D, duration: D, ease: "none", onUpdate: function () { aJour.forEach(function (f) { f(horloge.t); }); } }, 0);
      var chiffreFormat = function (c) {
        return function (v) {
          var s = c.decimales ? v.toFixed(c.decimales).replace(".", ",") : String(Math.round(v));
          var p = s.split(","); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
          return (c.avant || "") + p.join(",") + (c.apres || "");
        };
      };

      // ---------- Les cartes ----------
      var el = {};
      CARTES.forEach(function (c) {
        var d = K.el(cam, "div", "t02-carte-c pal-" + c.fond);
        d.id = ID + "-" + c.nom;
        d.setAttribute("data-layout-allow-overflow", "");   // la mosaïque déborde du cadre, exprès
        d.style.left = c.x + "px"; d.style.top = c.y + "px";
        var fond = K.el(d, "div", "t02-carte-fond");
        if (c.image) {
          var im = K.el(fond, "img", "t02-carte-img"); im.src = c.image; im.alt = "";
          if (c.cadrage) im.style.objectPosition = c.cadrage;
        }
        c.fondEl = fond;
        K.el(d, "div", "t02-carte-contour");
        el[c.nom] = d;
        if (c.ui === "mot") {
          c.mot = K.el(d, "div", "t02-carte-mot", c.texte);
          gsap.set(c.mot, { yPercent: -50 });
        } else if (c.ui === "chiffre") {
          c.chiffre = K.el(d, "div", "t02-carte-chiffre", chiffreFormat(c)(c.a));
          gsap.set(c.chiffre, { yPercent: -50 });
          if (c.texte) { c.contexte = K.el(d, "div", "t02-carte-contexte", c.texte); gsap.set(c.contexte, { yPercent: -50 }); }
        } else if (c.ui === "liste") {
          var liste = K.el(d, "div", "t02-carte-liste", null, "top:" + (680 - c.lignes.length * 70) + "px;");
          c.coches = c.lignes.map(function (t) {
            var l = K.el(liste, "div", "t02-carte-ligne");
            var ch = K.el(l, "span", "t02-carte-coche", K.ic("check"));
            K.el(l, "span", null, t);
            return ch;
          });
        } else if (c.ui === "bouton") {
          var b = K.el(d, "div", "t02-carte-bouton", '<i class="remplir"></i><span>' + c.texte + "</span>");
          gsap.set(b, { xPercent: -50, yPercent: -50 });
          c.remplir = b.querySelector(".remplir");
          c.bouton = b;
        }
      });

      // ---------- La grande carte : vide au début, puis sa capture, la bande, les repères, le nom ----------
      var H0 = CARTES[0], hero = el.hero, fondHero = H0.fondEl;
      // Sur une capture, la bande descend au tiers bas : le haut de la capture reste visible.
      if (H0.image) { hero.style.setProperty("--b-haut", "60%"); hero.style.setProperty("--b-h", "20%"); }
      var bHaut = H0.image ? 60 : 24, bBas = H0.image ? 80 : 46;
      var vide = K.el(hero, "div", "t02-carte-vide");
      var bande = K.el(hero, "div", "t02-carte-bande");
      var guides = K.el(hero, "div", "t02-carte-guides");
      var gv = [K.el(guides, "i", "t02-carte-gv", null, "left:12%"), K.el(guides, "i", "t02-carte-gv", null, "left:88%")];
      var gh = [K.el(guides, "i", "t02-carte-gh", null, "top:" + bHaut + "%"), K.el(guides, "i", "t02-carte-gh", null, "top:" + bBas + "%")];
      var pts = [[12, bHaut], [88, bHaut], [12, bBas], [88, bBas]].map(function (p) {
        return K.el(guides, "u", "t02-carte-pt", null, "left:" + p[0] + "%; top:" + p[1] + "%");
      });
      var zone = K.el(hero, "div", "t02-carte-zone-titre");
      var titre = K.el(zone, "div", "t02-carte-titre", NOM.split(" ").map(function (m) { return '<span class="k-mot">' + m + "</span>"; }).join(" "));
      titre.id = ID + "-titre";
      var signe = MARQUE ? K.el(hero, "div", "t02-carte-signe", MARQUE) : null;
      if (signe) { signe.id = ID + "-signe"; gsap.set(signe, { xPercent: -50 }); }
      var point = K.el(cam, "div", "t02-carte-point", null, "left:880px; top:1565px;");

      // ---------- La caméra ----------
      // Départ : tout près du coin bas-droit de la grande carte (1020, 1640 dans l'espace caméra),
      // posé en (800, 1380) à l'écran, à l'échelle 2,6 ; elle recule avant toute phrase. La grande
      // carte remplit ensuite l'image.
      var S0 = 2.6, CX = 540, CY = 960, S1 = 0.46, DX = -30, DY = -50;
      gsap.set(cam, { scale: S0, x: (800 - CX) - S0 * (1020 - CX), y: (1380 - CY) - S0 * (1640 - CY) });
      tl.to(cam, { scale: 1, x: 0, y: 0, duration: 0.6, ease: "expo.inOut" }, 0.22);
      // Pendant que le nom se lit : une dérive lente (3,5 %), rien d'autre.
      tl.to(cam, { scale: 1.035, duration: RECUL - 1.0, ease: "sine.inOut" }, 1.0);
      tl.to(cam, { scale: S1, x: 0, y: 0, duration: 0.85, ease: "expo.inOut" }, RECUL);
      tl.to(cam, { x: DX, y: DY, duration: D - RECUL - 0.85, ease: "sine.inOut" }, RECUL + 0.85);

      // Les repères et le point du début ; les repères se rétractent pendant le recul.
      var rh = $("rh"), rv = $("rv");
      // Ils partent du coin (798, 1378 à l'écran) et s'étendent des deux côtés.
      gsap.set(rh, { scaleX: 0, transformOrigin: "798px 50%" });
      gsap.set(rv, { scaleY: 0, transformOrigin: "50% 1378px" });
      tl.to(rh, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 0.0);
      tl.to(rv, { scaleY: 1, duration: 0.35, ease: "expo.out" }, 0.04);
      tl.to(rh, { scaleX: 0, duration: 0.25, ease: "power2.in" }, 0.28);
      tl.to(rv, { scaleY: 0, duration: 0.25, ease: "power2.in" }, 0.28);
      gsap.set(point, { scale: 0 });
      tl.to(point, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.05);
      // Le point d'accent file au centre de la carte : il s'y ouvre sur la capture.
      tl.to(point, { x: -340, y: -605, duration: 0.5, ease: "power3.inOut" }, 0.25);
      tl.set(point, { opacity: 0 }, 0.77);

      // Les quatre points de la carte, à la fin du recul.
      var coins = [[70, 290], [1010, 290], [70, 1630], [1010, 1630]].map(function (p) {
        return K.el(cam, "u", "t02-carte-coin", null, "left:" + p[0] + "px; top:" + p[1] + "px;");
      });
      K.cacher(coins, { scale: 0 });
      tl.to(coins, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.04 }, 0.6);
      tl.to(coins, { scale: 0, duration: 0.2, ease: "power2.in", stagger: 0.03 }, 1.15);

      // ---------- La carte se construit par couches ----------
      // 1. Sa matière : un cercle qui s'ouvre depuis le point (même taille, même couleur au départ).
      var R0 = 17, R1 = Math.hypot(480, 680) + 6;
      selon(function (t) {
        var r = t < 0.77 ? 0 : R0 + (R1 - R0) * prog(t, 0.77, 0.48, "power3.inOut");
        fondHero.style.clipPath = "circle(" + r.toFixed(1) + "px at 50% 50%)";
      });
      tl.set(vide, { opacity: 0 }, 1.25);
      // 2. La bande du nom s'ouvre depuis le centre.
      gsap.set(bande, { scaleX: 0 });
      tl.to(bande, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.1);
      // 3. Les repères de maquette mesurent la bande, puis le nom en voix légère, puis sa marque.
      gsap.set(gv, { scaleY: 0 }); gsap.set(gh, { scaleX: 0 }); K.cacher(pts, { scale: 0 });
      tl.to(gv, { scaleY: 1, duration: 0.42, ease: "expo.out", stagger: 0.05 }, 1.25);
      tl.to(gh, { scaleX: 1, duration: 0.42, ease: "expo.out", stagger: 0.05 }, 1.3);
      tl.to(pts, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", stagger: 0.04 }, 1.42);
      K.entreeMots(tl, titre.querySelectorAll(".k-mot"), 1.4, { y: 34, flou: 12, decalage: 0.09 });
      if (signe) {
        K.cacher(signe, { y: 16 });
        tl.to(signe, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 1.62);
      }
      // 4. Pendant que le nom se lit, la même carte change de palette sur les temps (coupes
      //    franches). Sur une capture, c'est la bande qui bascule : sombre, accent, sombre.
      var suite = H0.image ? ["sombre", "clair", "gris"] : ["clair", "sombre", H0.fond];
      var PALETTES = suite.map(function (p, i) { return [POSE + 0.45 + i * 0.3, p]; }).filter(function (p) { return p[0] < RECUL - 0.2; });
      PALETTES.forEach(function (p) { tl.set(hero, { attr: { class: "t02-carte-c pal-" + p[1] } }, p[0]); });
      tl.to(gv, { scaleY: 0, duration: 0.3, ease: "power2.in" }, RECUL);
      tl.to(gh, { scaleX: 0, duration: 0.3, ease: "power2.in" }, RECUL);
      tl.to(pts, { scale: 0, duration: 0.25, ease: "power2.in" }, RECUL);
      // Sa marque se retire au recul : déjà lue, elle passerait sous 28 px dans la mosaïque.
      if (signe) tl.to(signe, { opacity: 0, y: 16, duration: 0.25, ease: "power2.in" }, RECUL);

      // ---------- La mosaïque : les autres cartes arrivent de la droite ----------
      // Elles partent hors champ (au moins 1 400 px à droite) et glissent sous la grande, sans
      // fondu : une carte d'accent qui apparaîtrait en transparence sur la nuit virerait à l'olive.
      hero.style.zIndex = "2";
      var horsChamp = CX + (L / 2) / 0.95 + 480 + 20;
      CARTES.slice(1).forEach(function (c, i) {
        gsap.set(el[c.nom], { x: Math.max(1200, horsChamp - c.x) });
        tl.to(el[c.nom], { x: 0, duration: 0.85, ease: "expo.out" }, RECUL + 0.05 + i * 0.06);
      });

      // La vie de la mosaïque : la liste se coche, un chiffre monte, les mots se posent, le curseur
      // clique le bouton.
      var avec = function (ui) { return CARTES.filter(function (c) { return c.ui === ui; }); };
      avec("liste").forEach(function (c) {
        c.coches.forEach(function (ch, i) { tl.set(ch, { attr: { class: "t02-carte-coche fait" } }, RECUL + 0.7 + i * 0.18); });
      });
      avec("chiffre").forEach(function (c, i) {
        K.compteur(tl, c.chiffre, c.de || 0, c.a, RECUL + 0.45 + i * 0.1, 1.1, D, chiffreFormat(c), "expo.out");
      });
      var motsGeants = avec("mot").map(function (c) { return c.mot; });
      if (motsGeants.length) tl.fromTo(motsGeants, { scale: 0.82 }, { scale: 1, duration: 0.6, ease: "back.out(2.2)", stagger: 0.12 }, RECUL + 0.6);
      var bouton = avec("bouton")[0];
      if (bouton) {
        var curseur = K.curseur($("curseur-hote"), ID + "-curseur", true);
        K.cacher(curseur);
        gsap.set(bouton.remplir, { scaleX: 0 });
        // Le centre du bouton à l'écran au moment du clic (recul fini, la dérive a commencé).
        var derive = gsap.parseEase("sine.inOut")(Math.min(1, 0.6 / Math.max(0.6, D - RECUL - 0.85)));
        var bx = CX + S1 * (bouton.x - CX) + DX * derive, by = CY + S1 * (bouton.y - CY) + DY * derive;
        tl.to(curseur, { opacity: 1, duration: 0.2 }, RECUL + 0.85);
        K.trajet(tl, curseur, [[0, 900, 1500], [RECUL + 0.85, bx + 8, by + 6, 0.55, "power3.out"]]);
        K.clic(tl, curseur, RECUL + 1.45);
        tl.to(bouton.remplir, { scaleX: 1, duration: 0.35, ease: "power3.inOut" }, RECUL + 1.5);
        tl.set(bouton.bouton, { attr: { "data-etat": "plein" } }, RECUL + 1.7);
      }

      // Le nom et les mots se mesurent une fois les polices chargées.
      var cs = getComputedStyle(titre);
      document.fonts.load(cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily).then(finir, finir);
      // La largeur d'un texte (et non de sa boîte, qui fait toute la carte), sans transformation.
      function largeur(el, texte) {
        var s = K.el(el, "span", null, null, "position:absolute; left:0; top:0; visibility:hidden; white-space:nowrap;");
        s.textContent = texte != null ? texte : el.textContent;
        var w = s.offsetWidth; el.removeChild(s); return w;
      }
      function finir() {
        // Le nom tient dans la bande : sur deux lignes s'il le faut, réduit ensuite ; un mot géant,
        // un chiffre, son contexte et le libellé du bouton tiennent dans leur carte.
        var maxNom = zone.offsetWidth - 60;
        if (titre.scrollWidth > maxNom && NOM.indexOf(" ") > 0) { titre.style.whiteSpace = "normal"; titre.style.width = maxNom + "px"; }
        var plusLarge = 0; titre.querySelectorAll(".k-mot").forEach(function (m) { plusLarge = Math.max(plusLarge, m.offsetWidth); });
        var fsNom = 110;
        if (plusLarge > maxNom) fsNom = 110 * maxNom / plusLarge;
        if (titre.scrollHeight > zone.offsetHeight - 40) fsNom = Math.min(fsNom, 110 * (zone.offsetHeight - 40) / titre.scrollHeight);
        titre.style.fontSize = fsNom.toFixed(1) + "px";
        // Un mot géant ou un chiffre trop large se réduit (il reste très au-dessus de 28 px à l'écran) ;
        // un contexte, un libellé ou une ligne de liste trop longs se coupent : jamais sous 64 px.
        var MAX = 840;
        avec("mot").forEach(function (c) { var w = largeur(c.mot); if (w > MAX) c.mot.style.fontSize = (150 * MAX / w).toFixed(1) + "px"; });
        avec("chiffre").forEach(function (c) {
          var w = largeur(c.chiffre, chiffreFormat(c)(c.a));   // mesuré à sa valeur finale
          if (w > MAX) c.chiffre.style.fontSize = (200 * MAX / w).toFixed(1) + "px";
          if (c.contexte && largeur(c.contexte) > MAX) console.warn(ID + " : le contexte du chiffre est trop long, coupe des mots");
        });
        avec("bouton").forEach(function (c) { if (c.bouton.offsetWidth > 880) console.warn(ID + " : le libellé du bouton est trop long, coupe des mots"); });
        avec("liste").forEach(function (c) { c.coches.forEach(function (ch) { if (ch.parentNode.scrollWidth > ch.parentNode.offsetWidth + 1) console.warn(ID + " : une ligne de la liste est trop longue, coupe des mots"); }); });
        aJour.forEach(function (f) { f(0); });
        window.__timelines[ID] = tl;
      }
    })();
  </script>
</template>
