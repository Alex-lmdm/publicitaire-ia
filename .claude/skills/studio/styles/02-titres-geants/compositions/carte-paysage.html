    TEMPLATE N°2 · TITRES GÉANTS · SCÈNE « CARTE PAYSAGE » (le produit à l'écran), 5,0 s, 16:9

    Ce qu'elle montre : sur le fond sombre de la marque, la caméra part tout près d'un coin arrondi
    (une cote « Rayon 64 px », un point d'accent), recule et découvre une grande carte vide ; la
    carte se remplit d'un paysage illustré qui se construit par couches (ciel, lueur, mer, reflets,
    îles, rivage), des repères de maquette se posent (deux traits pleins, deux traits pointillés,
    quatre points), le nom de l'offre s'écrit en graisse légère dans la bande sélectionnée. Puis la
    caméra recule encore : six autres cartes arrivent de la droite, en mosaïque autour de la
    première, chacune avec un paysage et un morceau du produit (une liste de modules qui se coche,
    un bouton qu'un curseur clique, un lecteur qui avance, une tuile d'icône). Juste avant le recul,
    la grande carte change trois fois de palette sur les temps (jour, nuit, crépuscule).

    Les couleurs des paysages se DÉRIVENT de l'accent de la marque (oklch relatif) : crépuscule
    (ombres décalées de teinte), jour (l'accent pur), nuit (le fond de la marque). Rien en dur.
    --t02-d (défaut -40) : décalage de teinte des ombres, en degrés ; mets +40 pour un accent vert
    (sinon le ciel tire sur le kaki).

    À remplacer :
      1. L'identifiant « t02-carte » partout (racine, scène, préfixe des ids et des dégradés SVG,
         clé de la timeline).
      2. Le nom de l'offre (#t02-carte-titre, 1 à 3 mots, un .k-mot par mot) et la petite ligne
         dessous (#t02-carte-signe : le nom de sa marque, ou son logo en <img src="brand/logo.svg">).
      3. Le contenu des six cartes de la mosaïque (CARTES, plus bas) : ses VRAIES surfaces. Une
         carte « capture » prend une image du dossier assets/images (sa page, son espace de
         formation, son logiciel) ; « liste » les vrais titres de ses modules ; « bouton » le vrai
         libellé de son bouton ; « lecteur » une vraie vignette si elle existe. Une carte sans
         matière réelle reste un paysage seul : jamais une interface inventée.
      4. La palette de chaque carte (crepuscule, jour, nuit) et son relief (mer, plateaux).
    Polices : var(--brand-font-display) pour le nom ; Inter (assets/fonts/interfaces.css) pour
    les interfaces reconstruites.
  -->

          });
        } else if (c.ui === "bouton") {
          var b = K.el(d, "div", "t02-carte-ui t02-carte-bouton", '<i class="remplir"></i>' + K.ic("play") + "<span>" + c.texte + "</span>", "left:50%; top:46%; transform:translate(-50%,-50%);");
          c.remplir = b.querySelector(".remplir");
          c.bouton = b;
        } else if (c.ui === "tuile") {
          c.tuile = K.el(d, "div", "t02-carte-ui t02-carte-tuile", K.ic(c.icone), "left:615px; top:250px;");
        } else if (c.ui === "lecteur") {
          var lec = K.el(d, "div", "t02-carte-ui t02-carte-lecteur", null, "left:360px; top:150px;");
          K.el(lec, "div", "jouer", K.ic("play"));
          c.barre = K.el(K.el(lec, "div", "barre"), "i");
        }
      });

      // La grande carte : contour, repères, nom de l'offre.
      var hero = el.hero;
      var contour = K.el(hero, "div", "t02-carte-contour");
      var guides = K.el(hero, "div", "t02-carte-guides");
      var bande = K.el(guides, "div", "t02-carte-bande", null, "top:20%; height:31%;");
      var gv = [K.el(guides, "i", "t02-carte-gv", null, "left:12%"), K.el(guides, "i", "t02-carte-gv", null, "left:88%")];
      var gh = [K.el(guides, "i", "t02-carte-gh", null, "top:20%"), K.el(guides, "i", "t02-carte-gh", null, "top:51%")];
      var pts = [[12, 20], [88, 20], [12, 51], [88, 51]].map(function (p) {
        return K.el(guides, "u", "t02-carte-pt", null, "left:" + p[0] + "%; top:" + p[1] + "%");
      });
      var zone = K.el(hero, "div", "t02-carte-zone-titre", null, "top:20%; height:31%;");
      var titre = K.el(zone, "div", "t02-carte-titre", '<span class="k-mot">Ton</span> <span class="k-mot">offre</span>');
      titre.id = ID + "-titre";
      var signe = K.el(hero, "div", "t02-carte-signe", "Ta marque");
      signe.id = ID + "-signe";
      var point = K.el(cam, "div", "t02-carte-point", null, "left:1560px; top:880px;");

      // ---------- La caméra ----------
      // Départ : tout près du coin bas-droit de la grande carte (1700, 955 dans l'espace caméra),
      // posé en (1310, 860) à l'écran, à l'échelle 2,6.
      var S0 = 2.6, CX = 960, CY = 540;
      gsap.set(cam, { scale: S0, x: (1310 - CX) - S0 * (1700 - CX), y: (860 - CY) - S0 * (955 - CY) });
      tl.to(cam, { scale: 1, x: 0, y: 0, duration: 0.62, ease: "expo.inOut" }, 0.42);
      tl.to(cam, { scale: 1.035, duration: 0.95, ease: "none" }, 2.05);
      tl.to(cam, { scale: 0.44, x: 0, y: 0, duration: 0.85, ease: "expo.inOut" }, 3.0);
      tl.to(cam, { x: -70, y: -10, duration: D - 3.85, ease: "none" }, 3.85);

      // La cote, les repères et le point du début.
      tl.fromTo([$("rh"), $("rv")], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.0);
      tl.fromTo($("cote"), { opacity: 0, y: 8 }, { opacity: 0.85, y: 0, duration: 0.3, ease: "expo.out" }, 0.08);
      tl.to([$("rh"), $("rv"), $("cote")], { opacity: 0, duration: 0.2, ease: "power2.in" }, 0.45);
      tl.fromTo(point, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.12);
      tl.to(point, { x: -600, y: -255, duration: 0.7, ease: "power3.inOut" }, 0.45);
      tl.to(point, { scale: 0, duration: 0.3, ease: "power2.in" }, 1.08);

      // Les quatre points de la carte vide, à la fin du recul.
      var coins = [[230, 135], [1690, 135], [230, 945], [1690, 945]].map(function (p) {
        return K.el(cam, "u", "t02-carte-pt", null, "left:" + p[0] + "px; top:" + p[1] + "px; z-index:4;");
      });
      K.cacher(coins);
      tl.fromTo(coins, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.04 }, 0.82);
      tl.to(coins, { opacity: 0, duration: 0.2 }, 1.5);

      // ---------- Le paysage se construit par couches ----------
      var q = function (sel) { return hero.querySelectorAll(sel); };
      K.cacher(q(".p-ciel, .p-lueur, .p-loin, .p-mer, .p-reflets, .p-pres, .p-rivage"));
      tl.to(q(".p-ciel"), { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.0);
      tl.fromTo(q(".p-lueur"), { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 1.06);
      tl.fromTo(q(".p-mer"), { opacity: 1, scaleY: 0, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.42, ease: "expo.out" }, 1.18);
      tl.set(q(".p-reflets"), { opacity: 1 }, 1.3);
      tl.fromTo(q(".p-reflet"), { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.45, ease: "expo.out", stagger: 0.035 }, 1.3);
      tl.fromTo(q(".p-loin"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 1.4);
      tl.fromTo(q(".p-pres"), { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.55);
      tl.fromTo(q(".p-rivage"), { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 1.68);
      tl.to(contour, { opacity: 0, duration: 0.3 }, 1.2);

      // ---------- Les repères de maquette et le nom ----------
      gsap.set(gv, { scaleY: 0 }); gsap.set(gh, { scaleX: 0 }); K.cacher(pts); K.cacher(bande);
      tl.to(gv, { scaleY: 1, duration: 0.42, ease: "expo.out", stagger: 0.05 }, 1.92);
      tl.to(gh, { scaleX: 1, duration: 0.42, ease: "expo.out", stagger: 0.05 }, 1.98);
      tl.fromTo(pts, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", stagger: 0.04 }, 2.12);
      tl.fromTo(bande, { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "expo.out" }, 2.12);
      K.entreeMots(tl, titre.querySelectorAll(".k-mot"), 2.25, { y: 34, flou: 12, decalage: 0.09 });
      K.cacher(signe);
      tl.fromTo(signe, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 2.5);
      // La même carte change de palette sur les temps (coupes franches) : jour, nuit, crépuscule.
      [[2.64, "jour"], [2.80, "nuit"], [2.96, "crepuscule"]].forEach(function (p) {
        tl.set(hero, { attr: { class: "t02-carte-c pal-" + p[1] } }, p[0]);
      });
      tl.to(guides, { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.0);

      // ---------- La mosaïque : les autres cartes arrivent de la droite ----------
      var autres = CARTES.slice(1).map(function (c) { return el[c.nom]; });
      gsap.set(autres, { x: 1400, opacity: 0 });
      tl.to(autres, { x: 0, opacity: 1, duration: 0.85, ease: "expo.out", stagger: 0.06 }, 3.05);

      // La vie de la mosaïque : la liste se coche, le bouton est cliqué, le lecteur avance.
      var c3 = CARTES[3], c1 = CARTES[1], c4 = CARTES[4], c2 = CARTES[2], c5 = CARTES[5];
      c3.coches.forEach(function (ch, i) { tl.set(ch, { attr: { class: "t02-carte-coche fait" } }, 3.7 + i * 0.18); });
      gsap.set(c1.remplir, { scaleX: 0 });
      var curseur = K.curseur($("curseur-hote"), ID + "-curseur", true);
      K.cacher(curseur);
      tl.to(curseur, { opacity: 1, duration: 0.2 }, 3.85);
      K.trajet(tl, curseur, [[0, 1100, 520], [3.85, 604, 124, 0.55, "power3.out"]]);
      K.clic(tl, curseur, 4.45);
      tl.to(c1.remplir, { scaleX: 1, duration: 0.35, ease: "power3.inOut" }, 4.5);
      tl.fromTo(c4.barre, { scaleX: 0.05 }, { scaleX: 0.62, duration: D - 3.6, ease: "none" }, 3.6);
      tl.fromTo([c2.tuile, c5.tuile], { scale: 0.8 }, { scale: 1, duration: 0.6, ease: "back.out(2.2)", stagger: 0.25 }, 3.75);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
