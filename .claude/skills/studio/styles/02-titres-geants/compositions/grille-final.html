    TEMPLATE N°2 · TITRES GÉANTS · SCÈNE « GRILLE ET FINAL » (ce qu'on reçoit, le slogan, l'appel),
    8,0 s, 16:9

    Ce qu'elle montre, en trois plans coupés franc :
      plan A (0 à 2,4 s) : sur le fond sombre de la marque, l'étoile de rayons de la scène
        précédente se resserre au centre et disparaît ; une grille d'icônes au trait fin se dessine
        depuis le centre (chaque icône dans un cercle de construction pointillé, deux points sur
        le cercle) ; un cadre de sélection à poignées attrape une icône, qui passe à l'accent, et
        son étiquette s'écrit ; la caméra s'en approche ;
      plan B (2,4 à 4,4 s) : le slogan géant, blanc, sur deux lignes, dans un espace profond aux
        teintes de l'accent ; une planète en bas à gauche, des cubes (le produit) qui dérivent, la
        sphère de verre qui passe derrière les lettres ;
      plan C (4,4 à 8,0 s) : sur le fond sombre, le nom de la marque et ses repères de maquette ;
        la sphère arrive, se pose et devient le bouton ; le curseur le clique, il se remplit de
        l'accent ; le nom et le bouton tiennent 2,6 s avec les cubes qui dérivent.

    À remplacer :
      1. L'identifiant « t02-final » partout (racine, scène, préfixe des ids et des dégradés SVG,
         clé de la timeline).
      2. ICONES : une icône par élément RÉEL de l'offre (module, bonus, outil, fonction), 12 à 24,
         noms du kit (K.ic, Lucide) ou logos posés par `studio_motion.py logos`. CHOISIE : l'index
         de l'icône que le cadre attrape, et ETIQUETTE : ce qu'elle est (2 à 4 mots).
      3. Le slogan (#t02-final-l1, #t02-final-l2 : 1 à 2 mots par ligne, 4 au plus en tout).
      4. Le nom (#t02-final-nom : le nom de sa marque ou de l'offre ; un logo se pose en
         <img src="brand/logo.svg"> à sa gauche, s'il en a un) et le bouton (#t02-final-btn-texte :
         le vrai libellé du bouton de sa page, 1 à 3 mots).
    Couleurs : var(--brand-*) et teintes dérivées de l'accent (--t02-d, défaut -40 ; +40 pour un
    accent vert). Polices : var(--brand-font-display) ; étiquettes en var(--brand-font-body).
  -->

        var a1 = (i * 47) % 360, a2 = (a1 + 140 + (i * 23) % 80) % 360;
        var p = function (a) { return [75 + 62 * Math.cos(a * Math.PI / 180), 75 + 62 * Math.sin(a * Math.PI / 180)]; };
        var q1 = p(a1), q2 = p(a2);
        c.innerHTML = '<svg class="rond" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-width="1.6" stroke-dasharray="3 6"/>' +

      K.cacher(objet);
      tl.set(objet, { opacity: 1 }, B);
      // Derrière les lettres : de la droite vers le milieu, en tournant (z-index sous le slogan).
      // Dans l'espace, elle est à contre-jour (plus sombre) : le slogan blanc reste lisible devant.
      tl.fromTo(objet, { x: 260, y: 140, scale: 0.78, filter: "brightness(0.58) saturate(1.25)" },
        { x: -380, y: 60, scale: 0.92, filter: "brightness(0.58) saturate(1.25)", duration: 2.0, ease: "power1.inOut" }, B);
      tl.fromTo(objet.querySelectorAll(".s-tourne"), { x: -30 }, { x: 34, duration: D - B, ease: "none" }, B);
      tl.fromTo(objet.querySelector("svg"), { rotation: 8 }, { rotation: -6, duration: D - B, ease: "sine.inOut" }, B);

      // ---------- Plan C : le nom, ses repères, la sphère qui devient le bouton ----------
      var planC = $("planC");
      K.cacher(planC);
      tl.set(planC, { opacity: 1 }, C);
      tl.set(planB, { opacity: 0 }, C + 0.02);
      // La sphère se pose sous le nom et devient le bouton (même centre, 960 × 650).
      tl.set(objet, { x: 560, y: 520, scale: 0.5, filter: "brightness(1) saturate(1)" }, C);
      tl.to(objet, { x: -540, y: 350, scale: 0.3, duration: 0.55, ease: "expo.inOut" }, C + 0.02);
      tl.to(objet, { scale: 0, opacity: 0, duration: 0.18, ease: "power2.in" }, C + 0.55);

      var nom = $("nom"), btn = $("btn"), remplir = btn.querySelector(".remplir"), texteBtn = $("btn-texte");
      var lettres = nom.textContent.split("");
      nom.innerHTML = lettres.map(function (l) { return '<span class="k-mot">' + (l === " " ? "&nbsp;" : l) + "</span>"; }).join("");
      K.entreeMots(tl, nom.querySelectorAll(".k-mot"), C + 0.05, { y: 40, flou: 10, decalage: 0.025, duree: 0.5 });

      // Le bouton naît de la sphère : un rond qui s'étire en pilule, puis le texte.
      var LARGEUR = 560;
      gsap.set(btn, { width: 120, x: -60, opacity: 0 });
      gsap.set(remplir, { scale: 0 });
      tl.to(btn, { opacity: 1, duration: 0.12 }, C + 0.6);
      tl.to(btn, { width: LARGEUR, x: -LARGEUR / 2, duration: 0.45, ease: "expo.out" }, C + 0.66);
      K.cacher(texteBtn);
      tl.fromTo(texteBtn, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, C + 0.85);

      // Les repères de maquette : un trait sous le nom, une cote du bouton, leurs étiquettes.
      var reperes = $("reperes");
      var famille = getComputedStyle(nom).fontFamily.split(",")[0].replace(/["']/g, "").trim();
      var tNom = K.el(reperes, "div", "t02-final-trait", null, "left:560px; top:476px; width:800px; height:2px;");
      var tNomG = K.el(reperes, "div", "t02-final-trait", null, "left:560px; top:466px; width:2px; height:20px;");
      var tNomD = K.el(reperes, "div", "t02-final-trait", null, "left:1358px; top:466px; width:2px; height:20px;");
      var nNom = K.el(reperes, "div", "t02-final-note", famille + " SemiBold · 132 px", "left:560px; top:492px;");
      var tBtn = K.el(reperes, "div", "t02-final-trait", null, "left:" + (960 + LARGEUR / 2 + 30) + "px; top:590px; width:2px; height:120px;");
      var nBtn = K.el(reperes, "div", "t02-final-note", "Bouton · rayon plein", "left:" + (960 + LARGEUR / 2 + 50) + "px; top:636px;");
      gsap.set([tNom], { scaleX: 0, transformOrigin: "0 50%" });
      gsap.set([tNomG, tNomD, tBtn], { scaleY: 0 });
      K.cacher([nNom, nBtn]);
      tl.to(tNom, { scaleX: 1, duration: 0.45, ease: "expo.out" }, C + 0.4);
      tl.to([tNomG, tNomD], { scaleY: 1, duration: 0.3, ease: "expo.out" }, C + 0.45);
      tl.fromTo(nNom, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, C + 0.55);
      tl.to(tBtn, { scaleY: 1, duration: 0.35, ease: "expo.out" }, C + 1.0);
      tl.fromTo(nBtn, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, C + 1.05);
      tl.to([tNom, tNomG, tNomD, nNom, tBtn, nBtn], { opacity: 0, duration: 0.3, ease: "power2.in" }, C + 1.75);

      // Le curseur clique le bouton : il se remplit de l'accent.
      var curseur = K.curseur($("curseur-hote"), ID + "-curseur", true);
      K.cacher(curseur);
      tl.to(curseur, { opacity: 1, duration: 0.2 }, C + 0.95);
      K.trajet(tl, curseur, [[0, 1560, 960], [C + 0.95, 1050, 660, 0.55, "power3.out"]]);
      K.clic(tl, curseur, C + 1.55);
      tl.to(remplir, { scale: 1.02, duration: 0.4, ease: "power3.out" }, C + 1.58);
      tl.set(btn, { attr: { "data-etat": "plein" } }, C + 1.68);
      tl.fromTo(btn, { scale: 1 }, { scale: 1.04, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, C + 1.58);
      tl.to(curseur, { x: 1180, y: 760, duration: 0.6, ease: "power2.inOut" }, C + 1.9);

      // Quelques cubes qui dérivent pendant la tenue.
      var cubesC = cubes($("cubesC"), [[300, 220, 54, 1, 0], [1620, 260, 40, -1, 1], [1480, 880, 30, 1, 2], [420, 820, 34, -1, 1.5]]);
      cubesC.forEach(function (cu, i) {
        var r = parseFloat(cu.dataset.r);
        K.cacher(cu.parentNode);
        tl.fromTo(cu.parentNode, { opacity: 0, scale: 0.4 }, { opacity: 0.9, scale: 1, duration: 0.5, ease: "back.out(2)" }, C + 0.3 + i * 0.1);
        tl.fromTo(cu, { rotationX: -15, rotationY: 40 * i }, { rotationX: 15, rotationY: 40 * i + 120 * r, duration: D - C, ease: "none" }, C);
        tl.fromTo(cu.parentNode, { y: 0 }, { y: -26 + i * 8, duration: D - C, ease: "sine.inOut" }, C);
      });

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
