<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°2 · TITRES GÉANTS · SCÈNE « GRILLE ET FINAL » (ce qu'on reçoit, le slogan, l'appel),
    11,8 s, 16:9

    Ce qu'elle montre, en trois plans coupés franc, chacun tenu le temps de sa lecture :
      plan A : sur la nuit de la marque, l'étoile de rayons de la scène précédente se resserre au
        centre et disparaît ; une grille d'icônes au trait fin se dessine depuis le centre (une case
        par élément réel de l'offre, chacune dans un cercle de construction pointillé) ; la caméra
        s'approche de l'élément phare avant toute phrase, un cadre de sélection à poignées
        l'attrape, il passe à l'accent et son nom s'écrit ; pendant que ce nom se lit, les autres
        cases passent au flou (la profondeur), la caméra ne fait qu'une dérive lente ;
      plan B : le slogan géant, sur deux lignes, sur la nuit quadrillée fin ; ses lignes de base
        se tracent et son point final est un disque d'accent plein qui tombe en place ; pendant la
        lecture, ses mots changent de graisse sur les temps ;
      plan C (la carte de fin) : le point du slogan file sous le nom et devient le bouton (un rond
        qui s'étire en pilule) ; le nom s'écrit, des repères le mesurent ; le curseur clique le
        bouton, il se remplit de l'accent ; tenue de 3 s au moins.

    La vraie matière (interdits.md, « Rien d'inventé ») : chaque case est un élément réel de l'offre
    (un module, un bonus, une fonction : son icône ; un outil qu'elle nomme : son vrai logo), autant
    de cases qu'il y en a, jamais une icône de remplissage ; le nom de l'élément phare le dit. Le
    disque d'accent porte l'icône de la case phare, puis il est le point du slogan et devient le
    bouton : jamais une forme seule.
    Les tailles : le nom de l'élément phare fait 44 px (68 px à l'écran, caméra approchée) ; le
    slogan, sa plus longue ligne à 70 % de la largeur (300 px au plus) ; le nom de la carte de fin,
    mot héros à 64 % de la largeur (280 px au plus) : la scène règle ces tailles seule.

    La lecture (interdits.md, « La lecture ») : la scène place seule ses coupes après la lecture de
    chaque phrase (0,3 s par mot + 0,8 s, jamais moins de 1,5 s ; la carte de fin 3 s au moins) ;
    data-duration (ici et sur l'hôte dans index.html) = la fin de la tenue du plan C : la console
    donne la valeur s'il manque du temps. La caméra s'approche de la case phare avant tout texte ;
    pendant les lectures, elle ne fait qu'une dérive ou une poussée lente.

    Couleurs : celles de la marque, rien d'autre : la nuit (--brand-sombre), le texte clair
    (--brand-clair), ses gris, l'accent plein (--brand-accent-lisible pour un trait ou un texte
    posé sur la nuit). Les logos de ses outils gardent leurs couleurs. Aucune planète, aucun cube,
    aucune sphère, aucune forme 3D, aucune teinte dérivée de l'accent.

    À remplacer : l'objet EXEMPLE, en tête du script (chaque valeur vient de OFFRE.json ou de sa
    page, ou sa ligne se retire), puis l'identifiant « t02-final » partout (racine, scène, préfixe
    des ids, clé de la timeline) et data-duration.
      icones : une case par élément RÉEL de l'offre (module, bonus, outil, fonction), 6 à 24,
        autant qu'il en a : noms du kit (K.ic, Lucide) pour ses modules et ses bonus, logos posés
        par `studio_motion.py logos` (« logo-claude ») pour les outils qu'elle nomme ; choisie :
        l'index de la case que le cadre attrape ; etiquette : ce qu'elle est, en vrai (2 à 4 mots).
      slogan : une phrase de sa page en deux lignes (1 ou 2 mots par ligne, 4 au plus en tout) ;
        son point final devient le disque d'accent (ajouté s'il manque).
      nom : le nom de sa marque ou de l'offre ; logo (facultatif) : brand/logo.png, posé à sa
        gauche. bouton : le vrai libellé du bouton de sa page (la pilule s'élargit à sa mesure) ;
        note (facultative) : une info réelle sous le bouton (le prix, la date de fin). Une pub ne
        dessine pas de bouton : « Découvre-le » et une flèche vers le bas, à la place.
      Aucune étiquette technique (police, taille, rayon, code couleur).
    Polices : var(--brand-font-display) ; la note en var(--brand-font-body).
  -->
</head>

<template>
  <style>

    #t02-final .t02-final-slogan {
      position: absolute; left: 230px; white-space: nowrap; z-index: 6;

    #t02-final .t02-final-base { position: absolute; left: 0; right: 0; height: 2px; background: rgba(255, 255, 255, 0.16); transform-origin: 0 50%; }
    /* Le disque qui passe du plan B au plan C : le point du slogan, qui devient le bouton. */
    #t02-final .t02-final-objet { position: absolute; left: 0; top: 0; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; background: var(--brand-accent); z-index: 8; }
    /* Plan C : le nom, ses repères et le bouton. */
    #t02-final .t02-final-contenuC { position: absolute; inset: 0; }
    #t02-final .t02-final-nom {
      position: absolute; left: 0; right: 0; top: 330px; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 132px; line-height: 1;
      letter-spacing: -0.04em; color: var(--t02-texte);

    #t02-final .t02-final-nom img { height: 0.82em; width: auto; margin-right: 0.22em; vertical-align: -0.08em; }
    #t02-final .t02-final-trait { position: absolute; background: var(--t02-accent-texte); }
    #t02-final .t02-final-note { position: absolute; left: 0; right: 0; top: 742px; text-align: center; font-family: var(--brand-font-body); font-weight: 500; font-size: 36px; line-height: 1.3; color: var(--t02-texte); white-space: nowrap; }
    #t02-final .t02-final-btn {
      position: absolute; left: 960px; top: 650px; height: 120px; margin: -60px 0 0 0;
      border-radius: 999px; border: 3px solid var(--t02-accent-texte); overflow: hidden;

    #t02-final .t02-final-btn span {

  <div data-composition-id="t02-final" data-width="1920" data-height="1080" data-duration="11.8" style="position:absolute; inset:0;">
    <div id="t02-final" class="k-scene">
      <!-- Plan A -->
      <div class="t02-final-plan" id="t02-final-planA">
        <div class="t02-final-camA" id="t02-final-camA">
          <div class="t02-final-etoile" id="t02-final-etoile"></div>
          <div id="t02-final-grille"></div>
          <div class="t02-final-sel" id="t02-final-sel">
            <i class="t02-final-poignee" style="left:0; top:0;"></i><i class="t02-final-poignee" style="left:100%; top:0;"></i>
            <i class="t02-final-poignee" style="left:0; top:100%;"></i><i class="t02-final-poignee" style="left:100%; top:100%;"></i>
          </div>
          <div class="t02-final-etiquette" id="t02-final-etiquette"></div>
        </div>
      </div>
      <!-- Plan B -->
      <div class="t02-final-plan" id="t02-final-planB" style="background:var(--t02-nuit);">
        <div class="t02-final-grille" data-layout-allow-overflow></div>
        <div id="t02-final-bases"></div>
        <div class="t02-final-slogan" id="t02-final-l1"></div>
        <div class="t02-final-slogan" id="t02-final-l2"></div>
      </div>
      <!-- Plan C -->
      <div class="t02-final-plan" id="t02-final-planC" style="background:var(--t02-nuit);">
        <div class="t02-final-grille" data-layout-allow-overflow></div>
        <div class="t02-final-contenuC" id="t02-final-contenuC">
          <div class="t02-final-nom" id="t02-final-nom"></div>
          <div id="t02-final-reperes"></div>
          <div class="t02-final-btn" id="t02-final-btn" data-etat="vide"><i class="remplir"></i><span id="t02-final-btn-texte"></span></div>
          <div class="t02-final-note" id="t02-final-note"></div>
          <div id="t02-final-curseur-hote" style="position:absolute; inset:0; z-index:30;"></div>
        </div>
      </div>
      <!-- Le point du slogan passe d'un plan à l'autre : il vit au-dessus des plans B et C. -->
      <div class="t02-final-objet" id="t02-final-objet"></div>
    </div>
  </div>

  <script>
    (function () {
      var EXEMPLE = {   // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire
        // Une case par élément réel de l'offre (ses fonctions, ses modules, ses outils), autant qu'il
        // en a. Exemple : un logiciel et ses fonctions.
        icones: ["layout-dashboard", "chart-line", "mail", "calendar", "users", "shield-check",
          "zap", "cloud", "lock", "rocket", "settings", "bell"],
        choisie: 9, etiquette: "Mise en ligne",   // la case que le cadre attrape, et ce qu'elle est
        slogan: ["Ose aller", "plus loin."],      // une phrase de sa page, en deux lignes
        nom: "Ta marque", logo: "",               // logo : "brand/logo.png" s'il en a un
        bouton: "Essayer",                        // le vrai libellé du bouton de sa page
        note: ""                                  // une info réelle sous le bouton ("" : aucune)
      };

      var ID = "t02-final", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      // La durée : la plus courte des data-duration de la scène et de son hôte (index.html).
      var D = (function () {
        var v = [], n = document.getElementById(ID);
        for (; n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === ID && parseFloat(n.getAttribute("data-duration")) > 0) v.push(parseFloat(n.getAttribute("data-duration")));
        }
        return v.length ? Math.min.apply(null, v) : 11.8;
      })();

      var ICONES = EXEMPLE.icones, CHOISIE = Math.min(EXEMPLE.choisie, ICONES.length - 1), ETIQUETTE = EXEMPLE.etiquette;
      var NOTE = EXEMPLE.note || "";
      // Les tailles (la scène les règle à la mesure des textes) : le slogan, sa plus longue ligne ;
      // le nom de la carte de fin, mot héros.
      var W = 1920, SLOGAN_LARGE = 0.7 * W, SLOGAN_MAX = 300, NOM_LARGE = 0.64 * W, NOM_MAX = 280, NOM_BAS = 462;

      // La lecture : 0,3 s par mot + 0,8 s, jamais moins de 1,5 s ; la carte de fin 3 s au moins.
      var lecture = function (t, final) {
        var n = t.split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length;
        if (!n) return 0;
        var d = Math.max(1.5, 0.3 * n + 0.8);
        return Math.ceil((final ? Math.max(3, d) : d) * 10 - 1e-9) / 10;
      };
      var l1 = $("l1"), l2 = $("l2"), lignesS = [l1, l2];
      var nom = $("nom"), texteBtn = $("btn-texte");
      lignesS.forEach(function (l, i) {
        l.innerHTML = (EXEMPLE.slogan[i] || "").split(" ").filter(Boolean).map(function (m) { return '<span class="k-mot" data-layout-allow-overlap>' + m + "</span>"; }).join(" ");
      });
      nom.textContent = EXEMPLE.nom; texteBtn.textContent = EXEMPLE.bouton;
      var slogan = lignesS.map(function (l) { return l.textContent; }).join(" ");
      // Plan A : la grille se dessine (jusqu'à 1,35 s), la caméra s'approche (0,9 s), le cadre
      // attrape la case, son nom s'écrit (posé à 2,65 s) et se lit.
      var Z = 1.35, A_LU = 2.65;
      var B = Math.round((A_LU + lecture(ETIQUETTE)) * 100) / 100;
      // Plan B : le slogan posé (son point compris) à B + 1,17 s, puis sa lecture.
      var B_LU = B + 1.17, C = Math.round((B_LU + lecture(slogan)) * 100) / 100;
      var C_LU = C + Math.max(1.2, 0.55 + 0.025 * (nom.textContent.length - 1) + 0.5) + (NOTE ? 0.2 : 0);
      var FIN = C_LU + lecture([nom.textContent, texteBtn.textContent, NOTE].join(" "), true);
      if (D + 1e-6 < FIN) console.warn(ID + " : data-duration trop courte pour lire la carte de fin, il faut " + (Math.ceil(FIN * 10) / 10).toFixed(1) + " s");

      // ---------- Plan A : l'étoile de rayons de la révélation, qui se resserre ----------
      // Les mêmes rayons que la fin de « disque-revelation » (le sol en perspective et l'horizon).
      var etoile = $("etoile");
      [0, 8, 22, 40, 62, 90, 118, 140, 158, 172, 180].forEach(function (a) {
        var r = K.el(etoile, "i", "t02-final-rai");
        r.style.transform = "rotate(" + a + "deg)";
      });
      tl.fromTo(etoile, { x: 0, y: 0, scale: 1, rotation: 0 }, { x: 0, y: -180, scale: 0.09, rotation: 30, duration: 0.55, ease: "expo.inOut" }, 0);
      tl.to(etoile, { scale: 0, duration: 0.25, ease: "power2.in" }, 0.6);

      // ---------- La grille : une icône au trait fin par case, dessinée depuis le centre ----------
      // 6 colonnes ; les rangées suivent le nombre d'icônes, la dernière se centre si elle est courte.
      var grille = $("grille"), COL = 6, PX = 210, PY = 196, LIG = Math.ceil(ICONES.length / COL);
      var cases = ICONES.map(function (nomIc, i) {
        var lig = Math.floor(i / COL), dansLig = Math.min(COL, ICONES.length - lig * COL), col = i % COL;
        var x = 960 + (col - (dansLig - 1) / 2) * PX, y = 540 + (lig - (LIG - 1) / 2) * PY;
        var c = K.el(grille, "div", "t02-final-case", null, "left:" + x + "px; top:" + y + "px;");
        var a1 = (i * 47) % 360, a2 = (a1 + 140 + (i * 23) % 80) % 360;
        var p = function (a) { return [75 + 62 * Math.cos(a * Math.PI / 180), 75 + 62 * Math.sin(a * Math.PI / 180)]; };
        var q1 = p(a1), q2 = p(a2);
        c.innerHTML = '<svg class="rond" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255, 255, 255, 0.32)" stroke-width="1.6" stroke-dasharray="3 6"/>' +
          '<circle cx="' + q1[0].toFixed(1) + '" cy="' + q1[1].toFixed(1) + '" r="4" fill="currentColor"/>' +
          '<circle cx="' + q2[0].toFixed(1) + '" cy="' + q2[1].toFixed(1) + '" r="4" fill="currentColor"/></svg>' +
          K.ic(nomIc).replace(/stroke-width="2"/, 'stroke-width="0.85"').replace("<svg ", '<svg class="ic" ');
        c.dataset.d = Math.hypot(x - 960, y - 540).toFixed(0);
        return c;
      });
      var parDistance = cases.slice().sort(function (a, b) { return a.dataset.d - b.dataset.d; });
      parDistance.forEach(function (c, k) {
        var t0 = 0.5 + k * 0.03;
        var traits = c.querySelectorAll(".ic path, .ic circle, .ic line, .ic rect, .ic polyline, .ic polygon, .ic ellipse");
        traits.forEach(function (t) {
          var L = Math.ceil(t.getTotalLength ? t.getTotalLength() : 80) + 1;
          t.style.strokeDasharray = L + " " + L;
          gsap.set(t, { strokeDashoffset: L });
        });
        // L'icône reste cachée jusqu'à son tour (certaines ont des points pleins, sans trait).
        var ic = c.querySelector(".ic");
        gsap.set(ic, { opacity: 0 });
        tl.to(ic, { opacity: 1, duration: 0.08 }, t0);
        tl.to(traits, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, t0);
        var rond = c.querySelector(".rond");
        gsap.set(rond, { scale: 0.6, opacity: 0, rotation: -40, transformOrigin: "50% 50%" });
        tl.to(rond, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, t0);
      });

      // La caméra s'approche de la case phare avant toute phrase ; puis le cadre l'attrape, les
      // autres s'effacent, son nom s'écrit ; pendant sa lecture, elles passent au flou et la caméra
      // ne fait qu'une dérive lente.
      var choisie = cases[CHOISIE], cx = parseFloat(choisie.style.left), cy = parseFloat(choisie.style.top);
      var autres = cases.filter(function (c) { return c !== choisie; });
      var sel = $("sel"), etq = $("etiquette");
      gsap.set(sel, { left: cx - 88, top: cy - 88, width: 176, height: 176 });
      K.cacher(sel);
      var camA = $("camA"), ZX = (960 - cx) * 1.5, ZY = (540 - cy) * 1.5 - 60;
      tl.to(camA, { scale: 1.5, x: ZX, y: ZY, duration: 0.9, ease: "expo.inOut" }, Z);
      tl.fromTo(sel, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, Z + 0.75);
      tl.set(choisie, { attr: { class: "t02-final-case choisie" } }, Z + 0.83);
      tl.to(autres, { opacity: 0.45, duration: 0.3, ease: "power2.out" }, Z + 0.85);
      // L'étiquette se pose sous le cadre, centrée (entre deux lignes de la grille).
      etq.style.left = (cx - 450) + "px"; etq.style.width = "900px"; etq.style.textAlign = "center"; etq.style.top = (cy + 100) + "px";
      // Le nom se tape, puis la case se remplit d'accent et le nom se surligne : pendant sa lecture,
      // la vie vient de lui (la caméra ne fait qu'une dérive lente).
      etq.innerHTML = "<span><i></i><b></b></span>";
      var etqTexte = etq.querySelector("b"), etqBloc = etq.querySelector("i");
      K.taper(tl, etqTexte, ETIQUETTE, A_LU - 0.35, A_LU, D);
      var plein = K.el(choisie, "div", "t02-final-plein");
      choisie.insertBefore(plein, choisie.firstChild);
      gsap.set(plein, { scale: 0 });
      tl.to(plein, { scale: 1, duration: 0.4, ease: "back.out(2)" }, A_LU + 0.15);
      tl.set(choisie, { attr: { class: "t02-final-case choisie pleine" } }, A_LU + 0.2);
      tl.to(autres, { opacity: 0.22, filter: "blur(3px)", duration: 0.5, ease: "power2.inOut" }, A_LU + 0.45);
      gsap.set(etqBloc, { scaleX: 0 });
      tl.to(etqBloc, { scaleX: 1, duration: 0.3, ease: "power3.out" }, A_LU + 0.95);
      tl.set(etq, { attr: { "data-etat": "plein" } }, A_LU + 1.02);
      tl.to(camA, { scale: 1.55, x: (960 - cx) * 1.55, y: (540 - cy) * 1.55 - 62, duration: Math.max(0.5, B - Z - 0.9), ease: "sine.inOut" }, Z + 0.9);

      // ---------- Plan B : le slogan géant ----------
      var planB = $("planB");
      K.cacher(planB);
      tl.set(planB, { opacity: 1 }, B);
      tl.set($("planA"), { opacity: 0 }, B + 0.02);
      // Le point final du slogan devient un disque d'accent (ajouté s'il manque).
      var dernier = l2.querySelectorAll(".k-mot"), motFin = dernier[dernier.length - 1];
      motFin.textContent = motFin.textContent.replace(/\.$/, "");
      var point = K.el(motFin, "span", "t02-final-point");
      K.cacher(point, { scale: 0, y: -60 });
      K.entreeMots(tl, l1.querySelectorAll(".k-mot"), B + 0.02, { y: 60, flou: 16, decalage: 0.08, duree: 0.6 });
      K.entreeMots(tl, l2.querySelectorAll(".k-mot"), B + 0.22, { y: 60, flou: 16, decalage: 0.08, duree: 0.6 });
      tl.set(point, { opacity: 1 }, B + 0.72);
      tl.to(point, { scale: 1, y: 0, duration: 0.45, ease: "back.out(2.4)" }, B + 0.72);
      // Pendant la lecture, le slogan pousse lentement et ses mots changent de graisse sur les temps
      // (la 1re ligne : le point, sur la 2de, ne bouge pas).
      tl.fromTo(lignesS, { scale: 1 }, { scale: 1.035, duration: C - B, ease: "sine.inOut", transformOrigin: "0% 50%" }, B);
      var m1 = l1.querySelectorAll(".k-mot"), mA = m1[0], mZ = m1[m1.length - 1];
      var bascules = mA !== mZ ? [[0.45, mZ, 400], [1.1, mZ, 600], [1.1, mA, 400], [1.75, mA, 600]] : [[0.45, mZ, 400], [1.1, mZ, 600]];
      bascules.forEach(function (b) { if (B_LU + b[0] < C - 0.25) tl.set(b[1], { fontWeight: b[2] }, B_LU + b[0]); });

      // ---------- Plan C : le nom, ses repères, le point qui devient le bouton ----------
      var planC = $("planC");
      K.cacher(planC);
      tl.set(planC, { opacity: 1 }, C);
      tl.set(planB, { opacity: 0 }, C + 0.02);
      var btn = $("btn"), remplir = btn.querySelector(".remplir"), note = $("note");
      var lettres = nom.textContent.split("");
      nom.innerHTML = (EXEMPLE.logo ? '<img class="k-mot" alt="" src="' + EXEMPLE.logo + '">' : "") +
        lettres.map(function (l) { return '<span class="k-mot">' + (l === " " ? "&nbsp;" : l) + "</span>"; }).join("");
      K.cacher(nom.querySelectorAll(".k-mot"));
      K.entreeMots(tl, nom.querySelectorAll(".k-mot"), C + 0.05, { y: 40, flou: 10, decalage: 0.025, duree: 0.5 });
      if (NOTE) {
        note.textContent = NOTE;
        K.cacher(note, { y: 12 });
        tl.to(note, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, C + 1.05);
      } else note.style.display = "none";
      // La tenue vit : le plan pousse doucement.
      tl.fromTo($("contenuC"), { scale: 1 }, { scale: 1.025, duration: D - C, ease: "sine.inOut", transformOrigin: "50% 50%" }, C);

      // Ce qui se mesure (le point dans le slogan, le libellé du bouton) attend les polices.
      var cs = getComputedStyle(l1);
      document.fonts.load(cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily).then(finir, finir);
      function finir() {
        // Le slogan : sa plus longue ligne à SLOGAN_LARGE (SLOGAN_MAX au plus), les deux lignes
        // centrées en hauteur ; le nom de fin, mot héros, posé au-dessus de son repère.
        var fS = parseFloat(getComputedStyle(l1).fontSize), largeS = Math.max(l1.scrollWidth, l2.scrollWidth, 1);
        var tS = Math.min(SLOGAN_MAX, fS * SLOGAN_LARGE / largeS), pasS = tS * 238 / 236;
        var hautS = (1080 - (pasS + 0.92 * tS)) / 2 - 0.15 * tS;
        lignesS.forEach(function (l, i) { l.style.fontSize = tS.toFixed(1) + "px"; l.style.top = (hautS + i * pasS).toFixed(1) + "px"; });
        var mN = nom.querySelectorAll(".k-mot"), fN = parseFloat(getComputedStyle(nom).fontSize);
        var largeN = mN[mN.length - 1].offsetLeft + mN[mN.length - 1].offsetWidth - mN[0].offsetLeft;
        var tN = Math.min(NOM_MAX, fN * NOM_LARGE / Math.max(1, largeN));
        nom.style.fontSize = tN.toFixed(1) + "px"; nom.style.top = (NOM_BAS - 1.16 * tN) + "px";   // ses jambages au-dessus de son repère
        // Les lignes de base du slogan (des repères, sans étiquette).
        var hoteBases = $("bases"), bases = [];
        lignesS.forEach(function (l) {
          var base = l.offsetTop + l.offsetHeight * 0.86;
          bases.push(K.el(hoteBases, "i", "t02-final-base", null, "top:" + Math.round(base) + "px;"));
        });
        gsap.set(bases, { scaleX: 0 });
        tl.to(bases, { scaleX: 1, duration: 0.55, ease: "expo.out", stagger: 0.06 }, B + 0.05);

        // Le point, à l'écran au moment de la coupe : sa place dans la mise en page (offsetLeft et
        // offsetTop ignorent les transformations en cours), puis la poussée du slogan (×1,035 depuis
        // la gauche de sa ligne, au milieu de sa hauteur).
        var taille = point.offsetWidth;
        var px = l2.offsetLeft + point.offsetLeft + taille / 2, py = l2.offsetTop + point.offsetTop + point.offsetHeight / 2;
        var l2x = l2.offsetLeft, l2y = l2.offsetTop + l2.offsetHeight / 2;
        var pxC = l2x + (px - l2x) * 1.035, pyC = l2y + (py - l2y) * 1.035;
        var objet = $("objet");
        gsap.set(objet, { x: pxC, y: pyC, scale: taille / 100 });
        K.cacher(objet);
        tl.set(objet, { opacity: 1 }, C);
        tl.set(point, { opacity: 0 }, C);
        // Il file sous le nom, au centre du bouton, et y plonge ; le bouton naît de lui.
        tl.to(objet, { x: 960, y: 650, scale: 0.9, duration: 0.55, ease: "expo.inOut" }, C + 0.02);
        tl.to(objet, { scale: 0, duration: 0.16, ease: "power2.in" }, C + 0.55);

        // Le bouton : un rond qui s'étire en pilule (à la mesure de son libellé), puis le texte.
        var LARGEUR = Math.max(560, Math.ceil(texteBtn.offsetWidth) + 150);
        gsap.set(btn, { width: 120, x: -60, opacity: 0 });
        gsap.set(remplir, { scale: 0 });
        tl.to(btn, { opacity: 1, duration: 0.1 }, C + 0.6);
        tl.to(btn, { width: LARGEUR, x: -LARGEUR / 2, duration: 0.45, ease: "expo.out" }, C + 0.66);
        K.cacher(texteBtn, { y: 14 });
        tl.to(texteBtn, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, C + 0.85);

        // Les repères de maquette mesurent le nom et le bouton (des traits, sans étiquette), puis
        // se rétractent.
        var reperes = $("reperes");
        var mots = nom.querySelectorAll(".k-mot"), m0 = mots[0], m9 = mots[mots.length - 1];
        var largeNom = Math.min(1800, m9.offsetLeft + m9.offsetWidth - m0.offsetLeft), gNom = 960 - largeNom / 2;
        var tNom = K.el(reperes, "div", "t02-final-trait", null, "left:" + gNom + "px; top:476px; width:" + largeNom + "px; height:2px;");
        var tNomG = K.el(reperes, "div", "t02-final-trait", null, "left:" + gNom + "px; top:466px; width:2px; height:20px;");
        var tNomD = K.el(reperes, "div", "t02-final-trait", null, "left:" + (gNom + largeNom - 2) + "px; top:466px; width:2px; height:20px;");
        var tBtn = K.el(reperes, "div", "t02-final-trait", null, "left:" + (960 + LARGEUR / 2 + 30) + "px; top:590px; width:2px; height:120px;");
        gsap.set(tNom, { scaleX: 0, transformOrigin: "0 50%" });
        gsap.set([tNomG, tNomD, tBtn], { scaleY: 0 });
        tl.to(tNom, { scaleX: 1, duration: 0.45, ease: "expo.out" }, C + 0.4);
        tl.to([tNomG, tNomD], { scaleY: 1, duration: 0.3, ease: "expo.out" }, C + 0.45);
        tl.to(tBtn, { scaleY: 1, duration: 0.35, ease: "expo.out" }, C + 1.0);
        tl.to([tNom, tNomG, tNomD, tBtn], { scaleX: 0, scaleY: 0, duration: 0.3, ease: "power2.in" }, C + 1.75);

        // Le curseur clique le bouton : il se remplit de l'accent.
        var curseur = K.curseur($("curseur-hote"), ID + "-curseur", true);
        K.cacher(curseur);
        tl.to(curseur, { opacity: 1, duration: 0.2 }, C + 0.95);
        K.trajet(tl, curseur, [[0, 1560, 960], [C + 0.95, 1050, 660, 0.55, "power3.out"]]);
        K.clic(tl, curseur, C + 1.55);
        tl.to(remplir, { scale: 1.02, duration: 0.4, ease: "power3.out" }, C + 1.58);
        tl.set(btn, { attr: { "data-etat": "plein" } }, C + 1.68);
        tl.fromTo(btn, { scale: 1 }, { scale: 1.04, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, C + 1.58);
        tl.to(curseur, { x: 960 + LARGEUR / 2 + 120, y: NOTE ? 840 : 760, duration: 0.6, ease: "power2.inOut" }, C + 1.9);

        window.__timelines[ID] = tl;
      }
    })();
  </script>
</template>
