    canyon plus haut et plus étroit, sphère qui monte à 35 % de la hauteur, faisceau plus long)

    Ce qu'elle montre : sur un blanc cassé quadrillé de pointillés, une sphère de verre se dessine
    au trait (contour, hublots, cerclages), puis se remplit de couleur sur fond blanc ; coupe : la
    voilà qui flotte dans un canyon illustré au crépuscule (falaises en gradins, montagne,
    nuages), en tournant doucement ; la caméra lève les yeux avec elle, la sphère monte dans le
    ciel, un trait de lumière part de son dessous, le faisceau s'ouvre en cône et un cube (ton
    produit) y descend en tournant ; la caméra redescend, le cube se pose au point de fuite et
    des rayons de perspective partent de lui (ils deviennent l'icône de la scène suivante).

    Tout est dessiné ici (SVG et CSS 3D), sans image ni modèle : la sphère, le canyon et le cube
    prennent des teintes DÉRIVÉES de l'accent (oklch relatif), avec --t02-d (défaut -40) pour le
    décalage de teinte des ombres (+40 pour un accent vert).

    À remplacer :
      1. L'identifiant « t02-sphere » partout (racine, scène, préfixe des ids et des dégradés SVG,
         clé de la timeline).
      2. Les faces du cube (#t02-sphere-cube .f) : vides par défaut ; une face peut porter l'icône
         de l'offre (K.ic) ou son logo en <img>. Le cube EST le produit : ne le remplace pas par un
         objet sans rapport.
      3. Les instants (MOMENTS, plus bas) : la montée et l'ouverture du faisceau sur les temps forts
         de la musique ; garde l'ordre.
    Aucun texte à l'écran dans cette scène : elle se monte entre deux scènes qui parlent.
  -->
</head>
