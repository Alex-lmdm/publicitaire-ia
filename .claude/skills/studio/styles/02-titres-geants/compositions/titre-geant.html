<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°2 · TITRES GÉANTS · SCÈNE « TITRE GÉANT » (l'accroche), 6,4 s, 16:9 (1920 × 1080)

    Ce qu'elle montre, en deux plans coupés franc, chacun tenu le temps de sa lecture :
      plan A (0 à COUPE) : la couleur d'accent en plein écran ; le titre arrive si grand qu'il
        déborde du cadre de tous côtés et se resserre en 0,6 s jusqu'à tenir entier, ses trois
        lignes du haut au bas du cadre ; pendant sa lecture, le bloc ne fait que pousser lentement
        (×1,045) et deux mots de la ligne du milieu changent de graisse sur les temps (gras ↔
        léger) ; à la sortie, il repart dans le débordement (0,3 s) et la coupe tombe ;
      plan B (COUPE à la fin) : le spécimen sur la nuit de la marque, une grille fine calée sur les
        lignes du texte, la phrase tapée en deux voix (gras, puis léger et en retrait) ; un cadre de
        sélection à poignées attrape la ligne légère, qui passe en gras puis revient (un événement
        au moins toutes les 0,8 s) ; la caméra ne fait qu'une dérive lente.

    Le débordement est l'entrée et la sortie, jamais le moment où l'on lit : entre les deux, chaque
    mot est entier et la plus longue ligne tient dans 90 % de la largeur (la scène baisse la taille
    seule si une ligne est trop longue : garde 8 caractères au plus par ligne pour rester à 340 px).

    La lecture (interdits.md, « La lecture ») : le titre reste lecture(titre) entre la fin de son
    entrée et le début de sa sortie (0,3 s par mot + 0,8 s, jamais moins de 1,5 s :
    `studio_motion.py lecture "<phrase>"`), le spécimen lecture(spécimen) après sa dernière lettre
    (0,9 s après la coupe). La scène recule COUPE seule s'il le faut et le signale dans la console
    si data-duration ne suffit pas : data-duration (ici et sur l'hôte dans index.html) =
    COUPE + 0,9 + lecture(spécimen).

    À remplacer : l'objet EXEMPLE, en tête du script (chaque valeur vient de OFFRE.json ou d'une
    phrase de sa page, ou sa ligne se retire), puis l'identifiant « t02-titre » partout (racine,
    scène, préfixe des ids, clé de la timeline), data-duration, COUPE et les bascules de graisse
    (BASCULES) sur les temps de la musique. Les étiquettes ne sont jamais une cote, un nom de police
    ni un code couleur (réservées à une vidéo qui parle de design).
    Couleurs : celles de la marque, rien d'autre. Le plan A est l'accent plein (le titre posé dessus
    en --brand-contrast) ; le plan B, la nuit (--brand-sombre), son texte clair (--brand-clair), le
    spécimen en --brand-accent-lisible, la grille en blanc transparent (un gris), le cadre de
    sélection en trait de marque plein et fin. Aucune teinte tirée de l'accent, aucun accent en
    transparence. Polices : aucune en dur ; les graisses 400 et 600 de la police des titres doivent
    exister dans brand/fonts.css (sinon le navigateur les simule, mal).
  -->
</head>
<body>
<template>
  <style>
    #t02-titre {
      --t02-nuit: var(--brand-sombre);
      --t02-texte: var(--brand-clair);
      --t02-accent-texte: var(--brand-accent-lisible);
      --t02-ligne: rgba(255, 255, 255, 0.13);
      background: var(--t02-nuit);
    }
    /* --- Plan A : la couleur d'accent et le titre géant --- */
    #t02-titre .t02-titre-planA { position: absolute; inset: 0; background: var(--brand-accent); overflow: hidden; }
    #t02-titre .t02-titre-blocA { position: absolute; inset: 0; transform-origin: 8% 50%; }
    #t02-titre .t02-titre-ligneA {
      position: absolute; left: 30px; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 340px; line-height: 1;
      letter-spacing: -0.045em; color: var(--brand-contrast);
    }
    #t02-titre .t02-titre-ligneA span { display: inline-block; }

    /* --- Plan B : le spécimen sur la grille --- */
    #t02-titre .t02-titre-planB { position: absolute; inset: 0; background: var(--t02-nuit); overflow: hidden; z-index: 5; }
    #t02-titre .t02-titre-cameraB { position: absolute; inset: 0; transform-origin: 40% 55%; }
    #t02-titre .t02-titre-trait { position: absolute; background: var(--t02-ligne); }
    #t02-titre .t02-titre-trait.h { left: 0; right: 0; height: 1px; transform-origin: 0 50%; }
    #t02-titre .t02-titre-trait.v { top: 0; bottom: 0; width: 1px; transform-origin: 50% 0; }
    #t02-titre .t02-titre-ligneB {
      position: absolute; white-space: nowrap; line-height: 1;
      font-family: var(--brand-font-display); font-size: 300px; letter-spacing: -0.04em;
      color: var(--t02-accent-texte);
    }
    #t02-titre #t02-titre-b1, #t02-titre #t02-titre-b2 { left: 92px; font-weight: 600; }
    #t02-titre #t02-titre-b3 { left: 560px; font-weight: 400; letter-spacing: -0.03em; }
    #t02-titre #t02-titre-b3[data-voix="grasse"] { font-weight: 600; color: var(--t02-texte); letter-spacing: -0.04em; }
    /* Une étiquette porte une info réelle de la fiche (prix, date, chiffre), jamais une cote. */
    #t02-titre .t02-titre-etiquette {
      position: absolute; font-family: var(--brand-font-body); font-weight: 500; font-size: 30px;
      line-height: 1.25; color: var(--t02-texte); white-space: nowrap;
    }
    /* Le cadre de sélection suit la ligne qu'il attrape (il vit dans elle) : il s'élargit seul
       quand la ligne passe en gras. */
    #t02-titre .t02-titre-selection {
      position: absolute; left: -18px; right: -18px; top: 7%; bottom: -4%;
      border: 2px solid var(--t02-accent-texte); border-radius: 2px;
    }
    #t02-titre .t02-titre-poignee {
      position: absolute; width: 14px; height: 14px; margin: -8px 0 0 -8px;
      background: var(--t02-nuit); border: 2px solid var(--t02-accent-texte);
    }
  </style>

  <div data-composition-id="t02-titre" data-width="1920" data-height="1080" data-duration="6.4" style="position:absolute; inset:0;">
    <div id="t02-titre" class="k-scene">
      <!-- Plan A : les lignes du titre s'écrivent depuis EXEMPLE.titre -->
      <div class="t02-titre-planA" id="t02-titre-planA">
        <div class="t02-titre-blocA" id="t02-titre-blocA"></div>
      </div>

      <!-- Plan B : les lignes du spécimen se tapent depuis EXEMPLE.specimen -->
      <div class="t02-titre-planB" id="t02-titre-planB">
        <div class="t02-titre-cameraB" id="t02-titre-cameraB">
          <div id="t02-titre-grille"></div>
          <div class="t02-titre-ligneB" id="t02-titre-b1" data-layout-allow-overlap></div>
          <div class="t02-titre-ligneB" id="t02-titre-b2" data-layout-allow-overlap></div>
          <div class="t02-titre-ligneB" id="t02-titre-b3" data-voix="legere" data-layout-allow-overlap><span id="t02-titre-b3t"></span>
            <div class="t02-titre-selection" id="t02-titre-sel">
              <i class="t02-titre-poignee" style="left:0; top:0;"></i><i class="t02-titre-poignee" style="left:100%; top:0;"></i>
              <i class="t02-titre-poignee" style="left:0; top:100%;"></i><i class="t02-titre-poignee" style="left:100%; top:100%;"></i>
            </div>
          </div>
          <div class="t02-titre-etiquette" id="t02-titre-e1"></div>
          <div class="t02-titre-etiquette" id="t02-titre-e2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var EXEMPLE = {   // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire
        // Plan A : une phrase entière de sa page en trois lignes (3 à 7 mots, 8 caractères au plus
        // par ligne) ; la ligne du milieu porte les mots qui comptent. Exemple : un logiciel.
        titre: ["Ton site", "en ligne", "ce soir."],
        // Plan B : une phrase entière, deux lignes grasses (2 à 3 mots en tout) puis une ligne
        // légère en retrait (1 à 2 mots, 9 caractères au plus).
        specimen: ["Simple", "à lancer.", "Rapide."],
        // 0 à 2 infos réelles de la fiche en 2 à 5 mots (le prix, la date d'ouverture) ; [] : aucune.
        etiquettes: []
      };

      window.__timelines = window.__timelines || {};
      var ID = "t02-titre", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      // La durée : la plus courte des data-duration de la scène et de son hôte (index.html).
      var D = (function () {
        var v = [], n = document.getElementById(ID);
        for (; n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === ID && parseFloat(n.getAttribute("data-duration")) > 0) v.push(parseFloat(n.getAttribute("data-duration")));
        }
        return v.length ? Math.min.apply(null, v) : 6.4;
      })();

      // ---------- Le mouvement (sur les temps de la musique) ----------
      var W = 1920, H = 1080;
      var COUPE = 3.5;                  // la coupe sur le spécimen ; jamais avant ENTREE + lecture(titre) + SORTIE
      var ENTREE = 0.6, SORTIE = 0.3;   // le débordement : l'entrée et la sortie du titre
      var DEBORDE = 1.5;                // l'échelle du titre quand il déborde
      var TAILLE_A = 340;               // trois lignes de 340 px vont du haut au bas du cadre
      var MARGE = 50;                   // en haut et en bas : la poussée (×1,045) ne coupe aucune lettre
      // Les bascules de graisse, depuis la fin de l'entrée : [instant, ligne, mot, graisse].
      var BASCULES = [[0.4, 1, 0, 400], [0.9, 1, 0, 600], [0.9, 1, 1, 400], [1.4, 1, 0, 400],
        [1.4, 1, 1, 600], [1.9, 1, 0, 600], [2.3, 1, 1, 400]];

      // La lecture : 0,3 s par mot + 0,8 s, jamais moins de 1,5 s (studio_motion.py lecture).
      var lecture = function (t) {
        var n = t.split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length;
        return n ? Math.ceil(Math.max(1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10 : 0;
      };
      var texteA = EXEMPLE.titre.join(" "), texteB = EXEMPLE.specimen.join(" ");
      COUPE = Math.max(COUPE, ENTREE + lecture(texteA) + SORTIE);
      var ENTREE_B = 0.9;   // la dernière ligne du spécimen est posée 0,9 s après la coupe
      if (D + 1e-6 < COUPE + ENTREE_B + lecture(texteB)) {
        console.warn(ID + " : data-duration trop courte pour lire le spécimen, il faut " + (COUPE + ENTREE_B + lecture(texteB)).toFixed(1) + " s");
      }

      // ---------- Plan A : le titre géant ----------
      var blocA = $("blocA");
      var lignesA = EXEMPLE.titre.map(function (texte, i) {
        var l = K.el(blocA, "div", "t02-titre-ligneA", texte.split(" ").map(function (m) {
          return "<span data-layout-allow-overlap>" + m + "</span>";
        }).join(" "));
        l.id = ID + "-a" + (i + 1);
        l.setAttribute("data-layout-allow-overflow", "");   // à l'entrée et à la sortie seulement
        return l;
      });
      // L'entrée : si grand qu'il déborde, il se resserre jusqu'à tenir entier ; pendant la lecture,
      // une poussée lente seulement ; la sortie repart dans le débordement.
      tl.fromTo(blocA, { scale: DEBORDE }, { scale: 1, duration: ENTREE, ease: "power3.out" }, 0);
      tl.to(blocA, { scale: 1.045, duration: COUPE - SORTIE - ENTREE, ease: "sine.inOut" }, ENTREE);
      tl.to(blocA, { scale: DEBORDE, duration: SORTIE, ease: "power2.in" }, COUPE - SORTIE);
      if (lignesA[0]) tl.fromTo(lignesA[0], { x: 0 }, { x: 30, duration: COUPE, ease: "sine.inOut" }, 0);
      BASCULES.forEach(function (b) {
        var mot = lignesA[b[1]] && lignesA[b[1]].querySelectorAll("span")[b[2]];
        if (mot && ENTREE + b[0] < COUPE - SORTIE) tl.set(mot, { fontWeight: b[3] }, ENTREE + b[0]);
      });

      // ---------- Plan B : le spécimen ----------
      var planB = $("planB"), b1 = $("b1"), b2 = $("b2"), b3 = $("b3"), b3t = $("b3t");
      K.cacher(planB);
      tl.set(planB, { opacity: 1 }, COUPE);
      tl.set($("planA"), { opacity: 0 }, COUPE + 0.02);

      // Pendant la lecture, ce qui vit est la phrase elle-même : le cadre de sélection attrape la
      // ligne légère, qui passe en gras et en clair, puis revient ; le texte ne bouge pas.
      var sel = $("sel");
      K.cacher(sel);
      tl.fromTo(sel, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, COUPE + 1.15);
      tl.set(b3, { attr: { "data-voix": "grasse" } }, COUPE + 1.4);
      tl.set(b3, { attr: { "data-voix": "legere" } }, COUPE + 2.1);
      tl.to(sel, { opacity: 0, duration: 0.18, ease: "power2.in" }, COUPE + 2.3);
      // La caméra ne fait qu'une dérive lente pendant tout le plan (3 %).
      tl.fromTo($("cameraB"), { scale: 1.0, x: 0 }, { scale: 1.03, x: -14, duration: D - COUPE, ease: "sine.inOut" }, COUPE);

      // Les étiquettes (facultatives) : une info réelle de la fiche, à droite de la 1re ligne et
      // sous la ligne légère.
      var e1 = $("e1"), e2 = $("e2");
      e1.style.left = "1250px"; e1.style.top = "196px";
      e2.style.left = "94px"; e2.style.top = "800px";
      [e1, e2].forEach(function (e, i) {
        var texte = EXEMPLE.etiquettes[i];
        if (!texte) { e.style.display = "none"; return; }
        e.textContent = texte;
        K.cacher(e, { y: 10 });
        tl.to(e, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, COUPE + 0.7 + i * 0.12);
      });

      // Ce qui se mesure (la taille du titre, celle du spécimen) attend la police.
      var cs = getComputedStyle(lignesA[0] || blocA);
      document.fonts.load("600 " + cs.fontSize + " " + cs.fontFamily).then(finir, finir);
      function finir() {
        // Le titre : la plus longue ligne dans 90 % de la largeur (mesurée en gras), les lignes du
        // haut au bas du cadre, entières (des capitales aux jambages : 0,15 à 1,07 de la taille).
        var n = lignesA.length, large = Math.max.apply(null, lignesA.map(function (l) { return l.scrollWidth; }).concat([1]));
        var t = Math.min(TAILLE_A, TAILLE_A * 0.9 * W / large, (H - 2 * MARGE) / ((n - 1) * 0.987 + 0.92)), pas = t * 0.987;
        var haut = (H - ((n - 1) * pas + 0.92 * t)) / 2 - 0.15 * t;
        lignesA.forEach(function (l, i) { l.style.fontSize = t.toFixed(1) + "px"; l.style.top = (haut + i * pas).toFixed(1) + "px"; });

        // Le spécimen : chaque ligne entière dans le cadre (mesurée en gras), sinon la taille baisse.
        var TAILLE = 300, BASES = [312, 612, 902];
        var lignesB = [[b1, b1, EXEMPLE.specimen[0]], [b2, b2, EXEMPLE.specimen[1]], [b3, b3t, EXEMPLE.specimen[2]]];
        b3.setAttribute("data-voix", "grasse");
        var droite = Math.max.apply(null, lignesB.map(function (l) {
          l[1].textContent = l[2] || ""; return l[0].offsetLeft + l[1].offsetWidth;
        }));
        b3.setAttribute("data-voix", "legere");
        if (droite > W - 60) TAILLE = TAILLE * (W - 60 - b1.offsetLeft) / (droite - b1.offsetLeft);
        lignesB.forEach(function (l, i) {
          l[0].style.fontSize = TAILLE.toFixed(1) + "px";
          l[0].style.top = (BASES[i] - TAILLE * 0.85) + "px";
        });
        // La grille : une ligne sur chaque base et sur la hauteur des minuscules, et des colonnes.
        // Si une lettre à jambage (p, g, q) tombe sur un accent ou un point de la ligne du dessous,
        // change la coupe.
        var grille = $("grille"), traitsH = [], traitsV = [];
        BASES.forEach(function (b) {
          [b, b - TAILLE * 0.53].forEach(function (y) {
            traitsH.push(K.el(grille, "div", "t02-titre-trait h", null, "top:" + Math.round(y) + "px"));
          });
        });
        [92, 560, 1230, 1500, 1828].forEach(function (x) {
          traitsV.push(K.el(grille, "div", "t02-titre-trait v", null, "left:" + x + "px"));
        });
        gsap.set(traitsH, { scaleX: 0 });
        gsap.set(traitsV, { scaleY: 0 });
        tl.to(traitsH, { scaleX: 1, duration: 0.5, ease: "expo.out", stagger: 0.03 }, COUPE);
        tl.to(traitsV, { scaleY: 1, duration: 0.5, ease: "expo.out", stagger: 0.04 }, COUPE + 0.05);
        // La phrase tapée en deux voix. La 1re ligne commence juste avant la coupe : la première
        // image du plan montre déjà des lettres ; la ligne légère est posée à COUPE + 0,9 s. Tout se
        // tape, rien n'entre en fondu ni en flou : un accent transparent sur la nuit vire à l'olive.
        K.taper(tl, b1, lignesB[0][2], COUPE - 0.3, COUPE + 0.25, D);
        K.taper(tl, b2, lignesB[1][2], COUPE + 0.25, COUPE + 0.55, D);
        K.taper(tl, b3t, lignesB[2][2], COUPE + 0.6, COUPE + ENTREE_B, D);
        window.__timelines[ID] = tl;
      }
    })();
  </script>
</template>
</body>
</html>
