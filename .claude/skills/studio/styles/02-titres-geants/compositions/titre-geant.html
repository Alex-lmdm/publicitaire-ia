<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°2 · TITRES GÉANTS · SCÈNE « TITRE GÉANT » (l'accroche), 5,6 s, 16:9 (1920 × 1080)

    Ce qu'elle montre, en deux plans coupés franc, chacun tenu le temps de sa lecture :
      plan A (0 à COUPE) : la couleur d'accent en plein écran, trois lignes de titre si grandes
        qu'elles touchent le haut et le bas du cadre et débordent à droite ; la phrase se lit dès
        la première image ; pendant sa lecture, deux mots changent de graisse sur les temps (gras ↔
        léger), le bloc pousse lentement (×1,045) et la ligne du bas glisse doucement vers la gauche
        pour révéler la fin de son mot coupé ;
      plan B (COUPE à la fin) : le spécimen sur la nuit de la marque, une grille fine calée sur les
        lignes du texte, la phrase tapée en deux voix (gras, puis léger et en retrait) ; un cadre de
        sélection à poignées attrape la ligne légère, qui passe en gras puis revient (un événement
        au moins toutes les 0,8 s : une tenue sans rien autour passe pour une image figée) ; la
        caméra ne fait qu'une dérive lente.

    La lecture (rythme.md) : la phrase du plan A reste au moins lecture(titre) (0,3 s par mot +
    0,8 s, jamais moins de 1,5 s : `studio_motion.py lecture "<phrase>"`), celle du plan B au moins
    lecture(spécimen) après sa dernière lettre (0,9 s après la coupe). La scène allonge le plan A
    seule si COUPE est trop court et le signale dans la console si data-duration ne suffit pas :
    data-duration (ici et sur l'hôte dans index.html) = COUPE + 0,9 + lecture(spécimen).

    À remplacer :
      1. L'identifiant « t02-titre » partout (racine, scène, préfixe des ids, clé de la timeline)
         par celui de la scène, et data-duration (voir la lecture ci-dessus).
      2. Plan A : les trois lignes (#t02-titre-a1 à a3), un <span> par mot : une phrase entière
         (3 à 7 mots), jamais des mots isolés. Ligne 1 et ligne 3 : l'appui, elles peuvent déborder
         du cadre ; ligne 2 : les mots qui comptent, entiers. Vise 9 à 11 caractères en ligne 1 et 2,
         12 à 14 en ligne 3 (celle qui déborde : la glissade se mesure seule).
      3. Plan B : les trois lignes du spécimen (data-texte de #t02-titre-b1 à b3), une phrase
         entière : deux lignes grasses (2 à 3 mots en tout), une ligne légère en retrait (1 à 2
         mots, 9 caractères au plus).
      4. ETIQUETTES (facultatif, 2 au plus) : une info réelle de OFFRE.json en 2 à 5 mots (le prix,
         la date, un chiffre de preuve), posée près du spécimen ; vide par défaut. Jamais une cote,
         un nom de police ni un code couleur : ces étiquettes de maquette ne disent rien à son
         public, elles sont réservées à une vidéo qui parle de design (une marque, un template).
      5. COUPE et les bascules de graisse (BASCULES) : sur les temps de la musique.
    Couleurs : celles de la marque, rien d'autre. Le plan A est l'accent plein (le titre posé dessus
    en --brand-contrast) ; le plan B, la nuit de la marque (--brand-sombre), son texte clair
    (--brand-clair), le spécimen en --brand-accent-lisible (l'accent, ou le clair s'il ne se lit
    pas sur la nuit), la grille en blanc transparent (un gris), le cadre de sélection en trait de
    marque plein et fin. Aucune teinte dérivée de l'accent, aucun accent en transparence.
    Polices : aucune en dur ; les graisses 400 et 600 de la police des titres doivent exister dans
    brand/fonts.css (sinon le navigateur les simule, mal).
  -->
</head>
<body>
<template>
  <style>
    #t02-titre {
      /* La palette du style : la nuit de la marque (sa couleur la plus sombre ; sur une marque
         claire, c'est son texte), son clair pour le texte posé dessus, ses gris, et l'accent plein
         (--brand-accent-lisible pour un texte ou un trait posé sur la nuit). Rien n'est dérivé de
         l'accent : un jaune assombri ou mélangé devient brun (story refusée du 06/11/2026). */
      --t02-nuit: var(--brand-sombre);
      --t02-texte: var(--brand-clair);
      --t02-gris: var(--brand-gris-3);
      --t02-accent-texte: var(--brand-accent-lisible);
      --t02-ligne: rgba(255, 255, 255, 0.13);
      background: var(--t02-nuit);
    }
    /* --- Plan A : la couleur d'accent et le titre qui déborde --- */
    #t02-titre .t02-titre-planA { position: absolute; inset: 0; background: var(--brand-accent); overflow: hidden; }
    #t02-titre .t02-titre-blocA { position: absolute; inset: 0; transform-origin: 8% 50%; }
    #t02-titre .t02-titre-ligneA {
      position: absolute; left: 30px; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 380px; line-height: 1;
      letter-spacing: -0.045em; color: var(--brand-contrast);
    }
    #t02-titre .t02-titre-ligneA span { display: inline-block; }
    /* La base de chaque ligne : la 1re touche le haut du cadre, la 3e le bas. */
    #t02-titre #t02-titre-a1 { top: -50px; }
    #t02-titre #t02-titre-a2 { top: 325px; }
    #t02-titre #t02-titre-a3 { top: 700px; }

    /* --- Plan B : le spécimen sur la grille --- */
    #t02-titre .t02-titre-planB { position: absolute; inset: 0; background: var(--t02-nuit); overflow: hidden; z-index: 5; }
    #t02-titre .t02-titre-cameraB { position: absolute; inset: 0; transform-origin: 40% 55%; }
    #t02-titre .t02-titre-trait { position: absolute; background: var(--t02-ligne); }
    #t02-titre .t02-titre-trait.h { left: 0; right: 0; height: 1px; transform-origin: 0 50%; }
    #t02-titre .t02-titre-trait.v { top: 0; bottom: 0; width: 1px; transform-origin: 50% 0; }
    #t02-titre .t02-titre-ligneB {
      position: absolute; white-space: nowrap; line-height: 1;
      font-family: var(--brand-font-display); font-size: 300px; letter-spacing: -0.04em;
      color: var(--t02-accent-texte);
    }
    #t02-titre #t02-titre-b1, #t02-titre #t02-titre-b2 { left: 92px; font-weight: 600; }
    #t02-titre #t02-titre-b3 { left: 560px; font-weight: 400; letter-spacing: -0.03em; }
    #t02-titre #t02-titre-b3[data-voix="grasse"] { font-weight: 600; color: var(--t02-texte); letter-spacing: -0.04em; }
    /* Une étiquette porte une info réelle de la fiche (prix, date, chiffre), jamais une cote. */
    #t02-titre .t02-titre-etiquette {
      position: absolute; font-family: var(--brand-font-body); font-weight: 500; font-size: 30px;
      line-height: 1.25; color: var(--t02-texte); white-space: nowrap;
    }
    /* Le cadre de sélection suit la ligne qu'il attrape (il vit dans elle) : il s'élargit seul
       quand la ligne passe en gras. */
    #t02-titre .t02-titre-selection {
      position: absolute; left: -18px; right: -18px; top: 7%; bottom: -4%;
      border: 2px solid var(--t02-accent-texte); border-radius: 2px;
    }
    #t02-titre .t02-titre-poignee {
      position: absolute; width: 14px; height: 14px; margin: -8px 0 0 -8px;
      background: var(--t02-nuit); border: 2px solid var(--t02-accent-texte);
    }
  </style>

  <div data-composition-id="t02-titre" data-width="1920" data-height="1080" data-duration="5.6" style="position:absolute; inset:0;">
    <div id="t02-titre" class="k-scene">
      <!-- Plan A -->
      <div class="t02-titre-planA" id="t02-titre-planA">
        <div class="t02-titre-blocA" id="t02-titre-blocA">
          <div class="t02-titre-ligneA" id="t02-titre-a1" data-layout-allow-overflow><span data-layout-allow-overlap>Ton</span> <span data-layout-allow-overlap>offre,</span></div>
          <div class="t02-titre-ligneA" id="t02-titre-a2" data-layout-allow-overflow><span id="t02-titre-a2m1" data-layout-allow-overlap>en</span> <span id="t02-titre-a2m2" data-layout-allow-overlap>grand.</span></div>
          <div class="t02-titre-ligneA" id="t02-titre-a3" data-layout-allow-overflow><span data-layout-allow-overlap>Enfin</span> <span data-layout-allow-overlap>lancée.</span></div>
        </div>
      </div>

      <!-- Plan B -->
      <div class="t02-titre-planB" id="t02-titre-planB">
        <div class="t02-titre-cameraB" id="t02-titre-cameraB">
          <div id="t02-titre-grille"></div>
          <div class="t02-titre-ligneB" id="t02-titre-b1" data-texte="Simple" data-layout-allow-overlap></div>
          <div class="t02-titre-ligneB" id="t02-titre-b2" data-texte="à suivre." data-layout-allow-overlap></div>
          <div class="t02-titre-ligneB" id="t02-titre-b3" data-texte="Rapide." data-voix="legere" data-layout-allow-overlap><span id="t02-titre-b3t"></span>
            <div class="t02-titre-selection" id="t02-titre-sel">
              <i class="t02-titre-poignee" style="left:0; top:0;"></i><i class="t02-titre-poignee" style="left:100%; top:0;"></i>
              <i class="t02-titre-poignee" style="left:0; top:100%;"></i><i class="t02-titre-poignee" style="left:100%; top:100%;"></i>
            </div>
          </div>
          <div class="t02-titre-etiquette" id="t02-titre-e1"></div>
          <div class="t02-titre-etiquette" id="t02-titre-e2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "t02-titre", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      // La durée : la plus courte des data-duration de la scène et de son hôte (index.html).
      var D = (function () {
        var v = [], n = document.getElementById(ID);
        for (; n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === ID && parseFloat(n.getAttribute("data-duration")) > 0) v.push(parseFloat(n.getAttribute("data-duration")));
        }
        return v.length ? Math.min.apply(null, v) : 5.6;
      })();

      // ---------- Ce qu'on remplace ----------
      var COUPE = 2.7;      // la coupe sur le spécimen (un temps fort) ; jamais avant lecture(titre)
      // Les bascules de graisse, sur les temps (0,5 s) : la voix légère passe d'un mot à l'autre.
      var BASCULES = [
        [0.5, "a2m1", 400], [1.0, "a2m1", 600], [1.0, "a2m2", 400],
        [1.5, "a2m1", 400], [1.5, "a2m2", 600], [2.0, "a2m1", 600], [2.4, "a2m2", 400]
      ];
      var ETIQUETTES = [];   // ex. ["Ouverture · dimanche 8 novembre"] : une info réelle de la fiche

      // La lecture : 0,3 s par mot + 0,8 s, jamais moins de 1,5 s (studio_motion.py lecture).
      var lecture = function (t) {
        var n = t.split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length;
        return n ? Math.ceil(Math.max(1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10 : 0;
      };
      var b1 = $("b1"), b2 = $("b2"), b3 = $("b3");
      var texteA = ["a1", "a2", "a3"].map(function (l) { return $(l).textContent; }).join(" ");
      var texteB = [b1, b2, b3].map(function (l) { return l.dataset.texte; }).join(" ");
      COUPE = Math.max(COUPE, lecture(texteA));
      var ENTREE_B = 0.9;   // la dernière ligne du spécimen est posée 0,9 s après la coupe
      if (D + 1e-6 < COUPE + ENTREE_B + lecture(texteB)) {
        console.warn(ID + " : data-duration trop courte pour lire le spécimen, il faut " + (COUPE + ENTREE_B + lecture(texteB)).toFixed(1) + " s");
      }

      // ---------- Plan A : le titre géant, lisible dès la première image ----------
      // Pendant sa lecture, le bloc pousse lentement (×1,045 sur toute la tenue) et la 1re ligne
      // dérive : le titre ne bouge que doucement.
      tl.fromTo($("blocA"), { scale: 1, y: 10 }, { scale: 1.045, y: -14, duration: COUPE, ease: "sine.inOut" }, 0);
      tl.fromTo($("a1"), { x: 0 }, { x: 30, duration: COUPE, ease: "sine.inOut" }, 0);
      BASCULES.forEach(function (b) { if (b[0] < COUPE) tl.set($(b[1]), { fontWeight: b[2] }, b[0]); });

      // ---------- Plan B : le spécimen ----------
      var planB = $("planB");
      K.cacher(planB);
      tl.set(planB, { opacity: 1 }, COUPE);
      tl.set($("planA"), { opacity: 0 }, COUPE + 0.02);

      // Bases des lignes (px) : la grille se cale sur elles (base et hauteur des minuscules).
      // Écart d'une base à l'autre : 300 et 290 px. Si une lettre à jambage (p, g, q) tombe sur
      // un accent ou un point de la ligne du dessous, augmente l'écart ou change la coupe.
      var TAILLE = 300, BASES = [312, 612, 902];
      [b1, b2, b3].forEach(function (el, i) { el.style.top = (BASES[i] - TAILLE * 0.85) + "px"; });

      // La grille : une ligne sur chaque base et sur la hauteur des minuscules, et des colonnes.
      var grille = $("grille"), traitsH = [], traitsV = [];
      BASES.forEach(function (b) {
        [b, b - TAILLE * 0.53].forEach(function (y) {
          traitsH.push(K.el(grille, "div", "t02-titre-trait h", null, "top:" + Math.round(y) + "px"));
        });
      });
      [92, 560, 1230, 1500, 1828].forEach(function (x) {
        traitsV.push(K.el(grille, "div", "t02-titre-trait v", null, "left:" + x + "px"));
      });
      gsap.set(traitsH, { scaleX: 0 });
      gsap.set(traitsV, { scaleY: 0 });
      tl.to(traitsH, { scaleX: 1, duration: 0.5, ease: "expo.out", stagger: 0.03 }, COUPE);
      tl.to(traitsV, { scaleY: 1, duration: 0.5, ease: "expo.out", stagger: 0.04 }, COUPE + 0.05);

      // La phrase tapée en deux voix. La 1re ligne commence juste avant la coupe : la première
      // image du plan montre déjà des lettres ; la ligne légère est posée à COUPE + 0,9 s. Tout se
      // tape, rien n'entre en fondu ni en flou : un accent transparent sur la nuit vire à l'olive.
      K.taper(tl, b1, b1.dataset.texte, COUPE - 0.3, COUPE + 0.25, D);
      K.taper(tl, b2, b2.dataset.texte, COUPE + 0.25, COUPE + 0.55, D);
      K.taper(tl, $("b3t"), b3.dataset.texte, COUPE + 0.6, COUPE + 0.9, D);

      // Les étiquettes (facultatives) : une info réelle de la fiche, à droite de la 1re ligne et
      // sous la ligne légère.
      var e1 = $("e1"), e2 = $("e2");
      e1.style.left = "1250px"; e1.style.top = "196px";
      e2.style.left = "94px"; e2.style.top = "800px";
      [e1, e2].forEach(function (e, i) {
        if (!ETIQUETTES[i]) { e.style.display = "none"; return; }
        e.textContent = ETIQUETTES[i];
        K.cacher(e, { y: 10 });
        tl.to(e, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, COUPE + 0.7 + i * 0.12);
      });

      // Pendant la lecture, ce qui vit est la phrase elle-même : le cadre de sélection attrape la
      // ligne légère, qui passe en gras et en clair, puis revient ; le texte ne bouge pas.
      var sel = $("sel");
      K.cacher(sel);
      tl.fromTo(sel, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, COUPE + 1.15);
      tl.set(b3, { attr: { "data-voix": "grasse" } }, COUPE + 1.4);
      tl.set(b3, { attr: { "data-voix": "legere" } }, COUPE + 2.1);
      tl.to(sel, { opacity: 0, duration: 0.18, ease: "power2.in" }, COUPE + 2.3);
      // La caméra ne fait qu'une dérive lente pendant tout le plan (3 %).
      tl.fromTo($("cameraB"), { scale: 1.0, x: 0 }, { scale: 1.03, x: -14, duration: D - COUPE, ease: "sine.inOut" }, COUPE);

      // La ligne du bas glisse vers la gauche, juste assez pour montrer la fin de son mot coupé
      // (mesurée une fois la police chargée), lentement, pendant la lecture.
      var a3 = $("a3"), cs = getComputedStyle(a3);
      document.fonts.load(cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily).then(finir, finir);
      function finir() {
        var o = 0.08 * 1920, droite = o + (30 + a3.scrollWidth - o) * 1.045;
        var glisse = Math.max(-280, Math.min(0, (1890 - droite) / 1.045));
        if (glisse < 0) tl.fromTo(a3, { x: 0 }, { x: glisse, duration: Math.min(1.8, COUPE - 0.4), ease: "sine.inOut" }, 0.2);
        window.__timelines[ID] = tl;
      }
    })();
  </script>
</template>
</body>
</html>
