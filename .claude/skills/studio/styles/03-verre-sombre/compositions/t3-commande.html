<template>
<!--
  Style n°3 · Verre sombre · scène « Le bon de commande » (l'offre et le prix).
  Ce qu'elle montre : le bon de commande de l'offre, en verre sombre, incliné en 3D. Il pivote et
  entre de profil depuis une lame claire ; la caméra le montre en trois cadrages, un par partie
  (le prix, le réglage, le total et le bouton), recadrée nettement entre deux et posée pendant
  qu'on lit (une dérive lente seulement). Le prix tourne jusqu'à sa valeur, ce qui est inclus s'allume, le curseur
  fait glisser le nombre de paiements, active le bonus, le total se met à jour, puis il clique sur
  le bouton, qui se défait en points.
  Le bon suit SA VRAIE PAGE DE PAIEMENT, simplifiée : ses formules, son prix, ses façons de payer,
  son option ou son bonus s'il en a un, son total, son bouton, rien d'autre.
  Durée : 8,8 s. 16:9 (1920 × 1080) ; en 9:16, passe la racine à 1080 × 1920 : le bon se recadre
  seul (K.cadre), il remplit la largeur.
  À remplacer : l'objet EXEMPLE (les formules, le nom, le prix, ce qui est inclus, le nombre de
  paiements possible, le bonus, les libellés, le texte du bouton). Uniquement ce que sa vraie page
  de paiement propose : une ligne qui n'existe pas chez lui se retire (paiement en plusieurs fois,
  bonus) ; ni réduction ni prix barré inventés. Le menu, la ligne d'accès et la mention sont des
  micro-textes d'interface (texture, data-layout-ignore) ; le prix, les options, le total et le
  bouton se lisent (28 px au moins à l'écran, par la caméra).
  Le prix porte data-prix : la vidéo qui l'affiche ajoute à index.motion.json la règle
  {"kind": "staysInFrame", "selector": "[data-prix]"} (composition.md) ; un seul élément le porte.
  Couleurs : la nuit var(--brand-sombre), le verre une ombre (noir en transparence) avec des
  reflets blancs, le texte var(--brand-clair), les gris et les surfaces du bon var(--brand-gris-*),
  la lame var(--brand-clair) ; l'accent se pose plein (la pastille, la piste remplie,
  l'interrupteur, le bouton et ses points), il n'entre et ne sort jamais en fondu ni en flou, et il
  n'a ni halo ni voile.
  Identifiant : t3c (préfixe de tous les id et classes de la scène).
-->
<style>
  #t3c {
    --t3-nuit: var(--brand-sombre);
    --t3-texte: var(--brand-clair);
    --t3-accent-texte: var(--brand-accent-lisible);
    --t3-lueur: rgba(255, 255, 255, 0.075);
    --t3-verre: rgba(0, 0, 0, 0.42);
    --t3-gris: var(--brand-gris-3);
    --t3-police: var(--brand-font-body);
    background: var(--t3-nuit); font-family: var(--t3-police); color: var(--t3-texte);
  }
  #t3c .t3c-fond {
    position: absolute; inset: -2px;
    background:
      radial-gradient(ellipse 55% 48% at 20% -10%, var(--t3-lueur), transparent 72%),
      radial-gradient(ellipse 50% 40% at 85% 105%, rgba(255, 255, 255, 0.04), transparent 70%),
      var(--t3-nuit);
  }
  #t3c .t3c-rail { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  /* Le bon de commande : verre sombre (un noir en transparence), liseré clair en haut, grande ombre */
  #t3c .t3c-bon {
    position: absolute; left: -460px; top: 0; width: 920px; padding: 54px 56px 60px;
    border-radius: 40px; background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.02) 40%, rgba(255,255,255,.035)), var(--t3-verre);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.26), inset 0 0 0 1.5px rgba(255,255,255,.1), 0 70px 140px rgba(0,0,0,.6);
    display: flex; flex-direction: column; gap: 34px;
  }
  #t3c .t3c-liseret { position: absolute; inset: 0; border-radius: 40px; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,255,255,.22), transparent 18%, transparent 82%, rgba(255,255,255,.1)); opacity: .55;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 2px; }
  /* La lame claire : le bon vu de profil, le clair de la marque, plein, qui pivote puis se retire
     d'un balayage (jamais un fondu : un voile blanc à demi transparent sur l'accent ferait du jaune pâle). */
  #t3c .t3c-voile { position: absolute; inset: 0; border-radius: 40px; pointer-events: none;
    background: var(--brand-clair); clip-path: inset(0% 0% 0% 0% round 40px); }
  #t3c .t3c-ligne { display: flex; align-items: center; justify-content: space-between; gap: 20px; position: relative; }
  #t3c .t3c-onglets { display: flex; gap: 10px; align-items: center; }
  #t3c .t3c-onglet { padding: 14px 30px; border-radius: 999px; font-size: 30px; font-weight: 600; color: var(--t3-gris); }
  #t3c .t3c-onglet.t3c-actif { background: var(--t3-texte); color: var(--t3-nuit); }
  #t3c .t3c-menu { font-size: 26px; font-weight: 500; color: var(--t3-gris); display: flex; align-items: center; gap: 8px; }
  #t3c .t3c-menu svg { width: 26px; height: 26px; }
  #t3c .t3c-segment { position: relative; display: flex; border-radius: 999px; padding: 7px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.14); }
  /* La pastille du sélecteur : cerclée d'un trait plein de l'accent (le motif du look), elle glisse
     sous les libellés ; le choisi passe au clair, l'autre au gris (deux neutres : à chaque image, le
     libellé se lit, ce qu'un libellé foncé sur une pastille pleine qui glisse ne garantit pas). */
  #t3c .t3c-seg-pastille { position: absolute; left: 7px; top: 7px; bottom: 7px; width: calc(50% - 7px); border-radius: 999px; box-shadow: inset 0 0 0 2.5px var(--brand-accent); }
  #t3c .t3c-seg { position: relative; flex: 1; text-align: center; padding: 18px 0; border-radius: 999px; font-size: 32px; font-weight: 600; color: var(--t3-gris); }
  #t3c .t3c-lab { font-size: 32px; font-weight: 600; }
  #t3c .t3c-sous { font-size: 24px; font-weight: 500; color: var(--t3-gris); margin-top: 6px; }
  #t3c .t3c-prix { font-size: 112px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  #t3c .t3c-puces { display: flex; gap: 14px; }
  /* ce qui est inclus : des puces cerclées d'un gris de la marque, qui s'allument (fond plein) */
  #t3c .t3c-puce { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 0; border-radius: 18px;
    box-shadow: inset 0 0 0 2px var(--brand-gris-1); font-size: 30px; font-weight: 600; color: var(--brand-gris-4); }
  #t3c .t3c-puce svg { width: 30px; height: 30px; color: var(--t3-accent-texte); }
  #t3c .t3c-glisse { display: flex; align-items: center; gap: 28px; }
  #t3c .t3c-piste { position: relative; flex: 1; height: 12px; border-radius: 6px; background: var(--brand-gris-1); }
  #t3c .t3c-rempli { position: absolute; left: 0; top: 0; height: 100%; width: 100%; border-radius: 6px; background: var(--brand-accent); transform-origin: 0 50%; }
  #t3c .t3c-bille { position: absolute; left: 0; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--brand-clair);
    box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  #t3c .t3c-cran { position: absolute; top: 30px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: rgba(255,255,255,.3); }
  #t3c .t3c-valeur { width: 128px; height: 70px; border-radius: 20px; display: grid; place-items: center; font-size: 32px; font-weight: 600;
    background: var(--brand-gris-1); }
  #t3c .t3c-inter { position: relative; width: 92px; height: 52px; border-radius: 26px; background: var(--brand-gris-1); flex: none; }
  /* l'interrupteur se remplit de l'accent par un volet (jamais en fondu) */
  #t3c .t3c-inter-plein { position: absolute; inset: 0; border-radius: 26px; background: var(--brand-accent); clip-path: inset(0% 100% 0% 0% round 26px); }
  #t3c .t3c-inter-bille { position: absolute; left: 5px; top: 5px; width: 42px; height: 42px; border-radius: 50%; background: var(--brand-clair); box-shadow: 0 3px 10px rgba(0,0,0,.35); }
  #t3c .t3c-bonus { overflow: hidden; }
  #t3c .t3c-champs { display: flex; gap: 16px; padding-top: 4px; }
  #t3c .t3c-champ { flex: 1; display: flex; align-items: center; gap: 14px; padding: 22px 26px; border-radius: 20px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); font-size: 32px; font-weight: 600; }
  #t3c .t3c-champ svg { width: 30px; height: 30px; color: var(--t3-accent-texte); }
  #t3c .t3c-tag svg { width: 24px; height: 24px; display: block; }
  #t3c .t3c-tag { margin-left: auto; padding: 6px 10px; border-radius: 10px; font-size: 22px; font-weight: 700;
    color: var(--brand-contrast); background: var(--brand-accent); }
  #t3c .t3c-trait { height: 2px; background: rgba(255,255,255,.16); }
  #t3c .t3c-res { display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 600; }
  #t3c .t3c-res svg { width: 30px; height: 30px; color: var(--t3-gris); }
  #t3c .t3c-res .t3c-v { margin-left: auto; }
  /* Le bouton : l'accent plein ; au clic, un trou s'ouvre depuis le curseur et ne laisse que ses
     points (pleins, à l'accent), qui montent et s'effacent. */
  #t3c .t3c-bouton { position: relative; height: 112px; border-radius: 28px; }
  #t3c .t3c-bouton-plein { position: absolute; inset: 0; border-radius: 28px; display: grid; place-items: center; font-size: 40px; font-weight: 700;
    background: var(--brand-accent); color: var(--brand-contrast);
    --t3c-trou: 0px;
    -webkit-mask-image: radial-gradient(circle at 62% 50%, transparent var(--t3c-trou), #000 calc(var(--t3c-trou) + 1px));
    mask-image: radial-gradient(circle at 62% 50%, transparent var(--t3c-trou), #000 calc(var(--t3c-trou) + 1px)); }
  #t3c .t3c-points-bouton { position: absolute; inset: -6px; border-radius: 32px; opacity: 0;
    background-image: radial-gradient(circle, var(--brand-accent) 2px, transparent 2.7px); background-size: 11px 11px; }
  #t3c .t3c-mention { text-align: center; font-size: 24px; font-weight: 500; color: var(--brand-gris-4); display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: -12px; }
  #t3c .t3c-mention svg { width: 22px; height: 22px; }
  /* Pas de bande floue de profondeur de champ : le bon est plein d'accent (pastille, piste,
     interrupteur, bouton), et un accent flou se mêle à la nuit en olive. La profondeur vient de
     l'inclinaison, de la perspective et de la grande ombre. */
</style>

<div data-composition-id="t3c" data-width="1920" data-height="1080" data-duration="9" style="position:absolute; inset:0;">
  <div id="t3c" class="k-scene">
    <div class="t3c-fond"></div>
    <!-- La vignette assombrit la nuit seule : posée sous le bon, elle ne touche jamais l'accent. -->
    <div class="k-vignette"></div>
    <div class="k-scene3d" id="t3c-3d"><div class="k-camera" id="t3c-cam">
      <div class="t3c-rail" id="t3c-rail">
        <div class="t3c-bon" id="t3c-bon">
          <div class="t3c-ligne" id="t3c-l-entete">
            <div class="t3c-onglets" id="t3c-formules"></div>
            <div class="t3c-menu" id="t3c-menu"></div>
          </div>
          <div class="t3c-segment" id="t3c-segment"><div class="t3c-seg-pastille" id="t3c-seg-pastille"></div><div class="t3c-seg" id="t3c-seg-1"></div><div class="t3c-seg" id="t3c-seg-2"></div></div>
          <div class="t3c-ligne" id="t3c-l-prix">
            <div><div class="t3c-lab" id="t3c-nom"></div><div class="t3c-sous" id="t3c-acces"></div></div>
            <div class="t3c-prix" id="t3c-prix" data-prix></div>
          </div>
          <div class="t3c-puces" id="t3c-puces"></div>
          <div id="t3c-l-fois">
            <div class="t3c-lab" id="t3c-fois-lab" style="margin-bottom:22px"></div>
            <div class="t3c-glisse">
              <div class="t3c-piste" id="t3c-piste"><div class="t3c-rempli" id="t3c-rempli"></div><div class="t3c-bille" id="t3c-bille"></div></div>
              <div class="t3c-valeur" id="t3c-valeur"></div>
            </div>
          </div>
          <div class="t3c-ligne" id="t3c-l-bonus"><div class="t3c-lab" id="t3c-bonus-lab"></div>
            <div class="t3c-inter" id="t3c-inter"><div class="t3c-inter-plein" id="t3c-inter-plein"></div><div class="t3c-inter-bille" id="t3c-inter-bille"></div></div>
          </div>
          <div class="t3c-bonus" id="t3c-bonus"><div class="t3c-champs" id="t3c-champs"></div></div>
          <div class="t3c-trait"></div>
          <div class="t3c-res" id="t3c-l-auj"></div>
          <div class="t3c-res" id="t3c-l-total"></div>
          <div class="t3c-bouton" id="t3c-bouton"><div class="t3c-points-bouton" id="t3c-points-bouton"></div><div class="t3c-bouton-plein" id="t3c-bouton-plein"><span id="t3c-bouton-texte"></span></div></div>
          <div class="t3c-mention" id="t3c-mention"></div>
          <div class="t3c-liseret"></div>
          <div class="t3c-voile" id="t3c-voile"></div>
        </div>
      </div>
    </div></div>
  </div>
</div>

<script>
(function () {
  var EXEMPLE = { // À REMPLACER : tout vient de sa vraie page de paiement et de OFFRE.json (prix, bonus, echeances), ou la ligne se retire
    formules: ["Essentiel", "Complet"],          // ses formules, la 2e est active ; [] retire la ligne
    menu: "Accès à vie",                         // petit menu à droite, texture ("" le retire)
    paiements: ["Paiement unique", "En plusieurs fois"],
    nom: "Ton offre",                            // le nom de l'offre (OFFRE.json, produit)
    acces: "Accès immédiat",                     // sous le nom, texture ("" la retire)
    prix: "[SON PRIX]",                          // son vrai prix TTC en euros, un nombre (prix.montant)
    inclus: [["play", "Vidéos"], ["file-text", "Modèles"], ["users", "Groupe"], ["gift", "Bonus"]],   // [icône du kit, ce qui est inclus]
    foisMax: 3,                                  // paiement en 1 à N fois (echeances) ; 1 retire le curseur
    foisLab: "Nombre de paiements",
    bonus: "[SON BONUS]", bonusNom: "Ton bonus", bonusLab: "Ajouter le bonus",   // le vrai prix du bonus en euros, un nombre ; 0 retire la ligne
    aujourdhui: "Aujourd'hui", total: "Total",
    bouton: "Je rejoins",                        // le texte de son vrai bouton
    mention: "Paiement sécurisé"                 // texture ("" la retire)
  };
  K.emplacements("t3c", EXEMPLE);   // un emplacement d'exemple resté : la console le dit, `check` aussi
  var euros = function (v) { var r = Math.round(v * 100) / 100; return (r % 1 ? r.toFixed(2).replace(".", ",") : String(r)) + " €"; };
  // Les montants : un emplacement d'exemple (un texte) s'affiche tel quel, et ce qui en dépend aussi.
  var reel = typeof EXEMPLE.prix === "number" && (!EXEMPLE.bonus || typeof EXEMPLE.bonus === "number");
  var montant = function (v) { return typeof v === "number" ? euros(v) : String(v); };
  var D = 9.0;
  var $ = function (id) { return document.getElementById(id); };
  var cadre = K.cadre($("t3c")), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
  if (vertical) $("t3c").classList.add("t3c-vertical");

  // Construction depuis EXEMPLE
  EXEMPLE.formules.forEach(function (f, i) { K.el($("t3c-formules"), "div", "t3c-onglet" + (i === EXEMPLE.formules.length - 1 ? " t3c-actif" : ""), f); });
  if (!EXEMPLE.formules.length) $("t3c-formules").style.visibility = "hidden";
  $("t3c-menu").innerHTML = EXEMPLE.menu ? "<span>" + EXEMPLE.menu + "</span>" + K.ic("arrow-right").replace("<svg", '<svg style="transform:rotate(90deg)"') : "";
  $("t3c-seg-1").textContent = EXEMPLE.paiements[0]; $("t3c-seg-2").textContent = EXEMPLE.paiements[1];
  $("t3c-nom").textContent = EXEMPLE.nom; $("t3c-acces").textContent = EXEMPLE.acces;
  EXEMPLE.inclus.forEach(function (p) { K.el($("t3c-puces"), "div", "t3c-puce", K.ic(p[0]) + "<span>" + p[1] + "</span>"); });
  $("t3c-fois-lab").textContent = EXEMPLE.foisLab;
  for (var c = 0; c < EXEMPLE.foisMax; c++) K.el($("t3c-piste"), "div", "t3c-cran", null, "left:" + (EXEMPLE.foisMax > 1 ? (c / (EXEMPLE.foisMax - 1)) * 100 : 0) + "%");
  if (EXEMPLE.foisMax <= 1) $("t3c-l-fois").style.display = "none";
  $("t3c-bonus-lab").textContent = EXEMPLE.bonusLab;
  $("t3c-champs").innerHTML = '<div class="t3c-champ">' + K.ic("gift") + "<span>" + EXEMPLE.bonusNom + '</span></div><div class="t3c-champ"><span>+ ' + montant(EXEMPLE.bonus) + '</span><span class="t3c-tag">' + K.ic("check") + "</span></div>";
  if (!EXEMPLE.bonus) { $("t3c-l-bonus").style.display = "none"; $("t3c-bonus").style.display = "none"; }
  $("t3c-l-auj").innerHTML = K.ic("calendar") + "<span>" + EXEMPLE.aujourdhui + '</span><span class="t3c-v" id="t3c-v-auj"></span>';
  $("t3c-l-total").innerHTML = K.ic("wallet") + "<span>" + EXEMPLE.total + '</span><span class="t3c-v" id="t3c-v-total"></span>';
  $("t3c-bouton-texte").textContent = EXEMPLE.bouton;
  $("t3c-mention").innerHTML = EXEMPLE.mention ? K.ic("lock") + "<span>" + EXEMPLE.mention + "</span>" : "";
  // les micro-textes de l'interface, qu'on ne lit pas : de la texture
  ["t3c-menu", "t3c-acces", "t3c-mention"].forEach(function (id) { $(id).setAttribute("data-layout-ignore", ""); });
  var curseur = K.curseur($("t3c-bon"), "t3c-curseur", false);
  // Les couleurs animées, lues dans les jetons de la marque (GSAP n'interpole pas une variable CSS).
  var clair = K.jeton("--brand-clair"), gris = K.jeton("--brand-gris-3"), gris1 = K.jeton("--brand-gris-1");
  gsap.set("#t3c-seg-1", { color: clair });

  // États de départ
  var cam = { rx: 22, ry: -10, rz: -3, s: vertical ? 1.02 : 1.22 };
  gsap.set("#t3c-cam", { rotationX: cam.rx, rotationY: cam.ry, rotationZ: cam.rz, scale: cam.s });
  gsap.set("#t3c-bon", { rotationY: 87, x: 320, opacity: 0, filter: "blur(10px)", transformOrigin: "50% 0%" });
  gsap.set("#t3c-rempli", { scaleX: 0 });
  gsap.set("#t3c-puces svg", { scale: 0 });
  K.cacher(curseur);

  function construire() {
    var tl = gsap.timeline({ paused: true });
    var bon = $("t3c-bon");
    var y = function (el) { var v = 0; while (el && el !== bon) { v += el.offsetTop; el = el.offsetParent; } return v; };
    var x = function (el) { var v = 0; while (el && el !== bon) { v += el.offsetLeft; el = el.offsetParent; } return v; };
    var milieu = function (id) { var e = $(id); return y(e) + e.offsetHeight / 2; };
    var hBonus = EXEMPLE.bonus ? $("t3c-champs").offsetHeight + 4 : 0;
    // Le bonus garde sa place dans le bon (mesurée ici) : il s'ouvre par l'échelle (scaleY), et ce
    // qui est dessous, remonté d'autant, redescend avec lui (jamais une hauteur animée).
    var dessous = ["#t3c .t3c-trait", "#t3c-l-auj", "#t3c-l-total", "#t3c-bouton", "#t3c-mention"];
    if (hBonus) {
      gsap.set("#t3c-bonus", { height: hBonus, scaleY: 0, opacity: 0, transformOrigin: "50% 0%" });   // fermé : rien à lire
      gsap.set(dessous, { y: -hBonus });
    }
    var wSeg = $("t3c-seg-1").offsetWidth;
    // La caméra suit un point du bon (repère du bon, avant l'ouverture du bonus). Trois cadrages, un
    // par partie : on recadre net ENTRE deux lectures (0,7 s), jamais pendant ; sous une lecture, la
    // caméra ne fait que sa dérive lente. En vertical, le bon remplit la largeur et tient presque en
    // entier : le premier cadrage le montre tout entier, centré.
    var vise = function (t, cible) { tl.to("#t3c-rail", { y: -cible, duration: 0.7, ease: "power3.inOut" }, t); };
    var A = vertical ? (bon.offsetHeight - hBonus) / 2 : milieu("t3c-l-prix") - 60;
    var B = EXEMPLE.foisMax > 1 ? (milieu("t3c-l-fois") + (EXEMPLE.bonus ? milieu("t3c-l-bonus") + hBonus / 2 : milieu("t3c-l-fois"))) / 2 : milieu("t3c-l-bonus") + hBonus / 2;
    // le total et le bouton ; en vertical, le bas du bon se pose près du bas de l'image
    var C = vertical ? bon.offsetHeight * 0.62 : (milieu("t3c-l-auj") + milieu("t3c-bouton")) / 2;   // le bonus est déjà dans la mesure
    gsap.set("#t3c-rail", { y: -A });
    // la dérive lente de toute la scène : le bon tourne de quelques degrés
    tl.to("#t3c-cam", { rotationY: -5, rotationZ: -1.5, duration: D, ease: "sine.inOut" }, 0);

    // 1. Le prix (0 → 2,4 s) : le bon pivote et entre, la lame se retire d'un balayage, le prix
    //    tourne, ce qui est inclus s'allume ; puis il se lit.
    tl.to("#t3c-bon", { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.0);
