<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"></head>

<template>
<!--
  Style n°3 · Verre sombre · scène « Les onglets » (l'accroche).
  Ce qu'elle montre : la promesse en très gros, floue, qui devient nette ; la caméra recule et la
  phrase se complète mot à mot, sa fin à l'accent, posée à la moitié de la largeur environ (c'est son
  apparition). Puis elle se tient, immobile, le temps de sa lecture : derrière elle, la trame de
  points s'allume, la lumière glisse et ses vraies captures arrivent de la profondeur (aucun
  recadrage sous la phrase). Une fois la phrase lue, une barre d'onglets entre, défile très vite
  (flou de vitesse) sous une pastille fixe cerclée de l'accent, qui se pose sur l'offre et se
  remplit de l'accent ; on plonge dans ce bouton, qui couvre l'écran d'un éclair de l'accent, et
  le verbe d'appel et le nom de l'offre se forment en points, en grand, deviennent nets et se
  tiennent le temps de leur lecture.
  Durée : la scène tient chaque phrase le temps de sa lecture (0,3 s par mot + 0,8 s, 2 s au
  moins pour la promesse : `studio_motion.py lecture`) et en déduit sa durée (D dans le script) :
  7,2 s + la lecture de la promesse + celle de l'appel. 11,2 s avec l'objet EXEMPLE (5 mots puis
  3) ; +0,3 s par mot de plus. Reporte-la dans data-duration (ici et sur l'hôte dans index.html).
  La promesse tient sur une ligne : 8 mots au plus (le 1er morceau, 1 ou 2 mots, arrive en très
  gros). Une promesse plus longue ne se raccourcit pas : elle se pose dans une scène construite
  dans le style (deux lignes, même mise au point, même tenue).
  16:9 (1920 × 1080) ; en 9:16, passe la racine à 1080 × 1920 : tout se place d'après la taille de
  la composition (K.cadre).
  À remplacer : l'objet EXEMPLE (la promesse en deux morceaux ; les onglets, les sujets de sa
  page ; le nom de l'offre, qui figure dans les onglets ; le verbe d'appel ; l'icône du premier
  onglet ; ses vraies captures).
  Couleurs : la nuit var(--brand-sombre), le texte posé dessus var(--brand-clair), les gris
  var(--brand-gris-*), un mot à l'accent sur la nuit var(--brand-accent-lisible) ; l'accent se
  pose plein (le cercle de la pastille, son remplissage, l'éclair) et n'entre ni ne sort jamais en
  fondu ou en flou (un volet, une coupe, ou il passe au clair d'un coup avant le flou) ; la lumière
  et la trame sont du blanc très faible, sans halo.
  Identifiant : t3o (préfixe de tous les id et classes de la scène).
-->
<style>
  #t3o {
    --t3-nuit: var(--brand-sombre);
    --t3-texte: var(--brand-clair);
    --t3-accent-texte: var(--brand-accent-lisible);
    --t3-gris: var(--brand-gris-3);
    --t3-lueur: rgba(255, 255, 255, 0.075);
    --t3-police: var(--brand-font-body);
    background: var(--t3-nuit); font-family: var(--t3-police); color: var(--t3-texte);
  }
  /* La lumière de la scène : du blanc très faible qui glisse lentement sur la nuit. */
  #t3o .t3o-fond {
    position: absolute; inset: -2px -160px -2px -160px;
    background:
      radial-gradient(ellipse 55% 48% at 20% -10%, var(--t3-lueur), transparent 72%),
      radial-gradient(ellipse 60% 36% at 80% 112%, rgba(255, 255, 255, 0.04), transparent 70%),
      var(--t3-nuit);
  }
  /* La trame de points (le motif du look), masquée en ovale. */
  #t3o .t3o-trame {
    position: absolute; left: 50%; top: 50%; width: 1500px; height: 900px; margin: -450px 0 0 -750px;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.24) 1.6px, transparent 2.2px);
    background-size: 15px 15px;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, rgba(0,0,0,.55) 45%, transparent 75%);
    mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, rgba(0,0,0,.55) 45%, transparent 75%);
  }
  #t3o .t3o-plan { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
  /* L'accroche */
  #t3o .t3o-ligne {
    position: absolute; left: 0; right: 0; top: 50%; height: 80px; margin-top: -40px;
    text-align: center; white-space: nowrap; font-weight: 600; font-size: 60px; line-height: 80px;
    letter-spacing: -0.015em;
  }
  #t3o .t3o-ligne span { display: inline-block; }
  /* en 9:16, la promesse s'empile sur deux lignes (ses deux morceaux) et grandit : une mise en page,
     pas un recadrage */
  #t3o.t3o-vertical .t3o-ligne { height: 160px; margin-top: -80px; }
  #t3o .t3o-a { position: relative; color: var(--t3-texte); }
  #t3o .t3o-b { color: var(--t3-accent-texte); }
  /* les mots de la fin de phrase entrent par un volet qui monte (l'accent n'entre jamais en fondu ni en flou) */
  #t3o .t3o-bm { display: inline-block; clip-path: inset(100% 0% 0% 0%); }
  #t3o .t3o-caret { position: absolute; left: -0.32em; top: 0.12em; width: 0.16em; height: 0.86em;
    background-image: radial-gradient(circle, rgba(255,255,255,.95) 1.6px, transparent 2.2px); background-size: 6px 6px; }
  /* La barre d'onglets */
  #t3o .t3o-barre {
    position: absolute; left: 50%; top: 50%; height: 100px; margin-top: -50px;
    display: flex; align-items: center; gap: 60px; white-space: nowrap;
    font-weight: 600; font-size: 46px; color: var(--t3-gris);
  }
  #t3o .t3o-onglet { display: inline-flex; align-items: center; gap: 16px; height: 100px; position: relative; }
  #t3o .t3o-onglet svg { width: 46px; height: 46px; }
  #t3o .t3o-premier { color: var(--t3-texte); padding: 0 26px; border-radius: 22px; background: var(--brand-gris-1); }
  #t3o .t3o-sep { width: 2px; height: 50px; background: rgba(255, 255, 255, 0.16); }
  #t3o .t3o-cible { color: var(--t3-texte); }
  /* La pastille de sélection, fixe au centre : les onglets défilent dessous. Cerclée d'un trait
     plein de l'accent, vide (jamais un halo de l'accent, jamais un voile blanc qui sert de surface). */
  #t3o .t3o-selection {
    position: absolute; left: 50%; top: 50%; height: 112px; margin-top: -56px; border-radius: 30px;
    border: 2px solid var(--brand-accent);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  /* Le remplissage de la pastille : l'accent plein, qui entre par un volet (jamais en fondu), avec
     le nom de l'offre écrit dessus dans la couleur lisible sur l'accent. */
  #t3o .t3o-plein {
    position: absolute; left: 50%; top: 50%; height: 112px; margin-top: -56px; border-radius: 30px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; white-space: nowrap;
    font-weight: 600; font-size: 46px; background: var(--brand-accent); color: var(--brand-contrast);
    clip-path: inset(0% 100% 0% 0% round 30px);
  }
  /* L'arête haute de la pastille, où glisse le reflet. */
  #t3o .t3o-arete { position: absolute; left: 50%; top: 50%; height: 112px; margin-top: -56px; border-radius: 30px; overflow: hidden; pointer-events: none; }
  #t3o .t3o-reflet { position: absolute; top: -2px; left: 0; width: 46%; height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent); filter: blur(1px); }
  /* La fin : le verbe d'appel et le nom de l'offre, en grand (60 à 85 % de la largeur, calculé :
     tailles en em, la police se règle dans le script), d'abord en points */
  #t3o .t3o-final { position: absolute; left: 0; right: 0; top: 50%; height: 3em; margin-top: -1.5em; font-size: 58px; }
  #t3o .t3o-texte {
    position: absolute; left: 0; right: 0; top: 50%; height: 1.4em; margin-top: -0.7em; text-align: center; white-space: nowrap;
    font-weight: 600; font-size: 1em; line-height: 1.4em; letter-spacing: -0.012em;
  }
  #t3o .t3o-texte span { display: inline-block; }
  #t3o .t3o-net .t3o-f1 { color: var(--t3-texte); }
  #t3o .t3o-net .t3o-f2 { color: var(--t3-accent-texte); }
  #t3o .t3o-pix {
    color: var(--t3-texte); letter-spacing: 0.02em;
    -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 62%); -webkit-mask-size: 0.12em 0.12em;
    mask-image: radial-gradient(circle, #000 52%, transparent 62%); mask-size: 0.12em 0.12em;
  }
  #t3o .t3o-echo { color: var(--t3-texte); filter: blur(0.12em); }
  /* Le nom de l'offre à la fin : dans la pastille cerclée de l'accent, qui se remplit par un volet
     pendant la tenue (le mot clé surligné d'un bloc plein ; jamais l'accent en transparence). */
  #t3o .t3o-texte .t3o-f2 { position: relative; padding: 0 0.4em; border-radius: 0.38em; border: 0.04em solid transparent; }
  #t3o .t3o-net .t3o-f2 { border-color: var(--brand-accent); }
  #t3o .t3o-f2-plein { position: absolute; inset: -0.04em; border-radius: 0.38em; background: var(--brand-accent); color: var(--brand-contrast);
    display: flex; align-items: center; justify-content: center; clip-path: inset(0% 100% 0% 0% round 0.38em); }
  /* Ses vraies captures (ses vidéos, sa page, un résultat) dans le verre du look, autour de la
     promesse pendant sa tenue : ce que la phrase montre pendant qu'on la lit. */
  #t3o #t3o-matiere { transform-style: preserve-3d; }
  #t3o .t3o-capture { position: absolute; left: 0; top: 0; border-radius: 22px; overflow: hidden; background: rgba(0, 0, 0, 0.42);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.14), 0 30px 70px rgba(0, 0, 0, 0.45); }
  #t3o .t3o-capture img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); border-radius: 15px; object-fit: cover; object-position: top center; }
  #t3o .t3o-capture::after { content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent); }
</style>

<div data-composition-id="t3o" data-width="1920" data-height="1080" data-duration="11.2" style="position:absolute; inset:0;">
  <div id="t3o" class="k-scene">
    <div class="t3o-fond" data-layout-allow-overflow></div>
    <!-- La vignette assombrit la nuit seule : posée sous le sujet, elle ne touche jamais l'accent. -->
    <div class="k-vignette"></div>
    <div class="k-scene3d"><div class="k-camera" id="t3o-cam">
      <div class="t3o-plan" id="t3o-plan-trame"><div class="t3o-trame" id="t3o-trame" data-layout-ignore></div></div>
      <div class="t3o-plan" id="t3o-matiere" data-layout-allow-overflow></div>
      <div class="t3o-plan" id="t3o-zoom" data-layout-allow-overflow>
        <div class="t3o-ligne" id="t3o-ligne"><span class="t3o-a" id="t3o-a"></span><span id="t3o-espace">&nbsp;</span><span class="t3o-b" id="t3o-b"></span></div>
      </div>
      <div class="t3o-plan" id="t3o-zoom-barre" data-layout-allow-overflow>
        <div class="t3o-barre" id="t3o-barre" data-layout-allow-overflow></div>
        <div class="t3o-selection" id="t3o-selection"></div>
        <div class="t3o-barre" id="t3o-barre-haut" style="pointer-events:none" data-layout-allow-overflow></div>
        <div class="t3o-plein" id="t3o-plein" data-layout-allow-overlap><span id="t3o-plein-mot"></span></div>
        <div class="t3o-arete" id="t3o-arete"><div class="t3o-reflet" id="t3o-reflet"></div></div>
      </div>
    </div></div>
    <div class="t3o-final" id="t3o-final">
      <div class="t3o-texte t3o-echo" id="t3o-echo" data-layout-ignore></div>
      <div class="t3o-texte t3o-pix" id="t3o-pix" data-layout-ignore></div>
      <div class="t3o-texte t3o-net" id="t3o-net"></div>
    </div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="t3o-flou-h" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur id="t3o-flou-h-g" stdDeviation="0 0"/></filter>
    </svg>
  </div>
</div>

<script>
(function () {
  var EXEMPLE = { // À REMPLACER : chaque valeur vient de OFFRE.json ou de sa page, ou la ligne se retire
    promesse: ["Ta promesse", "en une ligne"],      // sa promesse (OFFRE.json, promesse) : 1er morceau en très gros, 8 mots au plus
    onglets: ["Tendances", "Nouveau", "|", "Formations", "Coaching", "Outils", "Ton offre", "Communauté", "Bonus"],  // les sujets de sa page, 6 à 9 ; « | » : un séparateur
    offre: "Ton offre",                              // le nom de l'offre (produit), l'onglet où se pose la pastille
    appel: "Découvre",                               // le verbe d'appel, devant le nom de l'offre
    iconePremier: "trending-up",                     // icône du kit devant le 1er onglet ; "" : aucune
    // Ce que la promesse montre pendant qu'on la lit : 2 ou 3 de ses vraies captures (ses vidéos, sa
    // page, un résultat), en verre autour d'elle : ["assets/images/video-1.jpg", …]. Sans capture, la
    // tenue ne vit que de la lumière (`rythme` la verra figée) : c'est le repérage qui manque de matière.
    captures: []
  };
  // Le temps de lecture du studio (`studio_motion.py lecture`) : 0,3 s par mot + 0,8 s, 1,5 s au
  // moins (2 s pour une accroche), arrondi au dixième supérieur.
  function lecture(texte, plancher) {
    var n = texte.split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length;
    return Math.ceil(Math.max(plancher || 1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10;
  }
  var POSEE = 2.25;                                   // la promesse est entière et posée (fin de son apparition)
  var TENUE = lecture(EXEMPLE.promesse.join(" "), 2); // elle se tient le temps de sa lecture
  var TENUE_FIN = lecture(EXEMPLE.appel + " " + EXEMPLE.offre);   // l'appel aussi
  var O = TENUE - 0.75;                               // la suite (la barre à 3,3 s + O) attend que la promesse soit lue
  var D = Math.round((7.2 + TENUE + TENUE_FIN) * 10) / 10;   // 11,2 s avec l'objet EXEMPLE : reporte-la en data-duration
  var $ = function (id) { return document.getElementById(id); };
  var cadre = K.cadre($("t3o")), L = cadre.largeur, H = cadre.hauteur;
  var vertical = H > L;
  if (vertical) $("t3o").classList.add("t3o-vertical");

  // Construction
  $("t3o-a").innerHTML = EXEMPLE.promesse[0] + '<span class="t3o-caret" id="t3o-caret" data-layout-ignore></span>';
  $("t3o-b").innerHTML = EXEMPLE.promesse[1].split(" ").map(function (m) { return '<span class="t3o-bm">' + m + "</span>"; }).join("&nbsp;");
  if (vertical) { $("t3o-espace").style.display = "none"; $("t3o-espace").insertAdjacentHTML("afterend", "<br>"); }
  var cible = null;
  function remplir(barre, haut) {
    EXEMPLE.onglets.forEach(function (nom, i) {
      var e;
      if (nom === "|") { e = K.el(barre, "div", "t3o-sep"); return; }
      e = K.el(barre, "div", "t3o-onglet" + (i === 0 ? " t3o-premier" : "") + (nom === EXEMPLE.offre ? " t3o-cible" : ""));
      var icone = i === 0 && EXEMPLE.iconePremier ? K.ic(EXEMPLE.iconePremier) : "";
      if (icone) K.el(e, "span", null, icone);     // une icône qui manque ne laisse rien
      var mot = K.el(e, "span", null, nom);
      // l'onglet de l'offre existe deux fois, superposé exprès (sous la pastille et net au-dessus)
      if (nom === EXEMPLE.offre) mot.setAttribute("data-layout-allow-overlap", "");
      // la barre qui file est de la texture (on ne lit que le premier onglet, puis celui de l'offre)
      else if (i > 0) mot.setAttribute("data-layout-ignore", "");
      if (haut) { e.style.visibility = nom === EXEMPLE.offre ? "visible" : "hidden"; }
      else if (nom === EXEMPLE.offre) cible = e;
    });
  }
  remplir($("t3o-barre"), false);
  remplir($("t3o-barre-haut"), true);   // copie : seul l'onglet de l'offre, net, au-dessus de la pastille
  $("t3o-plein-mot").textContent = EXEMPLE.offre;
  ["t3o-net", "t3o-pix", "t3o-echo"].forEach(function (id) {
    $(id).innerHTML = '<span class="t3o-in" id="' + id + '-in"><span class="t3o-f1">' + EXEMPLE.appel + '</span>&nbsp;<span class="t3o-f2"><span class="t3o-f2-txt">' + EXEMPLE.offre + "</span>" +
      (id === "t3o-net" ? '<span class="t3o-f2-plein" id="t3o-f2-plein" data-layout-allow-overlap>' + EXEMPLE.offre + "</span>" : "") + "</span></span>";
  });
  // Les captures : des cartes de verre au format de leur image, placées autour de la promesse
  // (à gauche, à droite, une plus loin en haut ; en 9:16, au-dessus et au-dessous), jamais dessus.
  var places = vertical
    ? [{ x: 0.24, y: 0.25, h: 0.26, ry: 16, rz: -4 }, { x: 0.66, y: 0.76, h: 0.24, ry: -14, rz: 3 }, { x: 0.74, y: 0.2, h: 0.15, ry: -12, rz: 3 }]
    : [{ x: 0.12, y: 0.53, h: 0.46, ry: 18, rz: -4 }, { x: 0.88, y: 0.47, h: 0.46, ry: -18, rz: 4 }, { x: 0.6, y: 0.17, h: 0.26, ry: -8, rz: 2 }];
  var large = vertical ? 0.5 : 0.2;                   // largeur maximale d'une capture (part du cadre)
  var captures = (EXEMPLE.captures || []).slice(0, 3).map(function (src, i) {
    var p = places[i], e = K.el($("t3o-matiere"), "div", "t3o-capture"), img = K.el(e, "img");
    img.alt = ""; img.src = src;
    e.dataset.ry = p.ry; e.dataset.rz = p.rz;
    e.style.height = Math.round(p.h * H) + "px"; e.style.width = Math.round(p.h * H * 9 / 16) + "px";
    img.onload = function () {        // la carte prend le format de son image (portrait, paysage)
      var r = img.naturalWidth / Math.max(1, img.naturalHeight), h = p.h * H, w = Math.min(h * r, large * L);
      e.style.width = Math.round(w) + "px"; e.style.height = Math.round(w / r) + "px";
      gsap.set(e, { left: p.x * L - w / 2, top: p.y * H - w / r / 2 });
    };
    img.onerror = function () { e.style.display = "none"; };   // une capture qui manque retire sa carte
    gsap.set(e, { left: p.x * L - p.h * H * 9 / 32, top: p.y * H - p.h * H / 2 });
    return e;
  });

  // États de départ (première image comprise)
  gsap.set("#t3o-zoom", { scale: 4.6 * (vertical ? 0.62 : 1) });
  gsap.set("#t3o-a", { filter: "blur(16px)" });
  K.cacher(["#t3o-barre", "#t3o-barre-haut", "#t3o-selection", "#t3o-final", "#t3o-trame", "#t3o-net"]);
  gsap.set("#t3o-barre", { filter: "url(#t3o-flou-h)" });
  if (captures.length) K.cacher(captures);

  function construire() {
    var tl = gsap.timeline({ paused: true });
    var clair = K.jeton("--brand-clair");
    // Mesures (polices chargées) : largeurs dans le repère de la barre, avant toute échelle.
    var wA = $("t3o-a").offsetWidth, wE = $("t3o-espace").offsetWidth, wB = $("t3o-b").offsetWidth;
    var wLigne = vertical ? Math.max(wA, wB) : wA + wE + wB;
    // la 1re moitié centrée (à côté de la suite en 16:9, au-dessus d'elle en 9:16), puis la ligne se recentre
    var decalage = vertical ? { x: 0, y: 40 } : { x: (wE + wB) / 2, y: 0 };
    var onglets = $("t3o-barre").children, premier = onglets[0];
    var cxPremier = premier.offsetLeft + premier.offsetWidth / 2;
    var cxCible = cible.offsetLeft + cible.offsetWidth / 2;
    var quatre = onglets[Math.min(3, onglets.length - 1)];
    var cxGroupe = (premier.offsetLeft + quatre.offsetLeft + quatre.offsetWidth) / 2;
    var wPastille = cible.offsetWidth + 64;
    gsap.set(["#t3o-barre", "#t3o-barre-haut"], { marginLeft: 0, x: -cxPremier });
    gsap.set(["#t3o-selection", "#t3o-plein", "#t3o-arete"], { width: wPastille, marginLeft: -wPastille / 2 });
    gsap.set("#t3o-ligne", decalage);
    // la promesse en très gros occupe ~80 % de la largeur, quelle que soit sa longueur
    gsap.set("#t3o-zoom", { scale: Math.min(4.6, (0.8 * L) / Math.max(1, wA)) });
    // l'échelle où la pastille pleine couvre tout l'écran (coins arrondis compris)
    var couvre = 1.12 * Math.max((1.25 * H) / 112, (1.12 * L) / wPastille);
    // La phrase finit à la moitié de la largeur (16:9) ou à 84 % sur deux lignes (9:16) : jamais une
    // petite ligne au milieu du vide. Le recul passe par une échelle intermédiaire un peu plus grande.
    var sFin = Math.min(2.5, ((vertical ? 0.84 : 0.52) * L) / Math.max(1, wLigne));
    var sMid = Math.min(sFin * 1.3, (0.95 * L) / Math.max(1, wLigne));
    // L'appel final, en grand : 62 % de la largeur (16:9), 85 % (9:16)
    var wFin = $("t3o-net-in").offsetWidth;
    var police = 58 * ((vertical ? 0.85 : 0.62) * L) / Math.max(1, wFin);
    $("t3o-final").style.fontSize = police.toFixed(1) + "px";
    var rayon = (police * 0.38).toFixed(1) + "px";
    gsap.set("#t3o-f2-plein", { clipPath: "inset(0% 100% 0% 0% round " + rayon + ")" });

    // 1. L'apparition (0 → 2,25 s) : la promesse floue devient nette, la caméra recule et la ligne
    //    se recentre, la fin de phrase entre mot à mot (des volets qui montent) pendant un dernier recul.
    var bm = document.querySelectorAll("#t3o .t3o-bm"), nb = bm.length;

    tl.fromTo("#t3o-trame", { opacity: 0, scale: 1.25 }, { opacity: 0.9, scale: 1, duration: 0.5, ease: "power2.out" }, 0.12);
    tl.to("#t3o-trame", { opacity: 0, duration: 0.5, ease: "power2.in" }, 0.85);
    tl.to("#t3o-zoom", { scale: sMid, duration: 0.75, ease: "power3.inOut" }, 0.42);
    tl.to("#t3o-ligne", { x: 0, y: 0, duration: 0.75, ease: "power3.inOut" }, 0.62);
    tl.fromTo(bm, { y: 16, clipPath: "inset(100% 0% 0% 0%)" }, { y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "expo.out", stagger: pasMot, immediateRender: false }, 0.98);
    tl.to("#t3o-zoom", { scale: sFin, duration: 1.05, ease: "power2.inOut" }, 1.18);
    // 2. La tenue (2,25 s → la lecture de la promesse) : la phrase ne bouge plus. Derrière elle, la
    //    trame de points s'allume et s'élargit, la lumière glisse, ses captures arrivent : aucun
    //    recadrage, ni ici ni dans les cinq premières secondes.
    var X = POSEE + TENUE;                                         // la promesse sort, lue
    tl.fromTo("#t3o-trame", { opacity: 0, scale: 0.94 }, { opacity: 0.5, scale: 1, duration: 0.7, ease: "power2.out", immediateRender: false }, POSEE + 0.1);
    tl.to("#t3o-trame", { scale: 1.05, duration: TENUE - 0.7, ease: "sine.inOut" }, POSEE + 0.8);
    for (var c = 0.5, k = 0; c < X; c += 0.5, k++) tl.set("#t3o-caret", { opacity: k % 2 ? 1 : 0 }, c);
    tl.fromTo(".t3o-fond", { x: 0, scale: 1 }, { x: 160, scale: 1.1, duration: D, ease: "sine.inOut" }, 0);
    // Ses captures arrivent une à une de la profondeur pendant la tenue (une toutes les 0,6 s : la
    // vie vient de ce que la phrase montre), dérivent lentement, puis repartent avec elle. Sans
    // fondu : une capture à demi transparente sur la nuit en salirait les couleurs.
    captures.forEach(function (e, i) {
      var t = POSEE + 0.15 + i * 0.6, ry = +e.dataset.ry, rz = +e.dataset.rz;
      tl.set(e, { opacity: 1 }, t);
      tl.fromTo(e, { z: -900, rotationY: ry * 2.2, rotationZ: rz * 2, y: 60 },
        { z: 0, rotationY: ry, rotationZ: rz, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t);
      tl.to(e, { y: i % 2 ? 14 : -14, rotationY: ry * 0.8, duration: X - t - 0.55, ease: "sine.inOut" }, t + 0.55);
      tl.to(e, { z: -1100, y: i % 2 ? 80 : -80, duration: 0.32, ease: "power2.in" }, X);
      tl.set(e, { opacity: 0 }, X + 0.32);
    });
    // la sortie se dissout dans le flou : sa fin passe d'abord au clair, d'un coup (un accent flou
    // ou à demi transparent sur la nuit vire à l'olive)
    tl.set(".t3o-b", { color: clair }, X);
    tl.to("#t3o-ligne", { opacity: 0, filter: "blur(10px)", y: -40, duration: 0.3, ease: "power2.in" }, X);
    tl.to("#t3o-trame", { opacity: 0, duration: 0.3, ease: "power2.in" }, X);

    // 3. La barre d'onglets, une fois la promesse lue : le premier, puis les suivants, puis le
    //    défilement (3,3 → 5,6 s, décalés de O : tous les temps qui suivent passent par T)
    var T = function (t) { return t + O; };
    // en 9:16, la barre aussi grande que possible (au plus ×0,85) tant que la pastille de l'offre
    // tient dans la largeur au plus près (×2,6) : de 50 à 100 px de texte selon la longueur du nom
    var zb = vertical ? Math.min(0.85, (0.92 * L) / (wPastille * 2.6)) : 1;
    gsap.set("#t3o-zoom-barre", { scale: 2.1 * zb });
    tl.set("#t3o-barre", { opacity: 1 }, T(3.3));
    gsap.set(onglets, { opacity: 0 });
    tl.fromTo(premier, { opacity: 0, scale: 0.88, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, T(3.3));
    for (var i = 1; i < onglets.length; i++) {
      var t = i <= 4 ? 3.62 + (i - 1) * 0.17 : 4.45 + (i - 5) * 0.04;
      tl.fromTo(onglets[i], { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, T(t));
    }
    tl.to("#t3o-zoom-barre", { scale: 1.6 * zb, duration: 1.0, ease: "power2.inOut" }, T(3.55));
    tl.to(["#t3o-barre", "#t3o-barre-haut"], { x: -cxGroupe, duration: 1.0, ease: "power2.inOut" }, T(3.55));
    // le défilement très rapide, avec un flou de vitesse horizontal (sur les onglets seuls, jamais sur l'accent)
    tl.to(["#t3o-barre", "#t3o-barre-haut"], { x: -cxCible, duration: 1.0, ease: "power3.inOut" }, T(4.55));
    tl.to("#t3o-zoom-barre", { scale: 2.05 * zb, duration: 1.0, ease: "power3.inOut" }, T(4.55));
    tl.fromTo("#t3o-flou-h-g", { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "18 0" }, duration: 0.5, ease: "power2.in" }, T(4.55));
    tl.to("#t3o-flou-h-g", { attr: { stdDeviation: "0 0" }, duration: 0.45, ease: "power2.out" }, T(5.05));
    // la pastille apparaît d'un coup et s'ouvre en largeur (son trait d'accent n'entre pas en fondu)
    tl.set("#t3o-selection", { opacity: 1 }, T(4.85));
    tl.fromTo("#t3o-selection", { scaleX: 0.7 }, { scaleX: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, T(4.85));
    tl.set("#t3o-barre-haut", { opacity: 1 }, T(5.45));

    // 4. La plongée dans le bouton (5,6 → 7 s) : la pastille se remplit de l'accent par un volet,
    //    puis on la traverse : elle couvre tout l'écran (un éclair de la couleur pleine), coupe.
    tl.to("#t3o-barre", { filter: "blur(9px)", opacity: 0.32, duration: 0.6, ease: "power2.out" }, T(5.55));
    tl.fromTo("#t3o-trame", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.1, duration: 1.05, ease: "power2.out", immediateRender: false }, T(5.5));
    tl.to("#t3o-zoom-barre", { scale: 2.6 * zb, duration: 0.85, ease: "expo.out" }, T(5.6));
    tl.fromTo("#t3o-reflet", { x: -220 }, { x: wPastille + 120, duration: 0.7, ease: "power2.inOut" }, T(5.85));
    tl.fromTo("#t3o-plein", { clipPath: "inset(0% 100% 0% 0% round 30px)" }, { clipPath: "inset(0% 0% 0% 0% round 30px)", duration: 0.26, ease: "power3.inOut" }, T(6.02));
    tl.set(["#t3o-selection", "#t3o-barre-haut"], { opacity: 0 }, T(6.3));
    // le nom posé sur l'accent disparaît d'un coup (un texte foncé en fondu sur l'accent fait de l'olive)
    tl.set("#t3o-plein-mot", { opacity: 0 }, T(6.55));
    tl.to("#t3o-barre", { opacity: 0, duration: 0.15, ease: "power1.in" }, T(6.55));
    tl.to("#t3o-zoom-barre", { scale: couvre, duration: 0.38, ease: "power3.in" }, T(6.55));
    tl.to("#t3o-trame", { scale: 2.4, opacity: 0, duration: 0.4, ease: "power3.in" }, T(6.55));
    tl.set("#t3o-zoom-barre", { opacity: 0 }, T(6.98));

    // 5. L'appel se forme en points, en grand, devient net d'un coup (7 → 7,4 s), puis se tient
    //    immobile le temps de sa lecture, la trame rallumée derrière lui ; il sort à la fin de la scène.
    var SORTIE = D - 0.32;
    tl.set("#t3o-final", { opacity: 1 }, T(6.98));
    tl.fromTo("#t3o-pix", { opacity: 0, scaleX: 1.25, filter: "blur(6px)" }, { opacity: 1, scaleX: 1, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, T(6.98));
    tl.fromTo("#t3o-echo", { opacity: 0.7, scale: 1.9 }, { opacity: 0, scale: 1.15, duration: 0.7, ease: "power2.out" }, T(7.0));
    tl.set("#t3o-net", { opacity: 1 }, T(7.28));
    tl.to("#t3o-pix", { opacity: 0, duration: 0.3, ease: "power1.in" }, T(7.3));
    tl.fromTo("#t3o-trame", { opacity: 0, scale: 0.94 }, { opacity: 0.45, scale: 1.04, duration: SORTIE - T(7.0), ease: "sine.inOut", immediateRender: false }, T(7.0));
    // au milieu de la tenue, la pastille du nom se remplit de l'accent par un volet (un événement de
    // contenu : le mot clé surligné d'un bloc plein) et claque
    var VOLET = (T(7.4) + SORTIE) / 2 - 0.13;
    tl.to("#t3o-f2-plein", { clipPath: "inset(0% 0% 0% 0% round " + rayon + ")", duration: 0.2, ease: "power2.inOut" }, VOLET);
    // sous la pastille pleine, le nom à l'accent ne se voit plus : il s'éteint le temps qu'elle le couvre
    tl.set("#t3o-net .t3o-f2-txt", { opacity: 0 }, VOLET + 0.2);
    tl.set("#t3o-net .t3o-f2-txt", { opacity: 1 }, SORTIE - 0.16);
    tl.fromTo("#t3o-net .t3o-f2", { scale: 1 }, { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, VOLET + 0.1);
    // la pastille se vide par un volet, le nom et son cercle passent au clair d'un coup, puis la
    // ligne se dissout dans le flou (jamais un accent flou)
    tl.to("#t3o-f2-plein", { clipPath: "inset(0% 0% 0% 100% round " + rayon + ")", duration: 0.16, ease: "power2.in" }, SORTIE - 0.16);
    tl.set("#t3o-net .t3o-f2", { color: clair, borderColor: "rgba(0,0,0,0)" }, SORTIE);
    tl.to("#t3o-final", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, SORTIE);
    tl.to("#t3o-trame", { opacity: 0, duration: 0.3, ease: "power2.in" }, SORTIE);

    window.__timelines["t3o"] = tl;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(construire); else construire();
})();
</script>
