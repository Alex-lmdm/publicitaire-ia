<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°4 · MOTS ÉPARPILLÉS · SCÈNE « FIN EN CADRE », VERSION VERTICALE 9:16 (1080 × 1920)
    (la même scène que fin-cadre.html, remise en page pour un Reel, une story, un TikTok : un cadre
    de 960 × 700 px, la phrase d'appel sur deux lignes, les trois cartes empilées de haut en bas, qui
    se rejoignent en colonne puis s'aplatissent en un trait ; les logos en haut et en bas)

    Ce qu'elle montre : sur sa nuit, un cadre au trait fin de 960 × 700 px se trace ; la phrase d'appel s'écrit
    dedans un mot à la fois, en léger, et chaque mot allume un peu plus le cadre (son trait plein
    de sa couleur fait le tour par paliers, son fond prend un gris de la marque) ; pendant qu'on la lit,
    les vrais logos nus des outils où l'offre travaille arrivent un à un autour du cadre ; puis les
    mots s'effacent dans le désordre, le cadre se resserre en une carte qui se remplit de sa
    couleur ; deux autres cartes en sortent de chaque côté : les trois parties réelles de l'offre
    (icône, nom, une ligne), tenues le temps de les lire ; elles se rejoignent en une barre, la
    barre s'aplatit en un trait de sa couleur ; au-dessus du trait, le nom ; dessous, le bouton, que
    le curseur clique ; le nom et le bouton se tiennent, les logos dérivent autour.

    Les durées suivent la lecture : la phrase d'appel complète reste le temps de la lire (0,3 s par
    mot + 0,8 s, jamais moins de 1,5 s : `studio_motion.py lecture`), les cartes le temps de lire
    leurs textes, le nom et le bouton 3 s au moins. La scène calcule ses instants : sa durée est FIN,
    que la console affiche (« t04-fin dure … s ») ; reporte-la dans D et dans data-duration, ici et
    sur son hôte dans index.html. Aucune caméra : la vie vient du cadre, des logos et des cartes
    (leurs icônes battent à tour de rôle ; le texte qu'on lit ne bouge pas).

    À remplacer : l'objet EXEMPLE (en tête du script).
      1. L'identifiant « t04-fin » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. appel : la phrase d'appel, courte et complète (4 à 8 mots, un mot à la fois), sur deux
         lignes centrées dans le cadre (trois au plus) : « | » marque le retour à la ligne.
      3. cartes : les trois parties RÉELLES de l'offre [icône du kit, nom, une ligne ou ""] (modules,
         accompagnement, bonus ; ou trois fonctions d'un logiciel), quelques mots chacune, empilées
         de haut en bas. En 9:16, garde trois cartes (la pile tient entre 530 et 1 370 px de haut).
      4. nom (un logo se pose en <img src="brand/logo.svg"> dans #t04-fin-nom) et bouton (le vrai
         libellé du bouton de sa page, 1 à 5 mots). Une pub ne dessine pas de bouton : « Découvre-le »
         et une flèche vers le bas, sans curseur.
      5. outils : les vrais logos nus des outils où l'offre travaille (ceux qu'elle nomme, posés par
         `studio_motion.py logos`), sur les PLACES au-dessus et au-dessous du cadre [x, y, taille, flou] ; [] sans.
    Couleurs : celles de sa marque, rien d'autre : la nuit est var(--brand-sombre), le texte posé
    dessus var(--brand-clair) ; le cadre, un trait gris puis sa couleur pleine et fine, son fond
    var(--brand-gris-1) (un gris de la marque, jamais une lueur de sa couleur ni un voile blanc) ;
    les cartes, le trait et le bouton sont sa couleur pleine, sans dégradé ni lueur, leur texte en
    var(--brand-contrast). Les logos gardent leurs vraies couleurs (un logo monochrome en clair).
  -->
</head>
<body>
<template>
  <style>
    #t04-fin {
      --t04-nuit: var(--brand-sombre);
      --t04-texte: var(--brand-clair);
      background: var(--t04-nuit);
    }
    #t04-fin .t04-fin-fond { position: absolute; border-radius: 40px; background: var(--brand-gris-1); }
    #t04-fin .t04-fin-cadre { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    /* La phrase d'appel passe sur deux lignes, centrées dans le cadre (en hauteur aussi). */
    #t04-fin .t04-fin-appel {
      position: absolute; left: 80px; right: 80px; top: 600px; height: 700px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      font-family: var(--brand-font-body); font-weight: 400; font-size: 64px; line-height: 1.22; letter-spacing: -0.02em; color: var(--t04-texte);
    }
    #t04-fin .t04-fin-appel div { white-space: nowrap; }
    #t04-fin .t04-fin-appel span { display: inline-block; margin: 0 0.13em; }
    #t04-fin .t04-fin-carte {
      position: absolute; left: 540px; top: 950px; width: 720px; height: 240px; margin: -120px 0 0 -360px; border-radius: 26px; overflow: hidden;
      background: var(--brand-accent); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      font-family: "Inter", var(--brand-font-body); text-align: center;
    }
    #t04-fin .t04-fin-carte .contenu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 22px;
      color: var(--brand-contrast); }
    #t04-fin .t04-fin-carte .ic { width: 52px; height: 52px; margin-bottom: 6px; }
    #t04-fin .t04-fin-carte .ic svg { width: 100%; height: 100%; }
    #t04-fin .t04-fin-carte b { font-weight: 700; font-size: 40px; letter-spacing: -0.01em; }
    #t04-fin .t04-fin-carte small { font-size: 30px; font-weight: 500; }
    #t04-fin .t04-fin-trait { position: absolute; left: 110px; top: 980px; width: 860px; height: 3px; border-radius: 2px; background: var(--brand-accent); }
    #t04-fin .t04-fin-nom {
      position: absolute; left: 0; right: 0; top: 862px; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 400; font-size: 88px; letter-spacing: -0.03em; line-height: 1; color: var(--t04-texte);
    }
    #t04-fin .t04-fin-bouton {
      position: absolute; left: 540px; top: 1030px; height: 104px; padding: 0 56px; transform: translateX(-50%); border-radius: 999px; white-space: nowrap;
      display: flex; align-items: center; background: var(--brand-accent); color: var(--brand-contrast);
      font-family: var(--brand-font-display); font-weight: 600; font-size: 44px; letter-spacing: -0.01em;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    #t04-fin .t04-fin-outil { position: absolute; display: grid; place-items: center; color: var(--t04-texte); }
    #t04-fin .t04-fin-outil svg, #t04-fin .t04-fin-outil img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.35)); }
  </style>

  <div data-composition-id="t04-fin" data-width="1080" data-height="1920" data-duration="13.9" style="position:absolute; inset:0;">
    <div id="t04-fin" class="k-scene">
      <div id="t04-fin-outils" data-layout-allow-overlap></div>
      <div class="t04-fin-fond" id="t04-fin-fond" style="left:60px; top:600px; width:960px; height:700px;"></div>
      <svg class="t04-fin-cadre" id="t04-fin-cadre" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <rect id="t04-fin-rect" x="60" y="600" width="960" height="700" rx="40" fill="none" style="stroke:var(--brand-gris-2)" stroke-width="2"/>
        <rect id="t04-fin-plein" x="60" y="600" width="960" height="700" rx="40" fill="none" style="stroke:var(--brand-accent)" stroke-width="3"/>
      </svg>
      <div class="t04-fin-appel" id="t04-fin-appel"></div>
      <div id="t04-fin-cartes"></div>
      <div class="t04-fin-trait" id="t04-fin-trait"></div>
      <div class="t04-fin-nom" id="t04-fin-nom"></div>
      <div class="t04-fin-bouton" id="t04-fin-bouton"></div>
      <div id="t04-fin-curseur-hote" style="position:absolute; inset:0; z-index:30;"></div>
    </div>
  </div>

  <script>
    (function () {
      // Exemple fictif : la fin d'un logiciel de prise de rendez-vous.
      var EXEMPLE = {   // À REMPLACER : chaque valeur vient de OFFRE.json (ses vraies parties, le vrai bouton de sa page), ou la ligne se retire
        appel: "Tes rendez-vous calés,|sans y penser.",
        // Ses trois parties réelles : [icône du kit, nom, une ligne ou ""].
        cartes: [["calendar", "L'agenda", "partagé"], ["message-circle", "Les réponses", "toutes prêtes"], ["bell", "Les rappels", "automatiques"]],
        nom: "Ton offre", bouton: "Je commence",
        outils: ["logo-whatsapp", "logo-google"]
      };

      window.__timelines = window.__timelines || {};
      var D = 13.9, ID = "t04-fin", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var APPEL = EXEMPLE.appel, CARTES = EXEMPLE.cartes, NOM = EXEMPLE.nom, BOUTON = EXEMPLE.bouton, OUTILS = EXEMPLE.outils;
      var PLACES = [[100, 260, 190, 0], [790, 200, 170, 0], [770, 1380, 210, 0], [180, 1420, 150, 0], [-20, 1600, 220, 0], [500, 140, 110, 0]];
      var CADENCE = 0.22;

      function lire(texte, final) {
        var n = texte.trim().split(/\s+/).filter(function (m) { return /[\p{L}\p{N}_]/u.test(m); }).length;
        var d = n ? Math.max(1.5, 0.3 * n + 0.8) : 0;
        return Math.ceil((final ? Math.max(3, d) : d) * 10 - 1e-9) / 10;
      }

      // Le cadre se trace (le contour court autour de la phrase), puis la phrase s'écrit.
      var cadre = $("cadre"), rect = $("rect"), plein = $("plein"), L = 2 * (960 + 700);
      [rect, plein].forEach(function (r) { r.style.strokeDasharray = L + " " + L; gsap.set(r, { strokeDashoffset: L }); });
      tl.to(rect, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 0.0);
      var lignes = APPEL.split("|").map(function (l) { return [K.el($("appel"), "div"), l.trim().split(" ")]; });
      var mots = [].concat.apply([], lignes.map(function (l) { return l[1].map(function (w) { return [l[0], w]; }); })).map(function (lw, i) {
        var s = K.el(lw[0], "span", null, lw[1]);
        K.cacher(s);
        tl.fromTo(s, { opacity: 0, y: 18, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.3 + i * CADENCE);
        return s;
      });
      // Chaque mot allume un peu plus le cadre : un trait plein de sa couleur en fait le tour par
      // paliers, et son fond (un gris de la marque) monte d'un cran, jusqu'à être plein au dernier mot.
      var fond = $("fond");
      K.cacher(fond);
      mots.forEach(function (m, i) {
        tl.to(plein, { strokeDashoffset: L * (1 - (i + 1) / mots.length), duration: 0.18, ease: "power2.out" }, 0.3 + i * CADENCE);
        tl.to(fond, { opacity: (i + 1) / mots.length, duration: 0.1, ease: "power2.out" }, 0.3 + i * CADENCE);
      });
      var complet = 0.3 + (mots.length - 1) * CADENCE + 0.3, efface = complet + lire(APPEL.replace(/\|/g, " "));
      // Les mots s'effacent dans le désordre (ordre fixe, tiré à graine), une fois la phrase lue.
      var r = K.rng(5), ordre = mots.map(function (m) { return [r(), m]; }).sort(function (a, b) { return a[0] - b[0]; });
      ordre.forEach(function (o, k) { tl.set(o[1], { opacity: 0 }, efface + k * 0.07); });

      // Le cadre se resserre en carte ; la carte se remplit de sa couleur ; deux autres en sortent.
      var t0 = efface + 0.25;
      [rect, plein].forEach(function (e) { tl.to(e, { attr: { x: 180, y: 830, width: 720, height: 240, rx: 26 }, duration: 0.55, ease: "expo.inOut" }, t0); });
      tl.to(cadre, { opacity: 0, duration: 0.15 }, t0 + 0.55);
      gsap.set(fond, { clipPath: "inset(0px 0px 0px 0px round 40px)" });
      tl.to(fond, { clipPath: "inset(230px 120px 230px 120px round 26px)", duration: 0.55, ease: "expo.inOut" }, t0);
      tl.set(fond, { opacity: 0 }, t0 + 0.8);
      var cartes = CARTES.map(function (c) {
        var e = K.el($("cartes"), "div", "t04-fin-carte");
        K.el(e, "div", "contenu", '<span class="ic">' + K.ic(c[0]) + "</span><b>" + c[1] + "</b>" + (c[2] ? "<small>" + c[2] + "</small>" : ""));
        return e;
      });
      var milieu = cartes[Math.floor(cartes.length / 2)], cotes = cartes.filter(function (c) { return c !== milieu; });
      milieu.style.zIndex = "2";
      K.cacher(cartes);
      // Elle se remplit depuis son centre (sa couleur reste pleine : jamais de fondu sur la nuit).
      tl.set(milieu, { opacity: 1 }, t0 + 0.38);
      tl.fromTo(milieu, { clipPath: "inset(48% 48% round 26px)" }, { clipPath: "inset(0% 0% round 26px)", duration: 0.4, ease: "expo.out", immediateRender: false }, t0 + 0.38);
      // Sur sa couleur, le texte paraît d'un coup (un sombre fondu sur son jaune ferait de l'olive).
      K.cacher(milieu.querySelector(".contenu"));
      tl.set(milieu.querySelector(".contenu"), { opacity: 1 }, t0 + 0.6);
      tl.fromTo(milieu.querySelector(".contenu"), { y: 10 }, { y: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, t0 + 0.6);
      // Les deux autres sortent de derrière elle, l'une après l'autre, pendant qu'on lit la première.
      cotes.forEach(function (c, k) {
        tl.set(c, { opacity: 1 }, t0 + 0.75 + k * 0.9);
        tl.fromTo(c, { y: 0, scale: 0.9 }, { y: k ? 300 : -300, scale: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, t0 + 0.75 + k * 0.9);
        K.cacher(c.querySelector(".contenu"));
        tl.set(c.querySelector(".contenu"), { opacity: 1 }, t0 + 0.95 + k * 0.9);
      });
      // Les cartes se lisent dès que la première est là (les deux autres arrivent pendant ce temps) ;
      // chacune s'allume à son tour : son icône bat, toutes les 0,8 s (le texte qu'on lit reste immobile).
      var lues = t0 + 0.8, joint = lues + 0.5 + lire(CARTES.map(function (c) { return c[1] + " " + c[2]; }).join(" "));
      var tour = [milieu].concat(cotes);
      for (var b = lues + 0.6, k = 0; b < joint - 0.4; b += 0.8, k++) {
        var c = tour[k % tour.length];
        tl.fromTo(c.querySelector(".ic"), { scale: 1 }, { scale: 1.3, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, b);
      }
      // Les trois cartes se rejoignent en une barre, qui s'aplatit en un trait de sa couleur.
      cotes.forEach(function (c, k) { tl.to(c, { y: k ? 240 : -240, duration: 0.4, ease: "power3.inOut" }, joint); });
      tl.set(cartes.map(function (c) { return c.querySelector(".contenu"); }), { opacity: 0 }, joint);
      tl.to(cartes, { borderRadius: 0, duration: 0.3 }, joint + 0.15);
      tl.to(milieu, { clipPath: "inset(0% 0% round 0px)", duration: 0.3 }, joint + 0.15);
      tl.to(cartes, { scaleY: 0.012, y: 30, duration: 0.45, ease: "expo.in" }, joint + 0.3);
      tl.set(cartes, { opacity: 0 }, joint + 0.75);
      var trait = $("trait"), tn = joint + 0.73;
      gsap.set(trait, { scaleX: 0.75, opacity: 0 });
      tl.set(trait, { opacity: 1 }, tn);
      tl.to(trait, { scaleX: 1, duration: 0.5, ease: "expo.out" }, tn);

      // Le nom au-dessus du trait, le bouton dessous ; le curseur le clique ; ils se tiennent.
      var nom = $("nom"), bouton = $("bouton");
      nom.textContent = NOM; bouton.textContent = BOUTON;
      K.cacher([nom, bouton]);
      tl.fromTo(nom, { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, tn + 0.02);
      tl.set(bouton, { opacity: 1 }, tn + 0.27);
      tl.fromTo(bouton, { y: 18, scale: 0.8 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(1)", immediateRender: false }, tn + 0.27);
      var curseur = K.curseur($("curseur-hote"), ID + "-curseur", true);
      K.cacher(curseur);
      tl.to(curseur, { opacity: 1, duration: 0.2 }, tn + 0.62);
      K.trajet(tl, curseur, [[0, 900, 1560], [tn + 0.62, 600, 1086, 0.55, "power3.out"]]);
      K.clic(tl, curseur, tn + 1.22);
      tl.fromTo(bouton, { scale: 1 }, { scale: 0.96, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, tn + 1.22);
      tl.to(curseur, { x: 780, y: 1290, duration: 0.6, ease: "power2.inOut" }, tn + 1.57);
      var FIN = Math.ceil((tn + 0.77 + lire(NOM + " " + BOUTON, true)) * 10 - 1e-6) / 10;
      tl.to(trait, { scaleX: 0.92, duration: Math.max(0.5, FIN - tn - 0.5), ease: "sine.inOut" }, tn + 0.5);

      // Les vrais logos de ses outils, nus, autour du cadre : ils arrivent un à un pendant qu'on lit
      // l'appel, puis dérivent jusqu'à la fin.
      PLACES.forEach(function (p, k) {
        var nomLogo = OUTILS.length ? OUTILS[k % OUTILS.length] : "", svg = nomLogo ? K.ic(nomLogo) : "";
        if (!svg) return;
        var e = K.el($("outils"), "div", "t04-fin-outil", svg, "left:" + p[0] + "px; top:" + p[1] + "px; width:" + p[2] + "px; height:" + p[2] + "px; filter:blur(" + p[3] + "px);");
        var arrive = complet + 0.3 + k * (efface - complet - 0.5) / Math.max(1, PLACES.length - 1);
        gsap.set(e, { scale: 0 });
        tl.to(e, { scale: 1, duration: 0.4, ease: "back.out(1)" }, arrive);
        var ampl = p[2] >= 200 ? 60 : 34;
        tl.fromTo(e, { x: 0, y: 0, rotation: 0 }, { x: (k % 2 ? -1 : 1) * ampl * 0.6, y: (k % 2 ? 1 : -1) * ampl, rotation: (k % 2 ? 9 : -9), duration: Math.max(0.5, FIN - arrive - 0.4), ease: "sine.inOut", immediateRender: false }, arrive + 0.4);
      });
      if (Math.abs(FIN - D) > 0.05) console.warn(ID + " dure " + FIN + " s : mets D et data-duration (ici et dans index.html) à " + FIN);
      tl.set({}, {}, D);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
