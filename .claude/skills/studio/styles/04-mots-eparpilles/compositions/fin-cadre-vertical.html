<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°4 · MOTS ÉPARPILLÉS · SCÈNE « FIN EN CADRE », VERSION VERTICALE 9:16 (1080 × 1920),
    6,5 s (la même scène que fin-cadre.html, remise en page pour un Reel, une story, un TikTok)

    Ce qu'elle montre : sur sa nuit, un cadre au trait fin de 960 × 700 px se trace ; la phrase
    d'appel s'écrit dedans un mot à la fois, sur deux lignes, en léger, et chaque mot allume un peu
    plus le cadre (son trait plein de sa couleur fait le tour par paliers, son fond s'éclaircit d'un
    gris) ; les mots s'effacent dans le désordre, le cadre se resserre en une carte qui se remplit
    de sa couleur ; deux autres cartes en sortent, l'une au-dessus, l'autre au-dessous : les trois
    parties de l'offre (icône, nom, une ligne), empilées ; elles se rejoignent en une colonne, la
    colonne s'aplatit en un trait de sa couleur ; au-dessus du trait, le nom ; dessous, le bouton,
    que le curseur clique. Tenu 2,1 s.

    À remplacer :
      1. L'identifiant « t04-fin » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. APPEL : la phrase d'appel, courte et complète (4 à 7 mots, un mot à la fois), sur deux
         lignes centrées dans le cadre (trois au plus) : « | » marque le retour à la ligne.
      3. CARTES : les trois parties RÉELLES de l'offre [icône du kit, nom, une ligne] (modules,
         accompagnement, bonus ; ou trois fonctions d'un logiciel), empilées de haut en bas. En
         9:16, garde trois cartes (la pile tient entre 530 et 1 370 px de haut).
      4. Le nom (#t04-fin-nom ; un logo se pose en <img src="brand/logo.svg"> à sa place) et le
         bouton (#t04-fin-bouton : le vrai libellé du bouton de sa page, 1 à 3 mots). Une pub ne
         dessine pas de bouton : « Découvre-le » et une flèche vers le bas, sans curseur.
    Couleurs : celles de sa marque, rien d'autre : la nuit est var(--brand-sombre), le texte posé
    dessus var(--brand-clair) ; le cadre, un blanc en transparence puis sa couleur pleine et fine,
    son fond un blanc en transparence (un gris, jamais une lueur de sa couleur) ;
    les cartes, le trait et le bouton sont sa couleur pleine, sans dégradé ni lueur, leur texte en
    var(--brand-contrast).
  -->
</head>
<body>
<template>
  <style>
    #t04-fin {
      --t04-nuit: var(--brand-sombre);
      --t04-texte: var(--brand-clair);
      background: var(--t04-nuit);
    }
    #t04-fin .t04-fin-fond { position: absolute; border-radius: 40px; background: #ffffff; }
    #t04-fin .t04-fin-cadre { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    /* La phrase d'appel passe sur deux lignes, centrées dans le cadre (en hauteur aussi). */
    #t04-fin .t04-fin-appel {
      position: absolute; left: 110px; right: 110px; top: 600px; height: 700px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      font-family: var(--brand-font-body); font-weight: 400; font-size: 64px; line-height: 1.22; letter-spacing: -0.02em; color: var(--t04-texte);
    }
    #t04-fin .t04-fin-appel div { white-space: nowrap; }
    #t04-fin .t04-fin-appel span { display: inline-block; margin: 0 0.13em; }
    #t04-fin .t04-fin-carte {
      position: absolute; left: 540px; top: 950px; width: 720px; height: 240px; margin: -120px 0 0 -360px; border-radius: 26px; overflow: hidden;
      background: var(--brand-accent); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      font-family: "Inter", var(--brand-font-body); text-align: center;
    }
    #t04-fin .t04-fin-carte .contenu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 22px;
      color: var(--brand-contrast); }
    #t04-fin .t04-fin-carte .ic { width: 48px; height: 48px; margin-bottom: 6px; }
    #t04-fin .t04-fin-carte .ic svg { width: 100%; height: 100%; }
    #t04-fin .t04-fin-carte b { font-weight: 700; font-size: 36px; letter-spacing: -0.01em; }
    #t04-fin .t04-fin-carte small { font-size: 25px; font-weight: 500; }
    #t04-fin .t04-fin-trait { position: absolute; left: 110px; top: 980px; width: 860px; height: 3px; border-radius: 2px; background: var(--brand-accent); }
    #t04-fin .t04-fin-nom {
      position: absolute; left: 0; right: 0; top: 862px; text-align: center; white-space: nowrap;
      font-family: var(--brand-font-display); font-weight: 400; font-size: 88px; letter-spacing: -0.03em; line-height: 1; color: var(--t04-texte);
    }
    #t04-fin .t04-fin-bouton {
      position: absolute; left: 540px; top: 1030px; height: 104px; padding: 0 56px; transform: translateX(-50%); border-radius: 999px; white-space: nowrap;
      display: flex; align-items: center; background: var(--brand-accent); color: var(--brand-contrast);
      font-family: var(--brand-font-display); font-weight: 600; font-size: 44px; letter-spacing: -0.01em;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
  </style>

  <div data-composition-id="t04-fin" data-width="1080" data-height="1920" data-duration="6.5" style="position:absolute; inset:0;">
    <div id="t04-fin" class="k-scene">
      <div class="t04-fin-fond" id="t04-fin-fond" style="left:60px; top:600px; width:960px; height:700px;"></div>
      <svg class="t04-fin-cadre" id="t04-fin-cadre" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <rect id="t04-fin-rect" x="60" y="600" width="960" height="700" rx="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
        <rect id="t04-fin-plein" x="60" y="600" width="960" height="700" rx="40" fill="none" style="stroke:var(--brand-accent)" stroke-width="3"/>
      </svg>
      <div class="t04-fin-appel" id="t04-fin-appel"></div>
      <div id="t04-fin-cartes"></div>
      <div class="t04-fin-trait" id="t04-fin-trait"></div>
      <div class="t04-fin-nom" id="t04-fin-nom">Ta marque</div>
      <div class="t04-fin-bouton" id="t04-fin-bouton">Je découvre</div>
      <div id="t04-fin-curseur-hote" style="position:absolute; inset:0; z-index:30;"></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 6.5, ID = "t04-fin", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var APPEL = "Lance ton offre,|sans t'épuiser.";
      var CARTES = [["book-open", "La méthode", "pas à pas, en vidéo"], ["users", "Le groupe", "pour avancer à plusieurs"], ["gift", "Les bonus", "modèles prêts à l'emploi"]];

      // Le cadre se trace (le contour court autour de la phrase), puis la phrase s'écrit.
      var cadre = $("cadre"), rect = $("rect"), plein = $("plein"), L = 2 * (960 + 700);
      [rect, plein].forEach(function (r) { r.style.strokeDasharray = L + " " + L; gsap.set(r, { strokeDashoffset: L }); });
      tl.to(rect, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 0.0);
      var lignes = APPEL.split("|").map(function (l) { return [K.el($("appel"), "div"), l.trim().split(" ")]; });
      var mots = [].concat.apply([], lignes.map(function (l) { return l[1].map(function (w) { return [l[0], w]; }); })).map(function (lw, i) {
        var s = K.el(lw[0], "span", null, lw[1]);
        K.cacher(s);
        tl.fromTo(s, { opacity: 0, y: 18, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.3 + i * 0.22);
        return s;
      });
      // Chaque mot allume un peu plus le cadre : un trait plein de sa couleur en fait le tour par
      // paliers, et son fond s'éclaircit d'un cran (un blanc en transparence : un gris sur sa nuit).
      var fond = $("fond");
      K.cacher(fond);
      mots.forEach(function (m, i) {
        tl.to(plein, { strokeDashoffset: L * (1 - (i + 1) / mots.length), duration: 0.18, ease: "power2.out" }, 0.3 + i * 0.22);
        tl.to(fond, { opacity: 0.045 * (i + 1), duration: 0.1, ease: "power2.out" }, 0.3 + i * 0.22);
      });
      // Les mots s'effacent dans le désordre (ordre fixe, tiré à graine).
      var r = K.rng(5), ordre = mots.map(function (m) { return [r(), m]; }).sort(function (a, b) { return a[0] - b[0]; });
      ordre.forEach(function (o, k) { tl.set(o[1], { opacity: 0 }, 1.75 + k * 0.07); });

      // Le cadre se resserre en carte ; la carte se remplit de sa couleur ; deux autres en sortent, au-dessus et au-dessous.
      [rect, plein].forEach(function (e) { tl.to(e, { attr: { x: 180, y: 830, width: 720, height: 240, rx: 26 }, duration: 0.55, ease: "expo.inOut" }, 2.0); });
      tl.to(cadre, { opacity: 0, duration: 0.15 }, 2.55);
      gsap.set(fond, { clipPath: "inset(0px 0px 0px 0px round 40px)" });
      tl.to(fond, { clipPath: "inset(230px 120px 230px 120px round 26px)", duration: 0.55, ease: "expo.inOut" }, 2.0);
      tl.set(fond, { opacity: 0 }, 2.8);
      var cartes = CARTES.map(function (c) {
        var e = K.el($("cartes"), "div", "t04-fin-carte");
        K.el(e, "div", "contenu", '<span class="ic">' + K.ic(c[0]) + "</span><b>" + c[1] + "</b><small>" + c[2] + "</small>");
        return e;
      });
      var milieu = cartes[Math.floor(cartes.length / 2)], cotes = cartes.filter(function (c) { return c !== milieu; });
      milieu.style.zIndex = "2";
      K.cacher(cartes);
      // Elle se remplit depuis son centre (sa couleur reste pleine : jamais de fondu sur la nuit).
      tl.set(milieu, { opacity: 1 }, 2.38);
      tl.fromTo(milieu, { clipPath: "inset(48% 48% round 26px)" }, { clipPath: "inset(0% 0% round 26px)", duration: 0.4, ease: "expo.out", immediateRender: false }, 2.38);
      tl.fromTo(milieu.querySelector(".contenu"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 2.6);
      // Les deux autres sortent de derrière elle.
      cotes.forEach(function (c, k) {
        tl.set(c, { opacity: 1 }, 2.75);
        tl.fromTo(c, { y: 0, scale: 0.9 }, { y: k ? 300 : -300, scale: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, 2.75 + k * 0.06);
        tl.fromTo(c.querySelector(".contenu"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.95 + k * 0.06);
      });
      // Les trois cartes se rejoignent en une colonne, qui s'aplatit en un trait de sa couleur (à 980 px).
      cotes.forEach(function (c, k) { tl.to(c, { y: k ? 240 : -240, duration: 0.4, ease: "power3.inOut" }, 3.55); });
      tl.to(cartes.map(function (c) { return c.querySelector(".contenu"); }), { opacity: 0, duration: 0.2 }, 3.55);
      tl.to(cartes, { borderRadius: 0, duration: 0.3 }, 3.7);
      tl.to(milieu, { clipPath: "inset(0% 0% round 0px)", duration: 0.3 }, 3.7);
      tl.to(cartes, { scaleY: 0.012, y: 30, duration: 0.45, ease: "expo.in" }, 3.85);
      tl.set(cartes, { opacity: 0 }, 4.3);
      var trait = $("trait");
      gsap.set(trait, { scaleX: 0.75, opacity: 0 });
      tl.set(trait, { opacity: 1 }, 4.28);
      tl.to(trait, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 4.28);
      tl.to(trait, { scaleX: 0.92, duration: D - 4.8, ease: "sine.inOut" }, 4.8);

      // Le nom au-dessus du trait, le bouton dessous ; le curseur le clique.
      var nom = $("nom"), bouton = $("bouton");
      K.cacher([nom, bouton]);
      tl.fromTo(nom, { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 4.3);
      tl.fromTo(bouton, { opacity: 0, y: 18, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 4.55);
      var curseur = K.curseur($("curseur-hote"), ID + "-curseur", true);
      K.cacher(curseur);
      tl.to(curseur, { opacity: 1, duration: 0.2 }, 4.9);
      K.trajet(tl, curseur, [[0, 900, 1560], [4.9, 600, 1086, 0.55, "power3.out"]]);
      K.clic(tl, curseur, 5.5);
      tl.fromTo(bouton, { scale: 1 }, { scale: 0.96, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 5.5);
      tl.to(curseur, { x: 780, y: 1290, duration: 0.6, ease: "power2.inOut" }, 5.85);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
