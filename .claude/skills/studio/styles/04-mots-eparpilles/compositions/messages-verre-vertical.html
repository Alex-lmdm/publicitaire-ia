<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°4 · MOTS ÉPARPILLÉS · SCÈNE « LES MESSAGES », VERSION VERTICALE 9:16 (1080 × 1920)
    (la même scène que messages-verre.html, remise en page pour un Reel, une story, un TikTok : la
    conversation remplit l'écran comme sur un téléphone, colonne de 968 px, bulles de 44 px, le fil
    part du milieu et remonte ; les logos dans les bandes du haut et du bas)

    Ce qu'elle montre : plein cadre, sa couleur pleine (la même qu'à la fin de orbe-pivot.html) ;
    une vraie conversation arrive en bulles pleines (celles de l'offre dans sa nuit, avec son logo
    pour avatar et une étiquette, celles du client en clair ; un lien collé y montre l'aperçu de sa
    vraie page, qui défile section par section tant qu'il est à l'écran) : trois points qui sautent annoncent
    chaque réponse de l'offre, puis la bulle se pose et ses mots s'allument un à un, au rythme où on
    les lit (les mots à venir sont déjà là, dans un gris lisible) ; une réponse peut proposer des choix (des cartes numérotées), que
    la réponse du client sélectionne ; la carte du résultat arrive sous la dernière réponse, ses
    vraies vignettes se cochent une à une pendant que sa barre se remplit ; autour, dans les marges,
    les vrais logos nus des outils où l'offre travaille arrivent un à un et dérivent ; à la fin, sa
    couleur se referme en disque sur sa nuit (raccord avec fin-cadre-vertical.html, qui commence sur la nuit).

    Les durées suivent la lecture : chaque bulle (avec ses choix) reste le temps de la lire (0,3 s
    par mot + 0,8 s, jamais moins de 1,5 s : `studio_motion.py lecture`) avant que la suivante
    n'arrive ; la dernière, avec la carte du résultat. La scène calcule ses instants : sa durée est
    FIN, que la console affiche (« t04-msg dure … s ») ; reporte-la dans D et dans data-duration,
    ici et sur son hôte dans index.html. La caméra ne recadre jamais pendant qu'une bulle se lit :
    une poussée lente (×1,03 sur toute la scène, sine.inOut) ; le fil ne remonte qu'à l'arrivée
    d'une nouvelle bulle, entre deux lectures.

    À remplacer : l'objet EXEMPLE (en tête du script).
      1. L'identifiant « t04-msg » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. messages : [qui, texte, options]. qui = "offre" (à gauche, avec son logo et l'ÉTIQUETTE) ou
         "client" (à droite). UNIQUEMENT un vrai échange : une vraie conversation avec son produit
         (son assistant, son outil, telle qu'une capture ou sa vidéo la montre), de vrais messages
         de clients (captures de témoignages), ou une vraie question de sa FAQ et sa vraie
         réponse. 2 à 4 bulles, 8 mots au plus chacune (ses choix compris), deux lignes au plus
         (33 signes par ligne).
         options (facultatif) : { lien: "sa-page.fr/…" } (le lien collé au-dessus du texte, dans une
         bulle du client), avec apercu: "assets/images/…" (sa vraie page, une longue capture de haut
         en bas : l'aperçu du lien, qui défile par paliers pendant que l'offre la lit) ; { choix: ["…", "…", "…"] } (deux ou trois cartes numérotées sous une
         bulle de l'offre, ses vrais choix) ; { prend: 2 } (la bulle du client qui sélectionne la
         carte n° 2 des derniers choix).
      3. etiquette : le nom de son produit ou de lui-même (« Ton coach », le nom de l'outil).
      4. logo : son logo pour l'avatar (le fichier de brand/ : "brand/logo.png" ou "brand/logo.svg") ;
         "" sans logo : l'initiale de l'ÉTIQUETTE s'affiche. Un logo sombre se pose sur un disque
         clair : passe .t04-msg-avatar en var(--brand-clair).
      5. CADENCE (hors d'EXEMPLE) : l'écart entre deux mots qui s'allument : le rythme de la lecture
         (0,3 s), sur la voix s'il y en a. La bulle se pose entière (ses mots à venir en gris) et ses mots s'allument au
         rythme où on les lit, puis ses choix ; la bulle suivante n'arrive qu'après sa lecture.
      6. resultat : ce que son produit rend vraiment { icone, titre, vignettes } (icône du kit, titre
         court, ses vraies captures en vignettes : les scènes d'une vidéo, les pages d'un plan…) ;
         null pour ne pas montrer de carte.
      7. outils : les vrais logos nus et nets (sans flou ni ombre sur sa couleur) des outils où l'offre travaille (ceux qu'elle nomme, posés par
         `studio_motion.py logos`), répartis sur les places des bandes du haut et du bas (PLACES :
         [x, y, taille, flou], hors du fil) ; [] sans logos. Un logo absent du projet ne s'affiche pas.
    Couleurs : celles de sa marque, rien d'autre : le fond est sa couleur pleine (un aplat, sans
    dégradé ni tourbillon) ; les bulles de l'offre, ses cartes et la carte du résultat sont dans sa
    nuit (var(--brand-sombre), texte var(--brand-clair)), celles du client claires (l'inverse) ;
    l'étiquette posée sur sa couleur est en var(--brand-contrast) ; la nuit de la fin est
    var(--brand-sombre). Les logos et les vignettes gardent leurs vraies couleurs.
  -->
</head>

<template>

  <div data-composition-id="t04-msg" data-width="1080" data-height="1920" data-duration="14.6" style="position:absolute; inset:0;">
    <div id="t04-msg" class="k-scene">
      <div class="t04-msg-monde" id="t04-msg-monde">
        <div id="t04-msg-outils" data-layout-allow-overlap></div>
        <div class="t04-msg-camera" id="t04-msg-camera" data-layout-allow-overflow>
          <div class="t04-msg-fil" id="t04-msg-fil"></div>
        </div>
      </div>
    </div>

  <script>
    (function () {
      // Exemple fictif : l'assistant d'un logiciel de prise de rendez-vous.
      var EXEMPLE = {   // À REMPLACER : chaque valeur vient de OFFRE.json et d'un vrai échange, ou la ligne se retire
        etiquette: "Ton assistant", logo: "brand/logo.png",
        // [qui, texte, options] : un vrai échange (son assistant, ses vrais messages, une question de sa FAQ).
        messages: [
          ["client", "Réponds à mes messages en attente.", { lien: "ton-site.fr/contact", apercu: "assets/images/capture-page.jpg" }],
          ["offre", "Trois réponses :", { choix: ["Un créneau", "Le tarif", "Une relance"] }],
          ["client", "La 1.", { prend: 1 }],
          ["offre", "Ton agenda est à jour."]
        ],
        // Ce que le produit rend vraiment : ses vraies captures en vignettes (« 4 » n'est qu'un exemple).
        resultat: { icone: "calendar", titre: "4 rendez-vous calés",
          vignettes: ["assets/images/rdv-1.jpg", "assets/images/rdv-2.jpg", "assets/images/rdv-3.jpg", "assets/images/rdv-4.jpg"] },
        outils: ["logo-whatsapp", "logo-google"]
      };

      window.__timelines = window.__timelines || {};
      var D = 14.6, ID = "t04-msg", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var ETIQUETTE = EXEMPLE.etiquette, LOGO = EXEMPLE.logo, CADENCE = 0.3;
      var MESSAGES = EXEMPLE.messages, RESULTAT = EXEMPLE.resultat, OUTILS = EXEMPLE.outils;
      var PLACES = [[800, 80, 170, 0], [90, 60, 190, 0], [200, 1600, 150, 0], [780, 1580, 210, 0], [430, 30, 110, 0], [-70, 1740, 240, 0], [620, 1800, 100, 0], [470, 1690, 120, 0]];
      // La mise en page du fil : le premier élément se pose vers Y0, le fil remonte quand le dernier
      // descendrait sous BAS ; 33 signes par ligne de bulle (44 px dans 800 px).
      var Y0 = 1000, BAS = 1480, ECART = 36, SIGNES = 33, LIGNE = 55.4, DEBUT = 0.45;

      function lire(texte) {
        var n = texte.trim().split(/\s+/).filter(function (m) { return /[\p{L}\p{N}_]/u.test(m); }).length;
        return n ? Math.ceil(Math.max(1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10 : 0;
      }
      var avatar = function (parent) {
        var a = K.el(parent, "div", "t04-msg-avatar");
        if (LOGO) { var img = K.el(a, "img"); img.alt = ""; img.src = LOGO; }
        else K.el(a, "b", null, ETIQUETTE.charAt(0));
        return a;
      };

      // ---------- Les bulles : chacune se pose quand la précédente a été lue ----------
      var fil = $("fil"), y = 0, t = DEBUT, arrivees = [], derniersChoix = null, finLecture = DEBUT, dernierLu = DEBUT, evts = [], apercus = [];
      MESSAGES.forEach(function (m) {
        var qui = m[0], texte = m[1], o = m[2] || {};
        var haut = 52 + Math.ceil(texte.length / SIGNES) * LIGNE + (o.lien ? 50 : 0);
        var top = y + (qui === "offre" ? 50 : 0), bas = top + haut;
        var ligne = K.el(fil, "div", "t04-msg-ligne t04-msg-" + qui, null, "top:" + top + "px;");
        var pose = qui === "offre" ? t + 0.38 : t;
        if (qui === "offre") {
          var a = avatar(ligne);
          K.el(ligne, "div", "t04-msg-etiquette", ETIQUETTE);
          // Les trois points qui sautent, juste avant la réponse ; l'avatar bat quand il « parle ».
          var pts = K.el(ligne, "div", "t04-msg-points", "<i></i><i></i><i></i>");
          // Sur sa couleur, rien n'entre en fondu (un sombre à demi transparent sur son jaune fait de
          // l'olive) : tout paraît d'un coup, à pleine opacité, et grandit.
          K.cacher(pts);
          tl.set(pts, { opacity: 1 }, t);
          tl.fromTo(pts, { scale: 0.6 }, { scale: 1, duration: 0.2, ease: "back.out(2)", transformOrigin: "0% 50%", immediateRender: false }, t);
          tl.fromTo(pts.children, { y: 0 }, { y: -9, duration: 0.12, ease: "power1.out", yoyo: true, repeat: 1, stagger: 0.08 }, t + 0.08);
          tl.set(pts, { opacity: 0 }, pose);
          tl.fromTo(a, { scale: 1 }, { scale: 1.2, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, pose);
        }
        var bulle = K.el(ligne, "div", "t04-msg-bulle");
        if (o.lien) K.el(bulle, "div", "t04-msg-lien", o.lien);
        if (o.lien && o.apercu) {   // l'aperçu du lien : sa vraie page, qui défilera par paliers
          var ap = K.el(bulle, "div", "t04-msg-apercu", '<img src="' + o.apercu + '" alt="">');
          ap.firstChild.addEventListener("error", function () { ap.style.display = "none"; });   // capture absente : pas d'aperçu
          apercus.push([ap.firstChild, pose]);
          haut += 20 + 360; bas = top + haut;
        }
        var mots = texte.split(" ").map(function (w, k, tous) {
          var s = K.el(bulle, "span", null, w);
          s.setAttribute("data-lu", "0");
          if (k < tous.length - 1) bulle.appendChild(document.createTextNode(" "));
          return s;
        });
        K.cacher(ligne);
        tl.set(ligne, { opacity: 1 }, pose);
        tl.fromTo(ligne, { y: 26, scale: 0.94 },
          { y: 0, scale: 1, duration: 0.45, ease: "expo.out", transformOrigin: qui === "offre" ? "0% 50%" : "100% 50%", immediateRender: false }, pose);
        // Ses mots s'allument au rythme de la lecture ; la lecture compte depuis que la bulle est posée.
        var lit = pose + 0.3, aLire = (o.lien ? o.lien + " " : "") + texte;
        mots.forEach(function (s, k) { tl.set(s, { attr: { "data-lu": "1" } }, lit + k * CADENCE); });
        var lu = lit + mots.length * CADENCE;
        if (o.choix) {   // ses vrais choix, en cartes numérotées sous la bulle
          var rangee = K.el(ligne, "div", "t04-msg-choix", null, "top:" + (haut + 16) + "px;");
          derniersChoix = o.choix.map(function (c, k) { return K.el(rangee, "div", "t04-msg-idee", "<i>" + (k + 1) + "</i><span>" + c + "</span>"); });
          derniersChoix.forEach(function (c) { c.setAttribute("data-pris", "0"); });
          K.cacher(derniersChoix, { y: 24 });
          derniersChoix.forEach(function (c, k) {
            tl.set(c, { opacity: 1 }, lu + k * 0.1);
            tl.to(c, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, lu + k * 0.1);
          });
          // Leurs titres s'allument à leur tour, au même rythme.
          var titres = derniersChoix.map(function (c) { return c.querySelector("span"); });
          titres.forEach(function (s, k) {
            s.setAttribute("data-lu", "0");
            tl.set(s, { attr: { "data-lu": "1" } }, lu + 0.3 + (k ? o.choix.slice(0, k).join(" ").split(" ").length : 0) * CADENCE);
          });
          lu += 0.3 + o.choix.join(" ").split(" ").length * CADENCE;
          bas += 16 + 120;
          aLire += " " + o.choix.join(" ");
        }
        if (o.prend && derniersChoix && derniersChoix[o.prend - 1]) {   // la carte choisie s'allume
          var choisie = derniersChoix[o.prend - 1];
          tl.set(choisie, { attr: { "data-pris": "1" } }, pose + 0.1);
          tl.fromTo(choisie, { scale: 1 }, { scale: 1.05, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, pose + 0.1);
        }
        arrivees.push([pose, bas]);
        evts.push(pose, lu);
        y = bas + ECART;
        finLecture = Math.max(lit + lire(aLire), lu + 0.6);
        dernierLu = lit;
        t = finLecture;
      });

      // ---------- La carte du résultat, sous la dernière réponse, pendant qu'on la lit ----------
      var FERME = finLecture;
      if (RESULTAT) {
        var vu = dernierLu + 0.3, top = y;
        var rl = K.el(fil, "div", "t04-msg-ligne", null, "top:" + top + "px;");
        var carte = K.el(rl, "div", "t04-msg-resultat", '<div class="tete"><span class="ic">' + K.ic(RESULTAT.icone) + "</span><b>" + RESULTAT.titre +
          '</b></div><div class="vignettes"></div><div class="barre"><i></i></div><span class="t04-msg-coche">' + K.ic("check") + "</span>");
        var vignettes = (RESULTAT.vignettes || []).map(function (src) {
          var v = K.el(carte.querySelector(".vignettes"), "div", null, '<img src="' + src + '" alt=""><em>' + K.ic("check") + "</em>");
          v.firstChild.addEventListener("error", function () { v.style.display = "none"; });   // capture absente : pas de vignette
          return v;
        });
        K.cacher(rl);
        tl.set(rl, { opacity: 1 }, vu);
        tl.fromTo(rl, { y: 40, scale: 0.92 }, { y: 0, scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "0% 50%", immediateRender: false }, vu);
        // Ses vignettes arrivent puis se cochent une à une, la barre suit, sur toute la lecture de la
        // dernière bulle ; à la fin, la carte se coche, juste avant que sa couleur se referme.
        var n = Math.max(1, vignettes.length), lecture = dernierLu + lire(MESSAGES[MESSAGES.length - 1][1] + " " + RESULTAT.titre);
        var pas = Math.max(0.3, (lecture - 1.0 - vu) / n);
        vignettes.forEach(function (v, k) {
          gsap.set(v, { scale: 0 });
          tl.to(v, { scale: 1, duration: 0.3, ease: "back.out(2)" }, vu + 0.35 + k * pas);
          var em = v.querySelector("em");
          gsap.set(em, { scale: 0 });
          tl.to(em, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, vu + 0.55 + k * pas);
        });
        tl.fromTo(carte.querySelector(".barre i"), { scaleX: 0 }, { scaleX: 1, duration: 0.35 + n * pas, ease: "power1.inOut" }, vu + 0.3);
        var coche = carte.querySelector(".t04-msg-coche");
        gsap.set(coche, { scale: 0 });
        tl.to(coche, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, vu + 0.7 + n * pas);
        arrivees.push([vu, top + 52 + 72 + (vignettes.length ? 102 : 0) + 28 + 4]);
        for (var k = 0; k <= n; k++) evts.push(vu + 0.35 + k * pas);
        FERME = Math.max(lecture, vu + 1.3 + n * pas);
      }

      // ---------- L'aperçu de sa page défile section par section, tant qu'il est à l'écran ----------
      apercus.forEach(function (a) {
        var debut = a[1] + 0.9, finA = arrivees[arrivees.length - 1][0] - 0.2, pasA = 0.9;
        var n = Math.max(1, Math.floor((finA - debut) / pasA) + 1);
        for (var k = 1; k <= n; k++) {
          tl.to(a[0], { objectPosition: "50% " + Math.round(100 * k / n) + "%", duration: 0.45, ease: "expo.inOut" }, debut + (k - 1) * pasA);
          evts.push(debut + (k - 1) * pasA);
        }
      });

      // ---------- Le fil remonte à l'arrivée d'une bulle (entre deux lectures), jamais pendant ----------
      var depart = Y0 - arrivees[0][1], courant = depart;
      gsap.set(fil, { y: depart });
      arrivees.forEach(function (a, i) {
        var cible = Math.min(courant, BAS - a[1]);
        if (i > 0 && cible < courant - 1) tl.to(fil, { y: cible, duration: 0.5, ease: "expo.out" }, a[0] - 0.05);
        courant = cible;
      });
      var FIN = Math.ceil((FERME + 0.62) * 10 - 1e-6) / 10;
      // La seule caméra : une poussée lente sur toute la scène.
      tl.fromTo($("camera"), { scale: 1 }, { scale: 1.03, duration: FIN, ease: "sine.inOut", transformOrigin: "50% 60%" }, 0);

      // ---------- Les vrais logos de ses outils, nus, dans les marges : ils arrivent un à un, dérivent ----------
      // Chacun arrive au milieu du plus long moment calme qui reste (pendant qu'une bulle se lit).
      evts.push(0.3, FERME);
      var calmes = function () {
        var s = evts.slice().sort(function (a, b) { return a - b; }), best = [0, 0.6];
        for (var i = 1; i < s.length; i++) if (s[i] - s[i - 1] > best[0]) best = [s[i] - s[i - 1], (s[i] + s[i - 1]) / 2];
        return best[1];
      };
      PLACES.forEach(function (p, k) {
        var nom = OUTILS.length ? OUTILS[k % OUTILS.length] : "", svg = nom ? K.ic(nom) : "";
        if (!svg) return;
        var e = K.el($("outils"), "div", "t04-msg-outil", svg, "left:" + p[0] + "px; top:" + p[1] + "px; width:" + p[2] + "px; height:" + p[2] + "px; filter:blur(" + p[3] + "px);");
        var arrive = calmes();
        evts.push(arrive);
        gsap.set(e, { scale: 0 });
        tl.to(e, { scale: 1, duration: 0.4, ease: "back.out(2)" }, arrive);
        // Il dérive ensuite, plus ample au premier plan (les grands flous), jusqu'à la fin.
        var ampl = p[2] >= 200 ? 60 : 34;
        tl.fromTo(e, { x: 0, y: 0, rotation: 0 }, { x: (k % 2 ? -1 : 1) * ampl * 0.6, y: (k % 2 ? 1 : -1) * ampl, rotation: (k % 2 ? 9 : -9), duration: Math.max(0.5, FIN - arrive - 0.4), ease: "sine.inOut", immediateRender: false }, arrive + 0.4);
      });

      // La fin : sa couleur se referme en disque sur sa nuit (pas de fondu : un jaune fondu dans le
      // noir passerait par l'olive). Raccord avec la scène suivante, qui commence sur la nuit.
      var monde = $("monde"), cercle = function (r) { return "circle(" + r + "px at 540px 960px)"; };
      gsap.set(monde, { clipPath: cercle(1250) });
      tl.to(monde, { clipPath: cercle(0), duration: 0.6, ease: "power3.in" }, FIN - 0.62);
      if (Math.abs(FIN - D) > 0.05) console.warn(ID + " dure " + FIN + " s : mets D et data-duration (ici et dans index.html) à " + FIN);
      tl.set({}, {}, D);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
