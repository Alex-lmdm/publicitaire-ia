<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°4 · MOTS ÉPARPILLÉS · SCÈNE « LES MESSAGES » (l'après : la solution en action),
    6,0 s, 16:9

    Ce qu'elle montre : plein cadre, sa couleur pleine (la même qu'à la fin de orbe-pivot.html) ;
    une conversation arrive en bulles pleines (celles de l'offre dans sa nuit, celles du client en
    clair) : trois points qui sautent annoncent chaque réponse
    de l'offre, puis la bulle se pose et ses mots s'allument un à un (les mots à venir sont déjà
    là, pâles) ; les bulles de l'offre ont son logo pour avatar et une étiquette ; le fil remonte
    et la caméra recadre à chaque bulle ; une carte de résultat arrive en dernier, sa barre se
    remplit et se coche ; à la fin, sa couleur se referme en disque sur sa nuit (raccord avec
    fin-cadre.html, qui commence sur la nuit).

    À remplacer :
      1. L'identifiant « t04-msg » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. MESSAGES : [qui, texte, instant]. qui = "offre" (à gauche, avec son logo et l'ÉTIQUETTE) ou
         "client" (à droite). UNIQUEMENT un vrai échange : une vraie conversation avec son produit
         (son assistant, son outil), de vrais messages de clients (captures de témoignages), ou
         une vraie question de sa FAQ et sa vraie réponse. 2 à 4 bulles, 12 mots au plus chacune.
      3. ETIQUETTE : le nom de son produit ou de lui-même (« Ton coach », le nom de l'outil).
      4. LOGO : son logo pour l'avatar (le fichier de brand/ : "brand/logo.png" ou "brand/logo.svg") ;
         "" sans logo : l'initiale de l'ÉTIQUETTE s'affiche. Un logo sombre se pose sur un disque
         clair : passe .t04-msg-avatar en var(--brand-clair).
      5. CADENCE : l'écart entre deux mots qui s'allument (0,07 à 0,12 s), sur la voix s'il y en a.
      6. RESULTAT : ce que son produit rend vraiment [icône du kit, titre, ligne, instant] (une page,
         un plan, une vidéo, un rendez-vous) ; null pour ne pas montrer de carte.
    Couleurs : celles de sa marque, rien d'autre : le fond est sa couleur pleine (un aplat, sans
    dégradé ni tourbillon) ; les bulles de l'offre et la carte du résultat sont dans sa nuit
    (var(--brand-sombre), texte var(--brand-clair)), celles du client claires (l'inverse) ;
    l'étiquette posée sur sa couleur est en var(--brand-contrast) ; la nuit de la fin est
    var(--brand-sombre).
  -->
</head>
<body>
<template>
  <style>
    #t04-msg {
      --t04-fond: var(--brand-accent);
      --t04-nuit: var(--brand-sombre);
      --t04-clair: var(--brand-clair);
      background: var(--brand-sombre);
    }
    /* Le monde de l'après : sa couleur pleine ; il se referme en disque à la fin. */
    #t04-msg .t04-msg-monde { position: absolute; inset: 0; overflow: hidden; background: var(--t04-fond); }
    #t04-msg .t04-msg-fil { position: absolute; left: 400px; top: 0; width: 1120px; height: 1080px; }
    #t04-msg .t04-msg-ligne { position: absolute; left: 0; width: 1120px; }
    #t04-msg .t04-msg-etiquette {
      position: absolute; left: 82px; top: -36px; font-family: "Inter", var(--brand-font-body); font-weight: 600; font-size: 22px;
      color: var(--brand-contrast); white-space: nowrap;
    }
    #t04-msg .t04-msg-bulle {
      position: absolute; padding: 24px 32px; border-radius: 22px; max-width: 820px; white-space: normal;
      background: var(--t04-nuit); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      font-family: "Inter", var(--brand-font-body); font-weight: 500; font-size: 38px; line-height: 1.28; color: var(--t04-clair);
    }
    #t04-msg .t04-msg-client .t04-msg-bulle { right: 0; top: 0; background: var(--t04-clair); color: var(--t04-nuit); }
    #t04-msg .t04-msg-offre .t04-msg-bulle { left: 82px; top: 0; }
    #t04-msg .t04-msg-bulle span { opacity: 0.22; }
    #t04-msg .t04-msg-points { position: absolute; left: 82px; top: 0; padding: 26px 30px; border-radius: 22px; display: flex; gap: 12px;
      background: var(--t04-nuit); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16); }
    #t04-msg .t04-msg-points i { width: 16px; height: 16px; border-radius: 50%; background: var(--brand-gris-3); }
    #t04-msg .t04-msg-avatar {
      position: absolute; left: 4px; top: 10px; width: 60px; height: 60px; border-radius: 50%; overflow: hidden;
      display: grid; place-items: center; background: var(--t04-nuit); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
    }
    #t04-msg .t04-msg-avatar img { width: 100%; height: 100%; padding: 3px; object-fit: contain; }
    #t04-msg .t04-msg-avatar b { font-family: var(--brand-font-display); font-weight: 700; font-size: 28px; color: var(--t04-clair); }
    #t04-msg .t04-msg-resultat { position: absolute; left: 82px; width: 620px; padding: 26px 30px; border-radius: 22px; display: grid;
      grid-template-columns: 72px 1fr; column-gap: 22px; align-items: center; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
      background: var(--t04-nuit); font-family: "Inter", var(--brand-font-body); color: var(--t04-clair); }
    #t04-msg .t04-msg-resultat .ic { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--brand-accent); color: var(--brand-contrast); grid-row: span 3; }
    #t04-msg .t04-msg-resultat .ic svg { width: 40px; height: 40px; }
    #t04-msg .t04-msg-resultat b { font-size: 32px; font-weight: 700; }
    #t04-msg .t04-msg-resultat small { font-size: 22px; color: var(--brand-gris-3); }
    #t04-msg .t04-msg-resultat .barre { height: 10px; border-radius: 5px; margin-top: 10px; background: var(--brand-gris-1); overflow: hidden; }
    #t04-msg .t04-msg-resultat .barre i { display: block; height: 100%; width: 100%; background: var(--brand-accent-lisible); transform-origin: 0 50%; }
    #t04-msg .t04-msg-coche { position: absolute; right: 26px; top: 26px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
      background: var(--brand-accent); color: var(--brand-contrast); }
    #t04-msg .t04-msg-coche svg { width: 26px; height: 26px; }
  </style>

  <div data-composition-id="t04-msg" data-width="1920" data-height="1080" data-duration="6" style="position:absolute; inset:0;">
    <div id="t04-msg" class="k-scene">
      <div class="t04-msg-monde" id="t04-msg-monde">
        <div class="t04-msg-fil" id="t04-msg-fil"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 6.0, ID = "t04-msg", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var ETIQUETTE = "Ton assistant", LOGO = "brand/logo.png", CADENCE = 0.07;
      // [qui, texte, instant où la bulle se pose] ; une bulle de l'offre est annoncée 0,38 s avant
      // par trois points qui sautent.
      var MESSAGES = [
        ["offre", "Bonjour ! On prépare quoi aujourd'hui ?", 0.55],
        ["client", "Ma page de vente, pour lundi.", 1.75],
        ["offre", "C'est parti. Voici ton plan.", 2.95]
      ];
      var RESULTAT = ["file-text", "Ta page de vente", "Plan en 3 étapes", 3.85];

      // Son logo pour avatar (sinon son initiale), dans un disque de sa nuit.
      var avatar = function (parent) {
        var a = K.el(parent, "div", "t04-msg-avatar");
        if (LOGO) { var img = K.el(a, "img"); img.alt = ""; img.src = LOGO; }
        else K.el(a, "b", null, ETIQUETTE.charAt(0));
        return a;
      };

      // Les bulles : chacune se pose, puis ses mots s'allument un à un ; le fil remonte.
      var fil = $("fil"), ESPACE = 190, BAS = 600, hauts = [];
      MESSAGES.forEach(function (m, i) {
        var ligne = K.el(fil, "div", "t04-msg-ligne t04-msg-" + m[0], null, "top:" + (BAS + i * ESPACE) + "px;");
        if (m[0] === "offre") {
          var a = avatar(ligne);
          K.el(ligne, "div", "t04-msg-etiquette", ETIQUETTE);
          // Les trois points qui sautent, juste avant la réponse ; l'avatar bat quand il « parle ».
          var pts = K.el(ligne, "div", "t04-msg-points", "<i></i><i></i><i></i>");
          K.cacher(pts);
          tl.fromTo(pts, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)", transformOrigin: "0% 50%" }, m[2] - 0.38);
          tl.fromTo(pts.children, { y: 0 }, { y: -9, duration: 0.12, ease: "power1.out", yoyo: true, repeat: 1, stagger: 0.08 }, m[2] - 0.3);
          tl.to(pts, { opacity: 0, duration: 0.06 }, m[2]);
          tl.fromTo(a, { scale: 1 }, { scale: 1.2, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, m[2]);
        }
        var bulle = K.el(ligne, "div", "t04-msg-bulle");
        var mots = m[1].split(" ").map(function (w, k) {
          var s = K.el(bulle, "span", null, w);
          if (k < m[1].split(" ").length - 1) bulle.appendChild(document.createTextNode(" "));
          return s;
        });
        K.cacher(ligne);
        tl.fromTo(ligne, { opacity: 0, y: 26, scale: 0.97, filter: "blur(8px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", transformOrigin: m[0] === "offre" ? "0% 50%" : "100% 50%" }, m[2]);
        tl.to(mots, { opacity: 1, duration: 0.08, ease: "none", stagger: CADENCE }, m[2] + 0.25);
        hauts.push(m[2]);
      });
      // La carte du résultat : ce que le produit rend ; sa barre se remplit, elle se coche.
      if (RESULTAT) {
        var rl = K.el(fil, "div", "t04-msg-ligne", null, "top:" + (BAS + MESSAGES.length * ESPACE - 10) + "px;");
        var carte = K.el(rl, "div", "t04-msg-resultat", '<span class="ic">' + K.ic(RESULTAT[0]) + "</span><b>" + RESULTAT[1] +
          "</b><small>" + RESULTAT[2] + '</small><div class="barre"><i></i></div><span class="t04-msg-coche">' + K.ic("check") + "</span>");
        K.cacher(rl);
        tl.fromTo(rl, { opacity: 0, y: 40, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "0% 50%" }, RESULTAT[3]);
        tl.fromTo(carte.querySelector(".barre i"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, RESULTAT[3] + 0.3);
        var coche = carte.querySelector(".t04-msg-coche");
        K.cacher(coche);
        tl.fromTo(coche, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, RESULTAT[3] + 1.0);
        hauts.push(RESULTAT[3]);
      }
      // Le fil remonte d'un cran à chaque nouvelle bulle ; la caméra recadre (poussée puis recul).
      gsap.set(fil, { y: 0 });
      // Le pas de remontée garde toute la conversation dans le cadre (de 600 px à la fin du fil).
      var PAS = Math.round(380 / Math.max(1, hauts.length - 1));
      hauts.forEach(function (t, i) { if (i > 0) tl.to(fil, { y: -PAS * i, duration: 0.5, ease: "expo.out" }, t - 0.05); });
      tl.fromTo(fil, { scale: 1.08 }, { scale: 1, duration: 1.0, ease: "expo.out", transformOrigin: "50% 60%" }, 0.45);
      tl.to(fil, { scale: 1.05, duration: 0.7, ease: "expo.inOut" }, 2.4);
      tl.to(fil, { scale: 0.97, duration: 0.8, ease: "expo.inOut" }, 4.4);

      // La fin : sa couleur se referme en disque sur sa nuit (pas de fondu : un jaune fondu dans le
      // noir passerait par l'olive). Raccord avec la scène suivante, qui commence sur la nuit.
      var monde = $("monde"), cercle = function (r) { return "circle(" + r + "px at 960px 540px)"; };
      gsap.set(monde, { clipPath: cercle(1250) });
      tl.to(monde, { clipPath: cercle(0), duration: 0.6, ease: "power3.in" }, D - 0.62);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
