<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    TEMPLATE N°4 · DÉGRADÉS VIFS · SCÈNE « MOTS ET OBJETS », VERSION VERTICALE 9:16 (1080 × 1920),
    7,4 s (la même scène que mots-objets.html, remise en page pour un Reel, une story, un TikTok)

    Ce qu'elle montre : le monde d'avant, en alternance, chaque bascule par une transition en
    pixels (des carrés de 120 px, 9 colonnes et 16 rangées, qui passent d'un plan à l'autre en
    balayant l'écran, 0,4 s) :
      papier 1 (0 à 1,9 s) : un papier blanc cassé quadrillé ; une phrase courte arrive un mot à
        la fois, chaque mot à sa place sur la grille (en zigzag, sur deux ou trois rangées dans
        la bande du milieu), et à chaque mot un objet du quotidien surgit sur sa case grise,
        dans les bandes du haut et du bas ;
      écran 1 (1,9 à 3,2 s) : un écran tramé (l'accent en tirets sur un fond presque noir), un
        grand téléphone incliné qui vibre (500 × 1 000 px), une pastille de verre au-dessus de
        lui (« NOUVELLE DEMANDE ») ;
      papier 2 (3,2 à 4,5 s) : la deuxième phrase, d'autres objets ;
      écran 2 (4,5 à 5,6 s) : le téléphone sous un autre angle, une autre pastille (« APPEL MANQUÉ ») ;
      papier 3 (5,6 à 7,0 s) : la chute du problème, entourée de TOUS les objets ;
      la fin (6,95 à 7,4 s) : les carrés du dégradé chaud envahissent l'écran (raccord avec la
        scène orbe-pivot, qui commence plein cadre sur ce dégradé).

    À remplacer :
      1. L'identifiant « t04-mots » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. PAPIERS : pour chaque papier, ses mots [mot, x, y, instant] (coin haut gauche en px ; 1 à
         4 mots, lus de gauche à droite, en deux ou trois rangées entre 600 et 1 300 px de haut,
         jamais dans les 10 % du haut ni les 20 % du bas ; 8 lettres au plus par mot) et ses
         objets [objet, x, y, côté de la case, instant] (cases de 200 à 300 px, en haut et en bas,
         calées sur la grille de 100 px : x = 40, 140, 240…, y = 60, 160, 260… ; un objet arrive
         avec un mot : c'est ce qui fait le rythme).
         Les objets viennent du quotidien de SON problème, par ordre de préférence : ses photos
         d'objets détourées ({ img: "assets/images/…" }), les logos des outils de la corvée
         ({ logo: "logo-…" }, posés par `studio_motion.py logos`), puis les objets dessinés ici
         ({ dessin: "calendrier" | "tasse" | "reveil" | "postit" | "enveloppe" | "carnet" }).
      3. ECRANS : la pastille (ce qui arrive sans qu'il puisse répondre, 2 ou 3 mots en capitales)
         et la notification du téléphone (titre, une ligne) ; la place et l'angle du téléphone
         (centré), la hauteur de la pastille (centrée au-dessus de lui).
      4. GLYPHE : une icône du kit au trait plein, le sujet du problème (une horloge, un message).
    Couleurs : le papier et l'encre sont neutres (le monde d'avant) ; la trame et le dégradé chaud
    se DÉRIVENT de l'accent (oklch relatif) : la trame est l'accent en tirets sur un fond presque
    noir, fixe (jamais le fond de la marque : sur une marque claire, l'écran perdrait sa nuit) ; le
    dégradé chaud tourne la teinte de l'accent de --t04-ecart degrés (défaut 50) vers
    le rouge. Une marque qui veut rester dans une seule teinte met --t04-ecart à 12.
  -->
</head>

  <div data-composition-id="t04-mots" data-width="1080" data-height="1920" data-duration="7.4" style="position:absolute; inset:0;">

    (function () {

          '<path d="M38 60a14 14 0 0 1 14-14h96a14 14 0 0 1 14 14v22H38z" fill="#c4322b"/><rect x="66" y="32" width="9" height="26" rx="4.5" fill="#7d7d7d"/><rect x="125" y="32" width="9" height="26" rx="4.5" fill="#7d7d7d"/>' +

          '<path d="M100 110V78" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round"/><path d="M100 110l26 12" stroke="#e5483f" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="110" r="6" fill="#2a2a2a"/></svg>',

      var PAPIERS = [
        { debut: 0, mots: [["Ta", 140, 900, 0.15], ["journée", 300, 780, 0.55], ["file.", 640, 940, 0.95]],
          objets: [[{ dessin: "calendrier" }, 640, 260, 300, 0.15], [{ dessin: "tasse" }, 140, 1260, 300, 0.55],

          glyphe: [520, 1040, 1.15] },
        { debut: 3.2, mots: [["Mille", 220, 820, 3.6], ["tâches.", 420, 960, 3.95]],
          objets: [[{ dessin: "postit" }, 640, 360, 300, 3.6], [{ dessin: "reveil" }, 140, 260, 300, 3.95],
            [{ dessin: "carnet" }, 140, 1260, 300, 4.2], [{ dessin: "tasse" }, 640, 1360, 300, 4.35]],
          glyphe: [720, 860, 3.75] },
        { debut: 5.6, mots: [["Et", 140, 880, 6.0], ["ton", 300, 780, 6.2], ["offre", 520, 860, 6.4], ["attend.", 400, 1000, 6.6]],
          objets: [[{ dessin: "calendrier" }, 740, 260, 200, 5.95], [{ dessin: "tasse" }, 140, 1260, 300, 6.0], [{ dessin: "reveil" }, 440, 360, 100, 6.05],
            [{ dessin: "postit" }, 640, 1360, 300, 6.2], [{ dessin: "enveloppe" }, 140, 260, 200, 6.25], [{ dessin: "carnet" }, 440, 1560, 200, 6.4],
            [{ dessin: "postit" }, 940, 660, 100, 6.45], [{ dessin: "enveloppe" }, 40, 1160, 100, 6.6], [{ dessin: "tasse" }, 540, 160, 100, 6.65]],

        { debut: 1.9, tel: [290, 520, -24, 10, -8], pastille: ["NOUVELLE DEMANDE", 540, 410], notif: ["Nouvelle demande", "Bonjour, c'est encore possible ?"], graine: 3 },

      var CHAUD = 6.95;

      function plan(classe) { return K.el(racine, "div", "t04-mots-plan " + classe); }

      // ---------- Un papier : ses objets sur leurs cases, ses mots, son glyphe ----------
      function papier(p, n) {
        var el = plan("t04-mots-papier");
        p.objets.forEach(function (o, i) {

      }

      // ---------- Un écran tramé : taches de couleur vues à travers des tirets, un téléphone ----------

        el.setAttribute("data-layout-allow-overflow", "");
        var r = K.rng(e.graine);
        var tache = function (hote, couleur) {

        var tirets = K.el(el, "div", "t04-mots-tirets"), claires = K.el(tirets, "div", null, null, "position:absolute; inset:0;");
        var vives = ["--t04-trame-2", "--t04-trame-3", "--t04-trame-2", "--t04-trame-3"].map(function (c) { return tache(claires, c); });
        sombres.concat(vives).forEach(function (t, i) {
          tl.fromTo(t, { x: 0, y: 0 }, { x: (i % 2 ? -1 : 1) * 120, y: (i % 3 - 1) * 160, duration: 2.0, ease: "sine.inOut" }, e.debut);
        });
        var scene = K.el(el, "div", "t04-mots-scene-tel", null, "left:" + e.tel[0] + "px; top:" + e.tel[1] + "px;");
        var tel = K.el(scene, "div", "t04-mots-tel k-tel", null, "width:500px; height:1000px;");
        K.el(tel, "div", "k-tel-ecran t04-mots-ecran", '<div class="k-tel-ilot"></div><div class="t04-mots-notif" data-layout-allow-overlap><b data-layout-allow-overlap>' +
          e.notif[0] + "</b>" + e.notif[1] + "</div>");
        gsap.set(tel, { rotationY: e.tel[2], rotationX: e.tel[3], rotationZ: e.tel[4], scale: 0.9 });
        tl.fromTo(tel, { y: 90 }, { y: -10, duration: 1.4, ease: "power2.out" }, e.debut);
        // Il vibre quand la demande arrive.
        [0, 1, 2, 3, 4, 5].forEach(function (k) { tl.to(tel, { rotationZ: e.tel[4] + (k % 2 ? -3 : 3), duration: 0.06, ease: "none" }, e.debut + 0.5 + k * 0.06); });
        tl.to(tel, { rotationZ: e.tel[4], duration: 0.1 }, e.debut + 0.86);
        var pastille = K.el(el, "div", "t04-mots-pastille", e.pastille[0], "left:" + e.pastille[1] + "px; top:" + e.pastille[2] + "px;");
        // Les deux écrans posent leur pastille au même endroit : celle du 1er reste sous le 2e écran (opaque).
        pastille.setAttribute("data-layout-allow-overlap", "");
        K.cacher(pastille, { xPercent: -50 });   // centrée sur x, au-dessus du téléphone
        tl.fromTo(pastille, { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, e.debut + 0.45);
        return el;
      }

      // Les plans dans l'ordre d'apparition (chacun recouvre le précédent).
      var ordre = [[papier(PAPIERS[0]), 0], [ecran(ECRANS[0]), ECRANS[0].debut], [papier(PAPIERS[1]), PAPIERS[1].debut],
        [ecran(ECRANS[1]), ECRANS[1].debut], [papier(PAPIERS[2]), PAPIERS[2].debut], [plan("t04-mots-chaud"), CHAUD]];

      // ---------- Les transitions en pixels : un plan apparaît par carrés de 120 px ----------
      // Seuil de chaque carré = hasard (à graine) + balayage de gauche à droite.
      var COTE = 120, COLS = 9, LIGS = 16;
      function seuils(graine) {
        var r = K.rng(graine), s = [];
        for (var k = 0; k < COLS * LIGS; k++) s.push(0.55 * r() + 0.45 * ((k % COLS) / (COLS - 1)));
        return s;
      }
      var TRANSITIONS = ordre.slice(1).map(function (o, i) { return [o[0], o[1], seuils(7 + i * 4)]; });
      function rendre(t) {
        TRANSITIONS.forEach(function (tr) {
          var el = tr[0], p = (t - tr[1]) / PIX, s = tr[2];
          if (p <= 0) { if (el.style.visibility !== "hidden") el.style.visibility = "hidden"; return; }
          // Jamais « visible » écrit en dur : le plan doit pouvoir hériter du masquage de la scène
          // quand elle est finie (sinon il reste affiché sous les scènes suivantes).
          if (el.style.visibility) el.style.visibility = "";
          if (p >= 1) { if (el.style.clipPath !== "none") el.style.clipPath = "none"; return; }
          var d = "";
          for (var k = 0; k < s.length; k++) {
            if (s[k] < p) d += "M" + (k % COLS) * COTE + " " + Math.floor(k / COLS) * COTE + "h" + COTE + "v" + COTE + "h-" + COTE + "Z";
          }
          el.style.clipPath = d ? "path('" + d + "')" : "inset(50% 50% 50% 50%)";
        });
      }
