  <!--
    STYLE N°4 · MOTS ÉPARPILLÉS · SCÈNE « MOTS ET CASES » (l'avant : le problème), 16:9

    Ce qu'elle montre : le monde d'avant, en plans qui se suivent, chaque bascule par une transition
    en pixels (des carrés de 120 px qui découvrent le plan suivant, 0,4 s, entre deux phrases) :
      - un papier clair quadrillé (sa couleur claire) : une phrase complète arrive un mot à la fois,
        chaque mot à sa place sur la grille (en zigzag, lue de gauche à droite) ; avec les mots, puis
        sur les temps de la tenue, des cases surgissent, et chacune porte sa vraie matière (une vraie
        capture en vignette, un vrai chiffre qui compte, le vrai logo d'un outil de sa corvée) ; la
        phrase complète reste le temps de la lire, ses mots clés se surlignent de sa couleur ;
      - un écran de nuit (sa couleur sombre, une trame de tirets blancs très pâles) : la pastille de
        ce qu'il vit tombe, s'empile et vibre, près de sa vraie capture inclinée (une carte claire, ou
        un téléphone) qui monte et vibre à chaque appel ;
      - à la fin, sa couleur pleine envahit l'écran par carrés (raccord avec orbe-pivot).

    Les durées suivent la lecture : un papier dure le temps de poser ses mots (un toutes les CADENCE
    s) puis la lecture de sa phrase complète (`studio_motion.py lecture`) ; un écran, 1 s pour poser
    sa pastille puis sa lecture. La scène calcule ses instants : sa durée est FIN (console : « t04-mots
    dure … s ») ; reporte-la dans D et dans data-duration, ici et sur son hôte dans index.html. Aucun
    recadrage : le papier pousse lentement (×1,03 sur toute sa tenue). Pendant la tenue, la vie vient
    des cases qui arrivent sur les temps (« tenue 1, 2… ») : des matières contrastées (une capture
    sombre, un logo plein, un chiffre sur sa couleur) ; c'est ce que `rythme` voit.

    À remplacer : l'objet EXEMPLE (en tête du script), puis la mise en page qui le suit.
      1. L'identifiant « t04-mots » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. EXEMPLE.papiers : chaque papier, sa phrase (courte et complète, 8 mots au plus ; un chiffre
         et son unité restent un seul mot, avec une espace insécable), ses mots clés tels qu'écrits
         (surlignés de sa couleur ; [] sans), et les matières de ses cases, du plus fort au plus
         faible (references/interdits.md, « Rien d'inventé ») :
           { img: "assets/images/…" } : une vraie capture en vignette (sa page, son produit, un
             résultat, une image de sa vraie vidéo), recadrée par la case ;
           { chiffre: 40, unite: "…", avant: "…" } : un vrai chiffre de OFFRE.json, qui compte
             jusqu'à sa valeur (un texte, "2 976 €", s'affiche tel quel) ;
           { logo: "logo-…" } : le vrai logo nu d'un outil que l'offre nomme (`studio_motion.py logos`) ;
           { mot: "…" } : un de ses vrais mots, en dernier recours.
         Une matière absente (capture ou logo qui manque au projet) retire sa case : jamais une forme
         seule comme sujet, jamais un objet dessiné (tasse, réveil, post-it, enveloppe).
      3. EXEMPLE.ecrans : chaque écran de nuit, sa pastille (2 à 4 mots en capitales : ce qu'il vit,
         ce qui lui coûte) et sa vraie capture (facultative : sans elle, la pastille seule, au centre).
      4. PLANS : l'ordre des plans (le motif papier / écran se répète une fois par besoin) et leur
         mise en page :
           papier : { papier: n° dans EXEMPLE.papiers, mots: [[x, y], …], cases: [[x, y, côté, quand, fond], …] }
             - mots : la place de chaque mot, dans l'ordre (coin haut gauche en px, sur la grille de
               100 px, en zigzag sur deux rangées) ; un mot sans place suit le précédent ;
             - cases : une par matière, dans l'ordre ; côté = un nombre (carré) ou [largeur,
               hauteur] ; quand = "mot 3" (avec le 3e mot) ou "tenue 1" (0,4 s après le dernier mot ;
               "tenue 2" 0,5 s plus tard…) ; fond (facultatif) : "case" (grise), "cadre" (au trait),
               "nuit", "aplat" (sa couleur) ou "aucun" : un fond est un cadre, il porte toujours sa
               matière ;
           écran : { ecran: n° dans EXEMPLE.ecrans, place: [x, y] (centre de la pastille), cadre:
             "carte" (paysage) ou "tel" (400 × 800), pose: [x, y, largeur, hauteur, angle Y, angle X,
             angle Z], graine }.
      5. CADENCE (écart entre deux mots, 0,22 à 0,3 s), seulement si la musique l'exige. OUVERTURE :
         true quand la scène ouvre la vidéo (la première image porte déjà le premier mot et sa case).
    Couleurs : celles de sa marque, rien d'autre (brand/tokens.css) : le papier est sa couleur
    claire, l'encre et la nuit sa couleur sombre, les cases et les pastilles empilées ses gris, la
    grille et la trame des traits fins en transparence, l'aplat, le surlignage et la fin sa couleur
    pleine ; rien ne porte d'ombre sur sa couleur. Ses captures et ses logos gardent leurs couleurs.
  -->
</head>

          // Les mots se frôlent exprès (zigzag serré) : leurs boîtes se touchent, pas leurs lettres.
          e.setAttribute("data-layout-allow-overlap", "");
          var j = cles.indexOf(m[0]);
          if (j >= 0) {   // le mot clé : un bloc de sa couleur passe derrière lui pendant la tenue
            var bloc = K.el(e, "span", "t04-mots-bloc");
            gsap.set(bloc, { scaleX: 0 });
            e.setAttribute("data-surligne", "0");
            var ts = p.finMots + 0.3 + j * 0.15;
            tl.to(bloc, { scaleX: 1, duration: 0.35, ease: "expo.out" }, ts);
            tl.set(e, { attr: { "data-surligne": "1" } }, ts + 0.05);
          }
          var lettres = K.el(e, "span", "t04-mots-lettres");
          lettres.setAttribute("data-layout-allow-overlap", "");
          var tw = p.t0 + k * CADENCE;
          if (i === 0 && k === 0 && OUVERTURE) K.taper(tl, lettres, m[0], -0.2, -0.1, D);   // déjà là sur la première image
          else K.taper(tl, lettres, m[0], tw, tw + Math.min(0.1, 0.025 * m[0].length), D);
        });
        // Le papier pousse lentement pendant toute sa tenue : la seule caméra de la scène.
        tl.fromTo(el, { scale: 1 }, { scale: 1.03, duration: p.fin + PIX - p.debut, ease: "sine.inOut", transformOrigin: "50% 50%" }, p.debut);
        return el;
      }

      // ---------- Un écran de nuit : la trame, sa vraie capture, la pastille ----------
      function ecran(p) {
        var el = plan("t04-mots-nuit");
        el.setAttribute("data-layout-allow-overflow", "");
        var r = K.rng(p.graine || 3), trame = K.el(el, "div", "t04-mots-trame"), duree = p.fin + PIX - p.debut;
        K.el(trame, "div", "t04-mots-trame-fond");   // la trame, et deux passages plus clairs qui la traversent
        [0, 1].forEach(function (k) {
          var w = 1100 + r() * 400, h = 700 + r() * 300;
          var l = K.el(trame, "div", "t04-mots-lumiere", null, "left:" + (r() * 1300 - 300) + "px; top:" + (r() * 600 - 300) + "px; width:" + w + "px; height:" + h + "px;");
          tl.fromTo(l, { x: 0, y: 0 }, { x: (k ? -1 : 1) * 520, y: (k ? 1 : -1) * 260, duration: duree, ease: "sine.inOut" }, p.debut);
        });
        if (p.capture) {   // sa vraie capture, inclinée, qui monte puis vibre avec la pastille
          var po = p.pose, tel = p.cadre === "tel";
          var scene = K.el(el, "div", "t04-mots-scene-capture", null, "left:" + po[0] + "px; top:" + po[1] + "px; width:" + po[2] + "px; height:" + po[3] + "px;");
          var obj = tel ? K.el(scene, "div", "t04-mots-tel k-tel", null, "width:" + po[2] + "px; height:" + po[3] + "px;")
            : K.el(scene, "div", "t04-mots-carte");
          K.el(obj, "div", tel ? "k-tel-ecran" : null, '<img src="' + p.capture + '" alt="">').firstChild
            .addEventListener("error", function () { scene.style.display = "none"; });   // capture absente : la pastille seule
          gsap.set(obj, { rotationY: po[4], rotationX: po[5], rotationZ: po[6], scale: 0.92 });
          tl.fromTo(obj, { y: 80 }, { y: -12, duration: Math.min(1.6, duree), ease: "power2.out" }, p.t0);
          // Elle vibre à l'arrivée de la pastille, puis toutes les 0,9 s (la capture vit, pas la pastille qu'on lit).
          for (var b = p.t0 + 0.5; b < p.fin - 0.5; b += 0.9) {
            [0, 1, 2, 3, 4, 5].forEach(function (k) { tl.to(obj, { rotationZ: po[6] + (k % 2 ? -3 : 3), duration: 0.06, ease: "none" }, b + k * 0.06); });
            tl.to(obj, { rotationZ: po[6], duration: 0.1 }, b + 0.36);
          }
          tl.to(obj, { y: -30, duration: Math.max(0.5, duree - 1.6), ease: "sine.inOut" }, p.t0 + 1.6);
        }
        // La pastille glisse, deux pastilles s'empilent derrière elle, puis la pile vibre une fois.
        var place = p.place || [960, 540];
        var pile = K.el(el, "div", "t04-mots-pile", null, "left:" + place[0] + "px; top:" + place[1] + "px;");
        pile.setAttribute("data-layout-allow-overlap", "");
        var vides = [[0.14, 52, ""], [0.07, 26, " pres"]].map(function (v) {
          return K.el(pile, "div", "t04-mots-vide" + v[2], null, "left:" + v[0] * 100 + "%; right:" + v[0] * 100 + "%; top:" + v[1] + "px; bottom:" + -v[1] + "px;");
        });
        var pastille = K.el(pile, "div", "t04-mots-pastille", "<i></i>" + p.ecran);
        K.cacher(pile, { xPercent: -50, yPercent: -50 });
        tl.fromTo(pile, { opacity: 0, x: -34, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.4, ease: "expo.out" }, p.t0 + 0.3);
        K.cacher(vides, { y: -30 });
        vides.forEach(function (v, k) { tl.to(v, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, p.t0 + 0.5 + (1 - k) * 0.09); });
        [0, 1, 2, 3, 4, 5].forEach(function (k) { tl.to(pile, { rotation: k % 2 ? -2.2 : 2.2, duration: 0.06, ease: "none" }, p.t0 + 0.62 + k * 0.06); });
        tl.to(pile, { rotation: 0, duration: 0.1 }, p.t0 + 0.98);
        // Le point de la pastille bat deux fois, comme un appel qui arrive.
        tl.to(pastille.querySelector("i"), { scale: 1.45, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, p.t0 + 0.62);
        tl.fromTo(pile, { y: 10 }, { y: -8, duration: duree - 0.3, ease: "sine.inOut" }, p.t0 + 0.3);
        return el;
      }

      // Les plans dans l'ordre d'apparition (chacun recouvre le précédent), puis sa couleur.
      var ordre = PLANS.map(function (p, i) { return [p.mots ? papier(p, i) : ecran(p), p.debut]; });
      ordre.push([plan("t04-mots-couleur"), COULEUR]);

      // ---------- Les transitions en pixels : un plan apparaît par carrés de 120 px ----------
      var COTE = 120, COLS = 16, LIGS = 9;
      function seuils(graine) {
        var r = K.rng(graine), s = [];
        for (var k = 0; k < COLS * LIGS; k++) s.push(0.55 * r() + 0.45 * ((k % COLS) / (COLS - 1)));
        return s;
      }
      var SEUILS = ordre.map(function (o, i) { return i ? seuils(7 + (i - 1) * 4) : null; });
      function rendre(t) {
        ordre.forEach(function (o, i) {
          var el = o[0], p = i ? (t - o[1]) / PIX : 1, s = SEUILS[i];
          // Un plan pas encore entré, ou recouvert en entier par le suivant, est masqué.
          var couvert = i < ordre.length - 1 && t >= ordre[i + 1][1] + PIX;
          if (p <= 0 || couvert) { if (el.style.visibility !== "hidden") el.style.visibility = "hidden"; return; }
          // Jamais « visible » écrit en dur : le plan hérite du masquage de la scène quand elle est finie.
          if (el.style.visibility) el.style.visibility = "";
          if (p >= 1) { if (el.style.clipPath && el.style.clipPath !== "none") el.style.clipPath = "none"; return; }
          var d = "";
          for (var k = 0; k < s.length; k++) {
            if (s[k] < p) d += "M" + (k % COLS) * COTE + " " + Math.floor(k / COLS) * COTE + "h" + COTE + "v" + COTE + "h-" + COTE + "Z";
          }
          el.style.clipPath = d ? "path('" + d + "')" : "inset(50% 50% 50% 50%)";
        });
      }
      var horloge = { t: 0 }; rendre(0);
      tl.to(horloge, { t: D, duration: D, ease: "none", onUpdate: function () { rendre(horloge.t); } }, 0);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
