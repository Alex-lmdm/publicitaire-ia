<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°4 · MOTS ÉPARPILLÉS · SCÈNE « MOTS ET CASES » (l'avant : le problème), 7,4 s, 16:9

    Ce qu'elle montre : le monde d'avant, en alternance, chaque bascule par une transition en
    pixels (des carrés de 120 px qui passent d'un plan à l'autre en balayant l'écran, 0,4 s) :
      papier 1 (0 à 1,9 s) : un papier clair quadrillé (sa couleur claire) ; une phrase courte
        arrive un mot à la fois, chaque mot à sa place sur la grille (en zigzag), et à chaque mot
        une case de la grille surgit, avec une forme simple à ses couleurs ou sa vraie matière ;
      écran 1 (1,9 à 3,2 s) : un écran de nuit (sa couleur sombre, une trame de tirets blancs très
        pâles où passe une lumière) ; la pastille de ce qu'il rate (« NOUVELLE DEMANDE ») tombe,
        s'empile et vibre ; avec sa vraie capture, elle se pose à côté d'un téléphone incliné ;
      papier 2 (3,2 à 4,5 s) : la deuxième phrase, d'autres cases ;
      écran 2 (4,5 à 5,6 s) : une autre pastille (« APPEL MANQUÉ »), ailleurs ;
      papier 3 (5,6 à 7,0 s) : la chute du problème, entourée de TOUTES les cases ;
      la fin (6,95 à 7,4 s) : les carrés de sa couleur pleine envahissent l'écran (raccord avec la
        scène orbe-pivot, qui commence plein cadre sur sa couleur).

    À remplacer :
      1. L'identifiant « t04-mots » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. PAPIERS : pour chaque papier, ses mots [mot, x, y, instant] (coin haut gauche en px, sur la
         grille de 100 px ; une phrase courte et complète, lue de gauche à droite) et ses cases
         [contenu, x, y, côté de la case, instant] (une case arrive avec un mot : c'est ce qui fait
         le rythme). Le contenu d'une case, par ordre de préférence :
           - sa vraie matière, que le plan de la vidéo fournit : une photo d'objet détourée
             { img: "assets/images/…" }, le logo d'un des outils de sa corvée { logo: "logo-…" }
             (posé par `studio_motion.py logos`) ;
           - sinon une forme simple à ses couleurs, qui prend toute la case : { forme: "aplat" }
             (la case pleine de sa couleur), "nuit" (pleine de sa couleur sombre), "disque" (un
             disque de sa couleur), "rond" (un disque de sa nuit), "cadre" (la case au trait),
             "point" (un petit disque de sa nuit sur la case grise) ou "case" (la case grise seule).
             Les formes de sa nuit font le rythme (une case claire ou jaune se voit peu au contrôle) :
             gardes-en une ou deux par phrase, sur les mots qui comptent.
         Jamais un objet dessiné (tasse, calendrier, réveil, post-it, enveloppe, carnet) : une image
         inventée fait « vidéo d'IA » et sort de sa palette.
      3. ECRANS : la pastille [texte, x, y] (ce qui arrive sans qu'il puisse répondre, 2 ou 3 mots
         en capitales ; x et y : son centre) ; capture (facultative) : sa vraie capture d'écran de
         téléphone ("assets/images/…"), posée dans le téléphone incliné tel [x, y, angle Y,
         angle X, angle Z] ; sans capture, pas de téléphone : la pastille seule, au centre. Avec
         une capture, pose la pastille à côté du téléphone (par exemple 1 420, 280).
    Couleurs : celles de sa marque, rien d'autre (brand/tokens.css) : le papier est sa couleur
    claire, l'encre et la nuit sa couleur sombre, les cases et la trame des neutres en
    transparence, la fin sa couleur pleine. Aucune couleur tirée de l'accent, jamais l'accent en
    transparence.
  -->
</head>
<body>
<template>
  <style>
    #t04-mots {
      --t04-papier: var(--brand-clair);
      --t04-encre: var(--brand-sombre);
      --t04-nuit: var(--brand-sombre);
      --t04-case: rgba(0, 0, 0, 0.055);
      background: var(--t04-papier);
    }
    #t04-mots .t04-mots-plan { position: absolute; inset: 0; overflow: hidden; }
    #t04-mots .t04-mots-papier {
      background-color: var(--t04-papier);
      background-image: linear-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.06) 1px, transparent 1px);
      background-size: 100px 100px; background-position: 60px 40px;
    }
    #t04-mots .t04-mots-mot {
      position: absolute; white-space: nowrap; line-height: 1;
      font-family: var(--brand-font-display); font-weight: 400; font-size: 104px; letter-spacing: -0.03em; color: var(--t04-encre);
    }
    #t04-mots .t04-mots-case { position: absolute; background: var(--t04-case); }
    /* Sa vraie matière sur la case : une photo détourée, le logo d'un outil. */
    #t04-mots .t04-mots-objet { position: absolute; inset: -14%; display: grid; place-items: center; }
    #t04-mots .t04-mots-objet svg, #t04-mots .t04-mots-objet img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.22)); }
    /* Sans matière : une forme simple à ses couleurs, qui prend toute la case (pleine, jamais en
       transparence ; une ombre neutre la décolle du papier). */
    #t04-mots .t04-mots-forme { position: absolute; inset: 0; }
    #t04-mots .t04-forme-aplat { background: var(--brand-accent); box-shadow: 0 18px 34px rgba(0, 0, 0, 0.12); }
    #t04-mots .t04-forme-nuit { background: var(--t04-encre); box-shadow: 0 18px 34px rgba(0, 0, 0, 0.16); }
    #t04-mots .t04-forme-disque { border-radius: 50%; background: var(--brand-accent); box-shadow: 0 18px 34px rgba(0, 0, 0, 0.12); }
    #t04-mots .t04-forme-rond { border-radius: 50%; background: var(--t04-encre); box-shadow: 0 18px 34px rgba(0, 0, 0, 0.16); }
    #t04-mots .t04-forme-cadre { border: 3px solid var(--t04-encre); }
    #t04-mots .t04-forme-point { inset: 38%; border-radius: 50%; background: var(--t04-encre); }
    /* L'écran de nuit : une trame de tirets blancs très pâles, une lumière neutre qui passe dessous. */
    #t04-mots .t04-mots-nuit { background: var(--t04-nuit); }
    #t04-mots .t04-mots-trame {
      position: absolute; inset: -40px;
      -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='7' height='12'><rect width='4' height='9' rx='1' fill='black'/></svg>");
      mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='7' height='12'><rect width='4' height='9' rx='1' fill='black'/></svg>");
      -webkit-mask-size: 7px 12px; mask-size: 7px 12px;
    }
    #t04-mots .t04-mots-trame-fond { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.05); }
    #t04-mots .t04-mots-lumiere { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0)); }
    /* La pastille de ce qu'il rate, et les deux pastilles vides qui s'empilent derrière elle. */
    #t04-mots .t04-mots-pile { position: absolute; }
    #t04-mots .t04-mots-pastille {
      position: relative; display: flex; align-items: center; gap: 20px; padding: 30px 56px 30px 44px; border-radius: 999px; white-space: nowrap;
      background: var(--brand-clair);
      font-family: "Inter", var(--brand-font-body); font-weight: 600; font-size: 48px; line-height: 1; letter-spacing: 0.05em; color: var(--brand-sombre);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.4);
    }
    #t04-mots .t04-mots-pastille i { display: block; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-accent); box-shadow: 0 0 0 2px var(--brand-sombre); }
    #t04-mots .t04-mots-vide { position: absolute; border-radius: 999px; background: rgba(255, 255, 255, 0.16); border: 1.5px solid rgba(255, 255, 255, 0.22); }
    #t04-mots .t04-mots-scene-tel { position: absolute; width: 400px; height: 800px; perspective: 1400px; }
    #t04-mots .t04-mots-tel { position: absolute; inset: 0; transform-style: preserve-3d; }
    /* La fin : sa couleur pleine, qui envahit l'écran par carrés (même rendu que le début d'orbe-pivot). */
    #t04-mots .t04-mots-couleur { background: var(--brand-accent); }
  </style>
  <div data-composition-id="t04-mots" data-width="1920" data-height="1080" data-duration="7.4" style="position:absolute; inset:0;">
    <div id="t04-mots" class="k-scene"></div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 7.4, ID = "t04-mots", tl = gsap.timeline({ paused: true });
      var racine = document.getElementById(ID);
      var PIX = 0.4;

      // ---------- Les plans, dans l'ordre : chaque papier et chaque écran apparaît en pixels ----------
      var PAPIERS = [
        { debut: 0, mots: [["Ta", 560, 430, 0.15], ["journée", 700, 300, 0.55], ["file.", 1160, 390, 0.95]],
          cases: [[{ forme: "aplat" }, 1460, 40, 300, 0.15], [{ forme: "rond" }, 160, 640, 300, 0.55],
            [{ forme: "nuit" }, 960, 740, 200, 0.95], [{ forme: "case" }, 160, 140, 200, 1.3], [{ forme: "cadre" }, 1460, 640, 300, 1.45],
            [{ forme: "point" }, 1660, 440, 100, 1.6]] },
        { debut: 3.2, mots: [["Mille", 600, 360, 3.6], ["tâches.", 900, 480, 3.95]],
          cases: [[{ forme: "rond" }, 1360, 140, 300, 3.6], [{ forme: "aplat" }, 260, 40, 300, 3.95],
            [{ forme: "nuit" }, 260, 640, 300, 4.2], [{ forme: "disque" }, 1460, 640, 300, 4.35], [{ forme: "point" }, 960, 840, 100, 4.4]] },
        { debut: 5.6, mots: [["Et", 470, 480, 6.0], ["ton", 600, 360, 6.2], ["offre", 850, 300, 6.4], ["attend.", 1110, 430, 6.6]],
          cases: [[{ forme: "disque" }, 1460, 40, 200, 5.95], [{ forme: "nuit" }, 160, 640, 300, 6.0], [{ forme: "point" }, 760, 40, 100, 6.05],
            [{ forme: "aplat" }, 1360, 640, 300, 6.2], [{ forme: "case" }, 160, 140, 200, 6.25], [{ forme: "rond" }, 660, 740, 200, 6.4],
            [{ forme: "aplat" }, 1760, 340, 100, 6.45], [{ forme: "cadre" }, 1160, 840, 100, 6.6], [{ forme: "nuit" }, 460, 40, 100, 6.65]] }
      ];
      var ECRANS = [
        { debut: 1.9, pastille: ["NOUVELLE DEMANDE", 960, 520], capture: "", tel: [820, 150, -24, 10, -8], graine: 3 },
        { debut: 4.5, pastille: ["APPEL MANQUÉ", 1010, 600], capture: "", tel: [640, 170, 26, 8, 9], graine: 9 }
      ];
      var COULEUR = 6.95;

      function plan(classe) { return K.el(racine, "div", "t04-mots-plan " + classe); }

      // ---------- Un papier : ses cases (forme ou vraie matière), ses mots ----------
      function papier(p) {
        var el = plan("t04-mots-papier");
        el.setAttribute("data-layout-allow-overflow", "");   // le papier pousse de 3 % : il déborde exprès
        p.cases.forEach(function (o, i) {
          var c = K.el(el, "div", "t04-mots-case", null, "left:" + o[1] + "px; top:" + o[2] + "px; width:" + o[3] + "px; height:" + o[3] + "px;");
          var t = o[0], dessus = null;
          if (t.forme && t.forme !== "case" && t.forme !== "point") c.style.background = "transparent";
          if (t.img) dessus = K.el(c, "div", "t04-mots-objet", '<img src="' + t.img + '" alt="">');
          else if (t.logo) dessus = K.el(c, "div", "t04-mots-objet", K.ic(t.logo));
          else if (t.forme && t.forme !== "case") dessus = K.el(c, "div", "t04-mots-forme t04-forme-" + t.forme);
          if (o[4] > 0) {   // à 0 : là dès la première image (une pub, une page : le sujet se lit tout de suite)
            gsap.set(c, { opacity: 0, scale: 0.55 });
            tl.to(c, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, o[4]);
          }
          // Ce qui est posé sur la case flotte doucement (8 px ; une matière tourne aussi de 3 degrés,
          // une forme reste d'équerre avec la grille).
          var a = t.forme ? 0 : 1;
          if (dessus) tl.fromTo(dessus, { y: 6, rotation: (-3 + (i % 3) * 3) * a }, { y: -8, rotation: ((i % 3) * 2 - 2) * a, duration: D - o[4], ease: "sine.inOut" }, o[4]);
        });
        p.mots.forEach(function (m) {
          var e = K.el(el, "div", "t04-mots-mot", null, "left:" + m[1] + "px; top:" + m[2] + "px;");
          // Les mots se frôlent exprès (zigzag serré) : leurs boîtes se touchent, pas leurs lettres.
          e.setAttribute("data-layout-allow-overlap", "");
          if (m[3] > 0) K.taper(tl, e, m[0], m[3], m[3] + Math.min(0.2, 0.04 * m[0].length), D);
          else e.textContent = m[0];
        });
        tl.fromTo(el, { scale: 1 }, { scale: 1.03, duration: 2.2, ease: "none", transformOrigin: "50% 50%" }, Math.max(0, p.debut));
        return el;
      }

      // ---------- Un écran de nuit : la trame, la lumière qui passe, la pastille qui tombe ----------
      function ecran(e) {
        var el = plan("t04-mots-nuit");
        el.setAttribute("data-layout-allow-overflow", "");
        var r = K.rng(e.graine), trame = K.el(el, "div", "t04-mots-trame");
        K.el(trame, "div", "t04-mots-trame-fond");
        [0, 1].forEach(function (k) {
          var w = 1100 + r() * 400, h = 700 + r() * 300;
          var l = K.el(trame, "div", "t04-mots-lumiere", null, "left:" + (r() * 1300 - 300) + "px; top:" + (r() * 600 - 300) + "px; width:" + w + "px; height:" + h + "px;");
          tl.fromTo(l, { x: 0, y: 0 }, { x: (k ? -1 : 1) * 160, y: (k ? 1 : -1) * 90, duration: 2.0, ease: "sine.inOut" }, e.debut);
        });
        var cible = null;
        if (e.capture) {   // sa vraie capture dans le téléphone incliné, qui monte puis vibre
          var scene = K.el(el, "div", "t04-mots-scene-tel", null, "left:" + e.tel[0] + "px; top:" + e.tel[1] + "px;");
          var tel = K.el(scene, "div", "t04-mots-tel k-tel", null, "width:400px; height:800px;");
          K.el(tel, "div", "k-tel-ecran", '<img src="' + e.capture + '" alt="">');
          gsap.set(tel, { rotationY: e.tel[2], rotationX: e.tel[3], rotationZ: e.tel[4], scale: 0.9 });
          tl.fromTo(tel, { y: 70 }, { y: -10, duration: 1.4, ease: "power2.out" }, e.debut);
          [0, 1, 2, 3, 4, 5].forEach(function (k) { tl.to(tel, { rotationZ: e.tel[4] + (k % 2 ? -3 : 3), duration: 0.06, ease: "none" }, e.debut + 0.5 + k * 0.06); });
          tl.to(tel, { rotationZ: e.tel[4], duration: 0.1 }, e.debut + 0.86);
        }
        // La pastille glisse, deux pastilles vides s'empilent derrière elle, puis tout vibre.
        var pile = K.el(el, "div", "t04-mots-pile", null, "left:" + e.pastille[1] + "px; top:" + e.pastille[2] + "px;");
        var vides = [[0.14, 52, 0.55], [0.07, 26, 0.8]].map(function (v) {
          return K.el(pile, "div", "t04-mots-vide", null, "left:" + v[0] * 100 + "%; right:" + v[0] * 100 + "%; top:" + v[1] + "px; bottom:" + -v[1] + "px; opacity:" + v[2] + ";");
        });
        var pastille = K.el(pile, "div", "t04-mots-pastille", "<i></i>" + e.pastille[0]);
        K.cacher(pile, { xPercent: -50, yPercent: -50 });
        tl.fromTo(pile, { opacity: 0, x: -34, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.4, ease: "expo.out" }, e.debut + 0.3);
        K.cacher(vides, { y: -30 });
        vides.forEach(function (v, k) { tl.to(v, { opacity: [0.55, 0.8][k], y: 0, duration: 0.35, ease: "expo.out" }, e.debut + 0.5 + (1 - k) * 0.09); });
        [0, 1, 2, 3, 4, 5].forEach(function (k) { tl.to(pile, { rotation: k % 2 ? -2.2 : 2.2, duration: 0.06, ease: "none" }, e.debut + 0.62 + k * 0.06); });
        tl.to(pile, { rotation: 0, duration: 0.1 }, e.debut + 0.98);
        // Le point de la pastille clignote une fois, comme un appel qui arrive.
        tl.to(pastille.querySelector("i"), { scale: 1.45, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, e.debut + 0.62);
        tl.fromTo(pile, { y: 10 }, { y: -6, duration: 1.2, ease: "power1.out" }, e.debut + 0.3);
        return el;
      }

      // Les plans dans l'ordre d'apparition (chacun recouvre le précédent).
      var ordre = [[papier(PAPIERS[0]), 0], [ecran(ECRANS[0]), ECRANS[0].debut], [papier(PAPIERS[1]), PAPIERS[1].debut],
        [ecran(ECRANS[1]), ECRANS[1].debut], [papier(PAPIERS[2]), PAPIERS[2].debut], [plan("t04-mots-couleur"), COULEUR]];

      // ---------- Les transitions en pixels : un plan apparaît par carrés de 120 px ----------
      // Seuil de chaque carré = hasard (à graine) + balayage de gauche à droite.
      var COTE = 120, COLS = 16, LIGS = 9;
      function seuils(graine) {
        var r = K.rng(graine), s = [];
        for (var k = 0; k < COLS * LIGS; k++) s.push(0.55 * r() + 0.45 * ((k % COLS) / (COLS - 1)));
        return s;
      }
      var TRANSITIONS = ordre.slice(1).map(function (o, i) { return [o[0], o[1], seuils(7 + i * 4)]; });
      function rendre(t) {
        TRANSITIONS.forEach(function (tr) {
          var el = tr[0], p = (t - tr[1]) / PIX, s = tr[2];
          if (p <= 0) { if (el.style.visibility !== "hidden") el.style.visibility = "hidden"; return; }
          // Jamais « visible » écrit en dur : le plan doit pouvoir hériter du masquage de la scène
          // quand elle est finie (sinon il reste affiché sous les scènes suivantes).
          if (el.style.visibility) el.style.visibility = "";
          if (p >= 1) { if (el.style.clipPath !== "none") el.style.clipPath = "none"; return; }
          var d = "";
          for (var k = 0; k < s.length; k++) {
            if (s[k] < p) d += "M" + (k % COLS) * COTE + " " + Math.floor(k / COLS) * COTE + "h" + COTE + "v" + COTE + "h-" + COTE + "Z";
          }
          el.style.clipPath = d ? "path('" + d + "')" : "inset(50% 50% 50% 50%)";
        });
      }
      var horloge = { t: 0 };
      rendre(0);
      tl.to(horloge, { t: D, duration: D, ease: "none", onUpdate: function () { rendre(horloge.t); } }, 0);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
