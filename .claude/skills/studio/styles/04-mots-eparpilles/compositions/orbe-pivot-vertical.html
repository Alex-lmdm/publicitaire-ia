<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°4 · MOTS ÉPARPILLÉS · SCÈNE « LE PIVOT EN DISQUE », VERSION VERTICALE 9:16
    (1080 × 1920), 4,0 s (la même scène que orbe-pivot.html, remise en page pour un Reel, une
    story, un TikTok)

    Ce qu'elle montre : plein cadre, sa couleur pleine (la même qu'à la fin de mots-objets.html) ;
    la phrase pivot s'écrit au centre, un mot à la fois (« Ça, c'était avant. »), et la couleur bat
    à chaque mot ; puis la couleur se resserre en un disque plein sur sa nuit, trois anneaux fins
    apparaissent autour ; le disque se pose, bat deux fois (avec, s'il le faut, le nom de l'offre
    dedans), puis s'ouvre jusqu'à remplir l'écran : la scène messages-verre-vertical.html commence
    sur sa couleur pleine. En 9:16, le disque reste au centre, un peu plus grand (320 puis 200 px
    de rayon), ses anneaux sont plus larges pour occuper la hauteur ; la phrase pivot passe à 64 px.

    À remplacer :
      1. L'identifiant « t04-orbe » partout (racine, scène, préfixe des ids, clé de la timeline).
      2. PIVOT : la phrase de bascule, courte et complète, un mot à la fois, sur la voix ou les
         temps. Elle dit que le problème appartient au passé, sans promettre un résultat.
      3. NOM : "" par défaut ; le nom de l'offre s'il doit apparaître dans le disque (le pivot qui
         révèle l'offre, sans avant / après dans le plan).
      4. Les instants (MOMENTS) si la musique l'exige ; garde l'ordre (phrase, disque, battement,
         ouverture).
    Couleurs : celles de sa marque, rien d'autre : le disque est sa couleur pleine, sans lueur ni
    dégradé ; la nuit autour est sa couleur sombre ; les anneaux, un blanc en transparence ; la
    phrase posée sur sa couleur est en var(--brand-contrast).
  -->
</head>
<body>
<template>
  <style>
    #t04-orbe {
      --t04-nuit: var(--brand-sombre);
      background: var(--t04-nuit);
    }
    #t04-orbe .t04-orbe-anneau { position: absolute; left: 540px; top: 960px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.22); }
    #t04-orbe .t04-orbe-disque { position: absolute; inset: 0; overflow: hidden; background: var(--brand-accent); }
    #t04-orbe .t04-orbe-pouls { position: absolute; inset: 0; background: #ffffff; }
    #t04-orbe .t04-orbe-texte {
      position: absolute; left: 0; right: 0; top: 922px; text-align: center; white-space: nowrap; z-index: 5;
      font-family: var(--brand-font-body); font-weight: 400; font-size: 64px; letter-spacing: -0.02em; color: var(--brand-contrast);
    }
    #t04-orbe .t04-orbe-texte span { display: inline-block; margin: 0 0.12em; }
    #t04-orbe .t04-orbe-nom {
      position: absolute; left: 0; right: 0; top: 935px; text-align: center; white-space: nowrap; z-index: 5;
      font-family: var(--brand-font-display); font-weight: 600; font-size: 50px; line-height: 1; letter-spacing: -0.02em; color: var(--brand-contrast);
    }
  </style>

  <div data-composition-id="t04-orbe" data-width="1080" data-height="1920" data-duration="4" style="position:absolute; inset:0;">
    <div id="t04-orbe" class="k-scene">
      <div id="t04-orbe-anneaux"></div>
      <div class="t04-orbe-disque" id="t04-orbe-disque" data-layout-allow-overflow>
        <div class="t04-orbe-pouls" id="t04-orbe-pouls"></div>
      </div>
      <div class="t04-orbe-texte" id="t04-orbe-texte"></div>
      <div class="t04-orbe-nom" id="t04-orbe-nom"></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 4.0, ID = "t04-orbe", tl = gsap.timeline({ paused: true });
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var PIVOT = [["Ça,", 0.15], ["c'était", 0.42], ["avant.", 0.72]];
      var NOM = "";
      var MOMENTS = { disque: 1.0, orbe: 1.55, battement: 2.35, ouverture: 3.0 };
      var CX = 540, CY = 960, R_DISQUE = 320, R_ORBE = 200;

      // La phrase pivot, un mot à la fois (coupe sèche, sans glissement).
      var texte = $("texte");
      var mots = PIVOT.map(function (m) { var s = K.el(texte, "span", null, m[0]); K.cacher(s); tl.set(s, { opacity: 1 }, m[1]); return s; });
      // À chaque mot, la couleur bat une fois (un éclair blanc très bref, qui s'éteint en 0,35 s).
      var pouls = $("pouls");
      K.cacher(pouls);
      PIVOT.forEach(function (m) { tl.fromTo(pouls, { opacity: 0.14 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, m[1]); });
      tl.to(mots, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, MOMENTS.orbe - 0.1);

      // La couleur se resserre en disque plein ; les anneaux apparaissent autour.
      var disque = $("disque");
      var cercle = function (r) { return "circle(" + r + "px at " + CX + "px " + CY + "px)"; };
      gsap.set(disque, { clipPath: cercle(1250) });
      tl.to(disque, { clipPath: cercle(R_DISQUE), duration: 0.6, ease: "power3.inOut" }, MOMENTS.disque);
      tl.to(disque, { clipPath: cercle(R_ORBE), duration: 0.8, ease: "expo.out" }, MOMENTS.orbe);
      var anneaux = [460, 740, 1080].map(function (r) {
        return K.el($("anneaux"), "div", "t04-orbe-anneau", null, "width:" + r * 2 + "px; height:" + r * 2 + "px; margin:" + -r + "px 0 0 " + -r + "px;");
      });
      K.cacher(anneaux);
      tl.fromTo(anneaux, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out", stagger: 0.08 }, MOMENTS.disque + 0.3);
      tl.to(anneaux, { scale: 1.06, duration: D - MOMENTS.orbe, ease: "none" }, MOMENTS.orbe);

      // Le disque se pose et bat deux fois ; les anneaux répondent au second battement.
      gsap.set(disque, { transformOrigin: CX + "px " + CY + "px" });
      var bat = function (t, echelle, monte, descend) {
        tl.to(disque, { scale: echelle, duration: monte, ease: "power2.out" }, t);
        tl.to(disque, { scale: 1, duration: descend, ease: "back.out(2.5)" }, t + monte);
      };
      bat(MOMENTS.orbe + 0.4, 1.04, 0.2, 0.22);
      bat(MOMENTS.battement + 0.05, 1.06, 0.18, 0.35);
      tl.to(anneaux, { opacity: 0.55, duration: 0.15, ease: "power2.out", stagger: 0.05 }, MOMENTS.battement + 0.1);
      tl.to(anneaux, { opacity: 1, duration: 0.4, ease: "power1.out", stagger: 0.05 }, MOMENTS.battement + 0.3);

      // Le nom de l'offre dans le disque (seulement s'il est donné).
      var nom = $("nom");
      if (NOM) {
        nom.textContent = NOM;
        K.cacher(nom);
        tl.fromTo(nom, { opacity: 0, scale: 0.9, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, MOMENTS.orbe + 0.25);
        tl.to(nom, { opacity: 0, scale: 1.2, duration: 0.25, ease: "power2.in" }, MOMENTS.ouverture);
      } else nom.remove();

      // Le disque s'ouvre sur tout l'écran ; les anneaux s'éloignent.
      tl.to(disque, { clipPath: cercle(1250), duration: 0.85, ease: "power3.in" }, MOMENTS.ouverture);
      tl.to(anneaux, { scale: 1.8, opacity: 0, duration: 0.85, ease: "power3.in" }, MOMENTS.ouverture);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
