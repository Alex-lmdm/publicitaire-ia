  <!--
    STYLE N°5 « INTERRUPTEURS EN CASCADE » · SCÈNE 4 : LA FENÊTRE QUI TRAVAILLE, PUIS L'ANNONCE
    (18,5 s avec les textes d'exemple)

    Ce qu'elle montre : la fenêtre plein écran de l'espace du membre (la fin de la scène 3 :
    salut + champ). La main ouvre le menu « + » : les interrupteurs de l'offre s'allument encore
    en cascade (le motif revient). On tape une demande, on l'envoie : la bulle monte, les étapes
    arrivent une à une avec leur icône, révélées de gauche à droite, et se cochent. Puis tout
    s'efface sur la carte d'annonce (pastille + titre sur deux lignes), et la signature finale : le
    nom de l'offre en grand (le mot héros de la fin), avec sa pastille de couleur ou son logo.
    Rôle : la démonstration courte, l'offre (ce qui est nouveau) et la signature.
    Rien ne part avant d'être lu (0,3 s par mot + 0,8 s : `studio_motion.py lecture`) : le menu,
    la demande tapée, les étapes (jusqu'à ce que toutes se lisent), le titre de la carte, la
    signature 3 s (l'écran final). La caméra se tient pendant qu'on lit, et les mots ne bougent pas
    (aucun coup au clic : la main et l'interface font le geste) ; un recadrage net seulement entre
    deux temps (du menu au champ, du champ aux étapes).
    Durée : la scène la calcule (D dans le script) ; reporte-la dans data-duration (ici et sur
    l'hôte).

    Format : 16:9. En 9:16, change data-width / data-height de la racine : la fenêtre et la carte
    se centrent seules (le contenu de la fenêtre est réduit à 86 %, ses textes restent au-dessus de
    28 px).

    À remplacer : l'objet EXEMPLE, en tête du script (chaque champ dit ce qu'il montre), et l'id
    « t05-annonce » partout (rechercher-remplacer) par l'id de la scène dans index.html. Le champ,
    la demande et les étapes ne valent que si son offre a vraiment un champ de demande (un outil
    d'IA, un assistant qu'on pilote en écrivant) : sinon, la fenêtre montre l'écran réel de son
    espace ou de son logiciel (une vraie capture, ou reconstruit d'après capture), ou la scène
    garde seulement la carte d'annonce et la signature. Police des titres : celle de la marque
    (--t05-titres).
    Ne pas toucher : la fenêtre au début (raccord avec la scène 3).
  -->
</head>

  <script>
    (function () {
      // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire (ici, une formation
      // d'exemple avec un assistant : aucun de ces textes n'est un fait).
      var EXEMPLE = {
        SALUT: "Bonjour, Léa",                              // le titre de la fenêtre : le même qu'en scène 3 (SALUTS[0])
        ACCUEIL: "Que veux-tu apprendre aujourd'hui ?",     // le texte gris du champ : le même qu'en scène 3
        MENU: [["book-open", "Module 1 · Les bases"], ["play", "Les vidéos"], ["list-checks", "Les exercices"], ["file-text", "Les modèles"], ["gift", "Les bonus"]],   // 4 ou 5 éléments de l'offre (les rangs de la scène 1)
        DEMANDE: "Prépare mon plan pour la semaine",        // ce que le membre demande vraiment dans son outil
        ETAPES: [["book-open", "Lecture du module 1…", ""], ["list-checks", "Choix de tes exercices…", ""], ["calendar", "Ton plan de la semaine…", ""]],   // ce que l'offre fait, en vrai : [icône du kit, texte, sa vraie capture (facultative), qui sort quand l'étape se coche]
        PASTILLE: "Nouveau",                                // « Nouveau », « Bonus », « Bientôt »…
        TITRE: ["Ton nouveau module", "est disponible"],    // l'annonce : deux lignes, 8 mots au plus
        FORT: "nouveau",                                    // le mot du titre surligné d'un bloc plein pendant la tenue ("" : aucun)
        NOM: "Ton offre",                                   // le nom de l'offre (la signature)
        LOGO: ""                                            // le logo du projet (ex. "brand/logo.svg") ; vide : la pastille de couleur de la marque
      };
      var ID = "t05-annonce";
      var SALUT = EXEMPLE.SALUT, ACCUEIL = EXEMPLE.ACCUEIL, MENU = EXEMPLE.MENU, DEMANDE = EXEMPLE.DEMANDE, ETAPES = EXEMPLE.ETAPES;
      var PASTILLE = EXEMPLE.PASTILLE, TITRE = EXEMPLE.TITRE, FORT = EXEMPLE.FORT, NOM = EXEMPLE.NOM, LOGO = EXEMPLE.LOGO;

      // Le temps de lecture du studio (`studio_motion.py lecture`) : 0,3 s par mot + 0,8 s, 1,5 s au
      // moins ; l'écran final 3 s.
      function lecture(t, plancher) { var n = [].concat(t).join(" ").split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length; return Math.ceil(Math.max(plancher || 1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10; }
      // Le menu reste le temps qu'on lise ses réglages ; la demande tapée reste le temps de sa lecture
      // avant l'envoi. Tout ce qui suit l'envoi est décalé de S.
      var FM = 2.45;                                                          // le menu se ferme, la caméra va au champ
      var TT = FM + 0.2;                                                      // la demande se tape (0,8 s)
      var ENV = Math.max(TT + 0.9, TT + lecture(DEMANDE) - 0.4);              // l'envoi
      var S = ENV - 3.05;
      // Les étapes restent jusqu'à ce que toutes se lisent (de la première qui s'écrit), la carte
      // d'annonce le temps de lire son titre, la signature 3 s.
      var T_ETAPES = 3.85 + S, XE = T_ETAPES + Math.max(lecture(ETAPES.map(function (e) { return e[1]; })), 0.38 * (ETAPES.length - 1) + 0.85 + 1.5);
      var OA = XE - 5.1;                                                      // décalage de la carte d'annonce (5,55 s + OA)
      var nT2 = TITRE[TITRE.length - 1].split(" ").length;
      var XT = 5.9 + OA + 0.07 * (nT2 - 1) + 0.7 + lecture(TITRE);           // le titre sort, lu
      var OS = XT - 7.1;                                                      // décalage de la signature (7,45 s + OS)
      var D = Math.ceil((7.75 + OS + 0.6 + 3) * 10 - 1e-9) / 10;             // le nom écrit, puis 3 s
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
      var tl = gsap.timeline({ paused: true }), cam = $("cam");
      function main(hote) {
        var e = K.el(hote, "div", "t05-main");
        e.id = ID + "-main";
        e.setAttribute("data-layout-allow-overflow", "");
        e.innerHTML = '<svg viewBox="0 0 40 46"><path d="M13 5C13 3.3 14.3 2 16 2C17.7 2 19 3.3 19 5L19 16.5C19.6 16.2 20.3 16 21 16C22.7 16 24 17.2 24.3 18.6C24.9 18.2 25.6 18 26.4 18C28 18 29.3 19.2 29.6 20.6C30.2 20.2 30.9 20 31.6 20C33.5 20 35 21.5 35 23.4L35 31C35 37.1 30.1 42 24 42L21.6 42C18.6 42 15.8 40.6 14 38.2L6.3 28.3C5.2 26.9 5.5 24.9 6.9 23.9C8.2 22.9 10 23.1 11 24.3L13 26.8Z" style="fill: var(--brand-clair); stroke: var(--brand-sombre);" stroke-width="1.7" stroke-linejoin="round"/><path d="M19 16.5V24M24.3 18.6V25M29.6 20.6V26" fill="none" style="stroke: var(--brand-sombre);" stroke-width="1.5" stroke-linecap="round"/></svg>';
        gsap.set(e.querySelector("svg"), { transformOrigin: "40% 4%" });
        return e;
      }
      // Caméra : échelle s autour du point P du monde, qui se pose au point V de l'image.
      function vers(s, P, V) { V = V || P; return { scale: s, x: V[0] - L / 2 - s * (P[0] - L / 2), y: V[1] - H / 2 - s * (P[1] - H / 2) }; }
      function recadre(t, s, P, V, duree, ease) { tl.to(cam, Object.assign(vers(s, P, V), { duration: duree || 0.7, ease: ease || "power3.inOut" }), t); }
      function clic(e, t) { var s = e.querySelector("svg"); tl.to(s, { scale: 0.86, duration: 0.08, ease: "power2.out" }, t).to(s, { scale: 1, duration: 0.25, ease: "back.out(1)" }, t + 0.08); }
      function allumer(inter, t) {
        tl.to(inter.querySelector(".t05-bille"), { x: 28, duration: 0.24, ease: "power3.inOut" }, t);
        tl.to(inter.querySelector(".t05-plein"), { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
        tl.fromTo(inter, { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.04);
      }

      var aJour = [];
      function selon(fn) { aJour.push(fn); }
      var horloge = { t: 0 };
      tl.to(horloge, { t: D, duration: D, ease: "none", onUpdate: function () { aJour.forEach(function (f) { f(horloge.t); }); } }, 0);
      function prog(t, t0, duree, ease) { return t <= t0 ? 0 : t >= t0 + duree ? 1 : gsap.parseEase(ease || "power2.inOut")((t - t0) / duree); }
      function mots(hote, lignes) { hote.innerHTML = lignes.map(function (l) { return '<span class="t05-ligne">' + l.split(" ").map(function (m) { return '<span class="t05-mot">' + m + "</span>"; }).join(" ") + "</span>"; }).join(""); return hote.querySelectorAll(".t05-mot"); }

      // --- La fenêtre (identique à la fin de la scène 3) --------------------------------------
      var mini = $("mini");
      if (vertical) gsap.set(mini, { scale: 0.86 });
      $("salut").textContent = SALUT;
      $("place").textContent = ACCUEIL;
      $("envoi").innerHTML = K.ic("arrow-up");

      // 1. Le menu « + » : les interrupteurs de l'offre s'allument encore en cascade
      var menu = $("menu"), inters = [];
      MENU.forEach(function (r) { var e = K.el(menu, "div", "t05-rang", '<span class="t05-ico">' + K.ic(r[0]) + "</span><span>" + r[1] + '</span><div class="t05-inter"><div class="t05-plein"></div><div class="t05-bille"></div></div>'); inters.push(e.querySelector(".t05-inter")); });
      gsap.set(menu, { left: 70, top: 300, transformOrigin: "30px 0px", scale: 0.6, opacity: 0 });
      gsap.set(racine.querySelectorAll(".t05-plein"), { opacity: 0 });
      // Position à l'écran d'un point de la fenêtre (le contenu est centré, réduit en 9:16).
      var k = vertical ? 0.86 : 1, ecran = function (x, y) { return [L / 2 + (x - 550) * k, H / 2 + (y - 200) * k]; };
      // Après le menu, la caméra s'approche du champ (×1,28 autour de son centre, ×1,12 en 9:16 pour
      // qu'il reste entier), puis se tient pendant qu'on lit la demande : le bouton d'envoi est visé
      // là où il est au moment du clic.
      var Z = vertical ? 1.12 : 1.28, ZE = Z, o = ecran(550, 265), plus = ecran(48, 314), envoi = [o[0] + (1015 - 550) * ZE * k, o[1] + (293 - 265) * ZE * k];
      var hand = main($("main-calque")), plusV = [plus[0] + 14 * k, plus[1] - 10 * k];
      gsap.set(hand, { x: L + 140, y: H * 0.85 });
      tl.to(hand, { x: plusV[0], y: plusV[1], duration: 0.6, ease: "power3.out" }, 0.15);
      clic(hand, 0.78);
      // Pendant le menu, la caméra se tient (on lit ses réglages), sans coup au clic.
      tl.to(menu, { scale: 1, duration: 0.32, ease: "back.out(1)" }, 0.82).to(menu, { opacity: 1, duration: 0.19, ease: "power2.out" }, 0.82);
      inters.forEach(function (it, i) { allumer(it, 1.12 + i * 0.1); });
      tl.to(hand, { x: plusV[0] + 380 * k, y: plusV[1] + 150 * k, duration: 0.6, ease: "power2.inOut" }, 1.0);
      tl.to(menu, { scale: 0.96, opacity: 0, duration: 0.22, ease: "power2.in" }, FM);

      // 2. Un recadrage net vers le champ (entre le menu et la demande), la demande est tapée, tenue
      //    le temps de sa lecture, puis envoyée ; la caméra se tient pendant ce temps
      recadre(FM, Z, o, o, 0.6, "power3.inOut");
      var tape = $("tape");
      K.cacher(tape);
      tl.set(tape, { opacity: 1 }, TT);
      K.taper(tl, tape, DEMANDE, TT, TT + 0.8, D);
      tl.set($("place"), { opacity: 0 }, TT);
      tl.set($("envoi"), { attr: { "data-actif": "oui" } }, TT + 0.15);
      tl.to(hand, { x: envoi[0], y: envoi[1], duration: 0.55, ease: "power3.inOut" }, ENV - 0.6);
      clic(hand, ENV);
      recadre(ENV + 0.12, 1, [L / 2, H / 2], [L / 2, H / 2], 0.5, "power3.inOut");
      tl.to(hand, { x: L + 160, y: H * 0.9, duration: 0.6, ease: "power3.in" }, 3.3 + S);
      tl.to(mini, { y: -120, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 3.15 + S);

      // 3. La bulle monte, les étapes arrivent (révélées de gauche à droite)
      var travail = $("travail"), bulle = $("bulle");
      K.cacher(travail);
      tl.set(travail, { opacity: 1 }, 3.35 + S);
      if (vertical) gsap.set(travail, { left: 70, right: 70, top: H / 2 - 420 });
      bulle.textContent = DEMANDE;
      gsap.set(bulle, { opacity: 0, y: 60 });
      tl.to(bulle, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 3.4 + S);
      ETAPES.forEach(function (e, i) {
        var et = K.el($("etapes"), "div", "t05-etape", '<span class="t05-ico">' + K.ic(e[0]) + "</span><span class=\"t05-txt\">" + e[1] + "</span>", "top:" + (230 + i * 130) + "px;");
        var t0 = 3.75 + S + i * 0.38, txt = et.querySelector(".t05-txt");
        gsap.set(et.querySelector(".t05-ico"), { scale: 0.5, opacity: 0 });
        tl.to(et.querySelector(".t05-ico"), { scale: 1, duration: 0.4, ease: "back.out(1)" }, t0).to(et.querySelector(".t05-ico"), { opacity: 1, duration: 0.24, ease: "power2.out" }, t0);
        // l'étape faite se coche (l'interface réagit) : son icône devient une coche, avec un petit rebond
        var ico = et.querySelector(".t05-ico"), coche = K.el(ico, "span", "t05-coche", K.ic("check"));
        gsap.set(coche, { position: "absolute", display: "grid", placeItems: "center", inset: 0, opacity: 0 });
        ico.style.position = "relative";
        var tc = Math.min(XE - 0.6, t0 + 1.3 + i * 0.35);
        tl.to(ico.querySelector("svg"), { opacity: 0, duration: 0.12 }, tc);
        tl.to(coche, { opacity: 1, duration: 0.12 }, tc);
        tl.fromTo(ico, { scale: 1 }, { scale: 1.15, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, tc);
        // ce que l'étape produit sort en aperçu flottant : sa vraie capture, dans une carte qui surgit
        // (sans fondu : une capture à demi transparente salit ses couleurs), et repart d'un coup
        if (e[2]) {
          var ap = K.el($("travail"), "div", "t05-apercu"), im = K.el(ap, "img"), place = vertical
            ? { x: i * 315, y: 650, h: 300 } : { x: 900 + i * 70, y: 120 + i * 210, h: 250 };
          im.alt = ""; im.src = e[2];
          var poser = function (r) { var w = Math.min(place.h * r, vertical ? 290 : 470), h = w / r; gsap.set(ap, { left: place.x, top: place.y, width: w, height: h }); };
          poser(16 / 9); im.onload = function () { poser(im.naturalWidth / Math.max(1, im.naturalHeight)); };
          K.cacher(ap);
          tl.set(ap, { opacity: 1 }, tc + 0.05);
          tl.fromTo(ap, { scale: 0.3, y: 50, rotation: i % 2 ? 6 : -6 }, { scale: 1, y: 0, rotation: i % 2 ? 2 : -2, duration: 0.45, ease: "back.out(1)", immediateRender: false }, tc + 0.05);
          tl.set(ap, { opacity: 0 }, XE);
        }
        // La ligne se révèle de gauche à droite (un masque qui glisse), comme une IA qui écrit
        txt.style.webkitMaskImage = txt.style.maskImage = "linear-gradient(90deg, #000 0%, #000 40%, transparent 60%)";
        txt.style.webkitMaskSize = txt.style.maskSize = "250% 100%";
        selon(function (t) { var v = (100 * (1 - prog(t, t0 + 0.1, 0.75, "power1.inOut"))).toFixed(1) + "% 0"; txt.style.webkitMaskPosition = v; txt.style.maskPosition = v; });
      });
      // pendant qu'on lit les étapes, rien ne bouge sous elles : la vie vient d'elles (elles s'écrivent,
      // se cochent, leurs aperçus surgissent)
      tl.to(travail, { opacity: 0, filter: "blur(12px)", duration: 0.35, ease: "power2.in" }, XE);

      // 4. La carte d'annonce : pastille + titre
      var fin = $("fin"), titre = $("titre");
      $("pastille").textContent = PASTILLE;
      var tMots = mots(titre, TITRE);
      // le mot fort : un bloc plein de l'accent derrière lui, qui s'ouvre par un volet au milieu de la tenue
      var fort = Array.prototype.filter.call(tMots, function (m) { return FORT && m.textContent.replace(/[.,!?]/g, "").toLowerCase() === FORT.toLowerCase(); })[0], bloc = null;
      // (l'accent ; l'encre si l'accent est trop pâle sur le clair, comme le trait des scènes 1 et 2)
      var csA = getComputedStyle(racine), lumA = function (c) { var x = document.createElement("canvas").getContext("2d"); x.fillStyle = "#000"; x.fillStyle = c.trim(); var v = x.fillStyle, r = [parseInt(v.substr(1, 2), 16), parseInt(v.substr(3, 2), 16), parseInt(v.substr(5, 2), 16)]; return r.map(function (u) { u /= 255; return u <= 0.03928 ? u / 12.92 : Math.pow((u + 0.055) / 1.055, 2.4); }).reduce(function (s, u, i) { return s + u * [0.2126, 0.7152, 0.0722][i]; }, 0); };
      var la = lumA(csA.getPropertyValue("--brand-accent")), lc = lumA(csA.getPropertyValue("--brand-clair")), blocAccent = (Math.max(la, lc) + 0.05) / (Math.min(la, lc) + 0.05) >= 2;
      if (fort) { fort.classList.add("t05-fort"); fort.innerHTML = '<span class="t05-fort-txt">' + fort.innerHTML + "</span>"; bloc = K.el(fort, "span", "t05-bloc"); bloc.style.background = blocAccent ? "var(--brand-accent)" : "var(--t05-encre)"; gsap.set(bloc, { opacity: 0 }); }
      K.cacher($("pastille")); K.cacher(tMots);
      // La pastille (une étiquette) et le titre paraissent nets, sans montée ni flou : le mot fort
      // a son geste (le bloc plein), le reste se lit.
      K.apparition(tl, $("pastille"), 5.55 + OA);
      var lignes = titre.querySelectorAll(".t05-ligne");
      K.apparition(tl, lignes[0].querySelectorAll(".t05-mot"), 5.65 + OA, { decalage: 0.04 });
      if (lignes[1]) K.apparition(tl, lignes[1].querySelectorAll(".t05-mot"), 5.9 + OA, { decalage: 0.04 });
      // La carte et la signature arrivent avec un léger recul de la caméra (leur apparition), puis
      // elles se tiennent immobiles.
      tl.fromTo(cam, { scale: 1.08, x: 0, y: 0 }, { scale: 1, duration: 1.1, ease: "expo.out", immediateRender: false }, 5.5 + OA);
      tl.fromTo(cam, { scale: 1.1 }, { scale: 1, duration: 1.0, ease: "expo.out", immediateRender: false }, 7.42 + OS);
      var tb = 5.9 + OA + 0.07 * (nT2 - 1) + 0.7 + 0.35;        // peu après que le titre est posé
      if (bloc) {
        tl.set(bloc, { opacity: 1 }, tb);
        tl.set(fort, { color: (blocAccent ? csA.getPropertyValue("--brand-contrast") : csA.getPropertyValue("--t05-carte")).trim() }, tb);
        tl.fromTo(bloc, { scaleX: 0.85 }, { scaleX: 1, duration: 0.25, ease: "back.out(1)", immediateRender: false }, tb);
        tl.set(bloc, { opacity: 0 }, XT - 0.15);
        tl.set(fort, { color: csA.getPropertyValue("--t05-encre").trim() }, XT - 0.15);
      }
      // puis la pastille se remplit de l'encre (l'annonce se confirme), au milieu de ce qui reste à lire
      var tp = (tb + 0.3 + XT) / 2 - 0.1;
      // (d'un coup : un fondu croisé du fond et du texte passerait par un contraste illisible)
      tl.set($("pastille"), { backgroundColor: getComputedStyle(racine).getPropertyValue("--t05-encre").trim(), color: getComputedStyle(racine).getPropertyValue("--t05-carte").trim() }, tp);
      tl.fromTo($("pastille"), { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, tp);
      tl.to([$("pastille")].concat(Array.prototype.slice.call(tMots)), { opacity: 0, filter: "blur(12px)", duration: 0.35, ease: "power2.in", stagger: 0.02 }, XT);

      // 5. La signature : la pastille de la marque (ou le logo) tourne et se pose, le nom s'écrit
      var marque = $("marque"), nom = $("nom"), sig = $("signature");
      marque.innerHTML = LOGO ? '<img src="' + LOGO + '" alt="">' : "<i></i>";
      nom.textContent = NOM;
      gsap.set(marque, { scale: 0, rotation: -120 });

      tl.to(marque, { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1)" }, 7.45 + OS);
      selon(function (t) { nom.style.clipPath = "inset(-10% " + (100 - 100 * prog(t, 7.75 + OS, 0.4, "power3.out")).toFixed(1) + "% -10% 0%)"; });

      // Mise en place verticale des deux cartes finales (mesurées après chargement des polices)
      var cs = getComputedStyle(titre);
      document.fonts.load(cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily).then(poser, poser);
      // Un salut long se réduit pour rester entier pendant les gros plans de la caméra (en 9:16,
      // 840 px de la fenêtre au plus, son point compris) ; la scène 3 et la scène 4 suivent la même
      // règle, le raccord reste exact.
      function ajusterSalut(hote) {
        var max = vertical ? 840 : 1040;
        hote.querySelectorAll(".t05-accueil").forEach(function (a) {
          var s = a.querySelector("span"), l = s ? s.offsetWidth + 48 : 0;
          if (l > max) a.style.fontSize = (64 * (max - 48) / s.offsetWidth).toFixed(1) + "px";
        });
      }
      function poser() {
        ajusterSalut(racine);
        var large = 0;
        lignes.forEach(function (l) { var ms = l.querySelectorAll(".t05-mot"), d = ms[ms.length - 1]; large = Math.max(large, d.offsetLeft + d.offsetWidth - ms[0].offsetLeft); });
        var maxL = L - (vertical ? 120 : 400);
        // (une police de marque plus large se réduit ; une annonce trop longue se coupe dans le script)
        if (large > maxL) titre.style.fontSize = (80 * Math.max(maxL / large, 0.6)).toFixed(1) + "px";
        // la signature, mot héros de la fin : le nom et sa pastille remplissent 62 % de la largeur
        // (la pastille et l'écart suivent la taille du nom : 0,62 em et 0,27 em)
        var lNom = nom.offsetWidth;
        sig.style.fontSize = Math.min(260, Math.max(112, 112 * 0.62 * L / (lNom + 100))).toFixed(1) + "px";
        gsap.set(fin, { top: H / 2 - fin.offsetHeight / 2 - 10 });
        gsap.set(sig, { top: H / 2 - sig.offsetHeight / 2 });
        aJour.forEach(function (f) { f(0); });
        window.__timelines[ID] = tl;
      }
    })();
  </script>
