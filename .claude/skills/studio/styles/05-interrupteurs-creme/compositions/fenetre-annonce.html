  <!--
    TEMPLATE N°5 « INTERRUPTEURS » · SCÈNE 4 : LA FENÊTRE QUI TRAVAILLE, PUIS L'ANNONCE (9 s)

    Ce qu'elle montre : la fenêtre plein écran de l'espace du membre (la fin de la scène 3 :
    salut + champ). La main ouvre le menu « + » : les interrupteurs de l'offre s'allument encore
    en cascade (le motif revient). On tape une demande, on l'envoie : la bulle monte, les étapes
    arrivent une à une avec leur icône, révélées de gauche à droite. Puis tout s'efface sur la
    carte d'annonce (pastille « Nouveau » + titre sur deux lignes), et la signature finale : le
    nom de l'offre, avec sa pastille de couleur ou le logo.
    Rôle : la démonstration courte, l'offre (ce qui est nouveau) et la signature.

    Format : 16:9. En 9:16, change data-width / data-height de la racine : la fenêtre et la carte
    se centrent seules (le contenu est réduit à 86 %).

    À REMPLACER :
      1. L'id « t05-annonce » partout (rechercher-remplacer) par l'id de la scène dans index.html.
      2. SALUT et ACCUEIL : les mêmes qu'en scène 3 (raccord).
      3. MENU : les éléments de l'offre (les mêmes que les rangs de la scène 1, 4 ou 5 suffisent).
      4. DEMANDE et ETAPES : ce que le membre demande et ce que l'offre fait, en vrai (si l'offre
         n'a pas de champ de demande, remplace le champ par l'écran réel de l'espace de formation
         ou du logiciel, d'après capture).
      5. PASTILLE (« Nouveau », « Bonus », « Bientôt »…), TITRE (deux lignes, 6 mots au plus),
         NOM (le nom de l'offre) et LOGO (chemin d'un logo du projet, ex. "brand/logo.svg" ;
         vide = la pastille de couleur de la marque).
      Police des titres : celle de la marque (--t05-titres). Marque sans police imposée : la serif
      du look (Source Serif 4), mode d'emploi dans style.md, section 4.
    Ne pas toucher : la fenêtre au début (raccord avec la scène 3).
  -->
</head>

  <div data-composition-id="t05-annonce" data-width="1920" data-height="1080" data-duration="9" style="position:absolute; inset:0;">

      var LOGO = ""; // ex. "brand/logo.svg" ; vide : la pastille de couleur de la marque

      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
      var tl = gsap.timeline({ paused: true }), cam = $("cam");
      function main(hote) {
        var e = K.el(hote, "div", "t05-main");
        e.id = ID + "-main";
        e.setAttribute("data-layout-allow-overflow", "");
        e.innerHTML = '<svg viewBox="0 0 40 46"><path d="M13 5C13 3.3 14.3 2 16 2C17.7 2 19 3.3 19 5L19 16.5C19.6 16.2 20.3 16 21 16C22.7 16 24 17.2 24.3 18.6C24.9 18.2 25.6 18 26.4 18C28 18 29.3 19.2 29.6 20.6C30.2 20.2 30.9 20 31.6 20C33.5 20 35 21.5 35 23.4L35 31C35 37.1 30.1 42 24 42L21.6 42C18.6 42 15.8 40.6 14 38.2L6.3 28.3C5.2 26.9 5.5 24.9 6.9 23.9C8.2 22.9 10 23.1 11 24.3L13 26.8Z" fill="#fff" stroke="#151515" stroke-width="1.7" stroke-linejoin="round"/><path d="M19 16.5V24M24.3 18.6V25M29.6 20.6V26" fill="none" stroke="#151515" stroke-width="1.5" stroke-linecap="round"/></svg>';
        gsap.set(e.querySelector("svg"), { transformOrigin: "40% 4%" });
        return e;
      }
      // Caméra : échelle s autour du point P du monde, qui se pose au point V de l'image.
      function vers(s, P, V) { V = V || P; return { scale: s, x: V[0] - L / 2 - s * (P[0] - L / 2), y: V[1] - H / 2 - s * (P[1] - H / 2) }; }
      function recadre(t, s, P, V, duree, ease) { tl.to(cam, Object.assign(vers(s, P, V), { duration: duree || 0.7, ease: ease || "expo.inOut" }), t); }

      function allumer(inter, t) {

      }
      // Ce qui dépend du temps sans tween possible (masque, découpe) : fonctions pures du temps.
      var aJour = [];
      function selon(fn) { aJour.push(fn); }
      var horloge = { t: 0 };
      tl.to(horloge, { t: D, duration: D, ease: "none", onUpdate: function () { aJour.forEach(function (f) { f(horloge.t); }); } }, 0);

      $("place").textContent = ACCUEIL;

      });

      var fin = $("fin"), titre = $("titre");
      $("pastille").textContent = PASTILLE;
      var tMots = mots(titre, TITRE);
      K.cacher($("pastille")); K.cacher(tMots);
      tl.fromTo($("pastille"), { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 5.55);
      var lignes = titre.querySelectorAll(".t05-ligne");
      K.entreeMots(tl, lignes[0].querySelectorAll(".t05-mot"), 5.65, { y: 10, flou: 12, duree: 0.7, decalage: 0.07, echelle: 1 });
      if (lignes[1]) K.entreeMots(tl, lignes[1].querySelectorAll(".t05-mot"), 5.9, { y: 10, flou: 12, duree: 0.7, decalage: 0.07, echelle: 1 });
      tl.fromTo(fin, { scale: 1 }, { scale: 1.025, duration: 1.6, ease: "sine.inOut", immediateRender: false }, 5.6);
      // La carte et la signature arrivent avec un léger recul de la caméra.
