    Ce qu'elle montre : un panneau de réglages de l'offre, vu de très près sur un papier crème. Une
    main clique l'interrupteur maître, les sept interrupteurs s'allument en cascade. La caméra
    recule et glisse : le panneau part au bord gauche, la phrase s'écrit au centre, un trait à main
    levée entoure les mots clés, puis les disques des membres apparaissent à droite. Le trait
    repart par le haut (il revient dans la scène 2, « trait-qui-relie »).
    Rôle : l'accroche d'une annonce (nouveau module, bonus, fonction), ou la démonstration « un
    clic suffit ».

    Format : 16:9 par défaut. En 9:16, change data-width / data-height de la racine (1080 × 1920) :
    la scène se remet en page seule (panneau en haut, phrase au milieu, membres en bas).

    À REMPLACER :
      1. L'id « t05-cascade » partout (rechercher-remplacer) par l'id de la scène (s1, s2…), le même
         que l'hôte dans index.html.
      2. L'onglet (« Ton offre ») et l'interrupteur maître (« Tout activer ») : le nom de l'offre ou
         de la partie annoncée.
      3. Les RANGS (tableau en tête du script) : les vrais éléments de l'offre (modules, bonus,
         fonctions), 5 à 7, avec une icône du kit (K.ic). Si l'offre branche des outils, leurs vrais
         logos (studio_motion.py logos), comme l'original.
      4. La phrase (les deux span.t05-ligne du HTML, 6 mots au plus) et les mots que le trait
         entoure (le span.t05-cle) : ce que la vidéo annonce, tiré de OFFRE.json.
      5. Les couleurs du look, en tête du style : --t05-papier (le crème), --t05-carte, --t05-encre.
         L'interrupteur allumé et les icônes prennent l'accent de la marque ; le trait aussi, sauf si
         l'accent est trop pâle sur le crème (jaune, pastel) : il passe alors à l'encre, tout seul.
      Police des titres : celle de la marque (--t05-titres). Marque sans police imposée : la serif
      du look (Source Serif 4), mode d'emploi dans style.md, section 4.
    Ne pas toucher : les temps de la cascade et du trait (ils raccordent avec la scène 2).
  -->

  <script>
    (function () {

      var RANGS = [

      var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
      var tl = gsap.timeline({ paused: true });

      // --- Outils du look (communs aux scènes du template 5) ---------------------------------
      // La couleur du trait : l'accent s'il se voit sur le papier (contraste 2 ou plus), sinon l'encre.
      function rvb(c) { var x = document.createElement("canvas").getContext("2d"); x.fillStyle = "#000"; x.fillStyle = c.trim(); var v = x.fillStyle; if (v[0] === "#") return [parseInt(v.substr(1, 2), 16), parseInt(v.substr(3, 2), 16), parseInt(v.substr(5, 2), 16)]; var m = v.match(/[\d.]+/g); return [+m[0], +m[1], +m[2]]; }
