<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°5 « INTERRUPTEURS EN CASCADE » · SCÈNE 1 : LES INTERRUPTEURS EN CASCADE (7,4 s pour 6 mots)

    Ce qu'elle montre : le panneau de réglages de l'offre, vu de près sur un papier clair : tout le
    panneau à l'image, chaque réglage lisible. Une main clique l'interrupteur maître, les autres
    s'allument en cascade ; la caméra ne fait qu'une dérive lente (aucun coup de caméra au clic).
    Elle recule d'un coup, entre le panneau et la phrase : le panneau reste en témoin au bord, la
    phrase s'écrit au centre. Pendant sa lecture, une dérive lente seulement, et la vie vient de ce
    qu'elle montre : le trait à main levée entoure ses mots clés, les disques des membres surgissent,
    les mots clés se surlignent d'un bloc plein, puis le trait repart par le haut (il revient dans
    la scène 2, « trait-qui-relie »). La caméra revient au plan large pendant que la phrase sort.
    Durée : 4,8 s + la lecture de la phrase (0,3 s par mot + 0,8 s : `studio_motion.py lecture`) :
    7,4 s pour 6 mots, 8 s pour 8. Reporte-la dans data-duration (ici et sur l'hôte).
    Rôle : l'accroche d'une annonce (un module, un bonus, une fonction), ou « un clic suffit ».

    Format : 16:9 par défaut. En 9:16, change data-width / data-height de la racine (1080 × 1920) :
    la scène se remet en page seule (panneau en haut, phrase au milieu, membres en bas).

    À remplacer : l'objet EXEMPLE, en tête du script (chaque champ dit ce qu'il montre), et l'id
    « t05-cascade » partout (rechercher-remplacer) par l'id de la scène, le même que l'hôte dans
    index.html. Les couleurs sont celles de la marque (variables --t05-* en tête du style, qui ne
    font que nommer ses jetons) ; la police des titres, celle de la marque (--t05-titres).
    Ne pas toucher : les temps de la cascade et du trait (ils raccordent avec la scène 2), et la
    caméra : pendant que la phrase se lit, une dérive lente seulement.
  -->
</head>
<body>
<template>
  <style>
    #t05-cascade {
      /* La palette du style : les neutres de la marque et son accent plein, rien d'autre. Le papier
         est un gris très clair (son clair mêlé à son gris le plus clair), les cartes son clair,
         l'encre sa couleur sombre ; jamais une teinte crème inventée, jamais l'accent en transparence. */
      --t05-papier: color-mix(in srgb, var(--brand-clair) 58%, var(--brand-gris-4));
      --t05-carte: var(--brand-clair);
      --t05-pli: color-mix(in srgb, var(--brand-clair) 25%, var(--brand-gris-4));
      --t05-encre: var(--brand-sombre);
      --t05-gris: var(--brand-gris-3);
      --t05-gris-texte: var(--brand-gris-2);
      --t05-allume: var(--brand-accent);
      --t05-titres: var(--brand-font-display);
      --t05-texte: var(--brand-font-body);
      background: var(--t05-papier);
    }
    #t05-cascade .t05-cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
    #t05-cascade .t05-onglet {
      position: absolute; height: 88px; width: 400px; border-radius: 24px; background: var(--t05-pli);
      display: flex; align-items: center; gap: 16px; padding-left: 36px;
      font: 500 33px/1 var(--t05-texte); color: var(--t05-encre); letter-spacing: -0.01em;
    }
    #t05-cascade .t05-onglet svg { width: 34px; height: 34px; }
    #t05-cascade .t05-panneau {
      position: absolute; width: 632px; height: 743px; border-radius: 24px; background: var(--t05-carte);
      box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.07), 0 22px 50px rgba(0, 0, 0, 0.08), 0 3px 10px rgba(0, 0, 0, 0.04);
    }
    #t05-cascade .t05-rang {
      position: absolute; left: 55px; right: 55px; height: 60px; margin-top: -30px;
      display: flex; align-items: center; gap: 16px; white-space: nowrap;
      font: 400 28px/1 var(--t05-texte); color: var(--t05-encre);
    }
    #t05-cascade .t05-tete { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
    #t05-cascade .t05-filet { position: absolute; left: 55px; right: 55px; height: 1.5px; background: rgba(0, 0, 0, 0.12); }
    #t05-cascade .t05-ico {
      width: 36px; height: 36px; border-radius: 9px; flex: none; display: grid; place-items: center;
      background: var(--brand-accent); color: var(--brand-contrast);
    }
    #t05-cascade .t05-ico svg { width: 21px; height: 21px; }
    #t05-cascade .t05-inter {
      position: absolute; right: 0; top: 12px; width: 62px; height: 36px; border-radius: 18px;
      background: var(--t05-pli);
    }
    #t05-cascade .t05-plein {
      position: absolute; inset: 0; border-radius: 18px; background: var(--t05-allume);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.07);
    }
    #t05-cascade .t05-bille {
      position: absolute; left: 3px; top: 3px; width: 30px; height: 30px; border-radius: 50%; background: var(--t05-carte);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22), 0 2px 6px rgba(0, 0, 0, 0.12);
    }
    #t05-cascade .t05-membre {
      position: absolute; width: 178px; height: 178px; margin: -89px 0 0 -89px; border-radius: 50%;
      background: var(--t05-carte); color: var(--t05-gris-texte); display: grid; place-items: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1), 0 2px 5px rgba(0, 0, 0, 0.05);
    }
    #t05-cascade .t05-membre svg { width: 50%; height: 50%; }
    #t05-cascade .t05-titre {
      position: absolute; width: 1200px; text-align: center; white-space: nowrap;
      font: 400 80px/1.16 var(--t05-titres); letter-spacing: -0.02em; color: var(--t05-encre);
    }
    #t05-cascade .t05-ligne { display: block; }
    #t05-cascade .t05-mot, #t05-cascade .t05-cle { display: inline-block; }
    /* Les mots clés, surlignés d'un bloc plein pendant la lecture (l'accent, ou l'encre s'il est trop
       pâle), jamais en transparence. Un peu d'air avant eux : le trait les entoure sans toucher le mot voisin. */
    #t05-cascade .t05-cle { position: relative; z-index: 0; margin-left: 0.45em; }
    #t05-cascade .t05-cle .t05-mot { position: relative; z-index: 1; }
    #t05-cascade .t05-bloc { position: absolute; left: -0.18em; right: -0.18em; top: 0.02em; bottom: -0.06em; background: var(--brand-accent); z-index: 0; border-radius: 0.1em; }
    #t05-cascade .t05-traits { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    #t05-cascade .t05-traits path { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    #t05-cascade .t05-main { position: absolute; left: 0; top: 0; width: 100px; height: 115px; margin: -5px 0 0 -40px; z-index: 80; }
    #t05-cascade .t05-main svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.18)); }
  </style>

  <div data-composition-id="t05-cascade" data-width="1920" data-height="1080" data-duration="7.4" style="position:absolute; inset:0;">
    <div id="t05-cascade" class="k-scene">
      <div class="t05-cam" id="t05-cascade-cam" data-layout-allow-overflow>
        <div class="t05-onglet" id="t05-cascade-onglet" data-layout-allow-overflow><span id="t05-cascade-onglet-ic"></span><span id="t05-cascade-onglet-nom"></span></div>
        <div class="t05-panneau" id="t05-cascade-panneau" data-layout-allow-overflow>
          <div class="t05-rang t05-tete" style="top:76px;"><span id="t05-cascade-maitre-nom"></span>
            <div class="t05-inter" id="t05-cascade-maitre"><div class="t05-plein"></div><div class="t05-bille"></div></div>
          </div>
          <div class="t05-filet" style="top:132px;"></div>
          <div id="t05-cascade-rangs"></div>
        </div>
        <div id="t05-cascade-membres"></div>
        <div class="t05-titre" id="t05-cascade-titre">
          <span id="t05-cascade-lignes"></span>
          <svg class="t05-traits" id="t05-cascade-traits" width="10" height="10" data-layout-allow-overflow>
            <defs>
              <filter id="t05-cascade-rugueux" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="bruit"/>
                <feDisplacementMap in="SourceGraphic" in2="bruit" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
            </defs>
            <path id="t05-cascade-boucle" filter="url(#t05-cascade-rugueux)"/>
          </svg>
        </div>
      </div>
      <div id="t05-cascade-main-hote" style="position:absolute; inset:0; z-index:70;"></div>
    </div>
  </div>

  <script>
    (function () {
      // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire (ici, une formation
      // d'exemple : aucun de ces textes n'est un fait).
      var EXEMPLE = {
        ONGLET: "Ton offre",                       // l'onglet du panneau : le nom de l'offre ou de la partie annoncée ("" : pas d'onglet)
        MAITRE: "Tout activer",                    // l'interrupteur maître
        RANGS: [                                   // 5 à 7 vrais éléments de l'offre : [icône du kit, son nom], ou le vrai logo d'un outil branché
          ["book-open", "Module 1 · Les bases"],
          ["play", "Les vidéos"],
          ["list-checks", "Les exercices"],
          ["file-text", "Les modèles"],
          ["users", "La communauté"],
          ["calendar", "Les lives"],
          ["gift", "Les bonus"]
        ],
        PHRASE: ["Tout ton programme", "en un clic"],   // ce que la vidéo annonce : deux lignes, 8 mots au plus
        ENTOURE: "un clic"                         // les mots de la 2e ligne que le trait entoure
      };
      var ID = "t05-cascade";
      // Le temps de lecture du studio (`studio_motion.py lecture`) : 0,3 s par mot + 0,8 s, 1,5 s au moins.
      function lecture(n) { return Math.ceil(Math.max(1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10; }
      var RANGS = EXEMPLE.RANGS;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cam = $("cam"), panneau = $("panneau"), onglet = $("onglet");
      var titre = $("titre"), svg = $("traits"), boucle = $("boucle");
      var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
      var tl = gsap.timeline({ paused: true });
      $("onglet-nom").textContent = EXEMPLE.ONGLET;
      $("maitre-nom").textContent = EXEMPLE.MAITRE;
      // La phrase, mot par mot ; les mots à entourer (dans la dernière ligne) dans un span.t05-cle.
      $("lignes").outerHTML = EXEMPLE.PHRASE.map(function (l, n) {
        var ms = l.split(" "), cle = n === EXEMPLE.PHRASE.length - 1 ? EXEMPLE.ENTOURE.split(" ") : [], k = -1;
        for (var i = 0; cle.length && i + cle.length <= ms.length; i++) if (ms.slice(i, i + cle.length).join(" ") === cle.join(" ")) { k = i; break; }
        var m = function (x) { return '<span class="t05-mot">' + x + "</span>"; };
        if (k < 0) return '<span class="t05-ligne">' + ms.map(m).join(" ") + "</span>";
        return '<span class="t05-ligne">' + ms.slice(0, k).map(m).join(" ") + (k ? " " : "") + '<span class="t05-cle"' + (k ? "" : ' style="margin-left:0"') + ">" + cle.map(m).join(" ") + "</span>" + (k + cle.length < ms.length ? " " + ms.slice(k + cle.length).map(m).join(" ") : "") + "</span>";
      }).join("");
      if (!EXEMPLE.ONGLET) onglet.style.display = "none";
      // La phrase : ses deux lignes posées à FE, tenues le temps de leur lecture, sorties à X.
      var lignes = titre.querySelectorAll(".t05-ligne");
      var n2 = lignes[1].querySelectorAll(".t05-mot").length;
      var FE = 3.2 + 0.07 * (n2 - 1) + 0.7, X = FE + lecture(titre.querySelectorAll(".t05-mot").length);
      var D = Math.round((X + 0.75) * 10) / 10;   // 7,4 s pour 6 mots : reporte-la en data-duration

      // --- Outils du look (communs aux scènes du style 5) ---------------------------------
      // La couleur du trait : l'accent s'il se voit sur le clair (contraste 2 ou plus), sinon l'encre.
      function rvb(c) { var x = document.createElement("canvas").getContext("2d"); x.fillStyle = "#000"; x.fillStyle = c.trim(); var v = x.fillStyle; if (v[0] === "#") return [parseInt(v.substr(1, 2), 16), parseInt(v.substr(3, 2), 16), parseInt(v.substr(5, 2), 16)]; var m = v.match(/[\d.]+/g); return [+m[0], +m[1], +m[2]]; }
      function lum(c) { return rvb(c).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce(function (s, v, i) { return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0); }
      function contraste(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
      function couleurTrait() { var cs = getComputedStyle(racine), a = cs.getPropertyValue("--brand-accent"), p = cs.getPropertyValue("--brand-clair"); return contraste(a, p) >= 2 ? a.trim() : cs.getPropertyValue("--t05-encre").trim(); }
      // Courbe lisse passant par des points (Catmull-Rom vers Bézier).
      function chemin(p, n) { var d = "M" + p[0][0].toFixed(1) + " " + p[0][1].toFixed(1); for (var i = 0; i < Math.min(p.length - 1, n == null ? 1e9 : n); i++) { var a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c; d += " C" + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + " " + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + " " + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + " " + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + " " + c[0].toFixed(1) + " " + c[1].toFixed(1); } return d; }
      // Longueur du même chemin jusqu'au point n (mêmes points de contrôle que le chemin entier).
      function longueur(p, n) { var t = document.createElementNS("http://www.w3.org/2000/svg", "path"); t.setAttribute("d", chemin(p, n)); svg.appendChild(t); var l = t.getTotalLength(); svg.removeChild(t); return l; }
      // Un trait dont on montre le morceau [a, b] de sa longueur : il se dessine, voyage, repart.
      function morceau(path) { var Lp = path.getTotalLength(); return function (a, b) { var d = Math.max(0, b - a); path.style.strokeDasharray = d.toFixed(1) + " " + (Lp + 20).toFixed(0); path.style.strokeDashoffset = (-a).toFixed(1); path.style.opacity = d > 0.5 ? "1" : "0"; }; }
      // Valeur au temps t d'après des clés [[t, valeur, courbe], …] (fonction pure du temps).
      function cle(cles, t) { if (t <= cles[0][0]) return cles[0][1]; for (var i = 1; i < cles.length; i++) { if (t <= cles[i][0]) { var a = cles[i - 1], b = cles[i], p = (t - a[0]) / (b[0] - a[0]); p = gsap.parseEase(b[2] || "power2.inOut")(p); return a[1] + (b[1] - a[1]) * p; } } return cles[cles.length - 1][1]; }
      function selon(fn) { var o = { t: 0 }; tl.to(o, { t: D, duration: D, ease: "none", onUpdate: function () { fn(o.t); } }, 0); fn(0); }
      // La main : un pointeur dessiné, sa pointe est son point actif.
      function main(hote) {
        var e = K.el(hote, "div", "t05-main");
        e.id = ID + "-main";
        e.setAttribute("data-layout-allow-overflow", "");
        e.innerHTML = '<svg viewBox="0 0 40 46"><path d="M13 5C13 3.3 14.3 2 16 2C17.7 2 19 3.3 19 5L19 16.5C19.6 16.2 20.3 16 21 16C22.7 16 24 17.2 24.3 18.6C24.9 18.2 25.6 18 26.4 18C28 18 29.3 19.2 29.6 20.6C30.2 20.2 30.9 20 31.6 20C33.5 20 35 21.5 35 23.4L35 31C35 37.1 30.1 42 24 42L21.6 42C18.6 42 15.8 40.6 14 38.2L6.3 28.3C5.2 26.9 5.5 24.9 6.9 23.9C8.2 22.9 10 23.1 11 24.3L13 26.8Z" style="fill: var(--brand-clair); stroke: var(--brand-sombre);" stroke-width="1.7" stroke-linejoin="round"/><path d="M19 16.5V24M24.3 18.6V25M29.6 20.6V26" fill="none" style="stroke: var(--brand-sombre);" stroke-width="1.5" stroke-linecap="round"/></svg>';
        gsap.set(e.querySelector("svg"), { transformOrigin: "40% 4%" });
        return e;
      }
      // Caméra : échelle s autour du point P du monde, qui se pose au point V de l'image.
      function vers(s, P, V) { V = V || P; return { scale: s, x: V[0] - L / 2 - s * (P[0] - L / 2), y: V[1] - H / 2 - s * (P[1] - H / 2) }; }
      function recadre(t, s, P, V, duree, ease) { tl.to(cam, Object.assign(vers(s, P, V), { duration: duree || 0.7, ease: ease || "power3.inOut" }), t); }
      function clic(e, t) { var s = e.querySelector("svg"); tl.to(s, { scale: 0.86, duration: 0.08, ease: "power2.out" }, t).to(s, { scale: 1, duration: 0.25, ease: "back.out(1)" }, t + 0.08); }
      function allumer(inter, t, duree) {
        var plein = inter.querySelector(".t05-plein"), bille = inter.querySelector(".t05-bille");
        tl.to(bille, { x: 26, duration: duree || 0.24, ease: "power3.inOut" }, t);
        tl.to(plein, { opacity: 1, duration: (duree || 0.24) * 0.8, ease: "power2.out" }, t);
        tl.fromTo(inter, { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.04);
      }

      // --- Mise en page : 16:9 (panneau au bord gauche) ou 9:16 (panneau en haut) -----------
      var P = vertical ? { x: 224, y: 150 } : { x: -251, y: 172 };   // panneau, après le recul
      var T = vertical ? { x: L / 2, y: 1210 } : { x: L / 2, y: 540 }; // centre de la phrase
      var membres = [];
      if (vertical) { for (var c = 0; c < 4; c++) for (var r2 = 0; r2 < 2; r2++) membres.push([182 + c * 238, 1635 + r2 * 238]); }
      else { for (var c2 = 0; c2 < 2; c2++) for (var r = 0; r < 5; r++) membres.push([1606 + c2 * 235, 70 + r * 235]); }
      gsap.set(panneau, { left: P.x, top: P.y });
      gsap.set(onglet, { left: P.x - 332, top: P.y + 76 - 44 });
      if (vertical) titre.style.fontSize = "84px";
      gsap.set(titre, { left: T.x - 600, top: T.y - 93 });
      if (vertical) gsap.set(onglet, { opacity: 0 });

      // Le gros plan : tout le panneau à l'image, vu de près (chaque réglage se lit à plus de 28 px,
      // le panneau prend la moitié du cadre ou plus), puis le recul. GP : le point du panneau posé
      // en VG de l'image (en 9:16, l'interrupteur maître ; en 16:9, le milieu du panneau).
      var maitre = { x: P.x + 632 - 86, y: P.y + 76 };
      var s0 = vertical ? 1.45 : 1.5;
      var GP = vertical ? [maitre.x, maitre.y] : [P.x + 316, P.y + 368], VG = vertical ? [820, 430] : [1326, 540];
      gsap.set(cam, vers(s0, GP, VG));
      // l'interrupteur maître à l'image au moment du clic (la caméra a déjà un peu dérivé)
      var sClic = s0 * (1 + 0.04 * gsap.parseEase("sine.inOut")((0.95 - 0.05) / 2.1));
      var vise = { x: VG[0] + sClic * (maitre.x - GP[0]), y: VG[1] + sClic * (maitre.y - GP[1]) };

      // Les rangs
      var hoteRangs = $("rangs"), inters = [];
      RANGS.forEach(function (r, i) {
        var e = K.el(hoteRangs, "div", "t05-rang", '<span class="t05-ico">' + K.ic(r[0]) + "</span><span>" + r[1] + '</span><div class="t05-inter"><div class="t05-plein"></div><div class="t05-bille"></div></div>', "top:" + (195 + i * 77.5) + "px;");
        inters.push(e.querySelector(".t05-inter"));
      });
      $("onglet-ic").innerHTML = K.ic("layers");
      gsap.set(racine.querySelectorAll(".t05-plein"), { opacity: 0 });

      // Les disques des membres (ils restent pour la scène 2)
      var hoteM = $("membres"), discs = [];
      var icMembre = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.6"/><circle cx="12" cy="9.6" r="3.4"/><path d="M6.4 18.6a7 7 0 0 1 11.2 0"/></svg>';
      membres.forEach(function (m, i) { var e = K.el(hoteM, "div", "t05-membre", icMembre, "left:" + m[0] + "px; top:" + m[1] + "px;"); e.setAttribute("data-layout-allow-overflow", ""); discs.push(e); });
      K.cacher(discs, { scale: 0.4 });

      // --- La main et la cascade ------------------------------------------------------------
      var hand = main($("main-hote"));
      var mx = vise.x + 18, my = vise.y + 8; // la pointe sur la moitié droite de l'interrupteur
      gsap.set(hand, { x: L + 120, y: vertical ? 760 : 620 });
      tl.to(hand, { x: mx, y: my, duration: 0.75, ease: "power3.out" }, 0.15);
      clic(hand, 0.95);
      allumer($("maitre"), 0.98, 0.28);
      inters.forEach(function (inter, i) { allumer(inter, 1.18 + i * 0.105); });
      tl.to(hand, { x: mx + 60, y: my + 150, duration: 0.5, ease: "power2.inOut" }, 1.55);
      tl.to(hand, { x: L + 160, y: my + 260, duration: 0.6, ease: "power3.in" }, 2.05);

      // --- Le recul : le panneau part au bord, la phrase arrive ------------------------------
      // Pendant qu'on lit les réglages, une dérive lente seulement (4 %, sine.inOut : aucun coup de
      // caméra au clic, la main et les interrupteurs font le geste), puis un seul recul net, entre le
      // panneau et la phrase. Pendant que la phrase se lit, une dérive lente (3,5 %) ; la caméra ne
      // revient au plan large qu'une fois la phrase lue, pendant qu'elle sort (raccord scène 2).
      recadre(0.05, s0 * 1.04, GP, VG, 2.1, "sine.inOut");
      tl.to(cam, { scale: 1, x: 0, y: 0, duration: 1.0, ease: "power3.inOut" }, 2.15);
      recadre(3.15, 1.035, [L / 2, H / 2], [L / 2 + (vertical ? 0 : 40), H / 2 + (vertical ? 30 : 0)], X - 3.2, "sine.inOut");
      recadre(X - 0.05, 1, [L / 2, H / 2], [L / 2, H / 2], 0.75, "power3.inOut");
      K.entreeMots(tl, lignes[0].querySelectorAll(".t05-mot"), 2.85, { y: 12, flou: 12, duree: 0.7, decalage: 0.07, echelle: 1 });
      K.entreeMots(tl, lignes[1].querySelectorAll(".t05-mot"), 3.2, { y: 12, flou: 12, duree: 0.7, decalage: 0.07, echelle: 1 });
      // Pendant la lecture, ce que la phrase montre : les membres surgissent ensemble, d'un coup (une

      discs.forEach(function (d, i) {

        tl.fromTo(d, { scale: 0.3 }, { scale: 1, duration: 0.2, ease: "back.out(1)", immediateRender: false }, FE + 0.15 + i * 0.008);
      });
      // Sortie de la phrase, une fois lue (le trait est déjà reparti)
      K.sortieMots(tl, titre.querySelectorAll(".t05-mot"), X, { y: -10, flou: 12, duree: 0.4, decalage: 0.035 });

      // --- Le trait à main levée : il entoure les mots clés, puis repart par le haut ----------
      // Construit après le chargement des polices (on mesure les mots clés).
      var cs = getComputedStyle(titre);
      document.fonts.load(cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily).then(construireTrait, construireTrait);
      function construireTrait() {
        // Une phrase trop large pour tenir entre le panneau et les membres se réduit.
        // (position d'un mot dans la phrase, même quand il est dans les mots clés)
        var posX = function (el) { var v = 0; while (el && el !== titre) { v += el.offsetLeft; el = el.offsetParent; } return v; };
        var large = 0; lignes.forEach(function (l) { var ms = l.querySelectorAll(".t05-mot"), d = ms[ms.length - 1]; large = Math.max(large, posX(d) + d.offsetWidth - posX(ms[0])); });
        // (Elle ne rattrape qu'une police de marque plus large : une phrase trop longue du script ne
        // se réduit pas, elle passe dans une scène construite dans le style.)
        var maxL = vertical ? L - 120 : 900;
        var fs0 = parseFloat(getComputedStyle(titre).fontSize);
        if (large > maxL) titre.style.fontSize = (fs0 * Math.max(maxL / large, 0.7)).toFixed(1) + "px";
        gsap.set(titre, { top: T.y - titre.offsetHeight / 2 });
        var cleEl = titre.querySelector(".t05-cle");
        if (!cleEl) { window.__timelines[ID] = tl; return; }   // rien à entourer : la phrase seule
        var x = cleEl.offsetLeft, y = cleEl.offsetTop, w = cleEl.offsetWidth, h = cleEl.offsetHeight; // relatifs à la phrase (son parent positionné)
        // la boucle passe dans l'air laissé avant les mots clés, sans toucher le mot voisin
        var fsT = parseFloat(getComputedStyle(titre).fontSize), marge = Math.min(36, 0.4 * fsT);
        var cx = x + w / 2, cy = y + h * 0.6, rx = w / 2 + marge, ry = h * 0.46 + 10, rng = K.rng(11), pts = [];
        // Entrée par la gauche sous la ligne (points 0 et 1), un tour complet avec un peu de
        // recouvrement (points 2 à 18), puis la queue qui continue de tourner et file hors de l'image
        // par le haut à droite (elle revient dans la scène 2).
        pts.push([x - 220, cy + ry * 0.95], [x - 100, cy + ry * 1.04]);
        var a0 = Math.PI / 2 + 0.25, tour = Math.PI * 2 + 0.55;

        var mots1 = lignes[0].querySelectorAll(".t05-mot"), dernier = mots1[mots1.length - 1];
        var droite = Math.max(posX(dernier) + dernier.offsetWidth, cx + rx) + 70;
        pts.push([cx + rx * 0.75, cy + ry * 1.25], [droite, cy + ry * 0.3], [droite + 70, y - 150], [droite + 10, -titre.offsetTop - 240]);

        var montrer = morceau(boucle), Ltot = boucle.getTotalLength();
        // les mots clés se surlignent d'un bloc plein au milieu de la lecture (l'accent ; l'encre si
        // l'accent est trop pâle sur le clair, comme le trait), d'un coup, puis le bloc se retire avant
        // que la phrase sorte. Les mots passent à la couleur lisible sur le bloc.
        var bloc = K.el(cleEl, "span", "t05-bloc"), cs0 = getComputedStyle(racine), surAccent = couleurTrait() === cs0.getPropertyValue("--brand-accent").trim();
        bloc.style.background = couleurTrait();
        var motsCle = cleEl.querySelectorAll(".t05-mot"), tBloc = Math.max(FE + 1.0, (FE + X) / 2) - 0.1;
        gsap.set(bloc, { opacity: 0 });
        tl.set(bloc, { opacity: 1 }, tBloc);
        tl.set(motsCle, { color: (surAccent ? cs0.getPropertyValue("--brand-contrast") : cs0.getPropertyValue("--brand-clair")).trim() }, tBloc);
        tl.fromTo(bloc, { scaleX: 0.85 }, { scaleX: 1, duration: 0.25, ease: "back.out(1)", immediateRender: false }, tBloc);
        tl.set(bloc, { opacity: 0 }, X - 0.15);
        tl.set(motsCle, { color: cs0.getPropertyValue("--t05-encre").trim() }, X - 0.15);
        var Lentree = longueur(pts, 2), Lboucle = longueur(pts, 18);
        // La boucle se ferme sous les yeux du lecteur (la caméra ne bouge pas pour elle), tient
        // pendant la lecture, puis la queue file hors de l'image juste avant que la phrase sorte.
        selon(function (t) {
          var b = cle([[3.45, 0], [4.25, Lboucle, "power2.inOut"], [X - 0.6, Lboucle, "none"], [X + 0.15, Ltot, "power2.in"]], t);
          var a = cle([[3.45, 0], [4.0, Lentree, "power2.inOut"], [X - 0.5, Lentree, "none"], [X + 0.2, Ltot, "power2.in"]], t);
          montrer(a, b);
        });
        window.__timelines[ID] = tl;
      }
    })();
