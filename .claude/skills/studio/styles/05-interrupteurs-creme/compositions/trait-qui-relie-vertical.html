    STYLE N°5 « INTERRUPTEURS EN CASCADE » · SCÈNE 2 : LE TRAIT QUI SOULIGNE ET QUI RELIE,
    VERSION VERTICALE 9:16 (1080 × 1920), 9,9 s pour un mot de 2 mots, une phrase de 5, un nom de 2
    (la même scène que trait-qui-relie.html, remise en page pour un Reel, une story ou un TikTok)

    Ce qu'elle montre : la suite directe de la scène 1 en 9:16 (interrupteurs-cascade.html, racine
    en 1080 × 1920) : le même panneau en haut, les mêmes disques des membres sur deux rangées en bas.
    Le mot fort au centre, en grand (le mot héros : 60 % de la largeur ou plus) ; le trait à main
    levée descend par la droite du panneau et le souligne, puis repart. Une phrase de deux lignes
    arrive ; le trait redescend, passe sous le panneau et devient deux filets VERTICAUX qui RELIENT
    le panneau à la phrase (au-dessus) et la phrase aux membres (au-dessous). La phrase cède la place
    au nom de l'offre, les filets s'ajustent, les icônes des membres deviennent des anneaux, et la
    caméra glisse vers le bas : la grille d'anneaux (5 colonnes) remplit l'image (raccord avec la
    scène 3 en 9:16, « grille-de-coches », racine en 1080 × 1920).
    Rôle : la solution (« une seule fois », « pour tous », « là où ils sont déjà »).
    Chaque texte se tient le temps de sa lecture (0,3 s par mot + 0,8 s, 1,5 s au moins :
    `studio_motion.py lecture`) ; pendant qu'il se lit, la caméra ne fait qu'une dérive lente et la
    vie vient du trait, du bloc plein qui surligne le mot fort et des membres qui deviennent des
    anneaux. La caméra ne recadre qu'entre deux textes, et la glissade vers la grille n'arrive
    qu'une fois le nom lu.
    Durée : la scène la calcule (D dans le script) : 3,3 s + la lecture du mot, de la phrase et du
    nom (9,9 s pour 2, 5 et 2 mots). Reporte-la dans data-duration (ici et sur l'hôte).

    Format : 9:16 seulement (la version 16:9 est trait-qui-relie.html).

    À remplacer : l'objet EXEMPLE, en tête du script (chaque champ dit ce qu'il montre), et l'id
    « t05-trait » partout (rechercher-remplacer) par l'id de la scène dans index.html. Les couleurs
    et la police : les mêmes variables qu'en scène 1.
    Ne pas toucher : la place du panneau, des disques et de la caméra au début (raccord avec la
    scène 1 en 9:16 : panneau en (224, 150), membres en 182 + 238 × colonne, 1635 + 238 × rangée)
    et à la fin (raccord avec la scène 3 en 9:16 : grille de 5 × 9 disques en 70 + 235 × colonne,
    76 + 235 × rangée, caméra au repos).
  -->

        var lignes = $("phrase").querySelectorAll(".t05-ligne");
        K.entreeMots(tl, lignes[0].querySelectorAll(".t05-mot"), P0, { y: 12, flou: 12, duree: 0.7, decalage: 0.07, echelle: 1 });
        K.entreeMots(tl, lignes[lignes.length - 1].querySelectorAll(".t05-mot"), P0 + 0.25, { y: 12, flou: 12, duree: 0.7, decalage: 0.07, echelle: 1 });
        var bp = boite($("phrase")), bn = boite($("nom")), xl = L / 2;
        // Filet du haut : du bas du panneau jusqu'au texte posé (la phrase, puis le nom).
        var debutH = BAS_PANNEAU + 30, finP = bp.y - 50, finN = bn.y - 46, finMax = Math.max(finP, finN);
        var p2 = [[1180, -200], [1000, 300], [950, 760], [880, 935], [xl + 60, debutH + 2], [xl, debutH + 26], [xl + 2, (debutH + 26 + finMax) / 2], [xl, finMax]];
        var s2 = $("gauche"); s2.setAttribute("d", chemin(p2)); s2.setAttribute("stroke", trait);
        var m2 = morceau(s2), L2 = s2.getTotalLength(), L2e = longueur(p2, 5);
        var b2p = L2 - (finMax - finP), b2n = L2 - (finMax - finN);
        // 3. Filet du bas : du texte posé jusqu'aux membres.
        var debP = bp.y + bp.h + 50, debN = bn.y + bn.h + 46, debutD = Math.min(debP, debN), finD = HAUT_MEMBRES - 22;
        var p3 = [[xl, debutD], [xl - 1.5, (debutD + finD) / 2], [xl + 1, finD]];
        var s3 = $("droite"); s3.setAttribute("d", chemin(p3)); s3.setAttribute("stroke", trait);
        var m3 = morceau(s3), L3 = s3.getTotalLength(), a3p = debP - debutD, a3n = debN - debutD;

        selon(function (t) {
          // souligné : il arrive (0,25 → 1,0), tient, puis rembobine et repart par où il est venu
          var b = cle([[0.25, 0], [1.0, L1, "power2.inOut"], [XM - 0.1, L1, "none"], [XM + 0.4, 0, "power2.in"]], t);
          var a = cle([[0.45, 0], [1.05, L1e, "power2.inOut"], [XM - 0.1, L1e, "none"], [XM + 0.3, 0, "power2.in"]], t);
          m1(Math.min(a, b), b);
          // filet du haut : le trait descend le long du panneau, passe dessous et file jusqu'à la phrase, puis au nom
          var b2 = cle([[P0 + 0.1, 0], [P0 + 0.9, b2p, "power2.inOut"], [XP + 0.1, b2p, "none"], [XP + 0.6, b2n, "power2.inOut"]], t);
          var a2 = cle([[P0 + 0.3, 0], [P0 + 0.95, L2e, "power2.inOut"]], t);
          m2(Math.min(a2, b2), b2);
          // filet du bas : il part de la phrase et rejoint les membres, puis s'ajuste au nom
          var b3 = cle([[P0 + 0.85, a3p], [P0 + 1.3, L3, "power2.inOut"]], t);
          var a3 = cle([[P0 + 0.85, a3p], [XP + 0.1, a3p, "none"], [XP + 0.6, a3n, "power2.inOut"]], t);
          m3(Math.min(a3, b3), b3);
        });

        // Pendant la lecture de la phrase, les vrais logos des outils qu'elle nomme arrivent ensemble,
        // nets, de part et d'autre du filet ; ils repartent avec elle (d'un coup, sans fondu)
        var outils = LOGOS.filter(function (n) { return !!K.ic(n); }).slice(0, 3).map(function (n, i, tous) {
          var t = 200, e = K.el($("cam"), "div", "t05-outil", K.ic(n));
          var x = L / 2 + (i - (tous.length - 1) / 2) * 330, y = (BAS_PANNEAU + bp.y) / 2;
          gsap.set(e, { left: x - t / 2, top: y - t / 2, width: t, height: t });
          K.cacher(e, { scale: 0.3 });
          tl.set(e, { opacity: 1 }, P0 + 1.2 + i * 0.03);
          tl.to(e, { scale: 1, duration: 0.35, ease: "back.out(1.8)" }, P0 + 1.2 + i * 0.03);
          tl.to(e, { y: -10, duration: XP - P0 - 1.6, ease: "sine.inOut" }, P0 + 1.6);
          tl.to(e, { scale: 0.2, duration: 0.25, ease: "power2.in" }, XP);
          tl.set(e, { opacity: 0 }, XP + 0.25);
          return e;
        });
        // 4. La phrase cède la place au nom
        K.sortieMots(tl, tPhrase, XP, { y: -8, flou: 14, duree: 0.28, decalage: 0.025 });
        K.entreeMots(tl, $("nom").querySelectorAll(".t05-mot"), XP + 0.27, { y: 0, flou: 16, duree: 0.6, echelle: 0.96 });

        // 5. Les membres deviennent des anneaux (vague depuis la rangée la plus proche du nom) ;
        //    la cinquième colonne arrive juste avant, comme les disques de la scène 1.
        // pendant la lecture du nom : la cinquième colonne surgit d'un coup, puis tous deviennent des anneaux
        nouveaux.forEach(function (d) { tl.set(d, { opacity: 1 }, XP + 1.0 + (+d.dataset.r) * 0.01); tl.fromTo(d, { scale: 0.3 }, { scale: 1, duration: 0.3, ease: "back.out(1.7)", immediateRender: false }, XP + 1.0 + (+d.dataset.r) * 0.01); });
        discs.forEach(function (d) {
          var t0 = XP + 1.55 + (+d.dataset.r) * 0.012 + (+d.dataset.c) * 0.006;
          tl.to(d.querySelector(".t05-ic"), { scale: 0.4, rotation: -90, opacity: 0, duration: 0.3, ease: "power2.in" }, t0);
          tl.to(d.querySelector(".t05-anneau circle"), { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out" }, t0 + 0.12);
        });

        // 6. La caméra : pendant chaque lecture, une dérive lente seulement (4 %, sine.inOut) ; elle
        // revient au plan large entre deux textes (le mot sort, la phrase sort), puis glisse vers le
        // bas une fois le nom lu : la grille d'anneaux remplit l'image (raccord scène 3).
        recadre(0.15, 1.04, TC, [TC[0] - 12, TC[1]], XM - 0.15, "sine.inOut");
        recadre(XM, 1, TC, TC, 0.65, "expo.inOut");
        recadre(P0 + 0.25, 1.035, TC, [TC[0] + 10, TC[1]], XP - P0 - 0.25, "sine.inOut");
        recadre(XP, 1.02, TC, TC, 0.6, "expo.inOut");
        recadre(XP + 0.6, 1.05, TC, [TC[0] - 10, TC[1]], XN - XP - 0.6, "sine.inOut");
        tl.to(cam, { x: FIN_CAM.x, y: FIN_CAM.y, scale: 1, duration: 1.05, ease: "expo.inOut" }, XN);
        tl.to(discs, { x: 0, y: 0, duration: 1.05, ease: "expo.inOut" }, XN);
        window.__timelines[ID] = tl;
      }
    })();
  </script>
