  <!--
    STYLE N°5 « INTERRUPTEURS EN CASCADE » · SCÈNE 2 : LE TRAIT QUI SOULIGNE ET QUI RELIE (9,9 s pour
    un mot de 2 mots, une phrase de 5, un nom de 2)

    Ce qu'elle montre : la suite directe de la scène 1 (même panneau au bord gauche, mêmes disques
    des membres à droite). La caméra s'approche pendant que le mot fort entre, en grand (le mot
    héros : 60 % de la largeur ou plus) ; le trait à main levée revient par le haut et le souligne,
    puis repart. La caméra revient au plan large entre le mot et la phrase. Une phrase de deux
    lignes arrive ; le trait redescend et devient deux filets qui RELIENT le panneau à la phrase et
    la phrase aux membres. La phrase cède la place au nom de l'offre (ou au logo de l'outil qui fait
    le lien), les filets s'ajustent, les icônes des membres deviennent des anneaux, et la caméra
    glisse vers la droite : la grille d'anneaux remplit l'image (raccord avec la scène 3,
    « grille-de-coches »).
    Rôle : la solution (« une seule fois », « pour tous », « là où ils sont déjà »).
    Chaque texte (le mot, la phrase, le nom) se tient le temps de sa lecture (0,3 s par mot + 0,8 s,
    1,5 s au moins : `studio_motion.py lecture`) ; pendant qu'il se lit, la caméra ne fait qu'une
    dérive lente et la vie vient du trait (il souligne, rembobine, descend, devient les filets qui
    s'ajustent), du bloc plein qui surligne le mot fort et des membres qui deviennent des anneaux.
    La caméra ne recadre qu'entre deux textes, et la glissade vers la grille n'arrive qu'une fois
    le nom lu.
    Durée : la scène la calcule (D dans le script) : 3,3 s + la lecture du mot, de la phrase et du
    nom (9,9 s pour 2, 5 et 2 mots). Reporte-la dans data-duration (ici et sur l'hôte).

    Format : 16:9. En 9:16, monte trait-qui-relie-vertical.html à sa place.

    À remplacer : l'objet EXEMPLE, en tête du script (chaque champ dit ce qu'il montre), et l'id
    « t05-trait » partout (rechercher-remplacer) par l'id de la scène dans index.html. Les couleurs
    et la police : les mêmes variables qu'en scène 1.
    Ne pas toucher : la place du panneau, des disques et de la caméra au début (raccord avec la
    scène 1) et à la fin (raccord avec la scène 3).
  -->

  <script>
    (function () {
      // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire (ici, une formation
      // d'exemple : aucun de ces textes n'est un fait).
      var EXEMPLE = {
        MOT: "Une fois.",                                // le mot fort, 1 à 3 mots : il s'affiche en grand
        PHRASE: ["Directement dans", "ton espace membre"],  // deux lignes de 3 mots au plus (6 en tout)
        NOM: "Ton offre",                                // le nom de l'offre, ou de l'outil qui fait le lien
        LOGOS: [],                                       // 2 ou 3 vrais logos des outils que la PHRASE nomme (posés par `studio_motion.py logos`) ; [] : aucun

        var s3 = $("droite"); s3.setAttribute("d", chemin(p3)); s3.setAttribute("stroke", trait);
        var m3 = morceau(s3), L3 = s3.getTotalLength(), a3p = debP - debutD, a3n = debN - debutD;

        selon(function (t) {
          // souligné : il arrive (0,25 → 1,0), tient, puis rembobine et repart par où il est venu
          var b = cle([[0.25, 0], [1.0, L1, "power2.inOut"], [XM - 0.1, L1, "none"], [XM + 0.4, 0, "power2.in"]], t);
          var a = cle([[0.45, 0], [1.05, L1e, "power2.inOut"], [XM - 0.1, L1e, "none"], [XM + 0.3, 0, "power2.in"]], t);
          m1(Math.min(a, b), b);
          // filet gauche : le trait descend le long du panneau et file jusqu'à la phrase, puis au nom
          var b2 = cle([[P0 + 0.1, 0], [P0 + 0.9, b2p, "power2.inOut"], [XP + 0.1, b2p, "none"], [XP + 0.6, b2n, "power2.inOut"]], t);
          var a2 = cle([[P0 + 0.3, 0], [P0 + 0.95, L2e, "power2.inOut"]], t);
          m2(Math.min(a2, b2), b2);
          // filet droit : il part de la phrase et rejoint les membres, puis s'ajuste au nom
          var b3 = cle([[P0 + 0.85, a3p], [P0 + 1.3, L3, "power2.inOut"]], t);
          var a3 = cle([[P0 + 0.85, a3p], [XP + 0.1, a3p, "none"], [XP + 0.6, a3n, "power2.inOut"]], t);
          m3(Math.min(a3, b3), b3);
        });

        // Pendant la lecture de la phrase, les vrais logos des outils qu'elle nomme arrivent ensemble,
        // nets, de part et d'autre du filet ; ils repartent avec elle (d'un coup, sans fondu)
        var outils = LOGOS.filter(function (n) { return !!K.ic(n); }).slice(0, 3).map(function (n, i, tous) {
          var t = 230, e = K.el($("cam"), "div", "t05-outil", K.ic(n));
          var x = L / 2 + (i - (tous.length - 1) / 2) * 300, y = bp.y - 190;
          gsap.set(e, { left: x - t / 2, top: y - t / 2, width: t, height: t });
          K.cacher(e, { scale: 0.3 });
          tl.set(e, { opacity: 1 }, P0 + 1.2 + i * 0.03);
          tl.to(e, { scale: 1, duration: 0.35, ease: "back.out(1.8)" }, P0 + 1.2 + i * 0.03);
          tl.to(e, { y: -10, duration: XP - P0 - 1.6, ease: "sine.inOut" }, P0 + 1.6);
          tl.to(e, { scale: 0.2, duration: 0.25, ease: "power2.in" }, XP);
          tl.set(e, { opacity: 0 }, XP + 0.25);
          return e;
        });
        // 4. La phrase cède la place au nom
        K.sortieMots(tl, tPhrase, XP, { y: -8, flou: 14, duree: 0.28, decalage: 0.025 });
        K.entreeMots(tl, $("nom").querySelectorAll(".t05-mot"), XP + 0.27, { y: 0, flou: 16, duree: 0.6, echelle: 0.96 });

        // 5. Les membres deviennent des anneaux (vague depuis la colonne la plus proche)
        discs.forEach(function (d) {
          var t0 = XP + 1.3 + (+d.dataset.c) * 0.012 + (+d.dataset.r) * 0.006;
          tl.to(d.querySelector(".t05-ic"), { scale: 0.4, rotation: -90, opacity: 0, duration: 0.3, ease: "power2.in" }, t0);
          tl.to(d.querySelector(".t05-anneau circle"), { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out" }, t0 + 0.12);
        });

        // 6. La caméra : elle s'approche pendant que le mot fort entre ; pendant chaque lecture, une
        // dérive lente seulement (3 à 5 %, sine.inOut) ; elle revient au plan large entre deux textes
        // (le mot sort, la phrase sort), puis glisse une fois le nom lu : la grille d'anneaux remplit
        // l'image (raccord scène 3).
        var C = [L / 2, H / 2];
        recadre(0.05, ZM, C, C, 0.8, "expo.inOut");                          // pendant que le mot entre
        recadre(0.85, ZM * 1.035, C, [C[0] - 20, C[1]], XM - 0.85, "sine.inOut");
        recadre(XM, 1, C, C, 0.65, "expo.inOut");
        recadre(P0 + 0.25, 1.035, C, [C[0] + 18, C[1]], XP - P0 - 0.25, "sine.inOut");
        recadre(XP, 1.02, C, C, 0.6, "expo.inOut");
        recadre(XP + 0.6, 1.05, C, [C[0] - 16, C[1]], XN - XP - 0.6, "sine.inOut");
        tl.to(cam, { x: -1470, y: 0, scale: 1, duration: 1.05, ease: "expo.inOut" }, XN);
        window.__timelines[ID] = tl;
      }
