<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°6 « NUÉE D'ENCRE » · SCÈNE 4 : LA RÉVÉLATION, « BIENTÔT » (5,6 s pour 4 mots)

    Ce qu'elle montre : la page vide, d'un coup (coupe franche sur le temps fort de la musique).
    L'initiale de l'offre change de forme à chaque quart de seconde (fine, grasse, en contour),
    trois points arrivent à côté d'elle ; coupe : deux lignes posées au centre (« Ton offre. »
    puis « Bientôt disponible. ») ; coupe : le nom de l'offre en capitales ; coupe au noir.
    Rôle : l'offre et l'appel d'un teaser (ce qui arrive, quand, où le suivre). Une page aplat, de
    l'encre, un seul point à l'accent : ni texture, ni image.
    Les deux lignes se tiennent ensemble le temps de leur lecture (0,3 s par mot + 0,8 s :
    `studio_motion.py lecture`), le nom 1,5 s au moins, pendant une dérive lente (3 %). Durée : la
    scène la calcule (D dans le script) : 5,6 s pour deux lignes de 4 mots et un nom ; reporte-la
    dans data-duration (ici et sur l'hôte).

    Format : 16:9 par défaut. En 9:16, change data-width / data-height de la racine : tout est
    centré, les tailles se réduisent à la largeur (74 % en 9:16, la zone de texte d'un Reel).

    À REMPLACER :
      1. L'id « t06-bientot » partout (rechercher-remplacer) par l'id de la scène dans index.html.
      2. NOM (le nom de l'offre ; son initiale anime le début), LIGNES (deux lignes courtes : le
         nom puis la promesse, « Bientôt disponible. », « Ouverture le 3 novembre. » seulement
         avec une vraie date de OFFRE.json) et LOGO (chemin d'un logo du projet ; vide = le nom en
         capitales).
      3. Couleurs : celles de la marque. La page est var(--brand-clair) (un aplat), l'encre et le
         noir final var(--brand-sombre) ; le troisième point prend l'accent, plein.
      Police des titres : celle de la marque (--t06-titres). Marque sans police imposée : la serif
      du look (Source Serif 4, graisse 600), mode d'emploi dans style.md, section 4.
  -->
</head>
<body>
<template>
  <style>
    #t06-bientot {
      --t06-papier: var(--brand-clair);   /* la page : un aplat de la couleur claire de la marque */
      --t06-encre: var(--brand-sombre);   /* l'encre et le noir final : sa couleur la plus sombre */
      --t06-titres: var(--brand-font-display);
      background: var(--t06-papier); color: var(--t06-encre);
    }
    #t06-bientot .t06-page { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.045) 100%); }
    #t06-bientot .t06-plan { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #t06-bientot .t06-sigle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 0.12em; font: 400 150px/1 var(--t06-titres); letter-spacing: -0.02em; white-space: nowrap; }
    #t06-bientot .t06-points { display: flex; gap: 0.1em; align-items: center; height: 0.7em; }
    #t06-bientot .t06-points i { display: block; width: 0.26em; height: 0.26em; border-radius: 50%; }
    #t06-bientot .t06-barres { display: flex; gap: 0.07em; align-items: stretch; height: 0.72em; }
    #t06-bientot .t06-barres i { display: block; width: 0.12em; }
    #t06-bientot .t06-lignes { text-align: center; font: 600 76px/1.2 var(--t06-titres); letter-spacing: -0.015em; white-space: nowrap; }
    #t06-bientot .t06-lignes div { display: block; }
    #t06-bientot .t06-nom { font: 700 104px/1 var(--brand-font-display); letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; }
    #t06-bientot .t06-nom img { height: 120px; width: auto; display: block; }
    #t06-bientot .t06-noir { position: absolute; inset: 0; background: var(--t06-encre); }
  </style>

  <div data-composition-id="t06-bientot" data-width="1920" data-height="1080" data-duration="5.6" style="position:absolute; inset:0;">
    <div id="t06-bientot" class="k-scene">
      <div class="t06-page"></div>
      <div class="t06-plan" id="t06-bientot-p1"></div>
      <div class="t06-plan" id="t06-bientot-p2"><div class="t06-lignes" id="t06-bientot-lignes"></div></div>
      <div class="t06-plan" id="t06-bientot-p3"><div class="t06-nom" id="t06-bientot-nom"></div></div>
      <div class="t06-noir" id="t06-bientot-noir"></div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "t06-bientot";
      var NOM = "Ton offre";
      var LIGNES = ["Ton offre.", "Bientôt disponible."];
      var LOGO = ""; // ex. "brand/logo.svg" ; vide : le nom en capitales
      // Le temps de lecture du studio (`studio_motion.py lecture`) : 0,3 s par mot + 0,8 s, 1,5 s au moins.
      function lecture(t) { var n = [].concat(t).join(" ").split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length; return Math.ceil(Math.max(1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10; }
      var XL = 1.82 + lecture(LIGNES), XN = XL + 0.02 + (LOGO ? 1.5 : lecture(NOM));   // les lignes, puis le nom, lus
      var D = Math.round((XN + 0.3) * 10) / 10;                                         // puis 0,3 s de noir

      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur;
      var tl = gsap.timeline({ paused: true });

      // Les couleurs de la marque : l'encre (sa couleur la plus sombre) vient du CSS de la scène ;
      // l'accent ne colore qu'un détail, plein (le troisième point).
      var ENCRE = "var(--t06-encre)", ACCENT = "var(--brand-accent)";

      // 1. Le sigle qui change de forme : l'initiale, puis des barres, puis trois points.
      var I = NOM.trim().charAt(0).toUpperCase(), p1 = $("p1");
      var FORMES_SIGLE = [
        { t: 0.06, poids: 400, contour: false, suite: "" },
        { t: 0.3, poids: 900, contour: false, suite: "barres" },
        { t: 0.54, poids: 700, contour: true, suite: "barres" },
        { t: 0.78, poids: 400, contour: false, suite: "points" }
      ];
      var etats = FORMES_SIGLE.map(function (f) {
        var e = K.el(p1, "div", "t06-sigle");
        var lettre = K.el(e, "span", "", I, "font-weight:" + f.poids + ";" + (f.contour ? "color:transparent; -webkit-text-stroke:3px " + ENCRE + ";" : ""));
        if (f.suite === "barres") { var b = K.el(e, "span", "t06-barres"); for (var k = 0; k < 3; k++) K.el(b, "i", "", "", "background:" + ENCRE + ";"); }
        if (f.suite === "points") { var p = K.el(e, "span", "t06-points"); for (var k2 = 0; k2 < 3; k2++) K.el(p, "i", "", "", "background:" + (k2 === 2 ? ACCENT : ENCRE) + ";"); }
        return e;
      });
      // Une seule forme visible à la fois (coupes franches), chacune centrée.
      gsap.set(etats, { opacity: 0 });
      etats.forEach(function (e, i) { tl.set(e, { opacity: 1 }, FORMES_SIGLE[i].t); if (i < etats.length - 1) tl.set(e, { opacity: 0 }, FORMES_SIGLE[i + 1].t); });
      // les trois points arrivent l'un après l'autre
      var points = etats[3].querySelectorAll(".t06-points i");
      gsap.set(points, { scale: 0 });
      points.forEach(function (p, k) { tl.to(p, { scale: 1, duration: 0.14, ease: "back.out(3)" }, 0.8 + k * 0.12); });
      tl.set($("p1"), { opacity: 0 }, 1.32);

      // 2. Les deux lignes, posées d'un coup (la deuxième un temps après la première)
      var lignes = $("lignes");
      LIGNES.forEach(function (l) { K.el(lignes, "div", "", l); });
      var ls = lignes.querySelectorAll("div");
      gsap.set(ls, { opacity: 0 });
      tl.set(ls[0], { opacity: 1 }, 1.34);
      if (ls[1]) tl.set(ls[1], { opacity: 1 }, 1.82);
      tl.fromTo(lignes, { scale: 1 }, { scale: 1.03, duration: XL - 1.34, ease: "sine.inOut", immediateRender: false }, 1.34);
      tl.set($("p2"), { opacity: 0 }, XL);

      // 3. Le nom (ou le logo), puis coupe au noir
      var nom = $("nom");
      nom.innerHTML = LOGO ? '<img src="' + LOGO + '" alt="">' : NOM;
      gsap.set($("p3"), { opacity: 0 });
      tl.set($("p3"), { opacity: 1 }, XL + 0.02);
      tl.fromTo(nom, { scale: 1.04 }, { scale: 1, duration: XN - XL, ease: "sine.out", immediateRender: false }, XL + 0.02);
      gsap.set($("noir"), { opacity: 0 });
      tl.set($("noir"), { opacity: 1 }, XN);

      // Les tailles suivent la largeur (une ligne trop longue se réduit).
      var csL = getComputedStyle(lignes);
      document.fonts.load(csL.fontWeight + " " + csL.fontSize + " " + csL.fontFamily).then(poser, poser);
      function poser() {
        var maxL = L * (H > L ? 0.74 : 0.8);   // en 9:16, la zone de texte d'un Reel (830 px sur 1 080)
        if (lignes.offsetWidth > maxL) lignes.style.fontSize = (76 * maxL / lignes.offsetWidth).toFixed(1) + "px";
        if (nom.offsetWidth > maxL) nom.style.fontSize = (104 * maxL / nom.offsetWidth).toFixed(1) + "px";
        window.__timelines[ID] = tl;
      }
    })();
  </script>
</template>
</body>
</html>
