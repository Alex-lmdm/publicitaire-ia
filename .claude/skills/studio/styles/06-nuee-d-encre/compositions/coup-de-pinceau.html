<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°6 « NUÉE D'ENCRE » · SCÈNE 1 : LE CERCLE AU PINCEAU QUI PORTE L'ACCROCHE (5,4 s)

    Ce qu'elle montre : une page claire, un aplat de la couleur claire de la marque (le cadre
    d'imprimerie dans les coins : une texture, jamais lue). Un pinceau trace un grand cercle à
    l'encre d'un seul geste ; pendant qu'il le ferme, les mots de l'accroche s'impriment au centre
    du cercle, et le point que pose le pinceau finit la phrase. Le cercle est le cadre de la phrase,
    jamais une forme seule. Puis le cercle et ses mots se « numérisent » (des colonnes de petits
    signes les traversent) et se défont en une nuée de points : un point par case d'encre réellement
    posée, leur nombre vient du sujet. La nuée tourne dans le sens du geste et se pose en une bande,
    le raccord de la scène 2 (« nuee-de-particules »), où elle écrit les mots suivants.
    Rôle : l'accroche d'un teaser (ouverture des inscriptions, bientôt disponible).
    L'accroche : le calque de ses mots porte data-accroche (composition.md) ; un seul élément de la
    vidéo le porte. Ses mots s'impriment par un masque à partir de MOTS_DEBUT : `check` ne voit pas
    un masque, c'est l'image qui dit s'ils se lisent à 0,5 s.

    Format : 16:9 par défaut. En 9:16, change data-width / data-height de la racine (1080 × 1920) :
    le cercle grandit à 80 % de la largeur, les mots, le point, les légendes et la bande se
    recalent seuls.

    À remplacer : l'objet EXEMPLE (en tête du script), et l'id « t06-pinceau » partout
    (rechercher-remplacer) par l'id de la scène dans index.html.
    Couleurs : celles de la marque, rien d'autre. La page est var(--brand-clair), l'encre
    var(--brand-sombre) ; POINT.accent = true pose le point à l'accent, plein (jamais en
    transparence).
    Ne pas toucher : GRAINE et la fonction bande() (la scène 2 repart de la même bande).
  -->
</head>
<body>
<template>
  <style>
    #t06-pinceau {
      --t06-papier: var(--brand-clair);   /* la page : un aplat de la couleur claire de la marque */
      --t06-encre: var(--brand-sombre);   /* l'encre : sa couleur la plus sombre */
      --t06-texte: var(--brand-font-body);
      --t06-titres: var(--brand-font-display);
      background: var(--t06-papier); color: var(--t06-encre);
    }
    /* la page respire à peine : une ombre neutre vers les bords, jamais une texture */
    #t06-pinceau .t06-page { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.045) 100%); }
    #t06-pinceau canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #t06-pinceau .t06-cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 48%; }
    #t06-pinceau .t06-mots { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #t06-pinceau .t06-mot { position: absolute; display: block; font-family: var(--t06-titres); font-weight: 600; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
    /* le cadre d'imprimerie : une texture (data-layout-ignore), jamais un texte à lire */
    #t06-pinceau .t06-legende { position: absolute; font: 400 11px/1.4 var(--t06-texte); letter-spacing: 0.02em; white-space: nowrap; }
    #t06-pinceau .t06-legende b { font-weight: 700; letter-spacing: 0.08em; }
    #t06-pinceau .t06-legende .t06-petit { font-size: 9px; opacity: 0.75; }
    #t06-pinceau .t06-filet { display: block; width: 100px; height: 1px; margin: 6px 0 6px auto; background: currentColor; opacity: 0.5; }
    #t06-pinceau .t06-gauche .t06-filet { margin-left: 0; }
    #t06-pinceau .t06-chiffre { position: absolute; font: 600 11px/1 var(--t06-texte); letter-spacing: 0.04em; white-space: nowrap; }
  </style>

  <div data-composition-id="t06-pinceau" data-width="1920" data-height="1080" data-duration="5.4" style="position:absolute; inset:0;">
    <div id="t06-pinceau" class="k-scene">
      <div class="t06-cam" id="t06-pinceau-cam" data-layout-allow-overflow>
        <div class="t06-page"></div>
        <canvas id="t06-pinceau-encre"></canvas>
        <div class="t06-mots" id="t06-pinceau-mots"></div>
        <canvas id="t06-pinceau-nuee"></canvas>
      </div>
      <div id="t06-pinceau-cadre" data-layout-ignore></div>
    </div>
  </div>

  <script>
    (function () {
      var EXEMPLE = { // À REMPLACER : chaque valeur vient de OFFRE.json ou du script validé, ou la ligne se retire
        // l'accroche : 1 à 3 mots, un par ligne, sans point final (le point, c'est le pinceau qui le pose)
        accroche: ["Quelque", "chose", "arrive"],
        // les repères d'imprimerie des coins (une texture, jamais lue) : le nom du projet, un numéro ;
        // jamais un chiffre de vente, une date ou une promesse
        legendes: {
          hautDroite: ["<b>N° 01</b> ESQUISSE", "à l'encre", '<span class="t06-petit">une forme qui se cherche</span>', "<b>PLANCHE</b> 01"],
          basGauche: ["<b>PROJET 01.</b> TON OFFRE", "à suivre", '<span class="t06-petit">page après page</span>'],
          basDroite: ["<b>P. 03</b>"]
        }
      };
      var ID = "t06-pinceau", D = 5.4;
      // Le geste : le cercle (centre et rayon dans le cadre, épaisseur en px pour 1080 de haut,
      // départ et durée en s), puis le point qui finit la phrase (sa place suit le dernier mot).
      var CERCLE = { pts: "cercle", cx: 0.5, cy: 0.48, r: 0.33, largeur: 120, debut: 0.1, duree: 1.15, graine: 3 };
      var POINT = { debut: 1.36, duree: 0.22, graine: 9, accent: false };
      var MOTS_DEBUT = 0.7;      // les mots s'impriment pendant que le pinceau ferme le cercle
      var T_NUM = 2.7, T_DEFAIT = 3.3; // la numérisation, puis l'encre qui se défait en points
      var GRAINE = 61, PAS_ENCRE = 9;  // une place de point par case de 9 px d'encre du cercle

      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
      var tl = gsap.timeline({ paused: true });
      var E = Math.min(L, H) / 1080; // échelle des épaisseurs (1 en 16:9 et en 9:16)

      // --- Outils du look (communs aux scènes du style 6) ---------------------------------
      function rng(g) { var s = (g >>> 0) || 1; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function toile(c) { c.width = L; c.height = H; return c.getContext("2d"); }
      // Les couleurs de la marque, lues sur la scène (le canevas veut des valeurs, pas des var()) :
      // l'encre est sa couleur la plus sombre, la page sa plus claire, l'accent se pose plein.
      var cs = getComputedStyle(racine), ENCRE = cs.color, PAPIER = cs.backgroundColor;
      var ACCENT = cs.getPropertyValue("--brand-accent").trim() || ENCRE;
      var TITRES = cs.getPropertyValue("--t06-titres").trim() || "sans-serif";
      function cadreImprimerie(hote) {
        var m = vertical ? 54 : 68, blocs = [], Lg = EXEMPLE.legendes;
        var lignes = function (l, filetAvant) { return l.map(function (x, i) { return (i === filetAvant ? '<i class="t06-filet"></i>' : "") + "<div>" + x + "</div>"; }).join(""); };
        blocs.push(K.el(hote, "div", "t06-legende", lignes(Lg.hautDroite, Lg.hautDroite.length - 1), "right:" + m + "px; top:" + (vertical ? 120 : 82) + "px; text-align:right;"));
        blocs.push(K.el(hote, "div", "t06-legende t06-gauche", lignes(Lg.basGauche, 0), "left:" + m + "px; bottom:" + (vertical ? 210 : 112) + "px;"));
        blocs.push(K.el(hote, "div", "t06-legende", lignes(Lg.basDroite, -1), "right:" + m + "px; bottom:" + (vertical ? 210 : 104) + "px;"));
        var xs = vertical ? [0.12, 0.3, 0.7, 0.88] : [0.14, 0.205, 0.275, 0.45, 0.86, 0.92], chiffres = [];
        xs.forEach(function (x) { chiffres.push(K.el(hote, "div", "t06-chiffre", "00.00", "left:" + (x * L).toFixed(0) + "px; bottom:" + (vertical ? 150 : 28) + "px;")); });
        // Les repères changent tous les quarts de seconde (valeur fixe pour un instant donné).
        return function (t) { var pas = Math.floor(t * 4); chiffres.forEach(function (c, i) { c.textContent = (rng(pas * 131 + i * 977 + 7)() * 99.99).toFixed(2); }); };
      }
      function hache(i, k) { var s = Math.sin(i * 12.9898 + (k || 0) * 78.233) * 43758.5453; return s - Math.floor(s); }
      function prog(t, a, b, ease) { return t <= a ? 0 : t >= b ? 1 : gsap.parseEase(ease || "power2.inOut")((t - a) / (b - a)); }
      // La bande de points où la nuée se pose (la scène 2 en repart : même fonction, même graine).
      function bande(rB) {
        var bx0 = L * (vertical ? 0.1 : 0.27), bx1 = L * (vertical ? 0.9 : 0.73), by = H * 0.5, bh = (vertical ? 120 : 135) * E;
        var u = rB(), v = (rB() + rB() + rB() - 1.5) / 1.5;
        var epais = bh * (0.3 + 0.7 * Math.pow(Math.sin(Math.PI * Math.min(1, 0.06 + u * 1.04)), 0.55));
        return [bx0 + (bx1 - bx0) * u, by + v * epais + Math.sin(u * 5 + 1) * 20 * E - (u - 0.5) * 46 * E];
      }
      // Les mots d'un élément de la page, redessinés à l'identique dans un canevas (même police,
      // même place) : pour les numériser, et pour en tirer les points.
      // mesurer() lit une fois la police et la place de chaque ligne ; ecrire() les redessine sans
      // toucher à la page (aucune mesure pendant le rendu).
      function mesurer(spans) {
        var x = document.createElement("canvas").getContext("2d");
        return spans.map(function (s) {
          var c = getComputedStyle(s), fs = parseFloat(c.fontSize), font = c.fontWeight + " " + fs + "px " + c.fontFamily;
          x.font = font; var m = x.measureText(s.textContent), fa = m.fontBoundingBoxAscent || fs * 0.9, fd = m.fontBoundingBoxDescent || fs * 0.25;
          return { texte: s.textContent, font: font, ls: c.letterSpacing === "normal" ? "0px" : c.letterSpacing, x: s.offsetLeft, y: s.offsetTop + (s.offsetHeight - fa - fd) / 2 + fa };
        });
      }
      function ecrire(x, lignes, couleur) {
        lignes.forEach(function (l) {
          x.font = l.font; x.textBaseline = "alphabetic"; x.textAlign = "left"; x.fillStyle = couleur;
          if ("letterSpacing" in x) x.letterSpacing = l.ls;
          x.fillText(l.texte, l.x, l.y);
        });
      }
      // Les places d'une matière (encre ou mots) dessinée dans un canevas caché : une place par case
      // de `pas` px que l'encre couvre. Le nombre de points vient donc du sujet, jamais d'un effet.
      function placesDe(x, pas, graine) {
        var d = x.getImageData(0, 0, L, H).data, r = rng(graine), p = [];
        for (var y = pas / 2; y < H; y += pas) for (var X = pas / 2; X < L; X += pas) {
          var qx = Math.min(L - 1, Math.max(0, X + (r() - 0.5) * pas * 0.7)), qy = Math.min(H - 1, Math.max(0, y + (r() - 0.5) * pas * 0.7));
          if (d[((qy | 0) * L + (qx | 0)) * 4 + 3] > 140) p.push([qx, qy]);
        }
        for (var i = p.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), s = p[i]; p[i] = p[j]; p[j] = s; }
        return p;
      }

      // --- Le pinceau : des poils qui portent l'encre et sèchent le long du geste -------------
      function echantillons(g) {
        var p = [];
        if (g.pts === "cercle") {
          var cx = g.cx * L, cy = g.cy * H, R = g.r * Math.min(L, H) * (vertical ? 1.22 : 1), rr = rng(g.graine);
          for (var i = 0; i <= 40; i++) { var u = i / 40, a = -Math.PI * 0.58 - u * Math.PI * 1.82, w = 1 + 0.035 * Math.sin(u * 7 + rr() * 0.2) - 0.03 * u; p.push([cx + Math.cos(a) * R * w, cy + Math.sin(a) * R * w * 1.03]); }
        } else { g.pts.forEach(function (q) { p.push([q[0] * L, q[1] * H]); }); }
        var d = [];
        for (var k = 0; k < p.length - 1; k++) { var a0 = p[k - 1] || p[k], a1 = p[k], a2 = p[k + 1], a3 = p[k + 2] || a2; for (var s = 0; s < 12; s++) { var t = s / 12, t2 = t * t, t3 = t2 * t; d.push([0.5 * (2 * a1[0] + (-a0[0] + a2[0]) * t + (2 * a0[0] - 5 * a1[0] + 4 * a2[0] - a3[0]) * t2 + (-a0[0] + 3 * a1[0] - 3 * a2[0] + a3[0]) * t3), 0.5 * (2 * a1[1] + (-a0[1] + a2[1]) * t + (2 * a0[1] - 5 * a1[1] + 4 * a2[1] - a3[1]) * t2 + (-a0[1] + 3 * a1[1] - 3 * a2[1] + a3[1]) * t3)]); } }
        d.push(p[p.length - 1]);
        return d;
      }
      function bruit(x) { var i = Math.floor(x), f = x - i, h = function (n) { var s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }; return h(i) + (h(i + 1) - h(i)) * f * f * (3 - 2 * f); }
      function pinceau(g) {
        var pts = echantillons(g), r = rng(g.graine * 97 + 1), W = g.largeur * E, n = pts.length, court = n < 30;
        var nx = [], ny = [];
        for (var i = 0; i < n; i++) { var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; nx.push(-dy / l); ny.push(dx / l); }
        // largeur : l'appui (tête ronde), la pression qui varie, le pinceau qui se lève
        var larg = court ? function (u) { return W * Math.sqrt(Math.max(0.05, Math.sin(Math.PI * Math.min(1, 0.15 + u * 0.85)))); }
          : function (u) { var appui = 0.32 + 0.68 * Math.sqrt(Math.min(1, u * 16)), leve = 1 - Math.pow(Math.max(0, u - 0.5) / 0.5, 1.4) * 0.8; return W * appui * leve * (0.88 + 0.12 * bruit(u * 6 + g.graine)); };
        // encre qui s'épuise : 0 au départ (mouillé), jusqu'à 0,75 à la fin (sec : le papier passe)
        var sec = court ? function () { return 0.04; } : function (u) { return 0.05 + 0.7 * Math.pow(u, 1.8); };
        var poils = [];
        for (var p = 0; p < 150; p++) { var k = (p / 149) * 2 - 1; poils.push({ k: k + (r() - 0.5) * 0.02, w: (1.2 + r() * 2.6) * E, a: 0.55 + r() * 0.45, ph: r() * 100, f: 9 + r() * 22, bord: Math.abs(k) }); }
        // plein : un geste à l'accent se pose sans transparence (l'accent n'est jamais dilué)
        function dessiner(ctx, avance, couleur, plein) {
          if (avance <= 0) return;
          var fin = Math.max(1, Math.floor(avance * (n - 1)));
          ctx.strokeStyle = couleur; ctx.fillStyle = couleur; ctx.lineCap = "round"; ctx.lineJoin = "round";
          // un voile d'encre sous les poils, plus dense au départ
          ctx.globalAlpha = plein ? 1 : 0.5; ctx.beginPath();
          for (var i = 0; i <= fin; i++) { var w = larg(i / (n - 1)) * 0.36 * (1 - sec(i / (n - 1)) * 0.6); ctx.lineTo(pts[i][0] + nx[i] * w, pts[i][1] + ny[i] * w); }
          for (var j = fin; j >= 0; j--) { var w2 = larg(j / (n - 1)) * 0.36 * (1 - sec(j / (n - 1)) * 0.6); ctx.lineTo(pts[j][0] - nx[j] * w2, pts[j][1] - ny[j] * w2); }
          ctx.closePath(); ctx.fill();
          // la tête du geste : arrondie, là où le pinceau s'est posé
          ctx.globalAlpha = plein ? 1 : 0.7; ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], larg(0.004) * 0.36, 0, 6.2832); ctx.fill();
          // les poils : chaque poil laisse une strie ; il saute là où il n'a plus d'encre
          poils.forEach(function (po) {
            ctx.globalAlpha = plein ? 1 : po.a; ctx.lineWidth = po.w; ctx.beginPath(); var trace = false;
            for (var i = 0; i <= fin; i++) {
              var u = i / (n - 1), seuil = sec(u) + po.bord * 0.25;
              if (bruit(u * po.f + po.ph) < seuil) { trace = false; continue; }
              var off = po.k * 0.5 * larg(u) * (1 + (bruit(u * 13 + po.ph) - 0.5) * 0.08 * po.bord), x = pts[i][0] + nx[i] * off, y = pts[i][1] + ny[i] * off;
              if (!trace) { ctx.moveTo(x, y); trace = true; } else ctx.lineTo(x, y);
            }
            ctx.stroke();
          });
          ctx.globalAlpha = 1;
        }
        return { dessiner: dessiner };
      }

      // --- Les mots de l'accroche, au centre du cercle -----------------------------------------
      // Une ligne par mot, la plus longue à 62 % du diamètre, le bloc à moitié de sa hauteur au plus.
      var R = CERCLE.r * Math.min(L, H) * (vertical ? 1.22 : 1), CX = CERCLE.cx * L, CY = CERCLE.cy * H;
      var hoteMots = $("mots"), spans = EXEMPLE.accroche.map(function (m) { return K.el(hoteMots, "span", "t06-mot", m, "font-size:100px;"); });
      // L'accroche : les mots portent data-accroche sur leur calque (un seul élément de la vidéo).
      hoteMots.setAttribute("data-accroche", "");
      var chiffres = cadreImprimerie($("cadre"));

      function construire() {
        var w100 = Math.max.apply(null, spans.map(function (s) { return s.offsetWidth; }).concat([1]));
        var fs = Math.min(0.62 * 2 * R / w100 * 100, (R * 1.05) / (spans.length * 1.04), 0.42 * R), ih = fs * 1.04;
        spans.forEach(function (s, k) {
          s.style.fontSize = fs.toFixed(1) + "px";
          s.style.left = (CX - s.offsetWidth / 2).toFixed(1) + "px";
          s.style.top = (CY - (spans.length * ih) / 2 + k * ih + (ih - s.offsetHeight) / 2).toFixed(1) + "px";
          // chaque ligne s'imprime de gauche à droite
          tl.fromTo(s, { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.3, ease: "power2.out", immediateRender: true }, MOTS_DEBUT + k * 0.15);
        });
        // Le point posé par le pinceau finit la phrase, après le dernier mot (sur sa ligne de base).
        var der = spans[spans.length - 1], mDer = (function () { var x = document.createElement("canvas").getContext("2d"); x.font = "600 " + fs + "px " + TITRES; return x.measureText("x"); })();
        var fa = mDer.fontBoundingBoxAscent || fs * 0.9, fd = mDer.fontBoundingBoxDescent || fs * 0.25;
        var px = der.offsetLeft + der.offsetWidth + fs * 0.2, py = der.offsetTop + (der.offsetHeight - fa - fd) / 2 + fa - fs * 0.1;
        var gPoint = { pts: [[(px - fs * 0.02) / L, (py - fs * 0.05) / H], [(px + fs * 0.02) / L, (py + fs * 0.03) / H]], largeur: fs * 0.3 / E, debut: POINT.debut, duree: POINT.duree, graine: POINT.graine, accent: POINT.accent };
        var GESTES = [CERCLE, gPoint], traits = GESTES.map(pinceau);

        // La nuée naît de l'encre réellement posée : le cercle, le point, puis les mots.
        var cE = document.createElement("canvas"), xE = toile(cE);
        traits.forEach(function (tr, k) { tr.dessiner(xE, 1, "#000", !!GESTES[k].accent); });
        var cM = document.createElement("canvas"), xM = toile(cM);
        var LIGNES = mesurer(spans);
        ecrire(xM, LIGNES, "#000");
        var pasMots = Math.max(4, Math.min(9, fs * 0.06)) * 1;
        var sources = placesDe(xE, PAS_ENCRE * E, GRAINE + 3).concat(placesDe(xM, pasMots, GRAINE + 4));
        var rB = rng(GRAINE), r = rng(GRAINE + 1), part = [];
        for (var i = 0; i < sources.length; i++) {
          var s = sources[i], b = bande(rB);
          part.push({ x0: s[0], y0: s[1], ra: Math.hypot(s[0] - CX, s[1] - CY), an: Math.atan2(s[1] - CY, s[0] - CX), x2: b[0], y2: b[1], tour: 0.9 + r() * 0.7, sou: (r() - 0.5) * 60 * E, d: r() * 0.3, ta: (1.5 + (i % 7) * 0.38) * E, al: 0.55 + hache(i, 5) * 0.45 });
        }

        var ctxE = toile($("encre")), ctxN = toile($("nuee"));
        // Les mots passent de la page au canevas au début de la numérisation (même dessin, même
        // place) : les colonnes de signes les traversent avec le cercle.
        tl.set(hoteMots, { opacity: 0 }, T_NUM);
        function rendre(t) {
          chiffres(t);
          ctxE.clearRect(0, 0, L, H);
          var fondu = 1 - prog(t, T_DEFAIT + 0.05, T_DEFAIT + 0.6);
          if (fondu > 0) {
            // le cercle se trace en deux élans (le pinceau accélère, ralentit, repart), puis le point
            traits.forEach(function (tr, k) { var g = GESTES[k], a = k === 0 ? 0.52 * prog(t, g.debut, g.debut + g.duree * 0.42, "power2.out") + 0.48 * prog(t, g.debut + g.duree * 0.45, g.debut + g.duree, "power2.inOut") : prog(t, g.debut, g.debut + g.duree, "power2.out"); tr.dessiner(ctxE, a, g.accent ? ACCENT : ENCRE, !!g.accent); });
            if (t >= T_NUM) ecrire(ctxE, LIGNES, ENCRE);
            // la numérisation : des colonnes de petits signes, couleur de la page, traversent l'encre

        // geste et la lecture (les mots ne bougent pas ; le pinceau, le point et le cadre font la vie),
        // puis, une fois les mots défaits, revient au cadre de la scène suivante.
        var cam = $("cam");
