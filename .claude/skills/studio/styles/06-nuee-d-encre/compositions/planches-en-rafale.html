<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°6 « NUÉE D'ENCRE » · SCÈNE 3 : LES PLANCHES EN RAFALE (2,8 s)

    Ce qu'elle montre : l'initiale en points de la scène 2, au centre. Autour d'elle, des planches
    surgissent en rafale, du centre vers les bords, jusqu'à remplir la page. Une planche, c'est sa
    vraie matière ou ses vrais mots, jamais un dessin inventé :
      - ses images (IMAGES) : ses croquis, ses captures (sa page, son produit), passés en noir et
        blanc dans un cadre fin ;
      - sinon ses mots (MOTS) : les vrais mots de son offre (ses formats, ses modules, ses
        outils), composés à l'encre comme des planches d'imprimerie : dans un cadre fin, sur un
        aplat d'encre, dans une pilule, seuls sur un filet ; quelques disques pleins ponctuent.
    Puis coupe franche sur la page vide de la scène 4 (« bientot »).
    Rôle : le crescendo du teaser, juste avant la révélation (la musique se retient, puis frappe
    sur la coupe).

    Format : 16:9 par défaut. En 9:16, change data-width / data-height de la racine : la grille
    des planches se recalcule (8 colonnes sur 5 rangs en 16:9, 5 sur 9 en 9:16, dans une marge).

    À REMPLACER :
      1. L'id « t06-planches » partout (rechercher-remplacer) par l'id de la scène dans index.html.
      2. IMAGES : ses vraies images (fichiers dans assets/images/ du projet : ses croquis, ses
         captures), fournies pour cette vidéo ; elles prennent les premières planches, au plus
         près de l'initiale. MOTS : 10 à 20 vrais mots de son offre (de OFFRE.json ou de sa page),
         qui prennent les autres planches. Sans images ni mots, la rafale se retire (la page
         reste avec l'initiale et le recul de la caméra).
      3. INITIALE : la même que dans la scène 2. LEGENDES_FIG : les petites légendes d'imprimerie
         sous certaines planches (« fig. 1 »…).
      Couleurs : celles de la marque. La page est var(--brand-clair), l'encre var(--brand-sombre),
      le texte sur un aplat d'encre la couleur de la page ; ses images passent en noir et blanc
      (le look est monochrome ; retire le filtre pour leur garder leurs couleurs : ce sont ses
      vraies captures, `palette` les signale, la revue tranche).
    Ne pas toucher : PARTICULES, GRAINE, FIN_SCENE2 et lettre() (raccord avec la scène 2).
  -->
</head>
<body>
<template>
  <style>
    #t06-planches {
      --t06-papier: var(--brand-clair);   /* la page : un aplat de la couleur claire de la marque */
      --t06-encre: var(--brand-sombre);   /* l'encre : sa couleur la plus sombre */
      --t06-texte: var(--brand-font-body);
      --t06-titres: var(--brand-font-display);
      background: var(--t06-papier); color: var(--t06-encre);
    }
    #t06-planches .t06-page { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.045) 100%); }
    #t06-planches canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #t06-planches .t06-cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
    #t06-planches .t06-planche { position: absolute; display: flex; align-items: center; justify-content: center; }
    #t06-planches .t06-planche svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #t06-planches .t06-planche rect, #t06-planches .t06-planche line { fill: none; stroke: currentColor; vector-effect: non-scaling-stroke; }
    #t06-planches .t06-mot { position: relative; font-family: var(--t06-titres); white-space: nowrap; line-height: 1; letter-spacing: -0.01em; }
    #t06-planches .t06-aplat { background: var(--t06-encre); color: var(--t06-papier); }
    #t06-planches .t06-pilule { background: var(--t06-encre); color: var(--t06-papier); border-radius: 999px; }
    #t06-planches .t06-disque { background: var(--t06-encre); border-radius: 50%; }
    #t06-planches .t06-planche img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: cover; filter: grayscale(1) contrast(1.05); }
    #t06-planches .t06-num { position: absolute; left: 0; top: -15px; font: 600 9px/1 var(--t06-texte); letter-spacing: 0.08em; white-space: nowrap; color: var(--t06-encre); }
    #t06-planches .t06-fig { position: absolute; left: 0; right: 0; bottom: -17px; text-align: center; font: italic 400 11px/1 var(--t06-texte); letter-spacing: 0.02em; white-space: nowrap; color: var(--t06-encre); }
  </style>

  <div data-composition-id="t06-planches" data-width="1920" data-height="1080" data-duration="2.8" style="position:absolute; inset:0;">
    <div id="t06-planches" class="k-scene">
      <div class="t06-page"></div>
      <canvas id="t06-planches-initiale"></canvas>
      <div class="t06-cam" id="t06-planches-cam" data-layout-allow-overflow>
        <div id="t06-planches-planches"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "t06-planches", D = 2.8;
      var IMAGES = []; // ses vraies images, ex. ["assets/images/capture-page.png", …] : les premières planches
      var MOTS = ["Ton offre", "Module 1", "Module 2", "Module 3", "Bonus", "Méthode", "Communauté", "Modèles",
        "Vidéos", "Exercices", "Lives", "Accès à vie"]; // les vrais mots de son offre (de OFFRE.json ou de sa page)
      var LEGENDES_FIG = ["fig. 1", "fig. 2", "pl. III", "fig. 4", "fig. 7", "pl. IX"];
      var INITIALE = "T"; // la même que dans la scène 2
      var PARTICULES = 3400, GRAINE = 61, FIN_SCENE2 = 5; // l'initiale continue de frémir

      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var racine = document.getElementById(ID), cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
      var tl = gsap.timeline({ paused: true });
      var E = Math.min(L, H) / 1080;

      // --- Outils du look (communs aux scènes du style 6) ---------------------------------
      function rng(g) { var s = (g >>> 0) || 1; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function hache(i, k) { var s = Math.sin(i * 12.9898 + (k || 0) * 78.233) * 43758.5453; return s - Math.floor(s); }
      function toile(c) { c.width = L; c.height = H; return c.getContext("2d"); }
      // Les couleurs de la marque, lues sur la scène (le canevas veut des valeurs, pas des var()).
      var cs = getComputedStyle(racine), ENCRE = cs.color;
      var TITRES = cs.getPropertyValue("--t06-titres").trim() || "sans-serif";
      // L'initiale en points, tirée exactement comme dans la scène 2 (même lettre, même graine).
      function lettre(n) {
        var c = document.createElement("canvas"), x = c.getContext("2d"), taille = Math.round(0.8 * Math.min(L, H));
        c.width = L; c.height = H;
        x.font = "700 " + taille + "px " + TITRES; x.textBaseline = "alphabetic";
        var m = x.measureText(INITIALE), g = m.actualBoundingBoxLeft || 0, d = m.actualBoundingBoxRight || m.width;
        var h = m.actualBoundingBoxAscent || taille * 0.7, b = m.actualBoundingBoxDescent || 0;
        var ox = L / 2 - (d - g) / 2, oy = H / 2 + (h - b) / 2;   // la boîte de la lettre centrée
        x.fillStyle = "#000"; x.fillText(INITIALE, ox, oy);
        var px = x.getImageData(0, 0, L, H).data, r = rng(GRAINE + 77), places = [];
        var x0 = Math.max(0, Math.floor(ox - g)), x1 = Math.min(L - 1, Math.ceil(ox + d)), y0 = Math.max(0, Math.floor(oy - h)), y1 = Math.min(H - 1, Math.ceil(oy + b));
        for (var essai = 0; places.length < n && essai < n * 60; essai++) {
          var qx = x0 + r() * (x1 - x0), qy = y0 + r() * (y1 - y0);
          if (px[((qy | 0) * L + (qx | 0)) * 4 + 3] > 140) places.push([qx, qy]);
        }
        while (places.length < n) places.push([L / 2, H / 2]);
        return { places: places, boite: [x0, y0, x1, y1] };
      }
      // la largeur d'un mot à 100 px, pour le composer à la taille de sa planche
      var mesure = document.createElement("canvas").getContext("2d");
      function largeur100(mot, graisse) { mesure.font = graisse + " 100px " + TITRES; return mesure.measureText(mot).width || 1; }

      function construire() {
        // --- L'initiale en points (la même nuée qu'à la fin de la scène 2) ----------------------
        var LETTRE = lettre(PARTICULES), ctx = toile($("initiale")), part = [];
        for (var i = 0; i < PARTICULES; i++) part.push({ ta: (1.5 + (i % 7) * 0.38) * E, al: 0.55 + hache(i, 5) * 0.45 });
        function rendreInitiale(t) {
          var T = FIN_SCENE2 + t, amp = 2.2 * E;
          ctx.clearRect(0, 0, L, H); ctx.fillStyle = ENCRE;
          for (var i = 0; i < part.length; i++) {
            var q = LETTRE.places[i], f = 0.5 + hache(i, 44), ph = hache(i, 45) * 6.2832, prof = 0.45 + 0.55 * hache(i, 43);
            var x = q[0] + Math.sin(T * 2.1 * f + ph) * amp, y = q[1] + Math.cos(T * 1.7 * f + ph) * amp;
            ctx.globalAlpha = part[i].al * (0.3 + 0.7 * prof); ctx.beginPath(); ctx.arc(x, y, part[i].ta * (0.7 + 0.3 * prof), 0, 6.2832); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // --- La rafale : une grille de places, remplie du centre vers les bords -----------------
        // Chaque planche reste dans sa case (aucun mot ne se chevauche ni ne sort du cadre) ; la
        // grille tient dans une marge, l'initiale garde sa place.
        var rP = rng(GRAINE + 9), places = [], cols = vertical ? 5 : 8, rangs = vertical ? 9 : 5, M = 40 * E;
        var pasX = (L - 2 * M) / cols, pasY = (H - 2 * M) / rangs, bt = LETTRE.boite, marge = 30 * E;
        for (var c = 0; c < cols; c++) for (var g = 0; g < rangs; g++) {
          var cx = M + (c + 0.5) * pasX, cy = M + (g + 0.5) * pasY;
          if (cx + pasX / 2 > bt[0] - marge && cx - pasX / 2 < bt[2] + marge && cy + pasY / 2 > bt[1] - marge && cy - pasY / 2 < bt[3] + marge) continue;
          places.push({ x: cx, y: cy, d: Math.hypot((cx - L / 2) / L, (cy - H / 2) / H), rot: (rP() - 0.5) * 10, jx: rP() - 0.5, jy: rP() - 0.5, tx: rP() });
        }
        places.sort(function (a, b) { return a.d - b.d; });
        var hote = $("planches"), nMots = MOTS.length, nImages = IMAGES.length, FS_MIN = 17 * E;
        if (!nMots && !nImages) places = [];   // ni image ni mot : la rafale se retire
        var parSalve = Math.max(1, Math.ceil(places.length / 5));
        places.forEach(function (p, k) {
          var image = k < nImages ? IMAGES[k] : (!nMots ? IMAGES[k % nImages] : null);
          var v = hache(k, 9), genre = image ? "image" : v < 0.34 ? "cadre" : v < 0.56 ? "nu" : v < 0.74 ? "aplat" : v < 0.9 ? "pilule" : "disque";
          // un disque plein ponctue, sans mot ; les mots se suivent du centre vers les bords (les
          // premiers, tous différents, au plus près de l'initiale)
          var mot = image || genre === "disque" ? "" : MOTS[(k - Math.min(k, nImages)) % nMots];
          // la taille de la planche suit sa case, celle du mot suit sa planche (jamais sous FS_MIN)
          var w = pasX * (0.78 + p.tx * 0.12), h = pasY * (image ? 0.62 : 0.5 + p.tx * 0.12), graisse = genre === "nu" ? 800 : genre === "cadre" ? 600 : 700, fs = 0;
          if (mot) {
            var l100 = largeur100(mot, graisse);
            if (genre === "pilule") { h = pasY * 0.3; fs = Math.max(FS_MIN, Math.min(h * 0.44, ((w - h) * 100) / l100)); w = Math.min(pasX * 0.92, fs * l100 / 100 + h * 1.1); }
            else if (genre === "nu") { h = pasY * 0.5; fs = Math.max(FS_MIN, Math.min(h * 0.6, (pasX * 0.9 * 100) / l100)); w = Math.min(pasX * 0.94, fs * l100 / 100 + 8); }
            else fs = Math.max(FS_MIN, Math.min(h * 0.36, (w * 0.8 * 100) / l100));
            if (fs * l100 / 100 > pasX * 0.94) fs = (pasX * 0.94 * 100) / l100;   // un mot très long se réduit pour tenir dans sa case
          }
          if (genre === "disque") { w = h = Math.min(pasX, pasY) * 0.32; }
          // un léger décalage dans la case, sans en sortir (légendes comprises)
          var x = p.x + p.jx * Math.max(0, pasX - w) * 0.7, y = p.y + p.jy * Math.max(0, pasY - h - 36) * 0.7;
          var e = K.el(hote, "div", "t06-planche" + (genre === "aplat" ? " t06-aplat" : genre === "pilule" ? " t06-pilule" : genre === "disque" ? " t06-disque" : ""), "",
            "left:" + (x - w / 2).toFixed(0) + "px; top:" + (y - h / 2).toFixed(0) + "px; width:" + w.toFixed(0) + "px; height:" + h.toFixed(0) + "px;");
          var traits = [];
          if (genre === "cadre" || genre === "image") {
            e.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="100" height="100" stroke-width="' + (1.2 + (k % 3) * 0.35).toFixed(2) + '"/></svg>');
            traits = traits.concat([].slice.call(e.querySelectorAll("rect")));
          }
          if (image) K.el(e, "img", "", null).setAttribute("src", image);
          if (mot) {
            K.el(e, "span", "t06-mot", mot, "font-size:" + fs.toFixed(1) + "px; font-weight:" + graisse + ";");
            if (genre === "nu") {
              var yl = (50 + (fs / h) * 62).toFixed(1);
              e.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="' + yl + '" x2="100" y2="' + yl + '" stroke-width="1"/></svg>');
              traits = traits.concat([].slice.call(e.querySelectorAll("line")));
            }
          }
          if ((genre === "cadre" || genre === "nu" || image) && k % 3 === 0) K.el(e, "span", "t06-num", "N° " + String(k + 1).padStart(2, "0"));
          if (k % 4 === 2 && LEGENDES_FIG.length && (genre === "cadre" || genre === "aplat" || image)) K.el(e, "div", "t06-fig", LEGENDES_FIG[(k / 4 | 0) % LEGENDES_FIG.length]);
          // chaque planche surgit : petite échelle, rotation, puis se pose ; son trait se dessine et
          // son mot s'écrit de gauche à droite, par salves sur le tempo (une toutes les 0,42 s, du
          // centre vers les bords)
          var t0 = 0.1 + Math.floor(k / parSalve) * 0.42 + (k % parSalve) * 0.012;
          gsap.set(e, { opacity: 0, scale: 0.6, rotation: p.rot });
          tl.to(e, { opacity: 1, scale: 1, rotation: 0, duration: 0.16, ease: "back.out(2)" }, t0);
          traits.forEach(function (el) { el.setAttribute("pathLength", "100"); el.setAttribute("stroke-dasharray", "100"); el.setAttribute("stroke-dashoffset", "100"); tl.to(el, { attr: { "stroke-dashoffset": 0 }, duration: 0.32, ease: "power2.out" }, t0 + 0.02); });
          var ecrit = e.querySelector(".t06-mot");
          if (ecrit) tl.fromTo(ecrit, { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.3, ease: "power2.out", immediateRender: true }, t0 + 0.04);
        });

        // La caméra recule doucement pendant la rafale ; tout se tient, puis coupe franche (scène 4).
        var cam = $("cam");
        gsap.set(cam, { scale: 1.14 });
        tl.to(cam, { scale: 1, duration: 2.2, ease: "power2.out" }, 0);
        tl.to(cam, { scale: 0.985, duration: 0.6, ease: "none" }, 2.2);
        var horloge = { t: 0 };
        tl.to(horloge, { t: D, duration: D, ease: "none", onUpdate: function () { rendreInitiale(horloge.t); } }, 0);
        rendreInitiale(0);
        window.__timelines[ID] = tl;
      }
      // l'initiale et les mots se mesurent avec la police chargée (même tirage que la scène 2)
      if (document.fonts && document.fonts.load) Promise.all([600, 700, 800].map(function (g) { return document.fonts.load(g + " 100px " + TITRES, INITIALE + MOTS.join("")); })).then(construire, construire);
      else construire();
    })();
  </script>
</template>
</body>
</html>
