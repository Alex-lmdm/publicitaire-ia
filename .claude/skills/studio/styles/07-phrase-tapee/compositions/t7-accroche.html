<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"></head>
<body>
<template>
<!--
  Style n°7 · Phrase tapée · scène « L'ouverture » (accroche et nom).
  Ce qu'elle montre : sur la nuit de ta marque, une phrase se pose mot à mot avec deux objets
  glissés DANS la ligne (une vignette où défilent ses vraies images, une pastille et son petit
  curseur) ; coupe sur la suite de la phrase, dont les mots s'allument tour à tour à la couleur de
  ta marque ; un temps de silence ; un mot géant tapé sur l'aplat de ta couleur ; coupe sur fond
  clair : ton logo devient net et ton nom sort de lui.
  Chaque texte se tient le temps de sa lecture (0,3 s par mot + 0,8 s, 2 s au moins pour
  l'accroche : `studio_motion.py lecture`) et ne bouge plus pendant qu'on le lit : la vie vient de
  la vignette qui change, de la pastille qu'on clique, des mots qui s'allument, du curseur qui
  clignote.
  Durée : la scène la calcule (D dans le script) : 11,2 s avec l'objet EXEMPLE ; reporte-la dans
  data-duration (ici et sur l'hôte). La phrase tient sur une ligne en 16:9 (deux en 9:16) : 8 mots
  au plus, pastille comprise.
  16:9 (1920 × 1080) ; en 9:16, passe la racine à 1080 × 1920 (la phrase passe sur deux lignes, le
  mot géant et le nom s'ajustent à la largeur).
  À remplacer : l'objet EXEMPLE en tête du script (chaque champ y est décrit). Sans vraie image, la
  vignette se retire de la phrase : jamais de mots qui défilent dedans, jamais une icône.
  Couleurs : seulement les jetons de ta marque (brand/tokens.css) : sa nuit, l'aplat de son accent,
  son clair, un gris. L'accent se pose plein ; sur fond clair, il ne sert qu'en aplat.
  Identifiant : t7a (préfixe de tous les id et classes de la scène).
-->
<style>
  #t7a {
    /* Les fonds du look viennent de la marque : la nuit (sa couleur la plus sombre), l'aplat de
       son accent, son clair. Le texte posé sur la nuit est son clair. */
    --t7-nuit: var(--brand-sombre);
    --t7-clair: var(--brand-clair);
    --t7-encre: var(--brand-sombre);
    --t7-texte: var(--brand-clair);
    --t7-gris: var(--brand-gris-3);
    --t7-accent-texte: var(--brand-accent-lisible);
    --t7-police: var(--brand-font-display);
    background: var(--t7-nuit); font-family: var(--t7-police); color: var(--t7-texte);
  }
  #t7a .t7a-plan { position: absolute; inset: 0; }
  #t7a .t7a-nuit { background: var(--t7-nuit); }
  #t7a .t7a-ligne { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    column-gap: 30px; row-gap: 10px; padding: 0 80px; font-size: 104px; font-weight: 500; letter-spacing: -0.045em; line-height: 1.1; white-space: nowrap; }
  #t7a .t7a-m { display: inline-block; }
  #t7a .t7a-g { color: var(--t7-gris); }
  /* La vignette : un petit cadre clair dans la ligne, qui porte ses vraies images. */
  #t7a .t7a-carte { position: relative; width: 96px; height: 134px; border-radius: 14px; background: var(--t7-clair); flex: none;
    box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  #t7a .t7a-vignette { position: absolute; inset: 5px; border-radius: 10px; overflow: hidden; }
  #t7a .t7a-vignette img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* La pastille : un mot (il ne change pas), sur l'aplat de l'accent, et son petit curseur en pixels. */
  #t7a .t7a-pastille { position: relative; height: 74px; padding: 0 26px; border-radius: 16px; display: grid; place-items: center; flex: none;
    font-family: var(--brand-font-body); font-size: 42px; font-weight: 600; letter-spacing: -0.01em; color: var(--brand-contrast); background: var(--brand-accent); }
  #t7a .t7a-pastille svg { position: absolute; right: -20px; bottom: -24px; width: 30px; height: 30px; }
  #t7a .t7a-pastille svg .t7a-pointe { fill: var(--t7-clair); stroke: var(--t7-encre); stroke-width: 1; paint-order: stroke; }
  #t7a .t7a-suite { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; white-space: nowrap;
    font-size: 116px; font-weight: 500; letter-spacing: -0.045em; line-height: 1.1; }
  #t7a .t7a-suite span { display: inline-block; }
  /* Un mot de la suite s'allume d'un coup à l'accent (jamais un mélange de l'accent et du blanc). */
  #t7a .t7a-s[data-on="1"] { color: var(--t7-accent-texte); }
  #t7a .t7a-aplat { background: var(--brand-accent); overflow: hidden; }
  /* Le mot géant : sa taille et sa hauteur se calculent à sa longueur (60 à 90 % de la largeur). */
  #t7a .t7a-geant { position: absolute; left: 0; right: 0; top: 50%; text-align: center; white-space: nowrap;
    font-weight: 700; letter-spacing: -0.05em; color: var(--brand-contrast); }
  #t7a .t7a-caret { display: inline-block; width: 0.07em; height: 0.82em; margin-left: 0.04em; vertical-align: -0.06em; background: currentColor; }
  #t7a .t7a-clair { background: var(--t7-clair); }
  #t7a .t7a-signe { position: absolute; left: 0; right: 0; top: 50%; display: flex; align-items: center; justify-content: center; color: var(--t7-encre); }
  #t7a .t7a-logo { display: grid; place-items: center; flex: none; }
  #t7a .t7a-logo img { width: 100%; height: 100%; object-fit: contain; }
  #t7a .t7a-nom-boite { overflow: hidden; }
  #t7a .t7a-nom { font-weight: 600; letter-spacing: -0.05em; white-space: nowrap; line-height: 1.2; }
</style>

<div data-composition-id="t7a" data-width="1920" data-height="1080" data-duration="11.2" style="position:absolute; inset:0;">
  <div id="t7a" class="k-scene">
    <div class="t7a-plan t7a-nuit" id="t7a-p1">
      <div class="t7a-ligne" id="t7a-ligne"></div>
      <div class="t7a-suite" id="t7a-suite"></div>
    </div>
    <div class="t7a-plan t7a-aplat" id="t7a-p2">
      <div class="t7a-geant" id="t7a-geant"><span id="t7a-geant-texte"></span><span class="t7a-caret" id="t7a-caret-geant"></span></div>
    </div>
    <div class="t7a-plan t7a-clair" id="t7a-p3">
      <div class="t7a-signe" id="t7a-signe"><div class="t7a-logo" id="t7a-logo"></div><div class="t7a-nom-boite"><div class="t7a-nom" id="t7a-nom"></div></div></div>
    </div>
  </div>
</div>

<script>
(function () {
  var EXEMPLE = { // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire
    // la phrase (ce que contient l'offre), en morceaux ; "[carte]" et "[pastille]" y placent ses deux objets
    phrase: ["Des leçons", "[carte]", "et des", "[pastille]"],
    gris: ["et des"],                                // les morceaux de la phrase en gris
    // ses vraies images (miniatures de ses vidéos, captures de ses pages), qui défilent dans la
    // vignette toutes les 0,45 s ; [] : la vignette se retire de la phrase
    vignettes: ["assets/images/miniature-1.jpg", "assets/images/miniature-2.jpg", "assets/images/miniature-3.jpg"],
    pastille: "modèles",                             // le mot de la pastille (un seul ; "" : la pastille se retire)
    suite: ["dans", "une", "seule", "formation."],   // ses mots s'allument tour à tour
    geant: "Voici",                                  // le mot géant (1 à 3 mots)
    logo: "brand/logo.png",                          // son fichier dans brand/ (logo.svg ou .png) ; "" : le nom seul
    nom: "Ton offre"                                 // le nom de l'offre
  };
  // Le temps de lecture du studio (`studio_motion.py lecture`) : 0,3 s par mot + 0,8 s, 1,5 s au moins.
  function lecture(t, plancher) { var n = [].concat(t).join(" ").split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length; return Math.ceil(Math.max(plancher || 1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10; }
  var morceaux = EXEMPLE.phrase.filter(function (m) {
    return (m !== "[carte]" || EXEMPLE.vignettes.length) && (m !== "[pastille]" || EXEMPLE.pastille);
  });
  var motsPhrase = morceaux.map(function (m) { return m === "[pastille]" ? EXEMPLE.pastille : m; }).filter(function (m) { return m !== "[carte]"; });
  var E1 = 0.05 + 0.3 * (morceaux.length - 1) + 0.45;                           // le dernier morceau posé
  var X1 = E1 + lecture(motsPhrase, 2);                                          // la phrase et ses objets, lue
  var XS = X1 + 0.35 + 0.06 * (EXEMPLE.suite.length - 1) + lecture(EXEMPLE.suite); // la suite, lue
  var G0 = XS + 0.4, XG = G0 + 0.6 + lecture(EXEMPLE.geant);                      // le silence, puis le mot géant, lu
  var D = Math.ceil((XG + 0.95 + lecture(EXEMPLE.nom)) * 10 - 1e-9) / 10;        // le logo et le nom, lus
  var $ = function (id) { return document.getElementById(id); };
  var racine = $("t7a"), q = function (s) { return racine.querySelectorAll(s); };
  var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;

  // La phrase, avec ses objets dans la ligne
  var ligne = $("t7a-ligne"), mots = [], carte, pastille, vignettes = [];
  morceaux.forEach(function (m) {
    if (m === "[carte]") {
      carte = K.el(ligne, "div", "t7a-carte");
      EXEMPLE.vignettes.forEach(function (src) {
        var e = K.el(carte, "div", "t7a-vignette"), img = K.el(e, "img");
        img.alt = ""; img.src = src; img.onerror = function () { e.remove(); };   // une image absente se retire
        vignettes.push(e);
      });
      mots.push(carte);
    } else if (m === "[pastille]") {
      pastille = K.el(ligne, "div", "t7a-pastille", '<span id="t7a-pastille-mot"></span><svg viewBox="-1 -1 9 10" shape-rendering="crispEdges">' +
        '<path class="t7a-pointe" d="M0 0h2v1h1v1h1v1h1v1h1v1h-3v1h-1v1h-1v-1h-1z"/></svg>');
      $("t7a-pastille-mot").textContent = EXEMPLE.pastille;
      mots.push(pastille);
    } else {
      mots.push(K.el(ligne, "span", "t7a-m" + (EXEMPLE.gris.indexOf(m) >= 0 ? " t7a-g" : ""), m));
    }
  });
  EXEMPLE.suite.forEach(function (m, i) {
    if (i) $("t7a-suite").appendChild(document.createTextNode(" "));
    K.el($("t7a-suite"), "span", "t7a-s", m);
  });
  // en 9:16, la suite passe à la ligne (jamais une police plus petite pour la faire tenir)
  if (vertical) { ligne.style.fontSize = "92px"; $("t7a-suite").style.cssText = "font-size:100px; white-space:normal; padding:0 60px;"; }
  // Le mot géant occupe 60 à 90 % de la largeur : sa taille suit sa longueur (environ 0,55 em par
  // lettre en graisse 700), sans dépasser la moitié de la hauteur.
  var fg = Math.round(Math.min(0.5 * H, 0.8 * L / (EXEMPLE.geant.length * 0.55)));
  $("t7a-geant").style.cssText = "font-size:" + fg + "px; line-height:" + Math.round(fg * 1.15) + "px; height:" + Math.round(fg * 1.15) + "px; margin-top:" + -Math.round(fg * 0.575) + "px;";
  // Le nom et son logo : 60 à 90 % de la largeur ensemble (le logo prend la hauteur du nom)
  var aLogo = !!EXEMPLE.logo;
  var fn = Math.round(Math.min(0.28 * H, (0.75 * L - (aLogo ? 34 : 0)) / (EXEMPLE.nom.length * 0.55 + (aLogo ? 1 : 0))));
  if (aLogo) $("t7a-logo").innerHTML = '<img src="' + EXEMPLE.logo + '" alt="" onerror="this.parentNode.style.display=\'none\'">'; else $("t7a-logo").style.display = "none";
  $("t7a-logo").style.cssText += "width:" + fn + "px; height:" + fn + "px; margin-right:" + (aLogo ? 34 : 0) + "px;";
  $("t7a-nom").textContent = EXEMPLE.nom;
  $("t7a-nom").style.fontSize = fn + "px";
  $("t7a-signe").style.cssText = "height:" + Math.round(fn * 1.3) + "px; margin-top:" + -Math.round(fn * 0.65) + "px;";

  // États de départ : le premier morceau est déjà là sur la toute première image (une ouverture
  // n'est jamais vide), les autres se posent un à un
  K.cacher(mots.slice(1)); K.cacher(["#t7a-suite", "#t7a-p2", "#t7a-p3"]);
  if (vignettes.length) { gsap.set(vignettes, { opacity: 0 }); gsap.set(vignettes[0], { opacity: 1 }); }
  var tl = gsap.timeline({ paused: true });

  // 1. La phrase et ses objets : les morceaux montent un à un, les objets surgissent dans la ligne
  mots.forEach(function (m, i) {
    if (!i) return;
    var objet = m === carte || m === pastille, t = 0.05 + i * 0.3;
    if (objet) tl.fromTo(m, { opacity: 0, scale: 0.3, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1)" }, t);
    else tl.fromTo(m, { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);
  });
  // pendant la lecture : la vignette change d'un coup, avec un petit rebond (ses vraies images)
  if (carte && vignettes.length > 1) {
    for (var s = 1; 0.75 + s * 0.45 < X1 - 0.3; s++) {
      var tv = 0.75 + s * 0.45, iv = s % vignettes.length, ip = (s - 1) % vignettes.length;
      tl.set(vignettes[ip], { opacity: 0 }, tv); tl.set(vignettes[iv], { opacity: 1 }, tv);
      tl.fromTo(carte, { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "back.out(1)", immediateRender: false }, tv);
    }
  }
  // et le petit curseur clique la pastille, deux fois
  if (pastille) {
    var tp = 0.05 + mots.indexOf(pastille) * 0.3 + 0.6;
    [tp, tp + 1.1].forEach(function (t) {
      if (t > X1 - 0.4) return;
      tl.fromTo(pastille, { scale: 1 }, { scale: 0.92, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
    });
  }
  tl.set("#t7a-ligne", { opacity: 0 }, X1);

  // 2. La suite, une fois la phrase lue : ses mots s'allument tour à tour à la couleur de la marque
  //    (chacun bondit un peu), puis tous ensemble ; elle se tient le temps de sa lecture
  var sm = q(".t7a-s");
  tl.set("#t7a-suite", { opacity: 1 }, X1);
  tl.fromTo(sm, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out", stagger: 0.06 }, X1);
  sm.forEach(function (m, i) {
    var t = X1 + 0.5 + i * 0.32;
    tl.set(m, { attr: { "data-on": "1" } }, t);
    tl.fromTo(m, { y: 0 }, { y: -14, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
    tl.set(m, { attr: { "data-on": "0" } }, t + 0.38);
  });
  sm.forEach(function (m, i) { tl.set(m, { attr: { "data-on": "1" } }, Math.max(X1 + 0.5 + sm.length * 0.32 + 0.1, XS - 0.3) + i * 0.05); });
  // coupe franche sur le silence : la nuit seule (0,4 s, la musique coupée)
  tl.set("#t7a-suite", { opacity: 0 }, XS);

  // 3. Le mot géant tapé sur l'aplat de la couleur de la marque, tenu le temps de sa lecture ; le
  //    curseur clignote
  tl.set("#t7a-p2", { opacity: 1 }, G0);
  tl.set("#t7a-p1", { opacity: 0 }, G0);
  K.taper(tl, $("t7a-geant-texte"), EXEMPLE.geant, G0 + 0.1, G0 + 0.6, D);
  for (var tc = G0 + 0.75, kc = 0; tc < XG; tc += 0.4, kc++) tl.set("#t7a-caret-geant", { opacity: kc % 2 ? 1 : 0 }, tc);

  // 4. Le logo devient net, le nom sort de lui et se tient le temps de sa lecture
  tl.set("#t7a-p3", { opacity: 1 }, XG);
  tl.set("#t7a-p2", { opacity: 0 }, XG);
  if (aLogo) tl.fromTo("#t7a-logo", { scale: 1.5, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, XG);
  // avec un logo, le nom sort de derrière lui ; sans logo, il monte du flou
  tl.fromTo("#t7a-nom", aLogo ? { xPercent: -100, y: 0, opacity: 0, filter: "blur(0px)" } : { xPercent: 0, y: 40, opacity: 0, filter: "blur(12px)" },
    { xPercent: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, XG + (aLogo ? 0.35 : 0.05));
  window.__timelines["t7a"] = tl;
})();
</script>
</template>
</body>
</html>
