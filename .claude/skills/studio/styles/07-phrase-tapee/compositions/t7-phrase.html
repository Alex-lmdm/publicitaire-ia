<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"></head>
<body>
<template>
<!--
  Style n°7 · Phrase tapée · scène « La phrase tapée » (la solution, puis la démonstration).
  Ce qu'elle montre : sur le fond ardoise (un gris de ta marque), deux lignes se tapent l'une sous
  l'autre (la première claire, la seconde grise) derrière un gros curseur de frappe à la couleur
  de ta marque ; coupe sur fond clair : une barre de demande où la phrase se tape, sa vraie page
  jointe au-dessus, les logos de ses outils empilés, le curseur clique sur envoyer ; la barre
  s'envole et la fenêtre du résultat s'ouvre et se remplit de ses vraies images, en cascade.
  Chaque texte se tient le temps de sa lecture (0,3 s par mot + 0,8 s : `studio_motion.py lecture`)
  et ne bouge plus pendant qu'on le lit : les deux lignes (leurs mots s'allument tour à tour, sur
  place), la demande dans la barre (sa vraie page glisse au-dessus et défile, ses logos
  arrivent un à un, puis le curseur vient cliquer), le titre de la fenêtre pendant que ses images
  tombent. La caméra ne fait qu'une dérive lente sous un texte qu'on lit.
  Durée : la scène la calcule (D dans le script) : 12,2 s avec l'objet EXEMPLE. Sans capture ni
  image du résultat, la fenêtre ne s'ouvre pas : la scène s'arrête juste après l'envoi (8,9 s).
  Reporte-la dans data-duration (ici et sur l'hôte).
  16:9 (1920 × 1080) ; en 9:16, passe la racine à 1080 × 1920 (classe t7p-vertical, réglée seule :
  barre plus haute où la demande passe sur deux lignes, fenêtre en portrait qui remplit l'écran).
  À remplacer : l'objet EXEMPLE en tête du script (chaque champ y est décrit). Jamais de cartes
  vides ni de squelette : sans vraie image, la fenêtre ne s'ouvre pas.
  Couleurs : seulement les jetons de ta marque (brand/tokens.css) : l'ardoise (un de ses gris), son
  clair, sa nuit pour l'encre, l'accent plein pour le curseur de frappe. Les captures et les logos
  gardent leurs vraies couleurs.
  Identifiant : t7p (préfixe de tous les id et classes de la scène).
-->
<style>
  #t7p {
    /* Les fonds du look viennent de la marque : l'ardoise (son gris le plus sombre), son clair. */
    --t7-ardoise: var(--brand-gris-1);
    --t7-clair: var(--brand-clair);
    --t7-encre: var(--brand-sombre);
    --t7-texte: var(--brand-clair);
    --t7-gris: var(--brand-gris-4);
    --t7-police: var(--brand-font-display);
    background: var(--t7-ardoise); font-family: var(--t7-police); color: var(--t7-texte);
  }
  #t7p .t7p-plan { position: absolute; inset: 0; }
  #t7p .t7p-ardoise { background: var(--t7-ardoise); }
  #t7p .t7p-clair { background: var(--t7-clair); }
  #t7p .t7p-lignes { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
    font-size: 124px; font-weight: 500; letter-spacing: -0.045em; line-height: 1.0; white-space: nowrap; }
  #t7p .t7p-l2 { color: var(--t7-gris); }
  /* Les mots des deux lignes, une fois tapées : ils s'allument d'un coup à l'accent, sur place
     (leurs boîtes, hautes de la police, se touchent d'une ligne à l'autre ; les lettres, non). */
  #t7p .t7p-mots { display: none; }
  #t7p .t7p-mot { display: inline-block; }
  #t7p .t7p-mot[data-on="1"] { color: var(--brand-accent-lisible); }
  #t7p .t7p-caret { display: inline-block; width: 0.075em; height: 0.84em; margin-left: 0.05em; vertical-align: -0.08em; background: var(--brand-accent); }
  #t7p .t7p-scene3d { position: absolute; inset: 0; perspective: 2000px; }
  #t7p .t7p-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #t7p .t7p-barre { position: absolute; left: 50%; top: 50%; width: 1300px; height: 124px; margin: -62px 0 0 -650px; border-radius: 30px; background: var(--t7-clair);
    box-shadow: 0 24px 60px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06), inset 0 0 0 1.5px rgba(0,0,0,.08);
    display: flex; align-items: center; padding: 0 30px 0 36px; gap: 26px; color: var(--t7-encre); font-family: var(--brand-font-body); }
  #t7p .t7p-plus { width: 34px; height: 34px; color: var(--brand-gris-2); flex: none; }
  #t7p .t7p-demande { flex: 1; font-size: 40px; font-weight: 400; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; }
  #t7p .t7p-demande::after { content: ""; display: inline-block; width: 3px; height: 42px; margin-left: 3px; vertical-align: -8px; background: var(--t7-encre); }
  #t7p .t7p-logos { display: flex; flex: none; }
  #t7p .t7p-logo { width: 62px; height: 62px; border-radius: 18px; background: var(--t7-clair); display: grid; place-items: center; margin-left: -14px; color: var(--t7-encre);
    box-shadow: 0 0 0 2px var(--t7-clair), 0 3px 10px rgba(0,0,0,.12), inset 0 0 0 1.5px rgba(0,0,0,.07); }
  #t7p .t7p-logo svg { width: 36px; height: 36px; }
  #t7p .t7p-envoyer { width: 76px; height: 76px; border-radius: 20px; background: var(--t7-encre); color: var(--t7-clair); display: grid; place-items: center; flex: none; }
  #t7p .t7p-envoyer svg { width: 36px; height: 36px; }
  /* Le lien joint à la demande : sa vraie page en aperçu (sa capture et son adresse), au-dessus de la barre. */
  #t7p .t7p-lien { position: absolute; left: 50%; bottom: calc(50% + 92px); width: 560px; margin-left: -650px; border-radius: 22px; background: var(--t7-clair); overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.12), inset 0 0 0 1.5px rgba(0,0,0,.08); color: var(--t7-encre); font-family: var(--brand-font-body); }
  #t7p .t7p-lien-ecran { position: relative; height: 290px; overflow: hidden; }
  #t7p .t7p-lien img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  #t7p .t7p-lien div { padding: 14px 24px 16px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; }
  #t7p.t7p-vertical .t7p-lien { margin-left: -500px; width: 680px; bottom: calc(50% + 150px); }
  #t7p.t7p-vertical .t7p-lien-ecran { height: 382px; }
  /* La fenêtre du résultat : un cadre clair, un filet qui se remplit, puis SA vraie matière. */
  #t7p .t7p-fenetre { position: absolute; left: 50%; top: 50%; width: 1380px; height: 800px; margin: -400px 0 0 -690px; border-radius: 22px; background: var(--t7-clair); overflow: hidden;
    box-shadow: 0 50px 120px rgba(0,0,0,.16), 0 4px 14px rgba(0,0,0,.06), inset 0 0 0 1.5px rgba(0,0,0,.07); color: var(--t7-encre); font-family: var(--brand-font-body); }
  #t7p .t7p-progres { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: rgba(0,0,0,.05); overflow: hidden; z-index: 3; }
  #t7p .t7p-progres div { height: 100%; width: 100%; background: var(--t7-encre); transform-origin: 0 50%; }
  #t7p .t7p-corps { position: absolute; left: 0; right: 0; top: 6px; bottom: 0; padding: 44px 56px; }
  #t7p .t7p-titre { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 20px; white-space: nowrap; }
  #t7p .t7p-titre span { font-size: 32px; font-weight: 500; color: var(--brand-gris-2); letter-spacing: 0; }
  #t7p .t7p-grille { position: absolute; display: grid; }
  #t7p .t7p-carte { position: relative; border-radius: 16px; overflow: hidden; background: var(--brand-gris-4);
    box-shadow: 0 14px 34px rgba(0,0,0,.12), inset 0 0 0 1.5px rgba(0,0,0,.06); }
  #t7p .t7p-carte img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #t7p .t7p-capture { position: absolute; left: 0; right: 0; top: 6px; bottom: 0; overflow: hidden; }
  #t7p .t7p-capture img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  /* 9:16 : la même scène remise en page (une mise en page, jamais un recadrage). */
  #t7p.t7p-vertical .t7p-barre { width: 1000px; height: auto; min-height: 200px; margin: 0 0 0 -500px; top: 50%; transform: translateY(-50%);
    padding: 30px 26px 30px 34px; border-radius: 36px; }
  #t7p.t7p-vertical .t7p-demande { font-size: 50px; line-height: 1.22; white-space: normal; padding-bottom: 8px; }
  #t7p.t7p-vertical .t7p-demande::after { height: 50px; vertical-align: -9px; }
  #t7p.t7p-vertical .t7p-fenetre { width: 1000px; height: 1460px; margin: -730px 0 0 -500px; }
  #t7p.t7p-vertical .t7p-corps { padding: 52px 52px; }
  #t7p.t7p-vertical .t7p-titre { font-size: 60px; }
  #t7p.t7p-vertical .t7p-titre span { font-size: 36px; }
</style>

<div data-composition-id="t7p" data-width="1920" data-height="1080" data-duration="12.2" style="position:absolute; inset:0;">
  <div id="t7p" class="k-scene">
    <div class="t7p-plan t7p-ardoise" id="t7p-p1">
      <div class="t7p-lignes"><div><span id="t7p-l1" data-layout-allow-overlap></span><span id="t7p-m1" class="t7p-mots" data-layout-allow-overlap></span><span class="t7p-caret" id="t7p-c1"></span></div><div class="t7p-l2"><span id="t7p-l2" data-layout-allow-overlap></span><span id="t7p-m2" class="t7p-mots" data-layout-allow-overlap></span><span class="t7p-caret" id="t7p-c2"></span></div></div>
    </div>
    <div class="t7p-plan t7p-clair" id="t7p-p2">
      <div class="t7p-scene3d"><div class="t7p-cam" id="t7p-cam">
        <div class="t7p-fenetre" id="t7p-fenetre">
          <div class="t7p-progres"><div id="t7p-progres"></div></div>
          <div class="t7p-corps" id="t7p-corps"><div class="t7p-titre" id="t7p-titre"></div></div>
        </div>
        <div class="t7p-lien" id="t7p-lien"></div>
        <div class="t7p-barre" id="t7p-barre">
          <div class="t7p-plus" id="t7p-plus"></div>
          <div class="t7p-demande" id="t7p-demande"></div>
          <div class="t7p-logos" id="t7p-logos"></div>
          <div class="t7p-envoyer" id="t7p-envoyer"></div>
        </div>
      </div></div>
      <div id="t7p-curseur-calque" style="position:absolute; inset:0; z-index:70;"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var EXEMPLE = { // À REMPLACER : chaque valeur vient de OFFRE.json, ou la ligne se retire
    ligne1: "Résume ta page.",                       // les deux lignes tapées (8 mots au plus à elles deux)
    ligne2: "En une phrase.",
    demande: "Résume cette page en trois points clés", // ce qu'on demande vraiment à son produit (8 mots au plus)
    logos: ["logo-notion", "logo-slack"],             // ses outils, posés par `studio_motion.py logos` (3 au plus ; un absent se retire)
    // la page jointe à la demande : sa vraie capture (ou deux écrans de sa page, qui défilent) et
    // son adresse, au-dessus de la barre pendant qu'on lit la demande ; img "" : aucun aperçu
    lien: { img: ["assets/images/page-1.png", "assets/images/page-2.png"], adresse: "tonsite.fr" },
    titre: "Le résumé", sousTitre: "3 points clés",   // le titre de la fenêtre du résultat
    // ce que montre la fenêtre : SES vraies images du résultat, qui tombent en cascade (format
    // "9:16", "1:1" ou "16:9"), ou la capture de son produit qui remplit la fenêtre (capture, qui
    // passe alors devant les cartes) ; ni l'une ni l'autre : la fenêtre ne s'ouvre pas
    cartes: ["assets/images/resultat-1.png", "assets/images/resultat-2.png", "assets/images/resultat-3.png", "assets/images/resultat-4.png"], format: "16:9",
    capture: ""
  };
  // Le temps de lecture du studio (`studio_motion.py lecture`) : 0,3 s par mot + 0,8 s, 1,5 s au moins.
  function lecture(t, plancher) { var n = [].concat(t).join(" ").split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length; return Math.ceil(Math.max(plancher || 1.5, 0.3 * n + 0.8) * 10 - 1e-9) / 10; }
  var XL = 1.9 + lecture([EXEMPLE.ligne1, EXEMPLE.ligne2]);    // les deux lignes, lues : coupe sur la barre
  var XB = XL + 1.0 + lecture(EXEMPLE.demande);                 // la demande, lue : la barre s'envole
  var W0 = XB + 0.25;                                           // la fenêtre du résultat
  var fenetre = !!(EXEMPLE.capture || EXEMPLE.cartes.length);
  var D = Math.ceil((fenetre ? W0 + 1.2 + lecture([EXEMPLE.titre, EXEMPLE.sousTitre]) : XB + 0.45) * 10 - 1e-9) / 10;
  var $ = function (id) { return document.getElementById(id); };
  var racine = $("t7p");
  var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
  if (vertical) racine.classList.add("t7p-vertical");
  $("t7p-plus").innerHTML = K.ic("plus");
  $("t7p-envoyer").innerHTML = K.ic("send");
  // Un logo absent est retiré ; un logo posé ici et ailleurs reçoit des identifiants internes
  // propres à sa copie (sinon il renvoie à la copie d'une autre scène, cachée, et disparaît).
  EXEMPLE.logos.slice(0, 3).forEach(function (n, i) {
    if (K.ic(n)) K.el($("t7p-logos"), "div", "t7p-logo", K.ic(n).replace(/(id="|url\(#|href="#)([^")]+)/g, "$1$2-t7p" + i));
  });
  $("t7p-titre").innerHTML = EXEMPLE.titre + (EXEMPLE.sousTitre ? "<span>" + EXEMPLE.sousTitre + "</span>" : "");
  var cartes = [];
  if (EXEMPLE.capture) {
    var cap = K.el($("t7p-fenetre"), "div", "t7p-capture"), im = K.el(cap, "img"); im.alt = ""; im.src = EXEMPLE.capture;
    $("t7p-corps").style.display = "none";
  } else if (EXEMPLE.cartes.length) {
    // La grille : le plus grand format de carte qui tient dans la fenêtre, sous son titre.
    var f = EXEMPLE.format.split(":").map(Number), ratio = f[0] / f[1];
    var lw = vertical ? 1000 : 1380, lh = (vertical ? 1460 : 800) - 6, marge = vertical ? 52 : 56, haut = vertical ? 52 + 96 : 44 + 86, ecart = vertical ? 28 : 24;
    var W = lw - 2 * marge, Hd = lh - haut - marge, meilleur = null;
    for (var col = 1; col <= EXEMPLE.cartes.length; col++) {
      var rangs = Math.ceil(EXEMPLE.cartes.length / col), w = (W - (col - 1) * ecart) / col, h = w / ratio;
      if (rangs * h + (rangs - 1) * ecart > Hd) { h = (Hd - (rangs - 1) * ecart) / rangs; w = h * ratio; }
      if (!meilleur || w * h > meilleur.w * meilleur.h) meilleur = { col: col, w: w, h: h };
    }
    var grille = K.el($("t7p-corps"), "div", "t7p-grille");
    grille.style.cssText = "left:" + marge + "px; right:" + marge + "px; top:" + haut + "px; grid-template-columns: repeat(" + meilleur.col + ", " + Math.floor(meilleur.w) + "px); gap: " + ecart + "px; justify-content: center;";
    EXEMPLE.cartes.forEach(function (src) {
      var c = K.el(grille, "div", "t7p-carte", null, "height:" + Math.floor(meilleur.h) + "px");
      var img = K.el(c, "img"); img.alt = ""; img.src = src; cartes.push(c);
    });
  }
  if (vertical) $("t7p-l1").parentNode.parentNode.style.fontSize = "96px";
  var curseur = K.curseur($("t7p-curseur-calque"), "t7p-curseur", false);

  // États de départ
  K.cacher(["#t7p-p2", "#t7p-c2", "#t7p-fenetre"]);
  if (cartes.length) K.cacher(cartes);
  var images = EXEMPLE.lien && EXEMPLE.lien.img ? [].concat(EXEMPLE.lien.img).filter(Boolean).slice(0, 2) : [];
  var lien = images.length ? $("t7p-lien") : null, ecrans = [];
  if (lien) {
    var ecran = K.el(lien, "div", "t7p-lien-ecran");
    ecrans = images.map(function (src, i) { var im = K.el(ecran, "img"); im.alt = ""; im.src = src; if (i) gsap.set(im, { yPercent: 100 }); return im; });
    if (EXEMPLE.lien.adresse) K.el(lien, "div", null, EXEMPLE.lien.adresse);
    gsap.set(lien, { clipPath: "inset(100% 0 0 0 round 22px)" });
  }
  else $("t7p-lien").style.display = "none";
  var tl = gsap.timeline({ paused: true });

  // 1. Deux lignes tapées sur l'ardoise, tenues le temps de leur lecture : une fois tapées, leurs mots
  //    s'allument tour à tour à l'accent, sans bouger (la vie de la tenue, sans caméra)
  K.taper(tl, $("t7p-l1"), EXEMPLE.ligne1, 0.1, 0.85, D);
  K.taper(tl, $("t7p-l2"), EXEMPLE.ligne2, 1.15, 1.9, D);
  tl.set("#t7p-c1", { opacity: 0 }, 1.0); tl.set("#t7p-c2", { opacity: 1 }, 1.0);
  for (var tc = 2.05, kc = 0; tc < XL - 0.1; tc += 0.4, kc++) tl.set("#t7p-c2", { opacity: kc % 2 ? 1 : 0 }, tc);
  var mots = [];
  [[EXEMPLE.ligne1, "1"], [EXEMPLE.ligne2, "2"]].forEach(function (l) {
    $("t7p-m" + l[1]).innerHTML = l[0].split(" ").map(function (m) { return '<span class="t7p-mot" data-layout-allow-overlap>' + m + "</span>"; }).join(" ");
    tl.set("#t7p-l" + l[1], { display: "none" }, 1.98); tl.set("#t7p-m" + l[1], { display: "inline" }, 1.98);
    mots = mots.concat(Array.prototype.slice.call($("t7p-m" + l[1]).children));
  });
  var pasMot = Math.min(0.32, (XL - 2.6) / Math.max(1, mots.length));
  mots.forEach(function (m, i) {
    var t = 2.1 + i * pasMot;
    tl.set(m, { attr: { "data-on": "1" } }, t);
    tl.set(m, { attr: { "data-on": "0" } }, t + 0.38);
  });

  // 2. La barre de demande, sur fond clair, tenue le temps de lire la demande : sa page jointe
  //    glisse au-dessus, ses logos arrivent un à un, puis le curseur vient cliquer sur envoyer
  tl.set("#t7p-p2", { opacity: 1 }, XL);
  tl.set("#t7p-p1", { opacity: 0 }, XL);
  // la caméra recule sur la barre pendant que la demande se tape (son apparition ; en 9:16, à
  // peine), puis ne fait qu'une dérive de 2 % pendant qu'on la lit
  tl.fromTo("#t7p-cam", { scale: vertical ? 1.04 : 1.18 }, { scale: 1.0, duration: 1.0, ease: "power2.out" }, XL);
  tl.to("#t7p-cam", { scale: 0.98, duration: XB - XL - 1.0, ease: "sine.inOut" }, XL + 1.0);
  K.taper(tl, $("t7p-demande"), EXEMPLE.demande, XL + 0.15, XL + 1.0, D);
  var logos = $("t7p-logos").children;
  var pasLogo = Math.min(0.7, (XB - XL - 2.6) / Math.max(1, logos.length));
  Array.prototype.forEach.call(logos, function (lg, i) {
    tl.fromTo(lg, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1)" }, XL + 1.2 + i * pasLogo).fromTo(lg, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, XL + 1.2 + i * pasLogo);
  });
  // la page jointe : dévoilée de bas en haut (sans fondu), elle défile d'un écran au suivant, puis
  // s'envole avec la barre
  if (lien) {
    tl.fromTo(lien, { clipPath: "inset(100% 0 0 0 round 22px)", y: 40 }, { clipPath: "inset(0% 0 0 0 round 22px)", y: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, XL + 1.15);
    if (ecrans[1]) { tl.to(ecrans[0], { yPercent: -100, duration: 0.6, ease: "power3.inOut" }, (XL + 1.7 + XB) / 2 - 0.3); tl.to(ecrans[1], { yPercent: 0, duration: 0.6, ease: "power3.inOut" }, (XL + 1.7 + XB) / 2 - 0.3); }
    tl.to(lien, { y: -320, scale: 0.6, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, XB);
    tl.set(lien, { opacity: 0 }, XB + 0.45);
  }
  var bx = L / 2 + (vertical ? 500 - 26 - 38 : 650 - 30 - 38), by = H / 2 + 2;
  K.trajet(tl, curseur, [[0, L * 0.82, H * 0.86], [XB - 0.75, bx + 6, by + 8, 0.55, "power3.out"]]);
  K.cacher(curseur);
  tl.to(curseur, { opacity: 1, duration: 0.15 }, XB - 0.8);
  K.clic(tl, curseur, XB - 0.15);
  tl.to("#t7p-envoyer", { scale: 0.88, duration: 0.08, ease: "power2.out" }, XB - 0.15);
  tl.to("#t7p-envoyer", { scale: 1, duration: 0.25, ease: "back.out(1)" }, XB - 0.07);

  // 3. La barre s'envole ; la fenêtre du résultat s'ouvre et se remplit de sa vraie matière, et se
  //    tient le temps de lire son titre (la caméra ne fait qu'une dérive lente)
  tl.to("#t7p-barre", { y: -260, scale: 0.6, opacity: 0, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, XB);
  tl.to(curseur, { opacity: 0, duration: 0.2 }, XB + 0.05);
  if (fenetre) {
    tl.fromTo("#t7p-fenetre", { opacity: 0, scale: 0.86, filter: "blur(14px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, W0);
    tl.fromTo("#t7p-progres", { scaleX: 0 }, { scaleX: 1, duration: D - W0 - 0.3, ease: "power1.inOut" }, W0 + 0.15);
    if (EXEMPLE.capture) {
      // la capture se dévoile de haut en bas, comme une page qui se charge
