<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"></head>
<body>
<template>
<!--
  Style n°7 · Phrase tapée · scène « La phrase tapée » (la solution, puis la démonstration).
  Ce qu'elle montre : sur le fond ardoise (un gris de ta marque), deux lignes se tapent l'une sous
  l'autre (la première claire, la seconde grise) derrière un gros curseur de frappe à la couleur
  de ta marque ; coupe sur fond clair : une barre de demande où la phrase se tape, les logos de
  ses outils empilés, le curseur clique sur envoyer ; la barre s'envole et la fenêtre du résultat
  s'ouvre et se remplit de ses vraies images, en cascade.
  Durée : 6,6 s. Sans capture ni image du résultat, la fenêtre ne s'ouvre pas : coupe la scène à
  4,4 s (data-duration ici et sur l'hôte), juste après l'envoi.
  16:9 (1920 × 1080) ; en 9:16, passe la racine à 1080 × 1920 (classe t7p-vertical, réglée seule :
  lignes plus courtes, barre plus haute où la demande passe sur deux lignes, fenêtre en portrait
  qui remplit l'écran).
  À remplacer (objet R en tête du script) : les deux lignes, la demande tapée, les logos de ses
  outils (posés par `studio_motion.py logos` ; un logo absent est retiré, jamais remplacé), le
  titre de la fenêtre, et ce qu'elle montre : ses vraies images du résultat (cartes, en cascade)
  ou la capture de son produit (capture, elle remplit la fenêtre). Jamais de cartes vides.
  Couleurs : seulement celles de ta marque (brand/tokens.css) : l'ardoise (un de ses gris), son
  clair, sa nuit pour l'encre, l'accent plein pour le curseur de frappe. Les captures et les logos
  gardent leurs vraies couleurs.
  Identifiant : t7p (préfixe de tous les id et classes de la scène).
-->
<style>
  #t7p {
    /* Les fonds du look viennent de la marque : l'ardoise (son gris le plus sombre), son clair. */
    --t7-ardoise: var(--brand-gris-1);
    --t7-clair: var(--brand-clair);
    --t7-encre: var(--brand-sombre);
    --t7-texte: var(--brand-clair);
    --t7-gris: var(--brand-gris-4);
    --t7-police: var(--brand-font-display);
    background: var(--t7-ardoise); font-family: var(--t7-police); color: var(--t7-texte);
  }
  #t7p .t7p-plan { position: absolute; inset: 0; }
  #t7p .t7p-ardoise { background: var(--t7-ardoise); }
  #t7p .t7p-clair { background: var(--t7-clair); }
  #t7p .t7p-lignes { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
    font-size: 124px; font-weight: 500; letter-spacing: -0.045em; line-height: 1.0; white-space: nowrap; }
  #t7p .t7p-l2 { color: var(--t7-gris); }
  #t7p .t7p-caret { display: inline-block; width: 0.075em; height: 0.84em; margin-left: 0.05em; vertical-align: -0.08em; background: var(--brand-accent); }
  #t7p .t7p-scene3d { position: absolute; inset: 0; perspective: 2000px; }
  #t7p .t7p-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #t7p .t7p-barre { position: absolute; left: 50%; top: 50%; width: 1300px; height: 124px; margin: -62px 0 0 -650px; border-radius: 30px; background: var(--t7-clair);
    box-shadow: 0 24px 60px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06), inset 0 0 0 1.5px rgba(0,0,0,.08);
    display: flex; align-items: center; padding: 0 30px 0 36px; gap: 26px; color: var(--t7-encre); font-family: var(--brand-font-body); }
  #t7p .t7p-plus { width: 34px; height: 34px; color: var(--brand-gris-2); flex: none; }
  #t7p .t7p-demande { flex: 1; font-size: 40px; font-weight: 400; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; }
  #t7p .t7p-demande::after { content: ""; display: inline-block; width: 3px; height: 42px; margin-left: 3px; vertical-align: -8px; background: var(--t7-encre); }
  #t7p .t7p-logos { display: flex; flex: none; }
  #t7p .t7p-logo { width: 62px; height: 62px; border-radius: 18px; background: var(--t7-clair); display: grid; place-items: center; margin-left: -14px; color: var(--t7-encre);
    box-shadow: 0 0 0 2px var(--t7-clair), 0 3px 10px rgba(0,0,0,.12), inset 0 0 0 1.5px rgba(0,0,0,.07); }
  #t7p .t7p-logo svg { width: 36px; height: 36px; }
  #t7p .t7p-envoyer { width: 76px; height: 76px; border-radius: 20px; background: var(--t7-encre); color: var(--t7-clair); display: grid; place-items: center; flex: none; }
  #t7p .t7p-envoyer svg { width: 36px; height: 36px; }
  /* La fenêtre du résultat : un cadre clair, sa barre de titre, puis SA vraie matière. */
  #t7p .t7p-fenetre { position: absolute; left: 50%; top: 50%; width: 1380px; height: 800px; margin: -400px 0 0 -690px; border-radius: 22px; background: var(--t7-clair); overflow: hidden;
    box-shadow: 0 50px 120px rgba(0,0,0,.16), 0 4px 14px rgba(0,0,0,.06), inset 0 0 0 1.5px rgba(0,0,0,.07); color: var(--t7-encre); font-family: var(--brand-font-body); }
  #t7p .t7p-tete { position: absolute; left: 0; right: 0; top: 0; height: 60px; border-bottom: 1.5px solid rgba(0,0,0,.07); }
  #t7p .t7p-feux { position: absolute; left: 24px; top: 23px; display: flex; gap: 9px; }
  #t7p .t7p-feux i { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.14); }
  #t7p .t7p-progres { position: absolute; left: 0; right: 0; top: 59px; height: 3px; background: rgba(0,0,0,.05); overflow: hidden; z-index: 3; }
  #t7p .t7p-progres div { height: 100%; width: 100%; background: var(--t7-encre); transform-origin: 0 50%; }
  #t7p .t7p-corps { position: absolute; left: 0; right: 0; top: 61px; bottom: 0; padding: 44px 56px; }
  #t7p .t7p-titre { font-size: 44px; font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
  #t7p .t7p-titre span { font-size: 22px; font-weight: 500; color: var(--brand-gris-2); letter-spacing: 0; }
  #t7p .t7p-grille { position: absolute; display: grid; }
  #t7p .t7p-carte { position: relative; border-radius: 16px; overflow: hidden; background: rgba(0,0,0,.04);
    box-shadow: 0 14px 34px rgba(0,0,0,.12), inset 0 0 0 1.5px rgba(0,0,0,.06); }
  #t7p .t7p-carte img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #t7p .t7p-capture { position: absolute; left: 0; right: 0; top: 61px; bottom: 0; overflow: hidden; }
  #t7p .t7p-capture img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  /* 9:16 : la même scène remise en page (une mise en page, jamais un recadrage). */
  #t7p.t7p-vertical .t7p-barre { width: 1000px; height: auto; min-height: 200px; margin: 0 0 0 -500px; top: 50%; transform: translateY(-50%);
    padding: 30px 26px 30px 34px; border-radius: 36px; }
  #t7p.t7p-vertical .t7p-demande { font-size: 50px; line-height: 1.22; white-space: normal; }
  #t7p.t7p-vertical .t7p-demande::after { height: 50px; vertical-align: -9px; }
  #t7p.t7p-vertical .t7p-fenetre { width: 1000px; height: 1460px; margin: -730px 0 0 -500px; }
  #t7p.t7p-vertical .t7p-tete { height: 80px; }
  #t7p.t7p-vertical .t7p-feux { top: 33px; }
  #t7p.t7p-vertical .t7p-progres { top: 79px; }
  #t7p.t7p-vertical .t7p-corps { top: 81px; padding: 52px 52px; }
  #t7p.t7p-vertical .t7p-titre { font-size: 56px; }
  #t7p.t7p-vertical .t7p-titre span { font-size: 28px; }
  #t7p.t7p-vertical .t7p-capture { top: 81px; }
</style>

<div data-composition-id="t7p" data-width="1920" data-height="1080" data-duration="6.6" style="position:absolute; inset:0;">
  <div id="t7p" class="k-scene">
    <div class="t7p-plan t7p-ardoise" id="t7p-p1">
      <div class="t7p-lignes"><div><span id="t7p-l1" data-layout-allow-overlap></span><span class="t7p-caret" id="t7p-c1"></span></div><div class="t7p-l2"><span id="t7p-l2" data-layout-allow-overlap></span><span class="t7p-caret" id="t7p-c2"></span></div></div>
    </div>
    <div class="t7p-plan t7p-clair" id="t7p-p2">
      <div class="t7p-scene3d"><div class="t7p-cam" id="t7p-cam">
        <div class="t7p-fenetre" id="t7p-fenetre">
          <div class="t7p-tete"><div class="t7p-feux"><i></i><i></i><i></i></div></div>
          <div class="t7p-progres"><div id="t7p-progres"></div></div>
          <div class="t7p-corps" id="t7p-corps"><div class="t7p-titre" id="t7p-titre"></div></div>
        </div>
        <div class="t7p-barre" id="t7p-barre">
          <div class="t7p-plus" id="t7p-plus"></div>
          <div class="t7p-demande" id="t7p-demande"></div>
          <div class="t7p-logos" id="t7p-logos"></div>
          <div class="t7p-envoyer" id="t7p-envoyer"></div>
        </div>
      </div></div>
      <div id="t7p-curseur-hote" style="position:absolute; inset:0; z-index:70;"></div>
    </div>
  </div>
</div>

<script>
(function () {
  // ---- À remplacer --------------------------------------------------------------------------
  var R = {
    ligne1: "Crée ta vidéo.",
    ligne2: "En une phrase.",
    demande: "Fais-moi une vidéo pour ma page de vente",
    logos: ["logo-claude", "logo-chatgpt"],         // ses outils, posés par `studio_motion.py logos` (3 au plus)
    titre: "Ton offre", sousTitre: "6 vidéos prêtes",
    // Ce que montre la fenêtre : SES vraies images du résultat, qui tombent en cascade
    // (cartes : ["assets/images/video-1.jpg", …], format "9:16", "1:1" ou "16:9"), ou la capture de
    // son produit qui remplit la fenêtre (capture : "assets/images/ecran.png"). Ni l'une ni
    // l'autre : la fenêtre ne s'ouvre pas (coupe la scène à 4,4 s).
    cartes: [], format: "9:16",
    capture: ""
  };
  // -------------------------------------------------------------------------------------------
  var D = 6.6;
  var $ = function (id) { return document.getElementById(id); };
  var racine = $("t7p");
  var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
  if (vertical) racine.classList.add("t7p-vertical");
  $("t7p-plus").innerHTML = K.ic("plus");
  $("t7p-envoyer").innerHTML = K.ic("send");
  // Un logo absent est retiré ; un logo posé ici et ailleurs reçoit des identifiants internes
  // propres à sa copie (sinon il renvoie à la copie d'une autre scène, cachée, et disparaît).
  R.logos.forEach(function (n, i) {
    if (K.ic(n)) K.el($("t7p-logos"), "div", "t7p-logo", K.ic(n).replace(/(id="|url\(#|href="#)([^")]+)/g, "$1$2-t7p" + i));
  });
  $("t7p-titre").innerHTML = R.titre + (R.sousTitre ? "<span>" + R.sousTitre + "</span>" : "");
  var fenetre = !!(R.capture || R.cartes.length), cartes = [];
  if (R.capture) {
    var cap = K.el($("t7p-fenetre"), "div", "t7p-capture"), im = K.el(cap, "img"); im.alt = ""; im.src = R.capture;
    $("t7p-corps").style.display = "none";
  } else if (R.cartes.length) {
    // La grille : le plus grand format de carte qui tient dans la fenêtre, sous son titre.
    var f = R.format.split(":").map(Number), ratio = f[0] / f[1];
    var lw = vertical ? 1000 : 1380, lh = (vertical ? 1460 - 81 : 800 - 61), marge = vertical ? 52 : 56, haut = vertical ? 52 + 84 : 44 + 74, ecart = vertical ? 28 : 24;
    var W = lw - 2 * marge, Hd = lh - haut - marge, meilleur = null;
    for (var col = 1; col <= R.cartes.length; col++) {
      var rangs = Math.ceil(R.cartes.length / col), w = (W - (col - 1) * ecart) / col, h = w / ratio;
      if (rangs * h + (rangs - 1) * ecart > Hd) { h = (Hd - (rangs - 1) * ecart) / rangs; w = h * ratio; }
      if (!meilleur || w * h > meilleur.w * meilleur.h) meilleur = { col: col, w: w, h: h };
    }
    var grille = K.el($("t7p-corps"), "div", "t7p-grille");
    grille.style.cssText = "left:" + marge + "px; right:" + marge + "px; top:" + haut + "px; grid-template-columns: repeat(" + meilleur.col + ", " + Math.floor(meilleur.w) + "px); gap: " + ecart + "px; justify-content: center;";
    R.cartes.forEach(function (src) {
      var c = K.el(grille, "div", "t7p-carte", null, "height:" + Math.floor(meilleur.h) + "px");
      var img = K.el(c, "img"); img.alt = ""; img.src = src; cartes.push(c);
    });
  }
  if (vertical) $("t7p-l1").parentNode.parentNode.style.fontSize = "96px";
  var curseur = K.curseur($("t7p-curseur-hote"), "t7p-curseur", false);

  // États de départ
  K.cacher(["#t7p-p2", "#t7p-c2", "#t7p-fenetre"]);
  var tl = gsap.timeline({ paused: true });

  // 1. Deux lignes tapées sur l'ardoise (0 → 2,35 s)
  K.taper(tl, $("t7p-l1"), R.ligne1, 0.1, 0.85, D);
  K.taper(tl, $("t7p-l2"), R.ligne2, 1.15, 1.9, D);
  tl.set("#t7p-c1", { opacity: 0 }, 1.0); tl.set("#t7p-c2", { opacity: 1 }, 1.0);
  [2.05, 2.25].forEach(function (t, i) { tl.set("#t7p-c2", { opacity: i % 2 ? 1 : 0 }, t); });
  tl.fromTo("#t7p .t7p-lignes", { scale: 1 }, { scale: 1.03, duration: 2.35, ease: "sine.out" }, 0);

  // 2. La barre de demande, sur fond clair (2,35 → 4,05 s)
  tl.set("#t7p-p2", { opacity: 1 }, 2.35);
  tl.set("#t7p-p1", { opacity: 0 }, 2.35);
  // la caméra recule sur la barre (en 9:16, à peine : la barre y prend presque toute la largeur)
  tl.fromTo("#t7p-cam", { scale: vertical ? 1.04 : 1.18 }, { scale: 1.0, duration: 1.7, ease: "power2.out" }, 2.35);
  K.taper(tl, $("t7p-demande"), R.demande, 2.5, 3.35, D);
  var logos = $("t7p-logos").children;
  if (logos.length) tl.fromTo(logos, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)", stagger: 0.08 }, 2.6);
  var bx = L / 2 + (vertical ? 500 - 26 - 38 : 650 - 30 - 38), by = H / 2 + 2;
  K.trajet(tl, curseur, [[0, L * 0.82, H * 0.86], [3.3, bx + 6, by + 8, 0.55, "power3.out"]]);
  K.cacher(curseur);
  tl.to(curseur, { opacity: 1, duration: 0.15 }, 3.25);
  K.clic(tl, curseur, 3.9);
  tl.to("#t7p-envoyer", { scale: 0.88, duration: 0.08, ease: "power2.out" }, 3.9);
  tl.to("#t7p-envoyer", { scale: 1, duration: 0.25, ease: "back.out(3)" }, 3.98);

  // 3. La barre s'envole ; la fenêtre du résultat s'ouvre et se remplit de sa vraie matière (4,05 → 6,6 s)
  tl.to("#t7p-barre", { y: -260, scale: 0.6, opacity: 0, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, 4.05);
  tl.to(curseur, { opacity: 0, duration: 0.2 }, 4.1);
  if (fenetre) {
    tl.fromTo("#t7p-fenetre", { opacity: 0, scale: 0.86, filter: "blur(14px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 4.3);
    tl.fromTo("#t7p-progres", { scaleX: 0 }, { scaleX: 1, duration: 1.7, ease: "power1.inOut" }, 4.45);
    if (R.capture) {
      // la capture se dévoile de haut en bas, comme une page qui se charge
      tl.fromTo("#t7p .t7p-capture", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.8, ease: "power2.out" }, 4.5);
    } else {
      tl.fromTo("#t7p-titre", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 4.5);
      tl.fromTo(cartes, { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)", stagger: 0.12 }, 4.65);
    }
    tl.fromTo("#t7p-cam", { rotationX: 0, y: 0 }, { rotationX: 6, y: -10, duration: 2.2, ease: "sine.inOut", immediateRender: false }, 4.4);
    tl.to("#t7p-cam", { scale: 1.06, duration: 2.2, ease: "sine.inOut" }, 4.4);
  }
  window.__timelines["t7p"] = tl;
})();
</script>
</template>
</body>
</html>
