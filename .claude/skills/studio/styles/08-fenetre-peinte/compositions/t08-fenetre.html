<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!--
    STYLE N°8 « FENÊTRE PEINTE » · SCÈNE : LA FENÊTRE FILMÉE (la démonstration) · 7 s
    Ce que la scène montre : la fenêtre de l'application de l'offre, posée sur un bureau aux
    couleurs de la marque, avec SA vraie interface dedans (ses captures). La caméra filme l'écran
    comme un enregistrement : vue entière, puis gros plans rapides (flou de bougé) sur un détail ;
    le curseur clique et l'écran change d'un coup (la capture suivante) ; une demande peut se taper
    dans le vrai champ de sa capture ; la caméra recule.
    Sans capture, la fenêtre reste vide, à ses couleurs, avec son seul titre : jamais une
    interface inventée (garde alors la scène courte, 3 s au plus, ou montre plutôt sa page).
    Format : 16:9 (1920 × 1080) ; en 9:16, data-width="1080" data-height="1920" ici et sur l'hôte :
    la fenêtre garde son dessin, réduite au milieu du bureau ; les gros plans remplissent l'écran.

    À REMPLACER (seulement par la vraie matière de l'offre, jamais une fonction qu'elle n'a pas) :
     1. L'id « t08-fenetre » (racine, constante ID, préfixe CSS) par l'id de la scène.
     2. TITRE : le nom dans la barre de titre (son produit, sa page).
     3. CAPTURES : ses vraies captures, dans l'ordre (sa page, son espace de formation, son
        logiciel : "assets/images/ecran-1.png" ; au mieux 1760 × 928, sinon du 16:9, cadré par le
        haut). La première s'affiche d'abord ; chaque clic de CLICS montre la suivante, d'un coup.
     4. CLICS : [instant, x, y] en coordonnées de la fenêtre (1760 × 980, barre de titre comprise) :
        là où le curseur clique sur sa capture (un onglet, un bouton, un champ). Sans capture, aucun.
     5. DEMANDE : une demande qui se tape dans le vrai champ de sa capture (texte, instants, place,
        taille, couleur du texte de ce champ) ; texte "" : aucune.
     6. PLANS : les gros plans [instant, x, y, zoom] en coordonnées de la fenêtre ; zoom 1 = vue
        entière. Vise ce qui fait vendre dans sa capture ; au-delà de 1,8, une capture en image
        devient floue.
     7. Le bureau : FOND = "accent" (l'aplat de sa couleur, le défaut : la fenêtre y prend un trait fin
        de sa nuit au lieu d'une ombre), "gris" (un dégradé entre ses gris et l'ombre douce de la
        fenêtre : plus calme) ou "sombre" (sa nuit, pour une capture claire) ; ou FOND_IMAGE =
        "assets/images/bureau.jpg", une vraie photo à lui.
        FENETRE = "claire" ou "sombre" : la barre de titre et le fond de la fenêtre, à accorder à sa
        capture.
    Couleurs : seulement celles de ta marque (brand/tokens.css) : ses gris, sa nuit, son clair,
    son accent en aplat plein ; des noirs et des blancs en transparence pour les ombres et les
    traits. Ses captures gardent leurs vraies couleurs.
  -->
</head>
<body>
<template>
<style>
  #t08-fenetre { --t08-bureau: radial-gradient(ellipse 60% 55% at 50% 45%, var(--brand-gris-2), var(--brand-gris-1));
    --t08-cadre: var(--brand-clair); --t08-barre: var(--brand-clair); --t08-filet: rgba(0,0,0,.08); --t08-feu: rgba(0,0,0,.16);
    --t08-titre: var(--brand-gris-2); --t08-texte: var(--brand-sombre);
    --t08-ombre: 0 0 0 1px rgba(0,0,0,.18), 0 36px 90px rgba(0,0,0,.38);
    background: var(--brand-gris-1); font-family: "Inter", var(--brand-font-body); }
  #t08-fenetre.t08-bureau-sombre { --t08-bureau: var(--brand-sombre); background: var(--brand-sombre); }
  #t08-fenetre.t08-bureau-accent { --t08-bureau: var(--brand-accent); --t08-ombre: 0 0 0 2px var(--brand-sombre); background: var(--brand-accent); }
  #t08-fenetre.t08-fenetre-sombre { --t08-cadre: var(--brand-sombre); --t08-barre: var(--brand-sombre); --t08-filet: rgba(255,255,255,.08);
    --t08-feu: rgba(255,255,255,.2); --t08-titre: var(--brand-gris-3); --t08-texte: var(--brand-clair); }
  #t08-fenetre .t08-bureau { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  /* Le fond du bureau déborde largement du cadre : un gros plan près d'un bord ne montre jamais sa limite. */
  #t08-fenetre .t08-toile { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; background: var(--t08-bureau); }
  #t08-fenetre .t08-toile.t08-photo { background-position: center; background-size: cover; }
  #t08-fenetre .t08-fenetre { position: absolute; left: 0; top: 0; width: 1760px; height: 980px; border-radius: 14px; overflow: hidden;
    background: var(--t08-cadre); box-shadow: var(--t08-ombre); transform-origin: 0 0; color: var(--t08-texte); }
  #t08-fenetre .t08-barre-titre { position: absolute; left: 0; top: 0; width: 1760px; height: 52px; background: var(--t08-barre); border-bottom: 1px solid var(--t08-filet); z-index: 2; }
  #t08-fenetre .t08-feu { position: absolute; top: 20px; width: 13px; height: 13px; border-radius: 50%; background: var(--t08-feu); }
  #t08-fenetre .t08-titre-fen { position: absolute; left: 0; right: 0; top: 16px; text-align: center; font-size: 15px; font-weight: 500; color: var(--t08-titre); white-space: nowrap; }
  #t08-fenetre .t08-contenu { position: absolute; left: 0; top: 52px; width: 1760px; height: 928px; overflow: hidden; }
  #t08-fenetre .t08-capture { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  #t08-fenetre .t08-vide { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 120px;
    font-family: var(--brand-font-display); font-size: 104px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; color: var(--t08-texte); }
  #t08-fenetre .t08-demande { position: absolute; white-space: nowrap; }
</style>

<div data-composition-id="t08-fenetre" data-width="1920" data-height="1080" data-duration="7" style="position:absolute; inset:0;">
  <div id="t08-fenetre" class="k-scene">
    <div class="t08-bureau" id="t08-fenetre-bureau" data-layout-allow-overflow>
      <div class="t08-toile" id="t08-fenetre-toile" data-layout-allow-overflow></div>
      <div class="t08-fenetre" id="t08-fenetre-fen">
        <div class="t08-barre-titre" id="t08-fenetre-barre"></div>
        <div class="t08-contenu" id="t08-fenetre-contenu"></div>
      </div>
      <div id="t08-fenetre-curseur-hote" style="position:absolute; inset:0; z-index:20;"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    var ID = "t08-fenetre", D = 7;
    // ---- À remplacer -------------------------------------------------------------------------
    var TITRE = "Ton offre";
    var CAPTURES = [];              // ses vraies captures, dans l'ordre : ["assets/images/ecran-1.png", …]
    // Les clics : [instant, x, y] dans la fenêtre (1760 × 980) ; chaque clic montre la capture suivante.
    var CLICS = [[1.12, 156, 20], [2.12, 112, 176], [3.25, 1233, 219]];
    // Une demande tapée dans le vrai champ de sa capture (texte "" : aucune).
    var DEMANDE = { texte: "", debut: 4.15, fin: 4.7, x: 384, y: 838, taille: 17, couleur: "var(--brand-sombre)" };
    // Les gros plans : [instant, x, y, zoom] dans la fenêtre (1760 × 980) ; zoom 1 = vue entière.
    var PLANS = [[0.55, 880, 26, 1.8], [1.55, 520, 360, 1.6], [2.7, 900, 420, 1.3], [3.55, 760, 700, 1.6], [4.7, 1300, 600, 1.5], [5.3, 880, 490, 1], [6.1, 880, 520, 1.2]];
    var FOND = "accent", FOND_IMAGE = "", FENETRE = "claire";
    // -------------------------------------------------------------------------------------------
    var tl = gsap.timeline({ paused: true });
    var racine = document.getElementById(ID);
    var q = function (s) { return racine.querySelector(s); };
    var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
    if (FOND === "sombre" || FOND === "accent") racine.classList.add("t08-bureau-" + FOND);
    if (FENETRE === "sombre") racine.classList.add("t08-fenetre-sombre");

    // ---- Le bureau : un fond de la marque (ou sa vraie photo), plus grand que le cadre ----------
    var bureau = q("#" + ID + "-bureau"), toile = q("#" + ID + "-toile");
    bureau.style.width = L + "px"; bureau.style.height = H + "px";
    if (FOND_IMAGE) { toile.classList.add("t08-photo"); toile.style.backgroundImage = "url(" + FOND_IMAGE + ")"; }

    // ---- La fenêtre : sa barre de titre, puis SES captures (ou son seul titre) -----------------
    var fen = q("#" + ID + "-fen"), barre = q("#" + ID + "-barre"), C = q("#" + ID + "-contenu");
    // La fenêtre (dessinée en 1760 × 980) se réduit pour tenir dans tout format, centrée sur le bureau.
    var k = Math.min(1, (L - 60) / 1760, (H - 60) / 980), fx = (L - 1760 * k) / 2, fy = (H - 980 * k) / 2;
    fen.style.left = fx + "px"; fen.style.top = fy + "px"; if (k < 1) fen.style.transform = "scale(" + k + ")";
    [0, 1, 2].forEach(function (i) { K.el(barre, "div", "t08-feu", null, "left:" + (20 + i * 22) + "px;"); });   // trois points gris
    K.el(barre, "div", "t08-titre-fen", TITRE);
    var ecrans = CAPTURES.map(function (src) { var im = K.el(C, "img", "t08-capture"); im.alt = ""; im.src = src; return im; });
    if (!ecrans.length) K.el(C, "div", "t08-vide", TITRE);
    var champ = null;
    if (DEMANDE.texte && ecrans.length) {
      champ = K.el(fen, "div", "t08-demande", null, "left:" + DEMANDE.x + "px; top:" + DEMANDE.y + "px; font-size:" + DEMANDE.taille + "px; color:" + DEMANDE.couleur + "; z-index:3;");
    }

    // ---- Le geste : caméra, curseur, clics, frappe ---------------------------------------------
    var P = function (wx, wy) { return [fx + wx * k, fy + wy * k]; };
    // Un gros plan : le point (wx, wy) de la fenêtre vient au centre de l'écran, au zoom s. En 9:16, la
    // fenêtre est plus petite dans l'image : ses gros plans serrent davantage (×1,4) pour remplir l'écran.
    var SERRE = vertical ? 1.4 : 1;
    var viser = function (t, wx, wy, s, duree) {
      var plan = s <= 1.01, p = plan ? [L / 2, H / 2] : P(wx, wy), sc = plan ? 1 : s * SERRE * (L / 1920) / k;
      tl.to(bureau, { x: -(p[0] - L / 2) * sc, y: -(p[1] - H / 2) * sc, scale: sc, duration: duree, ease: "expo.inOut" }, t);
      tl.to(bureau, { filter: "blur(7px)", duration: duree * 0.45, ease: "power2.in" }, t).to(bureau, { filter: "blur(0px)", duration: duree * 0.55, ease: "power2.out" }, t + duree * 0.45);
    };
    gsap.set(bureau, { x: 0, y: 0, scale: 1, filter: "blur(0px)" });
    tl.to(bureau, { scale: 1.03, duration: 0.5, ease: "sine.out" }, 0);
    // Sans capture, la caméra ne cherche aucun détail : elle va et vient sur le seul titre.
    var plans = ecrans.length ? PLANS : [[0.6, 880, 516, 1.3], [1.6, 880, 516, 1], [2.4, 880, 516, 1.2]];
    plans.forEach(function (pl) { viser(pl[0], pl[1], pl[2], pl[3], 0.5); });
    var dernier = plans.length ? plans[plans.length - 1][0] + 0.55 : 0.5;
    if (dernier < D) tl.to(bureau, { scale: "+=0.03", duration: D - dernier, ease: "none" }, dernier);

    // Les captures : la première d'abord, puis la suivante à chaque clic, d'un coup (sans animation).
    if (ecrans.length) {
      K.cacher(ecrans.slice(1));
      var clics = CLICS;
      var cur = K.curseur(q("#" + ID + "-curseur-hote"), ID + "-cur", false);
      var depart = P(1100, 640), trajet = [[0, depart[0], depart[1]]];
      clics.forEach(function (c) { var p = P(c[1], c[2]); trajet.push([Math.max(0.05, c[0] - 0.7), p[0], p[1], 0.6, "power3.inOut"]); });
      K.trajet(tl, cur, trajet);
      clics.forEach(function (c, i) {
        K.clic(tl, cur, c[0]);
        if (i + 1 < ecrans.length) { tl.set(ecrans[i], { opacity: 0 }, c[0] + 0.06); tl.set(ecrans[i + 1], { opacity: 1 }, c[0] + 0.06); }
      });
      if (champ) {
        // La demande se tape dans son champ, puis part au clic suivant (la capture d'après montre la réponse).
        K.taper(tl, champ, DEMANDE.texte, DEMANDE.debut, DEMANDE.fin, D);
        var envoi = clics.filter(function (c) { return c[0] > DEMANDE.fin; })[0];
        if (envoi) tl.set(champ, { opacity: 0 }, envoi[0] + 0.06);
      }
    }

    window.__timelines[ID] = tl;
  })();
</script>
</template>
</body>
</html>
