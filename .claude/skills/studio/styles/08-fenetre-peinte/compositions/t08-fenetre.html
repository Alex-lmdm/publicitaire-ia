    au pinceau. La caméra filme l'écran comme un enregistrement : vue entière, puis gros plans rapides
    (flou de bougé) sur un détail, le curseur clique (onglet, élément de la barre latérale), le contenu
    change, une demande se tape dans le champ du bas et part, la réponse arrive, la caméra recule.
    Format : 16:9 (1920 × 1080) ; en 9:16, data-width="1080" data-height="1920" ici et sur l'hôte :
    la fenêtre garde son dessin, réduite au milieu du fond peint ; les gros plans remplissent l'écran.

    À REMPLACER (seulement par la vraie interface de l'offre : une capture ou une reconstruction fidèle,
    jamais une fonction qu'elle n'a pas) :
     1. L'id « t08-fenetre » (racine, constante ID, préfixe CSS) par l'id de la scène.
     2. APP : le nom dans la barre de titre, les deux onglets, les rubriques et éléments de la barre
        latérale, la leçon ouverte (titre, détail, liste), le texte d'aide du champ, la demande tapée,
        la réponse. Pour un logiciel : remplace .t08-contenu par sa capture
        (<img src="assets/images/ecran.png">) et garde le cadre, le curseur et la caméra.
     3. PLANS : les gros plans [instant, x, y, zoom] en coordonnées de la fenêtre (1760 × 980).
     4. Le fond peint : PALETTE (couleurs de peinture, neutres) et GRAINE ; ou une image à toi en
        fond (FOND_IMAGE = "assets/images/fond.jpg").
    Couleurs : l'interface garde ses propres couleurs (celles de l'offre) ; l'accent de la marque ne
    sert qu'à quelques touches du fond peint et au bouton d'envoi.
  -->
