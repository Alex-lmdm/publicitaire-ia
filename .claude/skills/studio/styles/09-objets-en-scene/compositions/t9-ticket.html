<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"></head>
<body>
<template>
<!--
  Style n°9 · Objets en scène · scène « Le ticket » (un objet sans visage qui agit, et son rappel).
  Ce qu'elle montre : sur le clair de ta marque, un terminal de paiement sombre arrive en rebond ; une
  pièce tombe dans sa fente ; son écran tape un mot ; un ticket en sort. Deux versions du même geste :
  le ticket sans fin (long: true : il se déroule, son total en symboles de la mauvaise nouvelle, ce qui
  coûte) et le ticket minuscule (long: false : un seul symbole, ce qui ne coûte presque rien). Montées
  dans la même vidéo, la seconde répond à la première : c'est le rappel. Au-dessus, la phrase en gros
  mots, son dernier mot qui arrive minuscule (ou très grand avec le ticket sans fin).
  Pas de visage : un objet qui agit suffit, le visage est réservé au problème (t9-probleme).
  Durée : la scène la calcule (D dans le script) : 4,2 s avec l'objet EXEMPLE ; reporte-la dans
  data-duration (ici et sur l'hôte).
  16:9 (1920 × 1080) ; en 9:16, la racine passe à 1080 × 1920 et la scène se remet en page seule.
  À remplacer : l'objet EXEMPLE en tête du script (chaque champ y est décrit). Aucun montant inventé
  sur le ticket : des lignes grises et des symboles ; un vrai prix n'y va que s'il est dans la fiche.
  Les objets rebondissent plus que « presque aucun rebond » (metier.md : le dépassement de back.out(s) vaut
  4s³ / 27(s+1)²) : c'est leur élan, la signature du style ; les mots, eux, se posent net.
  Couleurs : seulement les jetons de ta marque : son clair en fond, son sombre pour le terminal, son
  accent pour l'écran, son jeton négatif pour un total qui coûte.
  Charge d'abord objets-en-scene.js et objets-en-scene.css du style (P.piece, P.coups) : style.md, « Les compositions du kit ».
  Identifiant : t9t (préfixe de tous les id et classes de la scène).
-->
<style>
  #t9t { background: var(--brand-clair); font-family: var(--brand-font-display); color: var(--brand-sombre); overflow: hidden; }
  #t9t .t9t-cadre { position: absolute; inset: 0; }
  #t9t .t9t-monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #t9t .t9t-corps { position: absolute; width: 440px; height: 330px; border-radius: 40px; background: var(--brand-sombre);
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.28), 0 10px 24px rgba(0, 0, 0, 0.18), inset 0 2px 0 rgba(255, 255, 255, 0.12); }
  #t9t .t9t-fente { position: absolute; height: 16px; border-radius: 8px; background: #000000; box-shadow: 0 0 0 4px var(--brand-gris-1); z-index: 3; }
  #t9t .t9t-ecran { position: absolute; left: 40px; top: 52px; width: 360px; height: 130px; border-radius: 16px; background: #000000;
    box-shadow: inset 0 0 0 3px var(--brand-gris-1); font-family: var(--brand-font-mono); font-weight: 700; font-size: 72px; line-height: 130px; text-align: center; color: var(--brand-accent); }
  #t9t .t9t-touche { position: absolute; top: 210px; width: 80px; height: 40px; border-radius: 12px; background: var(--brand-gris-1); }
  #t9t .t9t-ticket { position: absolute; width: 216px; overflow: hidden; z-index: 2; }
  #t9t .t9t-bande { position: absolute; left: 0; bottom: 0; width: 216px; background: #ffffff; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 95% 100%, 90% calc(100% - 10px), 85% 100%, 80% calc(100% - 10px), 75% 100%, 70% calc(100% - 10px), 65% 100%, 60% calc(100% - 10px), 55% 100%, 50% calc(100% - 10px), 45% 100%, 40% calc(100% - 10px), 35% 100%, 30% calc(100% - 10px), 25% 100%, 20% calc(100% - 10px), 15% 100%, 10% calc(100% - 10px), 5% 100%, 0 calc(100% - 10px)); }
  #t9t .t9t-t { position: absolute; left: 0; right: 0; top: 22px; text-align: center; font-family: var(--brand-font-mono); font-size: 28px; color: var(--brand-gris-2); }
  #t9t .t9t-total { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; line-height: 1; }
  #t9t .t9t-phrase { position: absolute; left: 40px; right: 40px; text-align: center; text-transform: uppercase; line-height: 0.95; z-index: 20; }
  #t9t .t9t-phrase span { display: inline-block; }
</style>

<div data-composition-id="t9t" data-width="1920" data-height="1080" data-duration="4.2" style="position:absolute; inset:0;">
  <div id="t9t" class="k-scene">
    <div class="t9t-cadre" id="t9t-cadre">
      <div class="t9t-monde" id="t9t-monde"></div>
      <div class="t9t-phrase" id="t9t-phrase"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var EXEMPLE = { // À REMPLACER : chaque valeur vient de OFFRE.json ou de son script validé, ou la ligne se retire
    phrase: ["Presque", "rien"],   // la phrase en gros mots (2 à 4 mots) ; le dernier arrive minuscule (ou géant si long)
    ecran: "</>",                  // ce que tape l'écran du terminal (un signe, un mot court ; "" : rien)
    symbole: "€",                  // le symbole du total (sa devise, ou un signe)
    long: false                    // true : le ticket sans fin (ce qui coûte, total en 5 symboles) ; false : le ticket minuscule
  };
  function lecture(t, plancher) { var n = [].concat(t).join(" ").split(/\s+/).filter(function (m) { return /[0-9A-Za-zÀ-ÿ]/.test(m); }).length; return Math.max(plancher || 1.5, 0.3 * n + 0.8); }
  var $ = function (id) { return document.getElementById(id); };
  var racine = $("t9t"), cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, vertical = H > L;
  var tl = gsap.timeline({ paused: true });
  var tEcran = 0.5, tTicket = EXEMPLE.ecran ? 1.2 : 0.7, tMot = tTicket + 0.12;
  var D = Math.ceil(Math.max(tTicket + 2.2, tMot + lecture(EXEMPLE.phrase, 2)) * 10) / 10;

  // --- Le terminal, sans visage ------------------------------------------------------------------------------
  var monde = $("t9t-monde"); gsap.set(monde, { width: L, height: H });
  var tx = L / 2 - 220, ty = vertical ? H * 0.34 : H * 0.27;
  var corps = K.el(monde, "div", "t9t-corps", "", "left:" + tx + "px; top:" + ty + "px;");
  var fenteHaut = K.el(monde, "div", "t9t-fente", "", "left:" + (tx + 120) + "px; top:" + (ty + 12) + "px; width:200px;");
  var ecran = K.el(corps, "div", "t9t-ecran");
  [56, 180, 304].forEach(function (x) { K.el(corps, "div", "t9t-touche", "", "left:" + x + "px;"); });
  var fenteBas = K.el(monde, "div", "t9t-fente", "", "left:" + (tx + 100) + "px; top:" + (ty + 320) + "px; width:240px; height:18px;");
  // Il arrive en rebond (il prend son élan vers le bas avant de se poser).
  tl.fromTo([corps, fenteHaut, fenteBas], { y: 60 }, { y: 0, duration: 0.42, ease: "back.out(2)", immediateRender: true }, 0);
  // La pièce tombe dans la fente du haut.
  var piece = P.piece(monde, L / 2, ty + 20, 110, {});
  gsap.set(piece, { y: -900, rotation: -200 });
  tl.to(piece, { y: 0, rotation: 0, duration: 0.3, ease: "power2.in" }, 0.05);
  tl.to(piece, { scaleY: 0, duration: 0.08, ease: "power2.in" }, 0.35);
  tl.to(corps, { scaleY: 0.97, scaleX: 1.02, duration: 0.06, ease: "power2.out", transformOrigin: "50% 100%" }, 0.37)
    .to(corps, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "elastic.out(1.2, 0.4)" }, 0.43);
  if (EXEMPLE.ecran) K.taper(tl, ecran, EXEMPLE.ecran, tEcran, tEcran + 0.5, D);

  // --- Le ticket : sans fin (ce qui coûte) ou minuscule (presque rien) ------------------------------------------
  var hT = EXEMPLE.long ? Math.min(640, H - ty - 360) : 210;
  var ticket = K.el(monde, "div", "t9t-ticket", "", "left:" + (tx + 112) + "px; top:" + (ty + 329) + "px; height:" + hT + "px;");
  var bande = K.el(ticket, "div", "t9t-bande", "", "height:" + hT + "px;");
  K.el(bande, "div", "t9t-t", "TICKET");
  var nLignes = EXEMPLE.long ? Math.floor((hT - 200) / 44) : 1;
  for (var k = 0; k < nLignes; k++) {
    K.el(bande, "i", "", "", "position:absolute; left:28px; top:" + (74 + k * 44) + "px; width:" + (70 + (k * 37) % 70) + "px; height:12px; border-radius:6px; background: var(--brand-gris-4);");
    if (EXEMPLE.long) K.el(bande, "i", "", "", "position:absolute; right:28px; top:" + (74 + k * 44) + "px; width:44px; height:12px; border-radius:6px; background: var(--brand-gris-4);");
  }
  K.el(bande, "i", "", "", "position:absolute; left:26px; right:26px; bottom:" + (EXEMPLE.long ? 120 : 94) + "px; border-top: 5px dashed var(--brand-gris-3);");
  var total = K.el(bande, "div", "b-mot t9t-total", EXEMPLE.long ? new Array(6).join(EXEMPLE.symbole) : EXEMPLE.symbole,
    "font-size:" + (EXEMPLE.long ? 56 : 64) + "px; color: var(" + (EXEMPLE.long ? "--brand-negative" : "--brand-sombre") + ");");
  gsap.set(bande, { y: -hT });
  tl.to(bande, { y: 0, duration: EXEMPLE.long ? 0.6 : 0.42, ease: EXEMPLE.long ? "power2.out" : "back.out(1.4)" }, tTicket);
  tl.to(ticket, { rotation: 1.5, duration: 0.07, yoyo: true, repeat: EXEMPLE.long ? 7 : 3, ease: "sine.inOut", transformOrigin: "50% 0%" }, tTicket + 0.4);

  // --- La phrase : son dernier mot arrive minuscule (presque rien), ou géant (le ticket sans fin) ---------------
  var phrase = $("t9t-phrase"); phrase.style.fontSize = (vertical ? 140 : 160) + "px"; phrase.style.top = (vertical ? 120 : 28) + "px";
  var n = EXEMPLE.phrase.length;
  var mots = EXEMPLE.phrase.map(function (m, i) { var s = K.el(phrase, "span", "", m); if (i < n - 1) phrase.appendChild(document.createTextNode(" ")); return s; });
  mots.slice(0, -1).forEach(function (s, i) { K.claque(tl, s, tMot + i * 0.24, { de: 1.5, duree: 0.28 }); });
  var dernier = mots[n - 1], tD = tMot + (n - 1) * 0.24 + 0.1;
  K.cacher(dernier); tl.set(dernier, { opacity: 1 }, tD);
  if (EXEMPLE.long) { dernier.style.color = "var(--brand-negative)"; tl.fromTo(dernier, { scale: 2.6 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, tD); }
  else tl.fromTo(dernier, { scale: 0.2 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, tD);

  // La caméra s'approche doucement du terminal.
  var oy = ty + 300;
  gsap.set(monde, { transformOrigin: (L / 2) + "px " + oy + "px" });
  tl.fromTo(monde, { scale: vertical ? 1.3 : 1.25 }, { scale: vertical ? 1.4 : 1.36, duration: D, ease: "sine.inOut", immediateRender: true }, 0);
  P.coups(tl, $("t9t-cadre"), [[tTicket, 0.03, "45% 60%"], [tD, 0.035, "50% 25%"]]);
  window.__timelines["t9t"] = tl;
})();
</script>
</template>
</body>
</html>
