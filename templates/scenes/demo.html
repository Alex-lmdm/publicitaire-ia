        var X = L / 2 + camE.x + camE.s * (pl.x + pl.l / 2 + x2 - L / 2), Y = H / 2 + camE.y + camE.s * (pl.y + pl.h / 2 + y1 - H / 2), f = 1800 / (1800 - z2);
        return [L / 2 + (X - L / 2) * f - 9, H / 2 + (Y - H / 2) * f - 5];   // la pointe du curseur est à (9, 5) px de son coin
      };
      // L'approche : le champ grandit et vient vers le centre, sans passer sous la ligne d'appui
      // (en 9:16 il remplit déjà presque la largeur : l'approche reste mesurée).
      var sC1 = V ? 1.13 : 1.42, fx = pl.x + champ.x + champ.l * (V ? 0.5 : 0.46), fy = pl.y + champ.y + champ.h / 2;
      var C1 = { s: sC1, x: -sC1 * (fx - L / 2), y: V ? haut + hA + 34 - H / 2 - sC1 * (pl.y - H / 2) : H * -0.03 - sC1 * (fy - H / 2) };

      // --- Le temps ------------------------------------------------------------------------
      var tl = gsap.timeline({ paused: true });
      var demande = String(CONTENU.demande || ""), invite = String(CONTENU.invite || "");
      var tApproche = 0.2, tClicChamp = 0.7, tFrappe = 0.75, tFinFrappe = tFrappe + Math.min(0.6, 0.2 + demande.length * 0.012);
      var tEnvoi = tFinFrappe + 0.2, tRecul = tEnvoi + 0.08, pas = 0.55, tEtape0 = tEnvoi + 0.4;
      var tEtapes = etapes.map(function (et, i) { return tEtape0 + i * pas; });
      var tRetour = tEtape0 + (n - 1) * pas + 0.85, tFond = tRetour + 0.42;
      // Le clic tombe une fois le résultat lu, et la ligne d'appui tenue le temps de sa lecture.
      var tClic = Math.max(tFond + Math.max(1.05, lecture(CONTENU.resultat || "") - 0.45), lecture(CONTENU.appui || "") + 0.35), tFlash = tClic + 0.03;

      // La fenêtre est là dès la première image (l'affiche) et se pose depuis la profondeur.
      tl.fromTo(planche, { z: -110, rotationX: rx0 + 5, rotationY: ry0 + (V ? 0 : 5), y: 20, transformOrigin: "50% 50%" },
        { z: 0, rotationX: rx0, rotationY: ry0, y: 0, duration: 0.9, ease: "expo.out" }, 0);
      // La caméra s'approche du geste, recule sur la réponse, puis dérive lentement.

      tl.to(cam, { scale: 1, x: 0, y: 0, duration: 0.8, ease: "expo.inOut" }, tRecul);
      var tDerive = tRecul + 0.8, finDerive = tFlash + 0.6;
      tl.to(cam, { scale: 1.03, duration: finDerive - tDerive, ease: "sine.inOut" }, tDerive);
      var C2 = { s: 1 + 0.03 * gsap.parseEase("sine.inOut")((tClic - tDerive) / (finDerive - tDerive)), x: 0, y: 0 };

      // La frappe : l'invite grisée tient jusqu'au clic, puis la demande s'écrit par petits groupes.
      var r = K.rng(demande.length * 7919 + 13), paliers = [0], nb = 0;
      while (nb < demande.length) { nb = Math.min(demande.length, nb + 1 + Math.floor(r() * 3)); paliers.push(nb); }
      K.texteSelon(tl, saisie, duree, function (t) {
        if (t < tFrappe) return invite;
        if (t >= tFinFrappe) return demande;
        return demande.slice(0, Math.max(1, paliers[Math.floor(((t - tFrappe) / (tFinFrappe - tFrappe)) * (paliers.length - 1))]));
      });
      tl.set(saisie, { color: encre }, tFrappe);
      tl.set(caret, { opacity: 1 }, tClicChamp).set(caret, { opacity: 0 }, tEnvoi + 0.05);
      if (!avecCapture) {
        tl.to(elChamp, { boxShadow: "inset 0 0 0 4px " + encre, duration: 0.18, ease: "power2.out" }, tClicChamp);
        tl.to(envoi, { scale: 0.86, duration: 0.08, ease: "power2.out" }, tEnvoi).to(envoi, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, tEnvoi + 0.08);
        tl.to(elChamp, { boxShadow: "inset 0 0 0 3px " + (K.jeton("--brand-gris-4") || "#d2d2d3"), duration: 0.25, ease: "power2.out" }, tEnvoi + 0.1);
      }

      // Les étapes : chacune tourne pendant la précédente, se coche sur le temps, et son aperçu
      // sort de la fenêtre pour flotter, chacun à sa profondeur : en 16:9 en arc à droite de la
      // fenêtre, en 9:16 en cascade devant sa moitié droite (là où les lignes sont vides).
      var vol = V
        ? [[-10, 0, 140, -14, -2.5], [40, 0.28, 190, -12, 2], [-4, 0.56, 160, -16, -2], [46, 0.8, 220, -13, 2.5]]
        : [[-40, 0.06, 240, -26, -3], [120, 0.32, 110, -18, 2.5], [-20, 0.6, 320, -30, -2], [140, 0.86, 170, -22, 3]];
      var hautV = pied.y + pied.h - liste.y;   // en 9:16, la cascade s'étale le long des étapes, au-dessus du bouton
      lignes.forEach(function (ln, i) {
        var tDebut = i === 0 ? tEnvoi + 0.08 : tEtapes[i - 1], tCoche = tEtapes[i], ap = apercus[i], v = vol[i % vol.length];
        tl.set([ln.fond, ln.roue], { opacity: 1 }, tDebut);
        tl.set(ln.etat, { opacity: 0 }, tDebut);
        tl.fromTo(ln.roue, { rotation: 0 }, { rotation: 600 * (tCoche - tDebut), duration: tCoche - tDebut, ease: "none", immediateRender: false }, tDebut);
        tl.set(ln.roue, { opacity: 0 }, tCoche).set(ln.texte, { color: encre }, tCoche).set(ln.fond, { opacity: 0 }, tCoche + 0.12);
        tl.fromTo(ln.coche, { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(2.2)", immediateRender: false }, tCoche);
        var x0 = liste.x + ln.cx, y0 = liste.y + ln.cy - ap.h / 2;
        var x1 = V ? pl.l - ap.l - 46 + v[0] : pl.l + 10 + v[0], y1 = V ? liste.y - 4 + v[1] * (hautV - ap.h) * 0.9 : v[1] * (pl.h - ap.h);
        gsap.set(ap.el, { x: x0, y: y0, scale: 0.3, transformOrigin: "0% 50%" });
        tl.set(ap.el, { opacity: 1 }, tCoche + 0.02);
        tl.fromTo(ap.el, { x: x0, y: y0, z: 0, scale: 0.3, rotationY: 0, rotation: 0 },
          { x: x1, y: y1, z: v[2], scale: 1, rotationY: v[3], rotation: v[4], duration: 0.7, ease: "expo.out", immediateRender: false }, tCoche + 0.02);
        // Le retour : les aperçus reviennent se fondre dans le résultat, en rafale.
        tl.to(ap.el, { x: pied.x + xPied + rondPied * 0.3, y: pied.y + pied.h / 2 - ap.h * 0.5, z: 0, scale: 0.16, rotationY: 0, rotation: 0, duration: 0.42, ease: "power3.in" }, tRetour + i * 0.05);
        tl.set(ap.el, { opacity: 0 }, tRetour + i * 0.05 + 0.42);
      });

      // Le résultat : le pied s'allume quand les aperçus y tombent (le même statut, qui change).
      K.texteSelon(tl, statut, duree, function (t) { return String((t < tFond ? CONTENU.attente : CONTENU.resultat) || ""); });
      tl.set(statut, { color: encre }, tFond);
      tl.fromTo(elPied, { scale: 1 }, { scale: 1.045, duration: 0.12, ease: "power2.out", immediateRender: false }, tFond)
        .to(elPied, { scale: 1, duration: 0.4, ease: "back.out(2)" }, tFond + 0.12);
      tl.fromTo(cochePied, { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(2.2)", immediateRender: false }, tFond + 0.04);
      K.volet(tl, boutonFond, tFond + 0.06, { duree: 0.3 });
      tl.set(boutonTexte, { color: K.jeton("--brand-contrast") || encre }, tFond + 0.14);
      tl.set(bouton, { boxShadow: "none" }, tFond + 0.36);

      // --- Le curseur : au-dessus de tout, il vise ce que la projection lui donne ----------
      var curseur = K.curseur(document.getElementById(ID + "-curseur-calque"), ID + "-curseur", false);   // noir : il agit surtout sur la fenêtre claire
      gsap.set(curseur, { scale: V ? 1.7 : 1.35, transformOrigin: "9px 5px" });
      var vEnvoi = [champ.x + xEnvoi + g.envoi / 2, champ.y + champ.h * 0.6];
      var pEnvoiC1 = projeter(vEnvoi[0], vEnvoi[1], C1), pEnvoiC0 = projeter(vEnvoi[0], vEnvoi[1], { s: 1, x: 0, y: 0 });
      var pChamp = projeter(champ.x + (V ? 150 : 170), champ.y + champ.h * 0.62, C1);
      var pRepos = V ? [0.56 * L, pl.y + pl.h + 70] : projeter(pl.l * 0.74, liste.y + 2.6 * g.rang, { s: 1, x: 0, y: 0 });
      var pBouton = projeter(pied.x + pied.l - lBouton / 2 - (pied.h - g.boutonH) / 2, pied.y + pied.h / 2 + 6, C2);
      K.trajet(tl, curseur, [
        [0, V ? 0.78 * L : pl.x + pl.l * 0.8, pl.y + pl.h * (V ? 0.58 : 0.8)],
        [tApproche, pChamp[0], pChamp[1], tClicChamp - tApproche - 0.05, "power3.inOut"],
        [tFinFrappe + 0.02, pEnvoiC1[0], pEnvoiC1[1], tEnvoi - tFinFrappe - 0.07, "power3.inOut"],
        [tRecul, pEnvoiC0[0], pEnvoiC0[1], 0.8, "expo.inOut"],
        [tEtape0 + 0.4, pRepos[0], pRepos[1], 0.7, "power2.inOut"],   // il s'écarte des aperçus
        [tFond - 0.35, pBouton[0], pBouton[1], tClic - tFond + 0.3, "power3.inOut"]
      ]);
      [tClicChamp, tEnvoi, tClic].forEach(function (tc) { K.clic(tl, curseur, tc); });
      tl.to(bouton, { scale: 0.93, duration: 0.07, ease: "power2.out" }, tClic).to(bouton, { scale: 1, duration: 0.26, ease: "back.out(2.6)" }, tClic + 0.07);

      // La ligne d'appui tient toute la démonstration, puis sort avant le flash ; le flash de
      // l'accent part du clic et couvre l'écran (la scène suivante peut s'ouvrir sur l'accent).
      if (elsAppui.length) K.sortieMots(tl, elsAppui, tClic - 0.32, { decalage: 0.03 });
      K.flash(tl, document.getElementById(ID + "-disque"), pBouton[0] + 9, pBouton[1] + 5, tFlash, 0.6);
      var t = tFlash + 0.62;

      // La durée qu'il faut à la scène : `check` la signale si data-duration ne suffit pas.
      if (duree + 0.01 < t) {
        console.error(ID + " : la scène demande " + t.toFixed(1) + " s pour être lue, data-duration n'en donne que " + duree + " : passe data-duration à " + Math.ceil(t * 2) / 2 + " (ici et sur son hôte dans index.html).");
      }
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
