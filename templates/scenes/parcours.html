<!-- Scène prête « Le parcours en étapes » (montrer comment ça marche ; un exemple, scenes.md ;
     sert aussi au travelling de ce qu'on reçoit). Pour un coaching, une formation, un
     service : 3 à 5 étapes vraies posées sur une longue toile (en 9:16 une colonne, en 16:9 une
     rangée), chacune avec sa pastille de délai, son titre court et sa matière (une liste qui se
     coche, un agenda qui se remplit, ou sa vraie capture). La caméra glisse de station en station
     en suivant le fil conducteur qui trace le chemin ; chaque station se coche à l'arrivée et sa
     matière s'anime ; les voisines restent floues (profondeur) ; à la fin la caméra recule pour tout
     voir. Se met en page seule en 9:16 et en 16:9 (K.cadre).
     Pour s'en servir : copie ce fichier dans compositions/, remplis CONTENU (rien d'exemple ne
     doit rester), mets à data-duration la durée que demande la scène (environ 9,5 s avec 4 étapes,
     7,6 s avec 3 ; trop courte, `check` relève des mots partis avant d'être lus et la console de
     l'aperçu dit la durée à mettre), puis `npm run check` et 3 images. Pour la poser deux fois, remplace partout
     « parcours » par un autre identifiant. -->
<template>
  <style>
    #parcours {
      --par-titre: var(--k-encre); --par-carte: var(--brand-clair); --par-encre: var(--k-encre); --par-trait: var(--brand-gris-4);
      --par-rail: var(--brand-gris-3); --par-actif: var(--k-encre); --par-anneau: var(--k-encre); --par-ombre: var(--k-ombre-claire);
    }
    #parcours.par-sombre {
      --par-titre: var(--brand-clair); --par-rail: var(--brand-gris-1); --par-actif: var(--brand-accent);
      --par-anneau: var(--brand-clair); --par-ombre: var(--k-ombre);
    }
    #parcours .par-station { position: absolute; }
    #parcours .par-tete { position: absolute; left: 0; top: 0; display: flex; align-items: center; }
    #parcours .par-borne {
      flex: none; display: grid; place-items: center; border-radius: 50%; position: relative;
      background: var(--brand-clair); box-shadow: inset 0 0 0 6px var(--par-anneau);
    }
    #parcours .par-borne i { position: absolute; inset: 0; border-radius: 50%; background: var(--brand-accent); display: grid; place-items: center; color: var(--brand-contrast); }
    #parcours .par-borne svg { width: 62%; height: 62%; }
    #parcours .par-delai {
      display: inline-block; background: var(--brand-accent); color: var(--brand-contrast); border-radius: 0.24em;
      font-family: var(--brand-font-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
    }
    #parcours .par-titre { position: absolute; color: var(--par-titre); white-space: nowrap; }
    #parcours .par-carte {
      position: absolute; overflow: hidden; border-radius: 28px; background: var(--par-carte); color: var(--par-encre);
      box-shadow: var(--par-ombre), inset 0 0 0 2px var(--par-trait); font-family: var(--brand-font-body); font-weight: 700;
    }
    #parcours .par-entete { display: flex; align-items: center; border-bottom: 2px solid var(--par-trait); letter-spacing: -0.02em; }
    #parcours .par-ligne { position: relative; display: flex; align-items: center; border-bottom: 2px solid var(--par-trait); white-space: nowrap; letter-spacing: -0.01em; }
    /* Une ligne faite passe au plein sous un volet (le blanc vire d'un coup sous la bande). */
    #parcours .par-bande { position: absolute; left: 10px; right: 10px; top: 8px; bottom: 8px; border-radius: 14px; background: var(--k-encre); transform-origin: 0 50%; }
    #parcours .par-ligne > span { position: relative; }
    #parcours .par-boite { flex: none; position: relative; border-radius: 12px; box-shadow: inset 0 0 0 4px var(--brand-gris-3); }
    #parcours .par-boite i, #parcours .par-case i {
      position: absolute; inset: 0; border-radius: inherit; background: var(--brand-accent); color: var(--brand-contrast); display: grid; place-items: center;
    }
    /* Une séance faite se remplit d'encre, sa coche à l'accent. */
    #parcours .par-case i { background: var(--k-encre); color: var(--brand-accent); }
    #parcours .par-boite svg { width: 70%; height: 70%; }
    #parcours .par-grille { position: absolute; display: grid; }
    #parcours .par-case { position: relative; border-radius: 16px; box-shadow: inset 0 0 0 3px var(--par-trait); padding: 0.4em 0.5em; color: var(--brand-gris-2); }
    #parcours .par-case i svg { width: 46%; height: 46%; }
    #parcours .par-capture { position: absolute; display: block; object-fit: cover; object-position: 50% 0; }
    #parcours .par-rail { fill: none; stroke: var(--par-rail); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 20; }
    #parcours .k-lien { stroke: var(--par-actif); stroke-width: 8; }
    #parcours .k-fil { box-shadow: 0 0 0 5px var(--par-anneau); }
  </style>
  <div data-composition-id="parcours" data-width="1080" data-height="1920" data-duration="9.5" style="position:absolute; inset:0;">
    <div id="parcours" class="k-scene">
      <div id="parcours-fond" class="k-fond k-fond-clair"></div>
      <!-- la caméra voyage le long de la toile : elle sort de son cadre exprès -->
      <div class="k-scene3d"><div class="k-camera" id="parcours-cam" data-layout-allow-overflow></div></div>
      <div class="k-vignette-claire" id="parcours-vignette"></div>
    </div>
  </div>
  <script>
    (function () {
      var ID = "parcours";

      // À REMPLACER : chaque étape, délai, ligne et image vient de OFFRE.json ou de sources/ (le
      // déroulé de sa page) ; une étape sans matière vraie prend la liste de ce qu'on y fait.
      var CONTENU = {
        fond: "clair",                  // "clair" ou "sombre" (sa nuit)
        etapes: [                       // 3 à 5 étapes vraies, dans l'ordre ; titre de 1 à 3 mots, délai de 1 à 3 mots
          { titre: "Appel découverte", delai: "Jour 1",
            matiere: { type: "agenda", titre: "Cette semaine", cases: ["Lun", "Mar", "Mer", "Jeu", "Ven"], marques: [2] } },
          { titre: "Ton plan", delai: "Semaine 1",
            matiere: { type: "liste", titre: "Plan d'action", lignes: ["Objectif à 90 jours", "Menus de la semaine", "Liste de courses"] } },
          { titre: "Suivi hebdo", delai: "8 semaines",
            matiere: { type: "agenda", titre: "Tes séances", cases: 8, marques: [0, 1, 2, 3, 4, 5, 6, 7] } },
          { titre: "Bilan final", delai: "Semaine 10",
            matiere: { type: "liste", titre: "Ton bilan", lignes: ["Mesures finales", "Plan de suite", "Questions-réponses"] } }
        ],
        // matiere : { type: "liste", titre, lignes: [2 à 4] } ; { type: "agenda", titre, cases: [libellés] ou un nombre,
        // marques: [rangs des cases cochées] } ; { type: "image", src: "assets/images/<sa capture>.png" }
        zone: null                      // [haut, bas] en part de la hauteur (`zones`) ; défaut selon le format
      };

      var racine = document.getElementById(ID), cam = document.getElementById(ID + "-cam");
      var cadre = K.cadre(racine), L = cadre.largeur, H = cadre.hauteur, V = H > L;
      var duree = K.duree(racine) || 30;   // une fois montée : la durée de son hôte dans index.html
      var zone = CONTENU.zone || (V ? [0.16, 0.27] : [0.08, 0.12]);
      var haut = zone[0] * H, bas = H - zone[1] * H, zc = (haut + bas) / 2;
      if (CONTENU.fond === "sombre") {
        racine.classList.add("par-sombre");
        document.getElementById(ID + "-fond").className = "k-fond k-fond-sombre";
        document.getElementById(ID + "-vignette").className = "k-vignette";
      }

      // La tenue d'un texte : 0,8 s + 0,3 s par mot, jamais moins de 1,5 s (`lecture`).
      var lecture = function (texte) { return Math.max(1.5, 0.8 + 0.3 * String(texte).trim().split(/\s+/).length); };
      // Une taille qui remplit la colonne sans la déborder, estimée sur le nombre de lettres
      // (aucune mesure à l'écran : la même image à chaque rendu).
      var taillePour = function (texte, largeur, mini, maxi) {
        return Math.max(mini, Math.min(maxi, largeur / (0.56 * Math.max(4, String(texte).length))));
      };
      var decouper = function (texte, maxCars) {
        texte = String(texte).trim();
        if (texte.length <= maxCars || texte.indexOf(" ") < 0) return [texte];
        var milieu = texte.length / 2, coupe = -1;
        for (var i = 0; i < texte.length; i++) {
          if (texte[i] === " " && (coupe < 0 || Math.abs(i - milieu) < Math.abs(coupe - milieu))) coupe = i;
        }
        return [texte.slice(0, coupe), texte.slice(coupe + 1)];
      };

      // --- La toile : une station par étape, à l'échelle 1 quand la caméra s'y arrête ------------
      // Le pas entre deux stations est fixé par le cadre : à la fin, la caméra recule à l'échelle
      // `sVue` pour tout voir, et chaque titre, chaque délai y fait encore 30 px au moins.
      var etapes = (CONTENU.etapes || []).filter(Boolean).slice(0, 5), n = etapes.length;
      var Wb = V ? 0.84 * L : 0.42 * L, Hb = V ? 0.36 * H : 0.98 * (bas - haut), pasT = V ? 0.43 * H : 0.5 * L;
      var sVue = V ? 0.9 * H / ((n - 1) * pasT + Hb) : 0.92 * L / ((n - 1) * pasT + Wb);
      var mini = 30 / sVue, fP = Math.max(V ? 50 : 48, mini), R = fP * 0.62, retrait = V ? 2 * R + 0.5 * fP : 0;
      var fH = V ? 46 : 44, fR = V ? 44 : 42, hTete = fP * 1.5;
      var centreDe = function (i) { return V ? [L / 2, zc + i * pasT] : [L / 2 + i * pasT, zc]; };
      var stations = [], bornes = [], aCocher = [];
      var SVG = "http://www.w3.org/2000/svg", svg = document.createElementNS(SVG, "svg");
      var cote = V ? [L, zc + (n - 1) * pasT + H] : [L + (n - 1) * pasT + L, H];
      svg.setAttribute("class", "k-liens");
      svg.setAttribute("viewBox", "0 0 " + cote[0] + " " + cote[1]);
      svg.setAttribute("width", String(cote[0]));
      svg.setAttribute("height", String(cote[1]));
      // La toile porte les stations, le rail et le fil : chacun reste dans la boîte de son parent.
      var toile = K.el(cam, "div", "k-plan", null, "left:0; top:0; width:" + cote[0] + "px; height:" + cote[1] + "px;");
      toile.setAttribute("data-layout-allow-overflow", "");
      toile.appendChild(svg);
      var trait = function (d, classe) {
        var p = document.createElementNS(SVG, "path");
        p.setAttribute("d", d);
        p.setAttribute("class", classe);
        svg.appendChild(p);
        return p;
      };
      var ic = function (nom) { return K.ic(nom); };

      etapes.forEach(function (et, i) {
        var c = centreDe(i), x0 = c[0] - Wb / 2;
        var st = K.el(toile, "div", "par-station k-plan", null, "left:" + x0 + "px; width:" + Wb + "px;");
        st.setAttribute("data-layout-allow-overflow", "");   // les voisines sortent du cadre exprès
        // La tête : la borne sur le rail, la pastille de délai.
        var tete = K.el(st, "div", "par-tete", null, "height:" + hTete + "px; gap:" + 0.45 * fP + "px;");
        var borne = K.el(tete, "div", "par-borne", null, "width:" + 2 * R + "px; height:" + 2 * R + "px;");
        var plein = K.el(borne, "i", null, ic("check"));
        gsap.set(plein, { scale: 0 });
        var delai = K.el(tete, "span", "par-delai", null, "font-size:" + fP + "px; padding:" + 0.22 * fP + "px " + 0.36 * fP + "px;");
        delai.textContent = et.delai || "";
        if (!et.delai) delai.style.display = "none";
        bornes.push({ x: x0 + R, y: hTete / 2, plein: plein, borne: borne, delai: delai });
        // Le titre court, en très grand.
        var lT = Wb - retrait, lignes = decouper(et.titre || "", Math.floor(lT / (0.56 * (V ? 84 : 78))));
        var fT = Math.max(mini, taillePour(lignes.reduce(function (a, b) { return b.length > a.length ? b : a; }, ""), lT, V ? 84 : 78, V ? 128 : 118));
        var yT = hTete + 0.35 * fP, hT = fT * 1.02 * lignes.length;
        var titre = K.el(st, "div", "par-titre k-heros", null, "left:" + retrait + "px; top:" + yT + "px; font-size:" + fT + "px; line-height:1.02;");
        lignes.forEach(function (l) { K.el(titre, "div", null).textContent = l; });
        // La matière : une carte qui prend la hauteur de ce qu'elle montre (jamais une grande surface
        // vide), dans la place qui reste. Ses mots sont ceux d'une interface, lus de près (40 px et
        // plus à l'arrêt), de la texture une fois la caméra reculée.
        var yC = yT + hT + 0.42 * fP, place = Hb - yC, lC = Wb - retrait, m = et.matiere || {}, pad = 0.7 * fH, hE = 1.9 * fH;
        var cases = typeof m.cases === "number" ? Array.apply(null, Array(m.cases)).map(function (_, k) { return "S" + (k + 1); }) : (m.cases || []);
        var cols = Math.min(5, Math.max(1, cases.length)), rangs = Math.ceil(cases.length / cols), g = 0.35 * fR;
        var hCase = Math.min((lC - 2 * pad - (cols - 1) * g) / cols * 0.9, (place - hE - 2 * pad - (rangs - 1) * g) / Math.max(1, rangs));
        var lignesM = (m.lignes || []).slice(0, 4), hL = Math.min(2.1 * fR, (place - hE) / Math.max(1, lignesM.length));
        var hC = m.type === "image" ? Math.min(place, lC * 0.62) : m.type === "agenda" ? hE + 2 * pad + rangs * hCase + (rangs - 1) * g : hE + lignesM.length * hL;
        st.style.height = (yC + hC) + "px";
        var carte = K.el(st, "div", "par-carte", null, "left:" + retrait + "px; top:" + yC + "px; width:" + lC + "px; height:" + hC + "px;");
        carte.setAttribute("data-layout-ignore", "");
        var evts = [];
        if (m.type === "image" && m.src) {
          var img = K.el(carte, "img", "par-capture", null, "left:0; top:0; width:" + lC + "px; height:" + hC + "px;");
          img.src = m.src;
          img.alt = "";
          evts.push({ el: img, image: true });
        } else {
          var ent = K.el(carte, "div", "par-entete", null, "height:" + hE + "px; padding:0 " + pad + "px; font-size:" + fH + "px;");
          ent.textContent = m.titre || "";
          if (m.type === "agenda") {
            var grille = K.el(carte, "div", "par-grille", null, "left:" + pad + "px; top:" + (hE + pad) + "px; width:" + (lC - 2 * pad) + "px;" +
              " grid-template-columns:repeat(" + cols + ", 1fr); grid-auto-rows:" + hCase + "px; gap:" + g + "px; font-size:" + fR * 0.9 + "px;");
            cases.forEach(function (lib, k) {
              var cs = K.el(grille, "div", "par-case");
              K.el(cs, "span", null).textContent = lib;
              if ((m.marques || []).indexOf(k) >= 0) {
                var marque = K.el(cs, "i", null, ic("check"));
                gsap.set(marque, { scale: 0 });
                evts.push({ el: marque });
              }
            });
          } else {
            lignesM.forEach(function (l) {
              var li = K.el(carte, "div", "par-ligne", null, "height:" + hL + "px; padding:0 " + pad + "px; gap:" + 0.5 * fR + "px; font-size:" + fR + "px;");
              var bande = K.el(li, "i", "par-bande");
              var boite = K.el(li, "span", "par-boite", null, "width:" + 1.05 * fR + "px; height:" + 1.05 * fR + "px;");
              var mot = K.el(li, "span", null);
              mot.textContent = l;
              var coche = K.el(boite, "i", null, ic("check"));
              gsap.set(coche, { scale: 0 });
              gsap.set(bande, { scaleX: 0 });
              evts.push({ el: coche, bande: bande, mot: mot });
            });
          }
        }
        aCocher.push(evts);
        stations.push({ el: st, h: yC + hC });
        if (i > 0) gsap.set(st, { filter: "blur(7px)" });   // les voisines restent floues : la profondeur
      });
      // Chaque station se centre sur son point ; en 16:9 elles partagent leur haut (le rail reste droit).
      var hMax = Math.max.apply(null, stations.map(function (s) { return s.h; }));
      stations = stations.map(function (s, i) {
        var y = V ? centreDe(i)[1] - s.h / 2 : zc - hMax / 2;
        s.el.style.top = y + "px";
        bornes[i].y += y;
        return s.el;
      });

      // Le rail : un pointillé qui relie les bornes (tout le chemin est là), puis un trait plein par
      // segment, tracé pendant le voyage.
      var pt = function (b) { return b.x + " " + b.y; };
      // Le chemin vient de plus loin que la première station (on entre dans un parcours déjà tracé).
      var avant = V ? bornes[0].x + " " + (bornes[0].y - pasT) : (bornes[0].x - pasT) + " " + bornes[0].y;
      trait("M" + avant + " L" + bornes.map(pt).join(" L"), "par-rail");
      var segments = bornes.slice(1).map(function (b, i) { return trait("M" + pt(bornes[i]) + " L" + pt(b), "k-lien"); });

      var tl = gsap.timeline({ paused: true });
      // L'arrivée à une station : sa borne se coche, son délai claque, sa matière s'anime.
      var arriver = function (i, t) {
        var b = bornes[i];
        tl.fromTo(b.plein, { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(2.2)", immediateRender: false }, t);
        tl.fromTo(b.delai, { scale: 1.18 }, { scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, t + 0.06);
        var evts = aCocher[i], pas = Math.min(0.3, 0.75 / Math.max(1, evts.length));
        evts.forEach(function (e, k) {
          if (e.image) tl.fromTo(e.el, { scale: 1.1 }, { scale: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, t);
          else tl.fromTo(e.el, { scale: 0 }, { scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: false }, t + 0.18 + k * pas);
          if (e.bande) {
            tl.to(e.bande, { scaleX: 1, duration: 0.3, ease: "power3.inOut" }, t + 0.1 + k * pas);
            tl.set(e.mot, { color: K.jeton("--brand-clair") }, t + 0.2 + k * pas);
          }
        });
        return t + 0.18 + evts.length * pas + 0.15;   // la fin de ce qui s'anime
      };
      // La caméra place le centre de la station i au milieu de la zone, à l'échelle sS (en 16:9 elle
      // s'approche : la station remplit le cadre, ses voisines sortent à demi).
      var sS = V ? 1 : 1.2;
      var vise = function (i) { var c = centreDe(i); return { x: -sS * (c[0] - L / 2), y: zc - H / 2 - sS * (c[1] - H / 2), scale: sS }; };

      // L'affiche : la première station est là dès l'image 0, la caméra la révèle en reculant.
      gsap.set(cam, vise(0));
      tl.fromTo(cam, { scale: sS * 1.14 }, { scale: sS, duration: 1, ease: "expo.out" }, 0);
      var G = 0.65, t = Math.max(lecture(etapes[0].titre), arriver(0, 0.3));
      for (var i = 1; i < n; i++) {
        // Le voyage : la caméra et le fil partent ensemble, sur la même courbe (le point reste à sa
        // place à l'écran, le monde glisse dessous) ; la station quittée floute, la suivante se fait nette.
        var fil = K.el(toile, "div", "k-fil");
        K.cacher([fil, segments[i - 1]]);
        tl.set([fil, segments[i - 1]], { opacity: 1 }, t);
        tl.fromTo(fil, { scale: 0 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
        K.trace(tl, segments[i - 1], t, G);
        K.longer(tl, fil, segments[i - 1], t, G, duree);
        tl.to(cam, Object.assign({ duration: G, ease: "power2.inOut" }, vise(i)), t);
        tl.to(stations[i - 1], { filter: "blur(7px)", duration: G, ease: "power2.inOut" }, t);
        tl.to(stations[i], { filter: "blur(0px)", duration: G, ease: "power2.inOut" }, t);
        tl.to(fil, { scale: 0, duration: 0.16, ease: "power2.in" }, t + G);
        // Son titre se lit dès la fin du voyage (il ralentit en arrivant).
        t = Math.max(t + G + Math.max(1.15, lecture(etapes[i].titre) - 0.35), arriver(i, t + G));
      }
      // La fin : la caméra recule pour tout voir (elle arrive au résultat : une longue traîne), toutes
      // les stations nettes ; tout le parcours tient 2 s à l'écran (une fin de film le demande).
      var cT = centreDe((n - 1) / 2);
      tl.to(cam, { scale: sVue, x: -sVue * (cT[0] - L / 2), y: -sVue * (cT[1] - H / 2), duration: 1, ease: "power3.out" }, t);
      tl.to(stations, { filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, t + 0.1);
      t += 1 + 1.6;

      // La durée qu'il faut à la scène : `check` la signale si data-duration ne suffit pas.
      if (duree + 0.01 < t) {
        console.error(ID + " : la scène demande " + t.toFixed(1) + " s pour être lue, data-duration n'en donne que " + duree + " : passe data-duration à " + Math.ceil(t * 2) / 2 + " (ici et sur son hôte dans index.html).");
      }
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
